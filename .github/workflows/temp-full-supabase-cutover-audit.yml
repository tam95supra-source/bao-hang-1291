name: Temp full Supabase cutover audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-full-supabase-cutover-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Full source and build audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== REPO HEAD ==='
          git rev-parse HEAD
          echo '=== TRACKED SUPABASE REFERENCES ==='
          git grep -nEi 'supabase|SUPABASE_|supabase\.co|oedasgcdjppjwidhlqdr|ap-northeast-2|@supabase|functions/v1|auth/v1' -- ':!**/*.lock' ':!docs/**' ':!ops/neon/**' ':!supabase/**' || true
          echo '=== FILE NAMES WITH SUPABASE NAME ==='
          git ls-files | grep -i supabase || true
          echo '=== ANDROID NETWORK / DEPS ==='
          git grep -nEi 'supabase|postgrest|gotrue|realtime|oedasgcdjppjwidhlqdr|supabase\.co' -- app build.gradle.kts settings.gradle.kts gradle.properties 2>/dev/null || true
          echo '=== WEB RUNTIME TARGETS ==='
          git grep -nEi 'https?://|NEON_API|FIREBASE_PROJECT|WORKER_URL|supabase' -- web-admin/src web-admin/vite.config.js 2>/dev/null || true
          echo '=== WORKFLOWS / OPS ==='
          git grep -nEi 'supabase|oedasgcdjppjwidhlqdr|supabase\.co|functions/v1|auth/v1' -- .github/workflows scripts google-apps-script firebase.json 2>/dev/null || true
          echo '=== WEB BUILD ==='
          cd web-admin
          npm ci --no-audit --no-fund
          npm run build
          if grep -RniE 'supabase\.co|oedasgcdjppjwidhlqdr|ap-northeast-2|@supabase|/auth/v1|/functions/v1' dist; then
            echo 'WEB_BUILD_SUPABASE_RUNTIME_FAIL'
            exit 21
          fi
          grep -Rni 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech' dist >/dev/null
          echo 'WEB_BUILD_NEON_ONLY_PASS'
          cd ..
          echo '=== ANDROID COMPILE CONFIG ==='
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > "$RUNNER_TEMP/android-deps.txt"
          if grep -iE 'supabase|postgrest|gotrue' "$RUNNER_TEMP/android-deps.txt"; then
            echo 'ANDROID_SUPABASE_DEP_FAIL'
            exit 22
          fi
          ./gradlew --no-daemon :app:compileDebugKotlin
          echo 'ANDROID_COMPILE_PASS'
