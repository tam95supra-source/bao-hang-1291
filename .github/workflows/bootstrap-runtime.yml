name: Bootstrap runtime secrets and first Admin

on:
  push:
    branches: [main]
    paths:
      - 'ops/runtime-bootstrap.request'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: oedasgcdjppjwidhlqdr
      PROJECT_URL: https://oedasgcdjppjwidhlqdr.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ADMIN_CODE: ${{ secrets.INITIAL_ADMIN_EMPLOYEE_CODE }}
      ADMIN_NAME: ${{ secrets.INITIAL_ADMIN_FULL_NAME }}
      ADMIN_CONTRACTOR: ${{ secrets.INITIAL_ADMIN_CONTRACTOR }}
      ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
    steps:
      - name: Validate required bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          for key in SUPABASE_ACCESS_TOKEN FIREBASE_SERVICE_ACCOUNT ADMIN_CODE ADMIN_NAME ADMIN_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -e '.project_id and .client_email and .private_key' >/dev/null
          if [ ${#ADMIN_PASSWORD} -lt 10 ]; then
            echo "INITIAL_ADMIN_PASSWORD must contain at least 10 characters" >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Supabase runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          CRON_SECRET="$(openssl rand -hex 32)"
          BOOTSTRAP_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$CRON_SECRET"
          echo "::add-mask::$BOOTSTRAP_SECRET"

          supabase secrets set \
            FIREBASE_SERVICE_ACCOUNT="$FIREBASE_SERVICE_ACCOUNT" \
            CRON_SECRET="$CRON_SECRET" \
            BOOTSTRAP_SECRET="$BOOTSTRAP_SECRET" \
            --project-ref "$PROJECT_REF"

          curl --fail-with-body --retry 2 --max-time 60 \
            -X POST "$PROJECT_URL/functions/v1/api/configure-schedule" \
            -H 'content-type: application/json' \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{}'

          PAYLOAD="$(jq -n \
            --arg employee_code "$ADMIN_CODE" \
            --arg full_name "$ADMIN_NAME" \
            --arg contractor "${ADMIN_CONTRACTOR:-}" \
            --arg password "$ADMIN_PASSWORD" \
            '{employee_code:$employee_code,full_name:$full_name,contractor:$contractor,password:$password}')"

          STATUS="$(curl -sS --retry 2 --max-time 60 \
            -o /tmp/bootstrap-response.json -w '%{http_code}' \
            -X POST "$PROJECT_URL/functions/v1/api/bootstrap-admin" \
            -H 'content-type: application/json' \
            -H "x-bootstrap-secret: $BOOTSTRAP_SECRET" \
            --data-binary "$PAYLOAD")"

          if [ "$STATUS" = '200' ]; then
            jq '{created,employee_code}' /tmp/bootstrap-response.json
          elif [ "$STATUS" = '409' ]; then
            echo 'Admin/profile already exists; bootstrap endpoint is locked as designed.'
          else
            cat /tmp/bootstrap-response.json >&2
            exit 1
          fi
