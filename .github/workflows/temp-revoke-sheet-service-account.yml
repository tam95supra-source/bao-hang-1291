name: Temp revoke Sheet service account
on:
  push:
    paths:
      - '.github/workflows/temp-revoke-sheet-service-account.yml'
permissions:
  contents: read
jobs:
  revoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SHEET_ID: 15_AJ8oB7cEeQjeM6Jb6dm0ki6NcqyxPRVRTAvQPHVM0
    steps:
      - name: Revoke this service account from canonical Sheet
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),assert=require('assert');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          assert.equal(sa.project_id,'bao-hang-1291','WRONG_FIREBASE_PROJECT');
          const b64u=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const input=b64u({alg:'RS256',typ:'JWT'})+'.'+b64u({iss:sa.client_email,scope:'https://www.googleapis.com/auth/drive',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+3600});
          const assertion=input+'.'+crypto.sign('RSA-SHA256',Buffer.from(input),sa.private_key).toString('base64url');
          (async()=>{
            const tokenRes=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});
            const token=await tokenRes.json(); assert(token.access_token,'GOOGLE_TOKEN_FAILED');
            const h={Authorization:'Bearer '+token.access_token};
            const listRes=await fetch(`https://www.googleapis.com/drive/v3/files/${process.env.SHEET_ID}/permissions?fields=permissions(id,type,role,emailAddress)`,{headers:h});
            assert.equal(listRes.status,200,'PERMISSION_LIST_HTTP_'+listRes.status);
            const list=await listRes.json();
            const mine=(list.permissions||[]).find(p=>p.emailAddress===sa.client_email);
            assert(mine,'SERVICE_ACCOUNT_PERMISSION_NOT_FOUND');
            const del=await fetch(`https://www.googleapis.com/drive/v3/files/${process.env.SHEET_ID}/permissions/${mine.id}`,{method:'DELETE',headers:h});
            assert.equal(del.status,204,'PERMISSION_DELETE_HTTP_'+del.status);
            console.log('TEMP_SHEET_SERVICE_ACCOUNT_PERMISSION_REVOKED');
          })().catch(e=>{console.error('REVOKE_FAIL='+e.message);process.exit(1)});
          NODE
