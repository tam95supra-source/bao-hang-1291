name: Dispatch guarded web explicit JWT deploy

on:
  push:
    branches:
      - target-final-20260814-impl

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing guarded Web Admin deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web-admin.yml --repo tam95supra-source/bao-hang-1291 --ref target-final-20260814-impl
      - name: Remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(gh api repos/tam95supra-source/bao-hang-1291/contents/.github/workflows/dispatch-web-explicit-jwt-once.yml?ref=target-final-20260814-impl --jq .sha)"
          gh api -X DELETE repos/tam95supra-source/bao-hang-1291/contents/.github/workflows/dispatch-web-explicit-jwt-once.yml -f message='ops: remove web deploy dispatcher' -f sha="$SHA" -f branch='target-final-20260814-impl'
