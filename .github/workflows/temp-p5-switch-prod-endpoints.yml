name: Temp P5 switch production endpoints

on:
  push:
    branches:
      - migration/neon-cutover
    paths:
      - '.github/workflows/temp-p5-switch-prod-endpoints.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
          fetch-depth: 0

      - name: Replace validation Data API with production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old='https://ep-flat-feather-azdi44be.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1'
          new='https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1'
          files=[Path('app/build.gradle.kts'),Path('web-admin/src/supabase-shim.js')]
          for p in files:
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{p}: expected exactly one validation endpoint, found {count}')
              p.write_text(text.replace(old,new),encoding='utf-8')
          PY

      - name: Fail-closed runtime scope scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RFn --exclude-dir=build --exclude-dir=node_modules 'ep-flat-feather-azdi44be' app web-admin
          ! grep -RFn --exclude-dir=build --exclude-dir=node_modules 'ttwftrooaizxmjovkbaz' app web-admin
          ! grep -RFn --exclude-dir=build --exclude-dir=node_modules 'pick-pack-1291.web.app' app web-admin
          ! grep -RFn --exclude-dir=build --exclude-dir=node_modules 'pick-pack-1291' app web-admin
          grep -Fq 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1' app/build.gradle.kts
          grep -Fq 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1' web-admin/src/supabase-shim.js
          echo 'P5_ENDPOINT_SCOPE_SCAN_OK'

      - name: Commit production endpoint switch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tam95supra-source'
          git config user.email 'tam95.supra@gmail.com'
          git add app/build.gradle.kts web-admin/src/supabase-shim.js
          git diff --cached --check
          git commit -m 'feat(migration): point Android and Web at Neon production'
          git push origin HEAD:migration/neon-cutover
