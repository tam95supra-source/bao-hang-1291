name: Fix Firestore optional claims once

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - '.github/workflows/fix-firestore-optional-claims-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - name: Guard optional token claims with Map.get defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('firestore.rules')
          text = p.read_text()
          old = """    function isDrain() { return siteOk() && request.auth.token.account_kind == 'SHEET_DRAIN' && request.auth.token.drain_enabled == true; }"""
          new = """    function isDrain() { return siteOk() && request.auth.token.get('account_kind', '') == 'SHEET_DRAIN' && request.auth.token.get('drain_enabled', false) == true; }"""
          if old not in text:
              raise SystemExit('expected isDrain source not found')
          text = text.replace(old, new, 1)
          old = """    function deviceAllowed(data) {
              return businessUser() && data.device_id is string && (
                (request.auth.token.account_kind == 'BACKUP' && request.auth.token.device_scope is string && (request.auth.token.device_scope == '*' || request.auth.token.device_scope == data.device_id))
                || (request.auth.token.account_kind != 'BACKUP' && request.auth.token.device_id is string && request.auth.token.device_id == data.device_id)
              );
            }"""
          new = """    function deviceAllowed(data) {
              return businessUser() && data.device_id is string && (
                (request.auth.token.get('account_kind', '') == 'BACKUP'
                  && request.auth.token.get('device_scope', '') is string
                  && (request.auth.token.get('device_scope', '') == '*' || request.auth.token.get('device_scope', '') == data.device_id))
                || (request.auth.token.get('account_kind', '') != 'BACKUP'
                  && request.auth.token.get('device_id', '') is string
                  && request.auth.token.get('device_id', '') == data.device_id)
              );
            }"""
          if old not in text:
              raise SystemExit('expected deviceAllowed source not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check -- firestore.rules
          grep -q "token.get('account_kind', '')" firestore.rules
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "fix: guard optional Firebase token claims"
          git push origin HEAD:target-final-20260814-impl
