name: Fix Firestore optional claims once

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - '.github/workflows/fix-firestore-optional-claims-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - name: Guard optional token claims with Map.get defaults
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('firestore.rules')
          text = p.read_text()
          replacements = {
              "request.auth.token.account_kind": "request.auth.token.get('account_kind', '')",
              "request.auth.token.drain_enabled": "request.auth.token.get('drain_enabled', false)",
              "request.auth.token.device_scope": "request.auth.token.get('device_scope', '')",
              "request.auth.token.device_id": "request.auth.token.get('device_id', '')",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected source token not found: {old}')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          git diff --check -- firestore.rules
          ! grep -Eq 'request\.auth\.token\.(account_kind|drain_enabled|device_scope|device_id)' firestore.rules
          grep -q "token.get('account_kind', '')" firestore.rules
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "fix: guard optional Firebase token claims"
          git push origin HEAD:target-final-20260814-impl
