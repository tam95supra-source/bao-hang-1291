name: Fix Firestore optional claims once

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - '.github/workflows/fix-firestore-optional-claims-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - name: Fix emulator catch-all probe path
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('firebase-rules-tests/firestore-rules.test.mjs')
          text = p.read_text()
          old = "__private_probe__"
          new = "private_probe"
          if old not in text:
              raise SystemExit('reserved emulator probe path not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check -- firebase-rules-tests/firestore-rules.test.mjs
          ! grep -q '__private_probe__' firebase-rules-tests/firestore-rules.test.mjs
      - name: Commit test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-rules-tests/firestore-rules.test.mjs
          git commit -m "test: use valid Firestore catch-all probe path"
          git push origin HEAD:target-final-20260814-impl
