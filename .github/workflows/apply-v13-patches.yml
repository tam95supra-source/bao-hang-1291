name: Apply v1.3 source transformation

on:
  push:
    branches: [work/beta-catalog-staff-ux-v13]
    paths:
      - 'ops/patch_api_v13.py'
      - 'ops/patch_web_v13.py'
      - 'ops/patch_android_v13.py'
      - '.github/workflows/apply-v13-patches.yml'

permissions:
  contents: write

concurrency:
  group: v13-transform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta-catalog-staff-ux-v13
          fetch-depth: 0
      - name: Transform Edge API
        run: python ops/patch_api_v13.py
      - name: Transform Web
        run: python ops/patch_web_v13.py
      - name: Transform Android
        shell: bash
        run: |
          set -o pipefail
          python ops/patch_android_v13.py 2>&1 | tee ops/v13_transform_error.txt
      - name: Persist transform diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          test -s ops/v13_transform_error.txt || printf 'Android transform failed without diagnostic output\n' > ops/v13_transform_error.txt
          git add ops/v13_transform_error.txt
          git commit -m 'Capture v1.3 transform diagnostic' || true
          git push origin HEAD:work/beta-catalog-staff-ux-v13
      - name: Source safety guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'SUPRA_CREDENTIAL_MASTER_KEY|inventory-credential-update|inventory-sync-start|api-supra\.winmart\.vn' \
            supabase/functions web-admin/src app/src/main || { echo 'Active Supra mechanism remains' >&2; exit 1; }
          ! grep -R -n -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=' \
            web-admin/src app/src/main supabase/functions || { echo 'Secret-like material found' >&2; exit 1; }
          git diff --check
      - name: Remove one-time transformation tooling
        run: rm -f ops/patch_api_v13.py ops/patch_web_v13.py ops/patch_android_v13.py ops/v13_transform_error.txt .github/workflows/apply-v13-patches.yml
      - name: Commit transformed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes'; exit 2; }
          git commit -m 'Implement catalog-only staff sync and final picker alerts'
          git push origin HEAD:work/beta-catalog-staff-ux-v13
