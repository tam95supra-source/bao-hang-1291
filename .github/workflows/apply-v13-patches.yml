name: Apply v1.3 source transformation

on:
  push:
    branches: [work/beta-catalog-staff-ux-v13]
    paths:
      - 'ops/patch_api_v13.py'
      - 'ops/patch_web_v13.py'
      - 'ops/patch_android_v13.py'
      - '.github/workflows/apply-v13-patches.yml'

permissions:
  contents: write

concurrency:
  group: v13-transform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta-catalog-staff-ux-v13
          fetch-depth: 0
      - name: Transform Edge API
        run: python ops/patch_api_v13.py
      - name: Transform Web
        run: python ops/patch_web_v13.py
      - name: Transform Android
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          patch=Path('ops/patch_android_v13.py')
          lines=patch.read_text(encoding='utf-8').splitlines()
          for marker in ("'overlay guard')", "'fcm final guard')"):
              hits=[i for i,line in enumerate(lines) if marker in line]
              if len(hits)!=1: raise SystemExit(f'compat {marker}: expected 1, got {len(hits)}')
              lines[hits[0]]='s=s'
          patch.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          fcm=Path('app/src/main/java/vn/pickpack1291/baohang/notifications/StockMessagingService.kt')
          s=fcm.read_text(encoding='utf-8')
          anchor='        val status = data["status"].orEmpty()\n'
          if s.count(anchor)!=1: raise SystemExit(f'fcm source anchor count={s.count(anchor)}')
          s=s.replace(anchor,anchor+'        if (status !in setOf("AVAILABLE", "SKIP_ALLOWED")) {\n            app.diagnostics.info("picker_notification_suppressed", mapOf("status" to status))\n            return\n        }\n',1)
          s=s.replace('val canClaim = status == "OPEN" && app.session.effectiveRole in setOf(UserRole.ADMIN, UserRole.ADMIN_INVENT, UserRole.INVENT)','val canClaim = false')
          fcm.write_text(s,encoding='utf-8')

          overlay=Path('app/src/main/java/vn/pickpack1291/baohang/notifications/OverlayAlertService.kt')
          s=overlay.read_text(encoding='utf-8')
          anchor='        val status = IssueStatus.from(intent.getStringExtra(EXTRA_STATUS))\n'
          if s.count(anchor)!=1: raise SystemExit(f'overlay source anchor count={s.count(anchor)}')
          s=s.replace(anchor,anchor+'        if (status !in setOf(IssueStatus.AVAILABLE, IssueStatus.SKIP_ALLOWED)) { dismiss(); return }\n',1)
          s=s.replace('val critical = intent.getBooleanExtra(EXTRA_CRITICAL, status.criticalForPicker)','val critical = true')
          s=s.replace('val canClaim = intent.getBooleanExtra(EXTRA_CAN_CLAIM, false) && issueId.isNotBlank()','val canClaim = false')
          s=s.replace('view.setBackgroundResource(if (critical) R.drawable.bg_overlay_critical else R.drawable.bg_overlay_info)','view.setBackgroundResource(if (status == IssueStatus.AVAILABLE) R.drawable.bg_overlay_available else R.drawable.bg_overlay_skip)')
          s=s.replace('view.findViewById<TextView>(R.id.tvOverlayStatus).text = status.label','view.findViewById<TextView>(R.id.tvOverlayStatus).text = if (status == IssueStatus.AVAILABLE) "ĐÃ CÓ HÀNG • QUAY LẠI LẤY HÀNG" else "CHO PHÉP SKIP • TIẾP TỤC CÔNG VIỆC"')
          s=s.replace('ack.visibility = if (critical || canClaim) View.VISIBLE else View.GONE','ack.visibility = View.VISIBLE')
          s=s.replace('hint.visibility = if (critical) View.GONE else View.VISIBLE','hint.visibility = View.VISIBLE')
          s=s.replace('ack.text = "ĐÃ HIỂU"','ack.text = "ĐÃ XÁC NHẬN"')
          s=s.replace('val height = (resources.displayMetrics.heightPixels * if (critical) 0.40 else 0.34).toInt()','val height = (resources.displayMetrics.heightPixels * 0.40).toInt()')
          overlay.write_text(s,encoding='utf-8')
          PY
          set -o pipefail
          python ops/patch_android_v13.py 2>&1 | tee ops/v13_transform_error.txt
      - name: Persist transform diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          test -s ops/v13_transform_error.txt || printf 'Android transform failed without diagnostic output\n' > ops/v13_transform_error.txt
          git add ops/v13_transform_error.txt
          git commit -m 'Capture v1.3 transform diagnostic' || true
          git push origin HEAD:work/beta-catalog-staff-ux-v13
      - name: Source safety guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'SUPRA_CREDENTIAL_MASTER_KEY|inventory-credential-update|inventory-sync-start|api-supra\.winmart\.vn' \
            supabase/functions web-admin/src app/src/main || { echo 'Active Supra mechanism remains' >&2; exit 1; }
          ! grep -R -n -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=' \
            web-admin/src app/src/main supabase/functions || { echo 'Secret-like material found' >&2; exit 1; }
          git diff --check
      - name: Remove one-time transformation tooling
        run: rm -f ops/patch_api_v13.py ops/patch_web_v13.py ops/patch_android_v13.py ops/v13_transform_error.txt .github/workflows/apply-v13-patches.yml
      - name: Commit transformed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes'; exit 2; }
          git commit -m 'Implement catalog-only staff sync and final picker alerts'
          git push origin HEAD:work/beta-catalog-staff-ux-v13
