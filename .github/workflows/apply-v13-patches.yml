name: Apply v1.3 backend web transformation

on:
  push:
    branches: [work/beta-catalog-staff-ux-v13]
    paths:
      - 'ops/patch_api_v13.py'
      - 'ops/patch_web_v13.py'
      - '.github/workflows/apply-v13-patches.yml'

permissions:
  contents: write

concurrency:
  group: v13-backend-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta-catalog-staff-ux-v13
          fetch-depth: 0
      - name: Transform Edge API
        run: python ops/patch_api_v13.py
      - name: Transform Web
        run: python ops/patch_web_v13.py
      - name: Fix staff realtime RPC call
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/api/index.ts')
          s=p.read_text(encoding='utf-8')
          old='await admin.schema("realtime").rpc("send",{payload:{run_id:run.id,status,created,updated,deactivated},event:"staff_changed",topic:"site:1291:staff",private:true}).catch(()=>{});'
          new='await admin.rpc("broadcast_staff_change_service",{p_payload:{run_id:run.id,status,created,updated,deactivated}}).catch(()=>{});'
          if old in s: s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify Supra mechanisms retired
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'SUPRA_CREDENTIAL_MASTER_KEY|inventory-credential-update|inventory-sync-start|api-supra\.winmart\.vn' supabase/functions web-admin/src; then
            echo 'Active Supra mechanism remains' >&2
            exit 1
          fi
      - name: Verify static secret safety
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=' web-admin/src supabase/functions; then
            echo 'Secret-like material found' >&2
            exit 1
          fi
      - name: Verify patch whitespace
        run: git diff --check
      - name: Remove completed transformation tooling
        run: rm -f ops/patch_api_v13.py ops/patch_web_v13.py ops/v13_transform_error.txt .github/workflows/apply-v13-patches.yml
      - name: Commit backend and web source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes'; exit 2; }
          git commit -m 'Implement catalog staff sync and warehouse web operations'
          git push origin HEAD:work/beta-catalog-staff-ux-v13
