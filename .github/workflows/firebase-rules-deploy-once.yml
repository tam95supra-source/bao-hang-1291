name: Firebase rules deploy once

on:
  push:
    branches: ['ops/firebase-read-probe-20260815']
    paths: ['.github/workflows/firebase-rules-deploy-once.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PROJECT_ID: bao-hang-1291
    steps:
      - uses: actions/checkout@v6
      - name: Publish repository Firestore rules through Rules REST API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'), fs=require('fs');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}'), project=process.env.PROJECT_ID;
          if(!sa.client_email||!sa.private_key) throw new Error('SERVICE_ACCOUNT_SECRET_INVALID');
          const source=fs.readFileSync('firestore.rules','utf8');
          if(!source.includes("rules_version = '2'")) throw new Error('RULES_SOURCE_INVALID');
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          async function token(){const n=Math.floor(Date.now()/1000),h=enc({alg:'RS256',typ:'JWT'}),p=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:n,exp:n+900}),u=`${h}.${p}`,sig=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${u}.${sig}`})});if(!r.ok)throw new Error(`OAUTH_${r.status}`);return (await r.json()).access_token}
          async function call(url,t,init={}){const r=await fetch(url,{...init,headers:{authorization:`Bearer ${t}`,'content-type':'application/json',...(init.headers||{})}});const text=await r.text();let body={};try{body=text?JSON.parse(text):{}}catch{}return{status:r.status,body}}
          const safe=(name,r)=>console.log(`${name}=${r.status}_${String(r.body?.error?.status||'OK').replace(/[^A-Z0-9_.:-]/gi,'_').slice(0,80)}`);
          (async()=>{
            const t=await token();
            const created=await call(`https://firebaserules.googleapis.com/v1/projects/${project}/rulesets`,t,{method:'POST',body:JSON.stringify({source:{files:[{name:'firestore.rules',content:source}]}})}); safe('RULESET_CREATE',created); if(created.status!==200)process.exit(2);
            const list=await call(`https://firebaserules.googleapis.com/v1/projects/${project}/releases?pageSize=100`,t); safe('RELEASE_LIST',list); if(list.status!==200)process.exit(3);
            const release=(list.body.releases||[]).find(x=>String(x.name||'').endsWith('/releases/cloud.firestore'));
            let published;
            if(release){published=await call(`https://firebaserules.googleapis.com/v1/${release.name}`,t,{method:'PATCH',body:JSON.stringify({release:{name:release.name,rulesetName:created.body.name},updateMask:'rulesetName'})});}
            else {published=await call(`https://firebaserules.googleapis.com/v1/projects/${project}/releases`,t,{method:'POST',body:JSON.stringify({name:`projects/${project}/releases/cloud.firestore`,rulesetName:created.body.name})});}
            safe('RULES_PUBLISH',published); if(published.status!==200)process.exit(4);
            console.log('FIRESTORE_RULES_TARGET=PASS');
          })().catch(e=>{console.error(String(e.message||e).replace(/[^A-Z0-9_.:-]/gi,'_').slice(0,120));process.exitCode=1});
          NODE