name: Deploy verified target Edge functions once

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - '.github/workflows/deploy-target-edge-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: oedasgcdjppjwidhlqdr
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
      - name: Fail closed without Supabase credential
        run: test -n "${SUPABASE_ACCESS_TOKEN:-}"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy target functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in api web-api admin-ops staff-watch notification-worker sheet-worker fallback-token emergency-auth emergency-drain fallback-importer backup-account-admin firebase-bootstrap; do
            test -f "supabase/functions/$fn/index.ts"
            supabase functions deploy "$fn" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
          done
          echo TARGET_EDGE_DEPLOY=PASS
