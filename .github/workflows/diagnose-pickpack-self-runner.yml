name: Diagnose PICK PACK Self Runner

on:
  push:
    branches: [ main ]
    paths:
      - '.ops/DIAG_PICKPACK_SELF_RUNNER.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Exact runner and existing Firebase secret guard
        shell: cmd
        run: |
          echo RUNNER_NAME=%RUNNER_NAME%
          if not "%RUNNER_NAME%"=="PICKPACK-BUILD-LAPTOP" exit /b 2
      - name: Verify existing Firebase secret without exposing it
        shell: powershell
        run: |
          if([string]::IsNullOrWhiteSpace($env:FIREBASE_SERVICE_ACCOUNT)){throw 'FIREBASE_SERVICE_ACCOUNT missing'}
          $j=$env:FIREBASE_SERVICE_ACCOUNT|ConvertFrom-Json
          if($j.project_id -ne 'bao-hang-1291'){throw 'Wrong Firebase project'}
          Write-Host 'BAOHANG_FIREBASE_SECRET=PASS'
