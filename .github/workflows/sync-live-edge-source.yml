name: One-time Live Edge Source Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-live-edge-source.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: oedasgcdjppjwidhlqdr
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Download exact live function sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf supabase/functions/api supabase/functions/web-api
          supabase functions download api --project-ref "$SUPABASE_PROJECT_ID" --use-api
          supabase functions download web-api --project-ref "$SUPABASE_PROJECT_ID" --use-api
          test -s supabase/functions/api/index.ts
          test -s supabase/functions/web-api/index.ts
          grep -q 'type Role = "ADMIN"' supabase/functions/api/index.ts
          grep -q 'x-admin-test-role' supabase/functions/web-api/index.ts
      - name: Commit downloaded live source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/api supabase/functions/web-api supabase/functions/_shared/fcm.ts
          if git diff --cached --quiet; then
            echo 'LIVE_EDGE_SOURCE_ALREADY_SYNCED=PASS'
            exit 0
          fi
          git commit -m 'Sync live role and diagnostics Edge APIs'
          git push origin HEAD:main
