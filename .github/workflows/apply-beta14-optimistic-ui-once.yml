name: Apply Beta14 optimistic UI once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-beta14-optimistic-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Patch optimistic Android UI and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_beta14_optimistic_ui.py
          rm .github/workflows/apply-beta14-optimistic-ui-once.yml
          rm .github/scripts/apply_beta14_optimistic_ui.py
          git diff --check
          gradle --no-daemon testDebugUnitTest assembleDebug
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt .github/workflows/apply-beta14-optimistic-ui-once.yml .github/scripts/apply_beta14_optimistic_ui.py
          git commit -m 'fix(android): respond optimistically to operational actions'
          git push
