name: Temp finalize Apps Script Neon

on:
  push:
    branches: [main]
    paths: ['.ops/FINALIZE_APPS_SCRIPT_NEON.txt']

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WORKER_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.GOOGLE_SHEET_WEBHOOK_SECRET }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      BOOTSTRAP_URL: https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/migration-apps-script-bootstrap
    steps:
      - uses: actions/checkout@v6
      - name: Exact BÁO HÀNG scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          case "$WORKER_URL" in https://script.google.com/macros/s/*/exec) ;; *) exit 10;; esac
          test -n "$WEBHOOK_SECRET"
          test -n "$FIREBASE_SERVICE_ACCOUNT"
      - name: Fetch one-time migration configuration without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg secret "$WEBHOOK_SECRET" '{project:"bao-hang-1291",supabase_ref:"oedasgcdjppjwidhlqdr",neon_project:"tiny-boat-19315489",neon_branch:"br-broad-resonance-aznwrpea",webhook_secret:$secret}' > "$RUNNER_TEMP/bootstrap-request.json"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 -X POST "$BOOTSTRAP_URL" -H 'content-type: application/json' --data-binary @"$RUNNER_TEMP/bootstrap-request.json" > "$RUNNER_TEMP/bootstrap.json"
          jq -e '.ok == true and .scope.project == "bao-hang-1291" and .scope.supabase_ref == "oedasgcdjppjwidhlqdr" and .scope.neon_project == "tiny-boat-19315489" and .scope.neon_branch == "br-broad-resonance-aznwrpea" and (.firebase_service_account|type=="string") and (.worker_admin_uid|type=="string") and (.neon_data_api|contains("ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech"))' "$RUNNER_TEMP/bootstrap.json" >/dev/null
          echo 'MIGRATION_CONFIG_SCOPE=PASS'
      - name: Configure locked Neon worker and run production tick
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const bootstrap = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/bootstrap.json','utf8'));
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (sa.project_id !== 'bao-hang-1291' || !sa.client_email || !sa.private_key) throw new Error('FIREBASE_SERVICE_ACCOUNT_SCOPE');
          if (JSON.parse(bootstrap.firebase_service_account).project_id !== 'bao-hang-1291') throw new Error('BOOTSTRAP_FIREBASE_SCOPE');
          const enc = v => Buffer.from(typeof v === 'string' ? v : JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now()/1000);
          const h = enc({alg:'RS256',typ:'JWT'});
          const p = enc({iss:sa.client_email,sub:sa.client_email,aud:'https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit',iat:now,exp:now+900,uid:String(bootstrap.worker_admin_uid)});
          const unsigned = `${h}.${p}`;
          const sig = crypto.sign('RSA-SHA256', Buffer.from(unsigned), sa.private_key).toString('base64url');
          const customToken = `${unsigned}.${sig}`;
          async function jsonFetch(url, options) {
            const res = await fetch(url, options);
            const text = await res.text();
            let data={}; try{data=JSON.parse(text)}catch{}
            if (!res.ok) throw new Error(`HTTP_${res.status}`);
            return data;
          }
          async function main(){
            const auth = await jsonFetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(bootstrap.firebase_web_api_key)}`, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:customToken,returnSecureToken:true})});
            if (!auth.idToken) throw new Error('ADMIN_ID_TOKEN_MISSING');
            const config = {
              webhook_secret:process.env.WEBHOOK_SECRET,
              firebase_service_account:bootstrap.firebase_service_account,
              staff_default_password:bootstrap.staff_default_password,
              neon_data_api:bootstrap.neon_data_api,
              firebase_web_api_key:bootstrap.firebase_web_api_key,
              firebase_project_id:bootstrap.firebase_project_id,
              worker_admin_uid:bootstrap.worker_admin_uid
            };
            const configured = await jsonFetch(process.env.WORKER_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'bootstrap-config',id_token:auth.idToken,config})});
            if (!(configured.ok === true || String(configured.error||'').includes('BOOTSTRAP_LOCKED'))) throw new Error('WORKER_BOOTSTRAP_REJECTED');
            const ping = await jsonFetch(process.env.WORKER_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'ping'})});
            if (!(ping.ok===true && ping.project==='bao-hang-1291' && ping.provider==='NEON_FIREBASE_GOOGLE')) throw new Error('WORKER_PING_FAILED');
            const tick = await jsonFetch(process.env.WORKER_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'worker-kick',id_token:auth.idToken})});
            if (tick.ok !== true) throw new Error('WORKER_TICK_FAILED');
            console.log('APPS_SCRIPT_NEON_BOOTSTRAP=PASS');
            console.log('APPS_SCRIPT_NEON_PING=PASS');
            console.log('APPS_SCRIPT_NEON_TICK=PASS');
          }
          main().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Cleanup migration material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/bootstrap.json" "$RUNNER_TEMP/bootstrap-request.json"
