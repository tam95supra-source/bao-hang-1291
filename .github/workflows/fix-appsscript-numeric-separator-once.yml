name: Fix Apps Script numeric separator once

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - '.github/workflows/fix-appsscript-numeric-separator-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - name: Make Code.gs compatible with Apps Script parser
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('google-apps-script/Code.gs')
          text = p.read_text()
          old = '2_000_000'
          if old not in text:
              raise SystemExit('expected numeric separator source not found')
          text = text.replace(old, '2000000')
          p.write_text(text)
          PY
          git diff --check -- google-apps-script/Code.gs
          if grep -En '[0-9]_[0-9]' google-apps-script/Code.gs; then
            echo 'Unsupported numeric separator remains in Code.gs' >&2
            exit 1
          fi
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/Code.gs
          git commit -m "fix: keep Apps Script source parser-compatible"
          git push origin HEAD:target-final-20260814-impl
