name: Temp P5 production signing validation

on:
  push:
    branches:
      - migration/neon-cutover
    paths:
      - '.github/workflows/temp-p5-release-signing-validation.yml'

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Fail closed on target and required bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          test -n "${GOOGLE_SHEET_WEBHOOK_URL:-}"
          case "$GOOGLE_SHEET_WEBHOOK_URL" in https://script.google.com/macros/s/*/exec) ;; *) exit 1;; esac
          ! grep -RInE 'ep-flat-feather-azdi44be|ttwftrooaizxmjovkbaz|pick-pack-1291\.web\.app|pick-pack-1291-primary|19a7c8e9-9fc0-4b04-a545-bcbe84b1bcb1' app/src app/build.gradle.kts
          grep -Fq 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1' app/build.gradle.kts

      - name: Restore and verify permanent signing key
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -s signing/production-signing.bundle.enc
          test -s signing/production-cert-sha256.txt
          test "$(cat signing/wrap-scheme.txt)" = 'firebase-service-account-private-key-v1'
          work="$RUNNER_TEMP/production-signing"
          mkdir -p "$work/plain"
          firebase_private_key="$(jq -er '.private_key' <<<"$FIREBASE_SERVICE_ACCOUNT")"
          wrap_key="$({ printf '%s\0' "$firebase_private_key"; printf '%s' "$GITHUB_REPOSITORY"; } | sha256sum | awk '{print $1}')"
          echo "::add-mask::$wrap_key"
          WRAP_KEY="$wrap_key" openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -md sha256 -pass env:WRAP_KEY \
            -in signing/production-signing.bundle.enc -out "$work/signing.tar"
          tar -C "$work/plain" -xf "$work/signing.tar"
          test -s "$work/plain/bao-hang-1291-production.p12"
          test -s "$work/plain/signing.properties"
          source "$work/plain/signing.properties"
          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_PASSWORD"
          pinned="$(tr -d '[:space:]' < signing/production-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          keytool -list -v -keystore "$work/plain/bao-hang-1291-production.p12" -storetype PKCS12 -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" 2>/dev/null > "$work/keytool.txt"
          actual="$(sed -n 's/^.*SHA256: //p' "$work/keytool.txt" | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$pinned" =~ ^[0-9a-f]{64}$ ]]
          test "$actual" = "$pinned"
          printf '%s' "$RELEASE_STORE_PASSWORD" > "$RUNNER_TEMP/release-store-password"
          printf '%s' "$RELEASE_KEY_PASSWORD" > "$RUNNER_TEMP/release-key-password"
          chmod 600 "$RUNNER_TEMP/release-store-password" "$RUNNER_TEMP/release-key-password"
          echo "store_file=$work/plain/bao-hang-1291-production.p12" >> "$GITHUB_OUTPUT"
          echo "key_alias=$RELEASE_KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      - name: Build signed release and verify identity
        shell: bash
        env:
          RELEASE_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          RELEASE_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          PINNED_FINGERPRINT: ${{ steps.signing.outputs.pinned }}
          VERSION_NAME: '1.6.4'
          VERSION_CODE: '12'
          OTA_CHANNEL: beta
        run: |
          set -euo pipefail
          RELEASE_STORE_PASSWORD="$(cat "$RUNNER_TEMP/release-store-password")"
          RELEASE_KEY_PASSWORD="$(cat "$RUNNER_TEMP/release-key-password")"
          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_PASSWORD"
          RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            gradle --no-daemon testReleaseUnitTest assembleRelease -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" -POTA_CHANNEL="$OTA_CHANNEL"
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -111 | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$apkanalyzer"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apksigner.txt"
          actual="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$PINNED_FINGERPRINT"
          test "$("$apkanalyzer" manifest application-id "$apk")" = 'vn.pickpack1291.baohang'
          test "$("$apkanalyzer" manifest version-code "$apk")" = "$VERSION_CODE"
          test "$("$apkanalyzer" manifest version-name "$apk")" = "$VERSION_NAME"
          "$apkanalyzer" manifest print "$apk" > "$RUNNER_TEMP/manifest.xml"
          grep -F 'vn.pickpack1291.baohang.OTA_CHANNEL' "$RUNNER_TEMP/manifest.xml" >/dev/null
          grep -F 'android:value="beta"' "$RUNNER_TEMP/manifest.xml" >/dev/null
          echo 'P5_RELEASE_SIGNING_VALIDATION_OK package=vn.pickpack1291.baohang channel=beta signer=pinned'
