name: Temp Admin Invent RBAC probe

on:
  push:
    branches: [main]
    paths:
      - 'ops/admin-invent-rbac-probe.trigger'

permissions:
  contents: write

concurrency:
  group: temp-admin-invent-rbac-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      NEON_API: https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Probe live ADMIN_INVENT permissions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (sa.project_id !== 'bao-hang-1291' || !sa.client_email || !sa.private_key) throw new Error('FIREBASE_SCOPE');
          const workerUrl = String(process.env.GOOGLE_SHEET_WEBHOOK_URL || '');
          if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(workerUrl)) throw new Error('WORKER_SCOPE');
          const source = fs.readFileSync('ops/full_staff_sync.mjs','utf8');
          const adminUid = source.match(/const ADMIN_UID='([^']+)'/)?.[1];
          const gcfg = JSON.parse(fs.readFileSync('app/google-services.json','utf8'));
          const apiKey = gcfg.client?.[0]?.api_key?.[0]?.current_key;
          if (!adminUid || !apiKey) throw new Error('PUBLIC_RUNTIME_CONFIG_MISSING');
          const enc = v => Buffer.from(typeof v === 'string' ? v : JSON.stringify(v)).toString('base64url');
          function customToken(uid) {
            const now = Math.floor(Date.now()/1000);
            const h = enc({alg:'RS256',typ:'JWT'});
            const p = enc({iss:sa.client_email,sub:sa.client_email,aud:'https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit',iat:now,exp:now+900,uid:String(uid)});
            const u = `${h}.${p}`;
            const s = crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');
            return `${u}.${s}`;
          }
          async function jsonFetch(url,opt={}) {
            const res = await fetch(url,opt);
            const text = await res.text();
            let data={}; try { data=text?JSON.parse(text):{} } catch { data={raw:text} }
            return {res,data,text};
          }
          async function idToken(uid) {
            const {res,data} = await jsonFetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:customToken(uid),returnSecureToken:true})});
            if (!res.ok || !data.idToken) throw new Error('CUSTOM_LOGIN_FAILED');
            return data.idToken;
          }
          async function rpc(token,name,payload={}) {
            const {res,data,text} = await jsonFetch(`${process.env.NEON_API}/rpc/${name}`,{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${token}`},body:JSON.stringify(payload)});
            if (!res.ok) throw new Error(`${name}:HTTP_${res.status}:${String(data?.message||data?.error||text).slice(0,160)}`);
            return data;
          }
          async function main() {
            const adminToken = await idToken(adminUid);
            const all = await rpc(adminToken,'api_list_users_rpc',{p_test_role:null});
            const target = (all.users || []).find(u => u.source_kind === 'MANUAL' && u.role === 'ADMIN_INVENT' && u.active === true);
            if (!target?.id) throw new Error('ACTIVE_MANUAL_ADMIN_INVENT_NOT_FOUND');
            const token = await idToken(target.id);
            const checks = [
              ['admin_summary','api_admin_summary_rpc',{}],
              ['reports_summary','api_reports_summary_rpc',{}],
              ['service_metrics','api_service_metrics_rpc',{}],
              ['issue_board','api_issue_board_rpc',{}],
              ['list_users','api_list_users_rpc',{}],
              ['staff_sync_status','api_staff_sync_status_rpc',{p_limit:5}],
            ];
            const lines=[];
            for (const [label,name,payload] of checks) {
              await rpc(token,name,{p_test_role:null,...payload});
              lines.push(`${label}=PASS`);
            }
            const worker = await jsonFetch(workerUrl,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'update-user',id_token:token,employee_code:'!',full_name:'RBAC Probe',role:'PICKER',active:true})});
            const workerError = String(worker.data?.error || '');
            if (!worker.res.ok || !workerError.includes('INVALID_USER') || workerError.includes('FORBIDDEN')) throw new Error(`CREATE_PERMISSION_GATE_FAILED:${workerError.slice(0,120)}`);
            lines.push('create_user_permission_gate=PASS');
            lines.push('test_data_created=0');
            lines.push(`checked_at=${new Date().toISOString()}`);
            fs.writeFileSync('ops/admin-invent-rbac-live-proof.txt',lines.join('\n')+'\n');
            console.log(lines.join('\n'));
          }
          main().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE

      - name: Commit sanitized proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/admin-invent-rbac-live-proof.txt
          git commit -m 'test(auth): verify live Admin Invent access'
          git pull --rebase origin main
          git push origin HEAD:main
