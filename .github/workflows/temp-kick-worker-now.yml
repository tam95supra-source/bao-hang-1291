name: Temp runtime patch verified gate

on:
  push:
    branches: [main]
    paths:
      - 'ops/kick-worker-now.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply guarded patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 ops/patch_runtime_staff.py > "$RUNNER_TEMP/patch.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          printf 'exit=%s\n' "$code" > ops/patch-runtime-staff-last.txt
          tail -n 12 "$RUNNER_TEMP/patch.log" | sed 's/[[:cntrl:]]//g' | head -c 1800 >> ops/patch-runtime-staff-last.txt
          cat ops/patch-runtime-staff-last.txt
          exit 0
      - name: Commit patch and proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/patch-runtime-staff-last.txt
          if [ "${{ steps.patch.outputs.exit_code }}" = '0' ]; then
            ! grep -q 'cron:' .github/workflows/staff-sync.yml
            ! grep -q "where G = 1291 and H = 'HY1'" .github/workflows/staff-sync.yml google-apps-script/DEPLOY_NEON.gs
            git diff --check
            git add app/src/main/java/vn/pickpack1291/baohang google-apps-script/DEPLOY_NEON.gs .github/workflows/staff-sync.yml
          fi
          git diff --cached --quiet || git commit -m 'fix(runtime): reconcile cleared snapshots and event-driven staff source'
          git pull --rebase origin main
          git push origin HEAD:main
          test "${{ steps.patch.outputs.exit_code }}" = '0'
