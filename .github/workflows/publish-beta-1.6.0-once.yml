name: Publish approved Beta 1.6.0 once

on:
  push:
    branches:
      - target-final-20260814-impl
    paths:
      - '.github/workflows/publish-beta-1.6.0-once.yml'

permissions:
  contents: write

concurrency:
  group: production-ota-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SOURCE_SHA: 2dd1e419735c72bba90dda6b6a8d2dda92421642
      VERSION_NAME: 1.6.0
      VERSION_CODE: '8'
      CHANNEL: beta
      TAG: beta-v1.6.0
      APK_NAME: bao-hang-1291-beta-1.6.0.apk
      POINTER: ota/beta/release-manifest.json
    steps:
      - name: Verify zero-cost/public release gate
        shell: bash
        run: |
          set -euo pipefail
          is_private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          test "$is_private" = 'false'
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing overwrite." >&2
            exit 1
          fi
          pointer_json="$(gh api "repos/$GITHUB_REPOSITORY/contents/$POINTER?ref=main" --jq '.content' | tr -d '\n' | base64 -d)"
          previous_channel="$(jq -r '.channel // empty' <<<"$pointer_json")"
          previous_code="$(jq -r '.versionCode // 0' <<<"$pointer_json")"
          test "$previous_channel" = 'beta'
          [[ "$previous_code" =~ ^[0-9]+$ ]]
          (( VERSION_CODE > previous_code ))
          echo "Release gate PASS: public standard runner, beta versionCode $previous_code -> $VERSION_CODE"

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Restore and verify permanent signing key
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -s signing/production-signing.bundle.enc
          test -s signing/production-cert-sha256.txt
          test "$(cat signing/wrap-scheme.txt)" = 'firebase-service-account-private-key-v1'
          work="$RUNNER_TEMP/production-signing"
          mkdir -p "$work/plain"
          firebase_private_key="$(jq -er '.private_key' <<<"$FIREBASE_SERVICE_ACCOUNT")"
          wrap_key="$({ printf '%s\0' "$firebase_private_key"; printf '%s' "$GITHUB_REPOSITORY"; } | sha256sum | awk '{print $1}')"
          echo "::add-mask::$wrap_key"
          WRAP_KEY="$wrap_key" openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -md sha256 \
            -pass env:WRAP_KEY -in signing/production-signing.bundle.enc -out "$work/signing.tar"
          tar -C "$work/plain" -xf "$work/signing.tar"
          test -s "$work/plain/bao-hang-1291-production.p12"
          test -s "$work/plain/signing.properties"
          source "$work/plain/signing.properties"
          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_PASSWORD"
          pinned="$(tr -d '[:space:]' < signing/production-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          keytool -list -v -keystore "$work/plain/bao-hang-1291-production.p12" -storetype PKCS12 \
            -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" 2>/dev/null > "$work/keytool.txt"
          actual="$(sed -n 's/^.*SHA256: //p' "$work/keytool.txt" | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$pinned" =~ ^[0-9a-f]{64}$ ]]
          test "$actual" = "$pinned"
          printf '%s' "$RELEASE_STORE_PASSWORD" > "$RUNNER_TEMP/release-store-password"
          printf '%s' "$RELEASE_KEY_PASSWORD" > "$RUNNER_TEMP/release-key-password"
          chmod 600 "$RUNNER_TEMP/release-store-password" "$RUNNER_TEMP/release-key-password"
          {
            echo "store_file=$work/plain/bao-hang-1291-production.p12"
            echo "key_alias=$RELEASE_KEY_ALIAS"
            echo "pinned_fingerprint=$pinned"
          } >> "$GITHUB_OUTPUT"

      - name: Test, build, sign and verify Beta 1.6.0
        id: build
        shell: bash
        env:
          RELEASE_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          RELEASE_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
          PINNED_FINGERPRINT: ${{ steps.signing.outputs.pinned_fingerprint }}
        run: |
          set -euo pipefail
          RELEASE_STORE_PASSWORD="$(cat "$RUNNER_TEMP/release-store-password")"
          RELEASE_KEY_PASSWORD="$(cat "$RUNNER_TEMP/release-key-password")"
          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_PASSWORD"
          RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            gradle --no-daemon testReleaseUnitTest assembleRelease \
              -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" -POTA_CHANNEL="$CHANNEL"

          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -111 | sort -V | tail -n1)"
          test -x "$apksigner"
          test -x "$apkanalyzer"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          actual_fingerprint="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$actual_fingerprint" = "$PINNED_FINGERPRINT"
          package_name="$("$apkanalyzer" manifest application-id "$apk")"
          apk_version_code="$("$apkanalyzer" manifest version-code "$apk")"
          apk_version_name="$("$apkanalyzer" manifest version-name "$apk")"
          test "$package_name" = 'vn.pickpack1291.baohang'
          test "$apk_version_code" = "$VERSION_CODE"
          test "$apk_version_name" = "$VERSION_NAME"
          "$apkanalyzer" manifest print "$apk" > "$RUNNER_TEMP/manifest.xml"
          grep -F 'vn.pickpack1291.baohang.OTA_CHANNEL' "$RUNNER_TEMP/manifest.xml" >/dev/null
          grep -F 'android:value="beta"' "$RUNNER_TEMP/manifest.xml" >/dev/null
          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_dir"
          cp "$apk" "$release_dir/$APK_NAME"
          apk_sha256="$(sha256sum "$release_dir/$APK_NAME" | awk '{print $1}')"
          {
            echo "release_dir=$release_dir"
            echo "apk_sha256=$apk_sha256"
          } >> "$GITHUB_OUTPUT"
          echo "APK_VERIFY_PASS package=$package_name version=$apk_version_name($apk_version_code) channel=$CHANNEL"

      - name: Publish and atomically advance Beta OTA pointer
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.build.outputs.release_dir }}
          APK_SHA256: ${{ steps.build.outputs.apk_sha256 }}
          SIGNER_SHA256: ${{ steps.signing.outputs.pinned_fingerprint }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/publish-beta"
          mkdir -p "$work/verify"
          notes="$work/release-notes.txt"
          cat > "$notes" <<'NOTES'
          Beta 1.6.0: sửa App → Web Realtime; cập nhật giao diện Android theo diff từng SKU thay vì reload; hiển thị tổng SKU cần xử lý ở tiêu đề; giữ nguyên tab/vị trí sau Nhận xử lý, Có hàng hoặc Skip hàng; bố trí hai nút CÓ HÀNG và SKIP HÀNG đối xứng; cảnh báo SKU mới chỉ ở lượt báo đầu tiên, các lượt sau chỉ cộng dồn và ghi log, kết quả vẫn gửi đúng các Picker đã báo.
          NOTES
          apk_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
          manifest="$RELEASE_DIR/release-manifest.json"
          jq -n \
            --arg channel "$CHANNEL" \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$apk_url" \
            --arg sha256 "$APK_SHA256" \
            --arg releaseNotes "$(cat "$notes")" \
            --arg signerSha256 "$SIGNER_SHA256" \
            --arg sourceSha "$SOURCE_SHA" \
            '{channel:$channel,versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,mandatory:false,releaseNotes:$releaseNotes,signerSha256:$signerSha256,sourceSha:$sourceSha}' > "$manifest"
          jq -e . "$manifest" >/dev/null

          cleanup_failed_release() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_failed_release ERR

          gh release create "$TAG" "$RELEASE_DIR/$APK_NAME" "$manifest" \
            --target "$SOURCE_SHA" --title "Báo hàng 1291 Beta $VERSION_NAME" --notes-file "$notes" --prerelease

          gh release download "$TAG" --pattern "$APK_NAME" --dir "$work/verify"
          gh release download "$TAG" --pattern 'release-manifest.json' --dir "$work/verify"
          published_sha="$(sha256sum "$work/verify/$APK_NAME" | awk '{print $1}')"
          test "$published_sha" = "$APK_SHA256"
          cmp -s "$manifest" "$work/verify/release-manifest.json"

          pointer_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$POINTER?ref=main" --jq '.sha')"
          content_b64="$(base64 -w0 "$manifest")"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$POINTER" \
            -f message="Update beta OTA manifest to $VERSION_NAME" \
            -f content="$content_b64" \
            -f sha="$pointer_sha" \
            -f branch='main' >/dev/null

          live_pointer="$(gh api "repos/$GITHUB_REPOSITORY/contents/$POINTER?ref=main" --jq '.content' | tr -d '\n' | base64 -d)"
          test "$(jq -r '.versionName' <<<"$live_pointer")" = "$VERSION_NAME"
          test "$(jq -r '.versionCode' <<<"$live_pointer")" = "$VERSION_CODE"
          test "$(jq -r '.sha256' <<<"$live_pointer")" = "$APK_SHA256"
          test "$(jq -r '.signerSha256' <<<"$live_pointer")" = "$SIGNER_SHA256"
          test "$(jq -r '.sourceSha' <<<"$live_pointer")" = "$SOURCE_SHA"
          trap - ERR
          echo "BETA_1_6_0_PUBLISH_PASS sha256=$APK_SHA256 signer=$SIGNER_SHA256 source=$SOURCE_SHA"

      - name: Remove one-shot release workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/publish-beta-1.6.0-once.yml'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=target-final-20260814-impl" --jq '.sha' 2>/dev/null || true)"
          if test -n "$sha"; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message='ops: remove Beta 1.6.0 one-shot release workflow' \
              -f sha="$sha" \
              -f branch='target-final-20260814-impl' >/dev/null
          fi
