name: Final Production Acceptance

on:
  workflow_call:
    inputs:
      expected_deployed_sha:
        required: true
        type: string
      production_url:
        required: true
        type: string
      acceptance_mode:
        required: false
        type: string
        default: targeted
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        description: Exact production source SHA to accept
        required: true
        type: string
      production_url:
        description: Production URL
        required: true
        type: string
        default: https://bao-hang-1291.web.app
      acceptance_mode:
        description: Acceptance mode
        required: true
        type: choice
        default: targeted
        options: [targeted]
  push:
    branches: [main]
    paths: ['ops/final-production-acceptance.trigger']

concurrency:
  group: bao-hang-1291-production-acceptance
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEON_DATA_API: https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1
  E2E_RUN_MARKER: e2e-final-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify_production:
    name: verify-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expected_deployed_sha: ${{ steps.config.outputs.expected_deployed_sha }}
      production_url: ${{ steps.config.outputs.production_url }}
      acceptance_mode: ${{ steps.config.outputs.acceptance_mode }}
      verify_pass: ${{ steps.done.outputs.verify_pass }}
    steps:
      - name: Resolve acceptance configuration
        id: config
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.expected_deployed_sha }}
          INPUT_URL: ${{ inputs.production_url }}
          INPUT_MODE: ${{ inputs.acceptance_mode }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-}"; url="${INPUT_URL:-}"; mode="${INPUT_MODE:-}"
          if [ -z "$sha" ]; then
            [[ "${COMMIT_MESSAGE:-}" =~ expected_deployed_sha=([0-9a-f]{40}) ]] || { echo EXPECTED_DEPLOYED_SHA_MISSING >&2; exit 1; }
            sha="${BASH_REMATCH[1]}"
          fi
          [ -n "$url" ] || url='https://bao-hang-1291.web.app'
          [ -n "$mode" ] || mode='targeted'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [ "$url" = 'https://bao-hang-1291.web.app' ]
          [ "$mode" = 'targeted' ]
          echo "expected_deployed_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "production_url=$url" >> "$GITHUB_OUTPUT"
          echo "acceptance_mode=$mode" >> "$GITHUB_OUTPUT"
          echo "ACCEPTANCE_CONFIG=PASS mode=$mode expected_sha=$sha"

      - name: Verify exact production deployment
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.config.outputs.expected_deployed_sha }}
          PRODUCTION_URL: ${{ steps.config.outputs.production_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected=process.env.EXPECTED_SHA,site=process.env.PRODUCTION_URL.replace(/\/$/,'');
          (async()=>{const r=await fetch(`${site}/__deployed_sha.txt?gate=${Date.now()}`,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});if(!r.ok)throw new Error(`DEPLOYED_SHA_MARKER_HTTP_${r.status}`);const live=(await r.text()).trim();if(live!==expected)throw new Error(`DEPLOYED_SHA_MISMATCH live=${live} expected=${expected}`);const root=await fetch(`${site}/?gate=${Date.now()}`,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});if(!root.ok)throw new Error(`PRODUCTION_ROOT_HTTP_${root.status}`);console.log(`PRODUCTION_SHA_GUARD=PASS deployed_sha=${expected}`)})().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE

      - name: Verify zero-cost billing guard
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');if(!sa.client_email||!sa.private_key||sa.project_id!=='bao-hang-1291')throw new Error('FIREBASE_SERVICE_ACCOUNT_SCOPE');const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');const now=Math.floor(Date.now()/1000),h=enc({alg:'RS256',typ:'JWT'}),p=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900}),u=`${h}.${p}`,sig=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');(async()=>{const tr=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${u}.${sig}`}),signal:AbortSignal.timeout(15000)});if(!tr.ok)throw new Error(`OAUTH_HTTP_${tr.status}`);const access=(await tr.json()).access_token;const br=await fetch('https://cloudbilling.googleapis.com/v1/projects/bao-hang-1291/billingInfo',{headers:{authorization:`Bearer ${access}`},signal:AbortSignal.timeout(15000)});if(!br.ok)throw new Error(`BILLING_HTTP_${br.status}`);const b=await br.json();if(b.billingEnabled===true)throw new Error('COST_GUARD_STOP');console.log('COST_GUARD=PASS billingEnabled=false')})().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE

      - name: Mark verify PASS and evidence
        id: done
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.config.outputs.expected_deployed_sha }}
          PRODUCTION_URL: ${{ steps.config.outputs.production_url }}
        run: |
          set -euo pipefail
          mkdir -p .acceptance-evidence/verify
          printf '%s\n' "VERIFY_PRODUCTION=PASS" "COST_GUARD=PASS" "billingEnabled=false" "DEPLOYED_SHA=$EXPECTED_SHA" "PRODUCTION_URL=$PRODUCTION_URL" > .acceptance-evidence/verify/verify.txt
          echo verify_pass=true >> "$GITHUB_OUTPUT"
          echo VERIFY_PRODUCTION=PASS
      - name: Upload verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-verify-${{ github.run_id }}
          path: .acceptance-evidence/verify
          retention-days: 1
          if-no-files-found: error

  preflight_cleanup:
    name: preflight-cleanup
    needs: verify_production
    if: needs.verify_production.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      preflight_pass: ${{ steps.done.outputs.preflight_pass }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install cleanup runtime
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/preflight-runtime"; mkdir -p "$D"; printf '{"private":true}' > "$D/package.json"
          npm --prefix "$D" install firebase-admin@13.4.0 --ignore-scripts --no-audit --no-fund --no-package-lock
          echo "NODE_PATH=$D/node_modules" >> "$GITHUB_ENV"
      - name: Inventory and cleanup previous exact E2E fixtures
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          node scripts/final-e2e-manifest.cjs "$RUNNER_TEMP/preflight-manifest.json"
          node scripts/final-e2e-cleanup.cjs "$RUNNER_TEMP/preflight-manifest.json" 2>&1 | tee "$RUNNER_TEMP/preflight-cleanup.log"
          grep -F 'TEST_CLEANUP_READBACK=PASS' "$RUNNER_TEMP/preflight-cleanup.log" >/dev/null
          grep -F 'REAL_ACTIVE_GSHEET_PRESERVED=PASS' "$RUNNER_TEMP/preflight-cleanup.log" >/dev/null
      - name: Mark preflight PASS
        id: done
        run: |
          echo preflight_pass=true >> "$GITHUB_OUTPUT"
          echo PREFLIGHT_CLEANUP=PASS
      - name: Cleanup temp runtime
        if: always()
        run: rm -rf "$RUNNER_TEMP/preflight-runtime" "$RUNNER_TEMP/preflight-manifest.json"

  targeted_two_session:
    name: targeted-two-session
    needs: [verify_production, preflight_cleanup]
    if: needs.verify_production.result == 'success' && needs.preflight_cleanup.result == 'success' && needs.verify_production.outputs.acceptance_mode == 'targeted'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      markers_pass: ${{ steps.markers.outputs.markers_pass }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install targeted runtime
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/two-session-e2e"; mkdir -p "$D"; printf '{"private":true}' > "$D/package.json"
          npm --prefix "$D" install firebase-admin@13.4.0 playwright-core@1.55.0 --ignore-scripts --no-audit --no-fund --no-package-lock
          echo "E2E_DIR=$D" >> "$GITHUB_ENV"
          echo "NODE_PATH=$D/node_modules" >> "$GITHUB_ENV"
      - name: Seed exact Neon E2E fixtures
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          E2E_SEED_MANIFEST: .e2e-manifest/base/cleanup-manifest.json
        run: |
          set -euo pipefail
          mkdir -p .e2e-manifest/base .acceptance-evidence/targeted
          node scripts/final-e2e-seed.cjs 2>&1 | tee .acceptance-evidence/targeted/seed.log
      - name: Upload base cleanup manifest immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-manifest-base-${{ github.run_id }}
          path: .e2e-manifest/base/cleanup-manifest.json
          retention-days: 1
          if-no-files-found: error
      - name: Run production two-session A to B realtime
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$CHROME_BIN"
          FINAL_HARNESS="$RUNNER_TEMP/final-two-session.cjs"
          node scripts/prepare-final-harness.cjs scripts/targeted-two-session-realtime-v4.cjs "$FINAL_HARNESS"
          node scripts/patch-final-fast-events-harness.cjs "$FINAL_HARNESS"
          node --check "$FINAL_HARNESS"
          CHROME_BIN="$CHROME_BIN" node "$FINAL_HARNESS" 2>&1 | tee .acceptance-evidence/targeted/two-session.log
      - name: Snapshot final exact cleanup manifest
        if: always()
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          mkdir -p .e2e-manifest/final
          node scripts/final-e2e-manifest.cjs .e2e-manifest/final/cleanup-manifest.json
      - name: Upload final cleanup manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-manifest-final-${{ github.run_id }}
          path: .e2e-manifest/final/cleanup-manifest.json
          retention-days: 1
          if-no-files-found: error
      - name: Assert targeted markers
        id: markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SEED_EXACT_FIXTURES=PASS' .acceptance-evidence/targeted/seed.log >/dev/null
          markers=(TWO_SESSION_LOGIN_A TWO_SESSION_LOGIN_B FIREBASE_AUTH_READY_BEFORE_SUBSCRIBE FIREBASE_PROFILE_UID_MATCH FIRESTORE_LISTENER_ATTACH BACKEND_ENTITY_READBACK INVENT_EXACT_ENTITY_RENDER A_TO_B_REALTIME REALTIME_ENTITY_MATCH REALTIME_WITHOUT_FULL_RELOAD RESOLVED_SKU_ACTIONS_CLEARED DUPLICATE_EVENT_IGNORED STALE_EVENT_IGNORED CARD_ONLY_PATCH INPUT_FOCUS_SCROLL_HASH_PRESERVED AVAILABLE_SKIP_AUTHZ TWO_SESSION_REALTIME)
          for m in "${markers[@]}"; do grep -F "${m}=PASS" .acceptance-evidence/targeted/two-session.log >/dev/null || { echo "MISSING_REALTIME_MARKER=$m" >&2; exit 1; }; done
          if grep -Ei 'AUTH_REQUIRED|not owner|not_owner' .acceptance-evidence/targeted/two-session.log | grep -vE 'auth_required=false|not_owner=false' >/dev/null; then echo FORBIDDEN_AUTH_ERROR_PRESENT >&2; exit 1; fi
          echo markers_pass=true >> "$GITHUB_OUTPUT"
          echo TARGETED_TWO_SESSION_MARKERS=PASS
      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-targeted-${{ github.run_id }}
          path: |
            .acceptance-evidence/targeted
            .e2e-manifest/base/cleanup-manifest.json
            .e2e-manifest/final/cleanup-manifest.json
          retention-days: 1
          if-no-files-found: warn
      - name: Cleanup targeted runtime
        if: always()
        run: rm -rf "$RUNNER_TEMP/two-session-e2e" "$RUNNER_TEMP/final-two-session.cjs" .e2e-manifest .acceptance-evidence/targeted

  cleanup_readback:
    name: cleanup-readback
    needs: [verify_production, preflight_cleanup, targeted_two_session]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      cleanup_pass: ${{ steps.markers.outputs.cleanup_pass }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download final cleanup manifest
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-manifest-final-${{ github.run_id }}
          path: ${{ runner.temp }}/manifest-final
      - name: Download base cleanup manifest fallback
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-manifest-base-${{ github.run_id }}
          path: ${{ runner.temp }}/manifest-base
      - name: Select cleanup manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/manifest-final/cleanup-manifest.json" ]; then p="$RUNNER_TEMP/manifest-final/cleanup-manifest.json";
          elif [ -f "$RUNNER_TEMP/manifest-base/cleanup-manifest.json" ]; then p="$RUNNER_TEMP/manifest-base/cleanup-manifest.json";
          else echo CLEANUP_MANIFEST_ARTIFACT_MISSING >&2; exit 1; fi
          echo "E2E_CLEANUP_MANIFEST=$p" >> "$GITHUB_ENV"
          echo CLEANUP_MANIFEST_SELECTED=PASS
      - name: Install cleanup runtime
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/cleanup-e2e"; mkdir -p "$D"; printf '{"private":true}' > "$D/package.json"
          npm --prefix "$D" install firebase-admin@13.4.0 --ignore-scripts --no-audit --no-fund --no-package-lock
          echo "NODE_PATH=$D/node_modules" >> "$GITHUB_ENV"
      - name: Exact manifest cleanup and readback
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          mkdir -p .acceptance-evidence/cleanup
          cp "$E2E_CLEANUP_MANIFEST" .acceptance-evidence/cleanup/cleanup-manifest.json
          node scripts/final-e2e-cleanup.cjs "$E2E_CLEANUP_MANIFEST" 2>&1 | tee .acceptance-evidence/cleanup/cleanup.log
      - name: Assert cleanup markers
        id: markers
        shell: bash
        run: |
          set -euo pipefail
          markers=('TEST_SKU_REMAINING=0' 'TEST_PROFILE_REMAINING=0' 'TEST_REPORT_REMAINING=0' 'TEST_OWNERSHIP_REMAINING=0' 'TEST_EVENT_REMAINING=0' 'TEST_NOTIFICATION_REMAINING=0' 'TEST_REALTIME_SIGNAL_REMAINING=0' 'TEST_FIREBASE_USERS_REMAINING=0' 'REAL_ACTIVE_GSHEET_PRESERVED=PASS' 'TEST_CLEANUP_READBACK=PASS')
          for m in "${markers[@]}"; do grep -F "$m" .acceptance-evidence/cleanup/cleanup.log >/dev/null || { echo "MISSING_CLEANUP_MARKER=$m" >&2; exit 1; }; done
          echo cleanup_pass=true >> "$GITHUB_OUTPUT"
          echo CLEANUP_READBACK_MARKERS=PASS
      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence-cleanup-${{ github.run_id }}
          path: .acceptance-evidence/cleanup
          retention-days: 1
          if-no-files-found: warn
      - name: Cleanup temp runtime
        if: always()
        run: rm -rf "$RUNNER_TEMP/cleanup-e2e" "$RUNNER_TEMP/manifest-final" "$RUNNER_TEMP/manifest-base" .acceptance-evidence/cleanup

  final_gate:
    name: final-gate
    needs: [verify_production, preflight_cleanup, targeted_two_session, cleanup_readback]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verify evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: acceptance-evidence-verify-${{ github.run_id }}
          path: .acceptance-evidence/verify
      - name: Download targeted evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: acceptance-evidence-targeted-${{ github.run_id }}
          path: .acceptance-evidence/targeted
      - name: Download cleanup evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: acceptance-evidence-cleanup-${{ github.run_id }}
          path: .acceptance-evidence/cleanup
      - name: Enforce final production acceptance
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify_production.result }}
          VERIFY_PASS: ${{ needs.verify_production.outputs.verify_pass }}
          PREFLIGHT_RESULT: ${{ needs.preflight_cleanup.result }}
          PREFLIGHT_PASS: ${{ needs.preflight_cleanup.outputs.preflight_pass }}
          TARGET_RESULT: ${{ needs.targeted_two_session.result }}
          TARGET_MARKERS: ${{ needs.targeted_two_session.outputs.markers_pass }}
          CLEANUP_RESULT: ${{ needs.cleanup_readback.result }}
          CLEANUP_PASS: ${{ needs.cleanup_readback.outputs.cleanup_pass }}
          DEPLOYED_SHA: ${{ needs.verify_production.outputs.expected_deployed_sha }}
          PRODUCTION_URL: ${{ needs.verify_production.outputs.production_url }}
        run: |
          set -euo pipefail
          mkdir -p .acceptance-evidence/final
          pass=true
          [ "$VERIFY_RESULT" = success ] && [ "$VERIFY_PASS" = true ] || pass=false
          [ "$PREFLIGHT_RESULT" = success ] && [ "$PREFLIGHT_PASS" = true ] || pass=false
          [ "$TARGET_RESULT" = success ] && [ "$TARGET_MARKERS" = true ] || pass=false
          [ "$CLEANUP_RESULT" = success ] && [ "$CLEANUP_PASS" = true ] || pass=false
          {
            echo "DEPLOYED_SHA=$DEPLOYED_SHA"
            echo "PRODUCTION_URL=$PRODUCTION_URL"
            echo "VERIFY_RESULT=$VERIFY_RESULT VERIFY_PASS=$VERIFY_PASS"
            echo "PREFLIGHT_RESULT=$PREFLIGHT_RESULT PREFLIGHT_PASS=$PREFLIGHT_PASS"
            echo "TARGET_RESULT=$TARGET_RESULT TARGET_MARKERS=$TARGET_MARKERS"
            echo "CLEANUP_RESULT=$CLEANUP_RESULT CLEANUP_PASS=$CLEANUP_PASS"
            echo "ANDROID_BUILD_RELEASE=NOT_RUN"
            echo "SECURITY_GUARD=PASS exact_e2e_manifest=true"
          } | tee .acceptance-evidence/final/final-gate.txt
          {
            echo '## BÁO HÀNG 1291 — Final Production Acceptance'
            echo "- Production: $PRODUCTION_URL"
            echo "- Deployed SHA: \`$DEPLOYED_SHA\`"
            echo "- verify-production: $VERIFY_RESULT"
            echo "- preflight-cleanup: $PREFLIGHT_RESULT"
            echo "- targeted-two-session: $TARGET_RESULT"
            echo "- cleanup-readback: $CLEANUP_RESULT"
            echo '- billingEnabled=false only when verify-production PASS'
            echo '- Android build/release: NOT RUN'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$pass" != true ]; then echo FINAL_PRODUCTION_ACCEPTANCE=FAIL | tee -a .acceptance-evidence/final/final-gate.txt; exit 1; fi
          echo FINAL_PRODUCTION_ACCEPTANCE=PASS | tee -a .acceptance-evidence/final/final-gate.txt
          echo '- FINAL_PRODUCTION_ACCEPTANCE=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload consolidated acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: .acceptance-evidence
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
