name: Temp finalize staff sync v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-finalize-staff-sync-v2.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Finalize steady-state staff sync
        id: work
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/finalize_staff_sync.py
          test -f .github/workflows/staff-sync.yml
          grep -q "cron: '17 \* \* \* \*'" .github/workflows/staff-sync.yml
          grep -q "replace('Đ','D').replace('đ','d')" .github/workflows/staff-sync.yml
      - name: Commit result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ops
          if [ "${{ steps.work.outcome }}" = success ]; then
            printf 'status=PASS\nworkflow=staff-sync.yml\ninterval=hourly\n' > ops/staff-sync-finalize-status.txt
          else
            printf 'status=FAIL\n' > ops/staff-sync-finalize-status.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/staff-sync.yml .github/workflows/temp-cutover-staff-source.yml ops/staff-sync-finalize-status.txt
          git diff --cached --quiet || git commit -m 'feat(staff): finalize hourly new-source sync'
          git pull --rebase origin main
          git push origin HEAD:main
