name: Temp final Apps Script production gate

on:
  push:
    branches: [migration/neon-cutover]
    paths: ['.github/workflows/temp-final-apps-script-gate.yml']

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      GOOGLE_SHEET_WEBHOOK_SECRET: ${{ secrets.GOOGLE_SHEET_WEBHOOK_SECRET }}
      FIREBASE_API_KEY: 'AIzaSyB-n368fntzxsuuLlvte9NXhcuX0DDbTXM'
      PICKER_UID: '9bb9f7aa-0e3c-4d48-bdb8-42afec4ed101'
      ADMIN_UID: '8aa8e619-44f5-4c52-b20f-8f0cc745d102'
      PICKER_EMAIL: 'p6-final-log-picker@example.invalid'
      ADMIN_EMAIL: 'p6-final-log-admin@example.invalid'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13

      - name: Verify deployment ping and guarded sheet webhook
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SHEET_WEBHOOK_URL:-}"
          test -n "${GOOGLE_SHEET_WEBHOOK_SECRET:-}"
          code="$(curl -sS -L -o ping.json -w '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"ping"}' "$GOOGLE_SHEET_WEBHOOK_URL")"
          echo "PING_HTTP=$code"; test "$code" = 200
          jq -e '.ok==true and .project=="bao-hang-1291" and .provider=="NEON_FIREBASE_GOOGLE"' ping.json >/dev/null
          jq -nc --arg secret "$GOOGLE_SHEET_WEBHOOK_SECRET" '{secret:$secret,events:[]}' > webhook.json
          code="$(curl -sS -L -o webhook-out.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @webhook.json "$GOOGLE_SHEET_WEBHOOK_URL")"
          echo "WEBHOOK_HTTP=$code"; test "$code" = 200
          jq -e '.ok==true and .processed==0' webhook-out.json >/dev/null
          echo 'APPS_SCRIPT_PING_WEBHOOK_OK'

      - name: Verify Drive diagnostic upload and download roundtrip
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 30 | tr -d '\n')Aa1!"
          echo "::add-mask::$password"; export TEST_PASSWORD="$password"
          cleanup() {
            node <<'NODE' >/dev/null 2>&1 || true
          const admin=require('firebase-admin');
          if(!admin.apps.length) admin.initializeApp({credential:admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT))});
          Promise.all([process.env.PICKER_UID,process.env.ADMIN_UID].map(uid=>admin.auth().deleteUser(uid).catch(()=>{}))).finally(()=>process.exit(0));
          NODE
            rm -f *.json *.gz *.txt
          }
          trap cleanup EXIT
          node <<'NODE'
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT))});
          (async()=>{
            for(const uid of [process.env.PICKER_UID,process.env.ADMIN_UID]) { try { await admin.auth().deleteUser(uid); } catch(_) {} }
            await admin.auth().createUser({uid:process.env.PICKER_UID,email:process.env.PICKER_EMAIL,password:process.env.TEST_PASSWORD,emailVerified:true});
            await admin.auth().setCustomUserClaims(process.env.PICKER_UID,{role:'authenticated',app_role:'PICKER'});
            await admin.auth().createUser({uid:process.env.ADMIN_UID,email:process.env.ADMIN_EMAIL,password:process.env.TEST_PASSWORD,emailVerified:true});
            await admin.auth().setCustomUserClaims(process.env.ADMIN_UID,{role:'authenticated',app_role:'ADMIN_INVENT'});
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          sleep 2
          signin(){
            local email="$1" out="$2" code
            code="$(curl -sS -o "$out" -w '%{http_code}' -H 'Content-Type: application/json' --data "$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password,returnSecureToken:true}')" "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$FIREBASE_API_KEY")"
            test "$code" = 200
            jq -er '.idToken' "$out"
          }
          picker_token="$(signin "$PICKER_EMAIL" picker-login.json)"
          admin_token="$(signin "$ADMIN_EMAIL" admin-login.json)"
          echo "::add-mask::$picker_token"; echo "::add-mask::$admin_token"
          printf '%s\n' '{"marker":"P6_FINAL_DRIVE_DIAGNOSTIC","project":"bao-hang-1291"}' > marker.txt
          gzip -n -c marker.txt > marker.gz
          sha="$(sha256sum marker.gz | awk '{print $1}')"
          b64="$(base64 -w0 marker.gz)"
          jq -nc --arg token "$picker_token" --arg data "$b64" --arg sha "$sha" '{action:"upload-log",id_token:$token,gzip_base64:$data,sha256:$sha,device_name:"P6_FINAL_ISOLATED",app_version:"P6_FINAL_VALIDATION"}' > upload-body.json
          code="$(curl -sS -L -o upload.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @upload-body.json "$GOOGLE_SHEET_WEBHOOK_URL")"
          echo "UPLOAD_HTTP=$code"; test "$code" = 200
          err="$(jq -r '.error // empty' upload.json 2>/dev/null || true)"; test -z "$err" || { echo "UPLOAD_ERROR=$err"; exit 1; }
          jq -e '.uploaded==true and (.id|type)=="string"' upload.json >/dev/null
          log_id="$(jq -er '.id' upload.json)"
          echo "P6_FINAL_LOG_ID=$log_id"
          jq -nc --arg token "$admin_token" --arg id "$log_id" '{action:"download-log",id_token:$token,id:$id}' > download-body.json
          code="$(curl -sS -L -o download.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @download-body.json "$GOOGLE_SHEET_WEBHOOK_URL")"
          echo "DOWNLOAD_HTTP=$code"; test "$code" = 200
          err="$(jq -r '.error // empty' download.json 2>/dev/null || true)"; test -z "$err" || { echo "DOWNLOAD_ERROR=$err"; exit 1; }
          jq -e '.ok==true and (.gzip_base64|type)=="string"' download.json >/dev/null
          jq -r '.gzip_base64' download.json | base64 -d > downloaded.gz
          test "$(sha256sum downloaded.gz | awk '{print $1}')" = "$sha"
          echo 'APPS_SCRIPT_DRIVE_ROUNDTRIP_OK'
