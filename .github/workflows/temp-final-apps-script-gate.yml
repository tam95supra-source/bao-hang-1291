name: Temp final Apps Script Drive roundtrip
on:
  push:
    branches: [migration/neon-cutover]
    paths: ['.github/workflows/temp-final-apps-script-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      FIREBASE_API_KEY: 'AIzaSyB-n368fntzxsuuLlvte9NXhcuX0DDbTXM'
      PICKER_UID: '9bb9f7aa-0e3c-4d48-bdb8-42afec4ed101'
      ADMIN_UID: '8aa8e619-44f5-4c52-b20f-8f0cc745d102'
      PICKER_EMAIL: 'p6-final-log-picker@example.invalid'
      ADMIN_EMAIL: 'p6-final-log-admin@example.invalid'
    steps:
      - uses: actions/checkout@v4
        with: {ref: migration/neon-cutover}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - name: Upload and download isolated diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 30 | tr -d '\n')Aa1!"; echo "::add-mask::$password"; export TEST_PASSWORD="$password"
          cleanup(){ node <<'NODE' >/dev/null 2>&1 || true
          const admin=require('firebase-admin'); if(!admin.apps.length)admin.initializeApp({credential:admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT))}); Promise.all([process.env.PICKER_UID,process.env.ADMIN_UID].map(uid=>admin.auth().deleteUser(uid).catch(()=>{}))).finally(()=>process.exit(0));
          NODE
          rm -f *.json *.gz *.txt; }
          trap cleanup EXIT
          node <<'NODE'
          const admin=require('firebase-admin'); admin.initializeApp({credential:admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT))});
          (async()=>{for(const uid of [process.env.PICKER_UID,process.env.ADMIN_UID]){try{await admin.auth().deleteUser(uid)}catch(_){}}; await admin.auth().createUser({uid:process.env.PICKER_UID,email:process.env.PICKER_EMAIL,password:process.env.TEST_PASSWORD,emailVerified:true}); await admin.auth().setCustomUserClaims(process.env.PICKER_UID,{role:'authenticated',app_role:'PICKER'}); await admin.auth().createUser({uid:process.env.ADMIN_UID,email:process.env.ADMIN_EMAIL,password:process.env.TEST_PASSWORD,emailVerified:true}); await admin.auth().setCustomUserClaims(process.env.ADMIN_UID,{role:'authenticated',app_role:'ADMIN_INVENT'});})().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          sleep 2
          signin(){ local email="$1" out="$2" code; code="$(curl -sS -o "$out" -w '%{http_code}' -H 'Content-Type: application/json' --data "$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password,returnSecureToken:true}')" "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$FIREBASE_API_KEY")"; test "$code" = 200; jq -er '.idToken' "$out"; }
          picker="$(signin "$PICKER_EMAIL" p.json)"; admin="$(signin "$ADMIN_EMAIL" a.json)"; echo "::add-mask::$picker"; echo "::add-mask::$admin"
          printf '%s\n' '{"marker":"P6_FINAL_DRIVE_DIAGNOSTIC","project":"bao-hang-1291"}' > marker.txt; gzip -n -c marker.txt > marker.gz
          sha="$(sha256sum marker.gz|awk '{print $1}')"; b64="$(base64 -w0 marker.gz)"
          jq -nc --arg token "$picker" --arg data "$b64" --arg sha "$sha" '{action:"upload-log",id_token:$token,gzip_base64:$data,sha256:$sha,device_name:"P6_FINAL_ISOLATED",app_version:"P6_FINAL_VALIDATION"}' > ub.json
          code="$(curl -sS -L -o u.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @ub.json "$GOOGLE_SHEET_WEBHOOK_URL")"; echo "UPLOAD_HTTP=$code"; test "$code" = 200; jq -e '.uploaded==true' u.json >/dev/null
          id="$(jq -er '.id' u.json)"; echo "P6_FINAL_LOG_ID=$id"
          jq -nc --arg token "$admin" --arg id "$id" '{action:"download-log",id_token:$token,id:$id}' > db.json
          code="$(curl -sS -L -o d.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @db.json "$GOOGLE_SHEET_WEBHOOK_URL")"; echo "DOWNLOAD_HTTP=$code"; test "$code" = 200; jq -e '.ok==true' d.json >/dev/null
          jq -r '.gzip_base64' d.json | base64 -d > out.gz; test "$(sha256sum out.gz|awk '{print $1}')" = "$sha"
          echo 'APPS_SCRIPT_DRIVE_ROUNDTRIP_OK'
