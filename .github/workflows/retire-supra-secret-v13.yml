name: Remove retired source integration Edge secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-supra-secret-v13.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: oedasgcdjppjwidhlqdr
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate management credential presence
        shell: bash
        run: test -n "${SUPABASE_ACCESS_TOKEN:-}"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Unset retired Edge secret
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets unset SUPRA_CREDENTIAL_MASTER_KEY --project-ref "$SUPABASE_PROJECT_ID"
          echo 'RETIRED_EDGE_SECRET_UNSET=PASS'
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/retire-supra-secret-v13.yml
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-time retired Edge secret cleanup workflow'
          git push origin HEAD:main
