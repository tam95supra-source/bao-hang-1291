name: Temp verify admin auth mapping

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-verify-admin-auth-mapping.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - name: Verify Firebase account mapping without password
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin = require('firebase-admin')
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}')
          if (sa.project_id !== 'bao-hang-1291') throw new Error('FIREBASE_SCOPE_MISMATCH')
          admin.initializeApp({credential: admin.credential.cert(sa)})
          ;(async()=>{
            const user = await admin.auth().getUserByEmail('6281280@bao-hang-1291.local')
            if (user.uid !== '44fae0a2-09eb-4226-8412-0f1a1f5d7ef8') throw new Error('UID_MISMATCH')
            if (user.disabled) throw new Error('ACCOUNT_DISABLED')
            const claims = user.customClaims || {}
            if (claims.role !== 'authenticated') throw new Error('AUTH_ROLE_MISMATCH')
            if (claims.app_role !== 'ADMIN') throw new Error('APP_ROLE_MISMATCH')
            console.log('FIREBASE_ACCOUNT_6281280_PASS')
          })().catch(e=>{console.error(e.message);process.exit(1)})
          NODE
