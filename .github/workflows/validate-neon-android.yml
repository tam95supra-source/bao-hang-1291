name: Validate Neon Android client

on:
  push:
    branches:
      - migration/neon-cutover
    paths:
      - 'app/**'
      - '.github/workflows/validate-neon-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-neon-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Fail closed on PICK PACK service identifiers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'ttwftrooaizxmjovkbaz|pick-pack-1291-primary|19a7c8e9-9fc0-4b04-a545-bcbe84b1bcb1' app/src app/build.gradle.kts; then
            echo 'Forbidden PICK PACK service identifier found in BÁO HÀNG Android source'
            exit 1
          fi
      - name: Unit tests and debug compile
        run: gradle --no-daemon testDebugUnitTest assembleDebug

# full validation rerun after Neon restore compile PASS
