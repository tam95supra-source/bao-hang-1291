name: Deploy strict API Sheet ACK route once

on:
  push:
    branches: [target-final-20260814-impl]
    paths: ['.github/workflows/deploy-api-strict-ack-once.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: oedasgcdjppjwidhlqdr
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
      - run: test -n "${SUPABASE_ACCESS_TOKEN:-}"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy API only
        run: supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify API active
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output json > "$RUNNER_TEMP/functions.json"
          jq -e '.[] | select((.slug // .name)=="api" and .status=="ACTIVE")' "$RUNNER_TEMP/functions.json" >/dev/null
          echo 'API_STRICT_ACK_DEPLOY=PASS'
