name: Agent search-counts validation
on:
  push:
    branches:
      - agent/fix-search-counts-withdraw-timer-20260816
    paths:
      - .automation/run-search-counts
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply guarded product patch
        run: |
          set -euo pipefail
          set +e
          output="$(python3 .automation/patch_search_counts.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$output" | grep -Fx 'web five status tabs: expected exactly 1 match, got 2' >/dev/null || exit "$rc"
            python3 - <<'PY'
          from pathlib import Path
          p = Path('web-admin/src/warehouse-ui-v2.css')
          s = p.read_text()
          old_tabs = '''.wv2-tabs {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
          '''
          new_tabs = '''.wv2-tabs {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
          '''
          if s.count(old_tabs) != 1:
              raise SystemExit(f'css tabs guard: expected 1 match, got {s.count(old_tabs)}')
          s = s.replace(old_tabs, new_tabs, 1)
          old_accent = '.wv2-issue[data-state="skipped"]::before { background: #98a2b3; }\n'
          new_accent = old_accent + '.wv2-issue[data-state="withdrawn"]::before { background: #d92d20; }\n'
          if s.count(old_accent) != 1:
              raise SystemExit(f'css accent guard: expected 1 match, got {s.count(old_accent)}')
          p.write_text(s.replace(old_accent, new_accent, 1))
          PY
          fi
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt': ['InputFilter.LengthFilter(8)', 'withdrawRemainingMs', 'SystemClock.elapsedRealtime()', 'Không có SKU chứa chuỗi', 'data.availableCount'],
              'app/src/main/java/vn/pickpack1291/baohang/data/AppDatabase.kt': ['instr(sku, ?) > 0', 'digits.length !in 3..8'],
              'supabase/functions/api/index.ts': ['resolved: "TODAY"', 'siteDayBounds', 'availableCount.count'],
              'supabase/functions/issue-withdraw/index.ts': ['withdraw_remaining_ms', 'scope:"TODAY"', 'fetchLimit'],
              'web-admin/src/warehouse-ui-v2.js': ["withdrawApi('board')", 'Đã thu hồi', 'Có hàng/SKIP/Thu hồi = hôm nay'],
              'web-admin/src/warehouse-ui-v2.css': ['grid-template-columns: repeat(5, minmax(0, 1fr));', 'data-state="withdrawn"'],
          }
          for path, needles in checks.items():
              data = Path(path).read_text()
              for needle in needles:
                  if needle not in data:
                      raise SystemExit(f'shape check failed: {path}: {needle}')
          print('PATCH_SHAPE=PASS')
          PY
      - name: Android unit test and debug build
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Web production build
        working-directory: web-admin
        run: npm ci --ignore-scripts && npm run build
      - name: Type-check changed Edge Functions
        run: deno check supabase/functions/api/index.ts supabase/functions/issue-withdraw/index.ts
      - name: Commit product files only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/vn/pickpack1291/baohang/data/AppDatabase.kt \
            app/src/main/java/vn/pickpack1291/baohang/data/Models.kt \
            app/src/main/java/vn/pickpack1291/baohang/network/ApiClient.kt \
            app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt \
            supabase/functions/api/index.ts \
            supabase/functions/issue-withdraw/index.ts \
            web-admin/src/warehouse-ui-v2.js \
            web-admin/src/warehouse-ui-v2.css
          git diff --cached --check
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m 'Fix SKU suggestions, operational counts and withdrawal timer'
          git push origin HEAD:agent/fix-search-counts-withdraw-timer-20260816
