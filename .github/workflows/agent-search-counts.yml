name: Agent search-counts validation
on:
  push:
    branches:
      - agent/fix-search-counts-withdraw-timer-20260816
    paths:
      - .automation/run-search-counts
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3
      - name: Apply deterministic guarded product patch
        run: |
          set -euo pipefail
          set +e
          output="$(python3 .automation/patch_search_counts.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$output" | grep -Fx 'web five status tabs: expected exactly 1 match, got 2' >/dev/null || exit "$rc"
            python3 - <<'PY'
          from pathlib import Path
          p = Path('web-admin/src/warehouse-ui-v2.css')
          s = p.read_text()
          old_tabs = '''.wv2-tabs {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
          '''
          new_tabs = '''.wv2-tabs {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
          '''
          if s.count(old_tabs) != 1: raise SystemExit(f'css tabs guard mismatch: {s.count(old_tabs)}')
          s = s.replace(old_tabs, new_tabs, 1)
          old_accent = '.wv2-issue[data-state="skipped"]::before { background: #98a2b3; }\n'
          if s.count(old_accent) != 1: raise SystemExit(f'css accent guard mismatch: {s.count(old_accent)}')
          s = s.replace(old_accent, old_accent + '.wv2-issue[data-state="withdrawn"]::before { background: #d92d20; }\n', 1)
          p.write_text(s)
          PY
          fi
          python3 - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt')
          s = main.read_text(); anchor = 'import android.widget.Button\n'; needed = 'import android.widget.ArrayAdapter\nimport android.widget.AutoCompleteTextView\n'
          if 'import android.widget.ArrayAdapter\n' not in s:
              if s.count(anchor) != 1: raise SystemExit('MainActivity import anchor mismatch')
              s = s.replace(anchor, needed + anchor, 1)
          main.write_text(s)
          api = Path('app/src/main/java/vn/pickpack1291/baohang/network/ApiClient.kt')
          s = api.read_text(); anchor = 'import vn.pickpack1291.baohang.data.IssueBoard\n'
          if 'import vn.pickpack1291.baohang.data.IssueStatus\n' not in s:
              if s.count(anchor) != 1: raise SystemExit('ApiClient import anchor mismatch')
              s = s.replace(anchor, anchor + 'import vn.pickpack1291.baohang.data.IssueStatus\n', 1)
          api.write_text(s)
          checks = {
              'app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt': ['InputFilter.LengthFilter(8)', 'withdrawRemainingMs', 'SystemClock.elapsedRealtime()', 'Không có SKU chứa chuỗi', 'data.availableCount'],
              'app/src/main/java/vn/pickpack1291/baohang/data/AppDatabase.kt': ['instr(sku, ?) > 0', 'digits.length !in 3..8'],
              'supabase/functions/api/index.ts': ['resolved: "TODAY"', 'siteDayBounds', 'availableCount.count'],
              'supabase/functions/issue-withdraw/index.ts': ['withdraw_remaining_ms', 'scope:"TODAY"', 'fetchLimit'],
              'web-admin/src/warehouse-ui-v2.js': ["withdrawApi('board')", 'Đã thu hồi', 'Có hàng/SKIP/Thu hồi = hôm nay'],
              'web-admin/src/warehouse-ui-v2.css': ['grid-template-columns: repeat(5, minmax(0, 1fr));', 'data-state="withdrawn"'],
          }
          for path, needles in checks.items():
              data = Path(path).read_text()
              for needle in needles:
                  if needle not in data: raise SystemExit(f'shape check failed: {path}: {needle}')
          print('PATCH_SHAPE=PASS')
          PY
      - name: Install pinned web dependencies
        run: npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Web production build
        run: npm --prefix web-admin run build
      - name: Enforce web performance and secret budgets
        shell: bash
        run: |
          set -euo pipefail
          test -f web-admin/dist/index.html
          if grep -R -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|service_role|SUPRA_CREDENTIAL_MASTER_KEY|encrypted_credential_bundle' web-admin/dist; then
            echo 'Secret-like server material found in static build' >&2
            exit 1
          fi
          shopt -s nullglob
          app_js=(web-admin/dist/assets/index-*.js)
          css=(web-admin/dist/assets/index-*.css)
          test ${#app_js[@]} -ge 1
          js_gzip=$(gzip -c "${app_js[0]}" | wc -c)
          test "$js_gzip" -le 153600
          if [ ${#css[@]} -ge 1 ]; then
            css_gzip=$(gzip -c "${css[0]}" | wc -c)
            test "$css_gzip" -le 30720
          fi
          echo "WEB_BUDGET=PASS initial_js_gzip=$js_gzip"
      - name: Type-check changed Edge Functions
        run: deno check supabase/functions/api/index.ts supabase/functions/issue-withdraw/index.ts
      - name: Commit product files only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/vn/pickpack1291/baohang/data/AppDatabase.kt \
            app/src/main/java/vn/pickpack1291/baohang/data/Models.kt \
            app/src/main/java/vn/pickpack1291/baohang/network/ApiClient.kt \
            app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt \
            supabase/functions/api/index.ts \
            supabase/functions/issue-withdraw/index.ts \
            web-admin/src/warehouse-ui-v2.js \
            web-admin/src/warehouse-ui-v2.css
          git diff --cached --check
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m 'Fix SKU suggestions, operational counts and withdrawal timer'
          git push origin HEAD:agent/fix-search-counts-withdraw-timer-20260816
