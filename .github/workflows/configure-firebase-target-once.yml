name: Configure Firebase emergency target once

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - '.github/workflows/configure-firebase-target-once.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SHEET_WEBHOOK_SECRET: ${{ secrets.GOOGLE_SHEET_WEBHOOK_SECRET }}
      FIREBASE_PROJECT_ID: bao-hang-1291
      FIREBASE_PROJECT_NUMBER: '831583541434'
      FIREBASE_APP_ID: '1:831583541434:android:8b9a55c3cab3dba3628a83'
      PROD_SHA256: '2811931445e7d175c13492ae15ab0f85bf609bbbd49b67cdc655e65e93a0f8c0'
      FIREBASE_API_KEY: 'AIzaSyB-n368fntzxsuuLlvte9NXhcuX0DDbTXM'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
      - name: Materialize credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          test -n "${GOOGLE_SHEET_WEBHOOK_SECRET:-}"
          test ${#GOOGLE_SHEET_WEBHOOK_SECRET} -ge 32
          umask 077
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          jq -e '.project_id == "bao-hang-1291" and .client_email and .private_key' "$SA_FILE" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"
      - name: Guard zero cost and configure Firebase identity surfaces
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT),project=process.env.FIREBASE_PROJECT_ID,projectNumber=process.env.FIREBASE_PROJECT_NUMBER,appId=process.env.FIREBASE_APP_ID,apiKey=process.env.FIREBASE_API_KEY;
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          async function token(){const n=Math.floor(Date.now()/1000),h=enc({alg:'RS256',typ:'JWT'}),p=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:n,exp:n+1200}),u=`${h}.${p}`,s=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url'),r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${u}.${s}`})});if(!r.ok)throw new Error(`OAUTH_${r.status}`);return (await r.json()).access_token;}
          async function req(url,t,init={}){const r=await fetch(url,{...init,headers:{authorization:`Bearer ${t}`,'content-type':'application/json',...(init.headers||{})}}),x=await r.text();let b={};try{b=x?JSON.parse(x):{}}catch{b={}}return{status:r.status,body:b};}
          (async()=>{const t=await token();const billing=await req(`https://cloudbilling.googleapis.com/v1/projects/${project}/billingInfo`,t);if(billing.status!==200)throw new Error(`COST_GUARD_UNVERIFIED_${billing.status}`);if(billing.body.billingEnabled===true||billing.body.billingAccountName)throw new Error('COST_GUARD_STOP_BILLING_ATTACHED');console.log('COST_GUARD=PASS billingEnabled=false');
            const db=await req(`https://firestore.googleapis.com/v1/projects/${project}/databases/(default)`,t);if(db.status===200)console.log(`FIRESTORE_DB_METADATA=PASS location=${db.body.locationId} delete_protection=${db.body.deleteProtectionState}`);else if(db.status===403)console.log('FIRESTORE_DB_METADATA=UNVERIFIED_IAM_403');else throw new Error(`FIRESTORE_DB_LOOKUP_${db.status}`);
            const projectMeta=await req(`https://firebase.googleapis.com/v1beta1/projects/${project}`,t);if(projectMeta.status===200)console.log(`FIREBASE_PROJECT_LOCATION=${projectMeta.body?.resources?.locationId||'UNSET'}`);else console.log(`FIREBASE_PROJECT_METADATA=UNAVAILABLE_${projectMeta.status}`);
            const shaUrl=`https://firebase.googleapis.com/v1beta1/projects/${project}/androidApps/${encodeURIComponent(appId)}/sha`,listed=await req(shaUrl,t);if(listed.status!==200)throw new Error(`FIREBASE_SHA_LIST_${listed.status}`);const normalized=process.env.PROD_SHA256.toUpperCase().match(/../g).join(':'),exists=(listed.body.certificates||[]).some(c=>String(c.shaHash||'').replace(/:/g,'').toLowerCase()===process.env.PROD_SHA256.toLowerCase());if(!exists){const a=await req(shaUrl,t,{method:'POST',body:JSON.stringify({name:'',shaHash:normalized,certType:'SHA_256'})});if(![200,201].includes(a.status))throw new Error(`FIREBASE_SHA_CREATE_${a.status}_${a.body?.error?.status||''}`);}console.log('FIREBASE_SIGNER_SHA256=PASS');
            const acName=`projects/${projectNumber}/apps/${appId}/playIntegrityConfig`,ac=await req(`https://firebaseappcheck.googleapis.com/v1/${acName}?updateMask=tokenTtl,appIntegrity.allowUnrecognizedVersion,deviceIntegrity.minDeviceRecognitionLevel,accountDetails.requireLicensed`,t,{method:'PATCH',body:JSON.stringify({name:acName,tokenTtl:'3600s',appIntegrity:{allowUnrecognizedVersion:true},deviceIntegrity:{minDeviceRecognitionLevel:'MEETS_DEVICE_INTEGRITY'},accountDetails:{requireLicensed:false}})});if(ac.status!==200)throw new Error(`APP_CHECK_CONFIG_${ac.status}_${ac.body?.error?.status||''}`);if(ac.body?.appIntegrity?.allowUnrecognizedVersion!==true||ac.body?.accountDetails?.requireLicensed!==false)throw new Error('APP_CHECK_VERIFY');console.log('APP_CHECK_CONFIG=PASS off_play_allowed=true enforcement=unchanged');
            const pass='Bh1291!'+crypto.createHmac('sha256',process.env.GOOGLE_SHEET_WEBHOOK_SECRET).update('sheet-drain-password-v1').digest('hex')+'aA1!',uid='bh1291-sheet-drain',email='sheet-drain@auth.bao-hang-1291.invalid';const create=await req(`https://identitytoolkit.googleapis.com/v1/projects/${project}/accounts?key=${encodeURIComponent(apiKey)}`,t,{method:'POST',body:JSON.stringify({localId:uid,email,password:pass,displayName:'Báo hàng 1291 Sheet Drain',emailVerified:true,disabled:false})});if(![200,201,400].includes(create.status))throw new Error(`DRAIN_CREATE_${create.status}`);if(create.status===400&&!['LOCAL_ID_EXISTS','EMAIL_EXISTS'].some(x=>String(create.body?.error?.message||'').includes(x)))throw new Error(`DRAIN_CREATE_${create.body?.error?.message||'400'}`);const upd=await req(`https://identitytoolkit.googleapis.com/v1/projects/${project}/accounts:update?key=${encodeURIComponent(apiKey)}`,t,{method:'POST',body:JSON.stringify({localId:uid,targetProjectId:project,email,password:pass,displayName:'Báo hàng 1291 Sheet Drain',emailVerified:true,disableUser:false,customAttributes:JSON.stringify({site:'1291',account_kind:'SHEET_DRAIN',drain_enabled:true})})});if(upd.status!==200)throw new Error(`DRAIN_UPDATE_${upd.status}`);console.log('FIREBASE_DRAIN_IDENTITY=PASS');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Deploy Firestore rules from reviewed source
        shell: bash
        run: npx --yes firebase-tools@14.17.0 deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Smoke authorization with drain identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),apiKey=process.env.FIREBASE_API_KEY,project=process.env.FIREBASE_PROJECT_ID,pass='Bh1291!'+crypto.createHmac('sha256',process.env.GOOGLE_SHEET_WEBHOOK_SECRET).update('sheet-drain-password-v1').digest('hex')+'aA1!';
          (async()=>{const auth=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'sheet-drain@auth.bao-hang-1291.invalid',password:pass,returnSecureToken:true})});if(!auth.ok)throw new Error(`DRAIN_SIGNIN_${auth.status}`);const id=(await auth.json()).idToken;const list=await fetch(`https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents/emergency_events?pageSize=1`,{headers:{authorization:`Bearer ${id}`}});if(list.status!==200)throw new Error(`DRAIN_RULE_READ_${list.status}`);const bad=await fetch(`https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents/emergency_events/rule-smoke-forbidden`,{method:'PATCH',headers:{authorization:`Bearer ${id}`,'content-type':'application/json'},body:JSON.stringify({fields:{event_id:{stringValue:'rule-smoke-forbidden'}}})});if(bad.status!==403)throw new Error(`DRAIN_BUSINESS_WRITE_NOT_DENIED_${bad.status}`);console.log('FIRESTORE_RULE_SMOKE=PASS drain_read=true drain_business_write_denied=true');})().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Cleanup credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
