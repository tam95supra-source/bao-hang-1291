name: Configure Firebase emergency target once

on:
  push:
    branches: [target-final-20260814-impl]
    paths: ['.github/workflows/configure-firebase-target-once.yml']

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SHEET_WEBHOOK_SECRET: ${{ secrets.GOOGLE_SHEET_WEBHOOK_SECRET }}
      FIREBASE_PROJECT_ID: bao-hang-1291
      FIREBASE_PROJECT_NUMBER: '831583541434'
      FIREBASE_APP_ID: '1:831583541434:android:8b9a55c3cab3dba3628a83'
      PROD_SHA256: '2811931445e7d175c13492ae15ab0f85bf609bbbd49b67cdc655e65e93a0f8c0'
      FIREBASE_API_KEY: 'AIzaSyB-n368fntzxsuuLlvte9NXhcuX0DDbTXM'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
      - name: Materialize credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          test -n "${GOOGLE_SHEET_WEBHOOK_SECRET:-}"
          test ${#GOOGLE_SHEET_WEBHOOK_SECRET} -ge 32
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          jq -e '.project_id == "bao-hang-1291" and .client_email and .private_key' "$RUNNER_TEMP/firebase-sa.json" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Cost guard, signer, drain identity and App Check probe
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'); const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          const project=process.env.FIREBASE_PROJECT_ID, apiKey=process.env.FIREBASE_API_KEY, appId=process.env.FIREBASE_APP_ID, projectNumber=process.env.FIREBASE_PROJECT_NUMBER;
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          async function token(){const n=Math.floor(Date.now()/1000),h=enc({alg:'RS256',typ:'JWT'}),p=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:n,exp:n+1200}),u=`${h}.${p}`,sig=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${u}.${sig}`})});if(!r.ok)throw new Error(`OAUTH_${r.status}`);return (await r.json()).access_token}
          async function req(url,t,init={}){const r=await fetch(url,{...init,headers:{authorization:`Bearer ${t}`,'content-type':'application/json',...(init.headers||{})}});const x=await r.text();let b={};try{b=x?JSON.parse(x):{}}catch{}return{status:r.status,body:b}}
          (async()=>{const t=await token();
            const billing=await req(`https://cloudbilling.googleapis.com/v1/projects/${project}/billingInfo`,t); if(billing.status!==200)throw new Error(`COST_GUARD_UNVERIFIED_${billing.status}`); if(billing.body.billingEnabled===true||billing.body.billingAccountName)throw new Error('COST_GUARD_STOP_BILLING_ATTACHED'); console.log('COST_GUARD=PASS billingEnabled=false');
            const db=await req(`https://firestore.googleapis.com/v1/projects/${project}/databases/(default)`,t); console.log(db.status===200?`FIRESTORE_DB_METADATA=PASS location=${db.body.locationId} delete_protection=${db.body.deleteProtectionState}`:`FIRESTORE_DB_METADATA=UNVERIFIED_IAM_${db.status}`);
            const shaUrl=`https://firebase.googleapis.com/v1beta1/projects/${project}/androidApps/${encodeURIComponent(appId)}/sha`,listed=await req(shaUrl,t); if(listed.status!==200)throw new Error(`FIREBASE_SHA_LIST_${listed.status}`); const normalized=process.env.PROD_SHA256.toUpperCase().match(/../g).join(':'),exists=(listed.body.certificates||[]).some(c=>String(c.shaHash||'').replace(/:/g,'').toLowerCase()===process.env.PROD_SHA256.toLowerCase()); if(!exists){const a=await req(shaUrl,t,{method:'POST',body:JSON.stringify({shaHash:normalized,certType:'SHA_256'})});if(![200,201].includes(a.status))throw new Error(`FIREBASE_SHA_CREATE_${a.status}`)} console.log('FIREBASE_SIGNER_SHA256=PASS');
            const pass='Bh1291!'+crypto.createHmac('sha256',process.env.GOOGLE_SHEET_WEBHOOK_SECRET).update('sheet-drain-password-v1').digest('hex')+'aA1!',uid='bh1291-sheet-drain',email='sheet-drain@auth.bao-hang-1291.invalid'; const create=await req(`https://identitytoolkit.googleapis.com/v1/projects/${project}/accounts?key=${encodeURIComponent(apiKey)}`,t,{method:'POST',body:JSON.stringify({localId:uid,email,password:pass,displayName:'Báo hàng 1291 Sheet Drain',emailVerified:true,disabled:false})}); if(create.status===400&&!['LOCAL_ID_EXISTS','EMAIL_EXISTS'].some(x=>String(create.body?.error?.message||'').includes(x)))throw new Error(`DRAIN_CREATE_${create.body?.error?.message||create.status}`); if(![200,201,400].includes(create.status))throw new Error(`DRAIN_CREATE_${create.status}`); const upd=await req(`https://identitytoolkit.googleapis.com/v1/projects/${project}/accounts:update?key=${encodeURIComponent(apiKey)}`,t,{method:'POST',body:JSON.stringify({localId:uid,targetProjectId:project,email,password:pass,displayName:'Báo hàng 1291 Sheet Drain',emailVerified:true,disableUser:false,customAttributes:JSON.stringify({site:'1291',account_kind:'SHEET_DRAIN',drain_enabled:true})})}); if(upd.status!==200)throw new Error(`DRAIN_UPDATE_${upd.status}_${upd.body?.error?.status||''}`); console.log('FIREBASE_DRAIN_IDENTITY=PASS');
            const name=`projects/${projectNumber}/apps/${appId}/playIntegrityConfig`,ac=await req(`https://firebaseappcheck.googleapis.com/v1/${name}?updateMask=tokenTtl,appIntegrity.allowUnrecognizedVersion,deviceIntegrity.minDeviceRecognitionLevel,accountDetails.requireLicensed`,t,{method:'PATCH',body:JSON.stringify({name,tokenTtl:'3600s',appIntegrity:{allowUnrecognizedVersion:true},deviceIntegrity:{minDeviceRecognitionLevel:'MEETS_DEVICE_INTEGRITY'},accountDetails:{requireLicensed:false}})}); if(ac.status===200)console.log('APP_CHECK_CONFIG=PASS off_play_allowed=true enforcement=unchanged'); else console.log(`APP_CHECK_CONFIG=BLOCKED_IAM_${ac.status}_${ac.body?.error?.status||'UNKNOWN'}`);
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Deploy reviewed Firestore rules
        shell: bash
        run: npx --yes firebase-tools@14.17.0 deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Smoke drain authorization
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),project=process.env.FIREBASE_PROJECT_ID,apiKey=process.env.FIREBASE_API_KEY,pass='Bh1291!'+crypto.createHmac('sha256',process.env.GOOGLE_SHEET_WEBHOOK_SECRET).update('sheet-drain-password-v1').digest('hex')+'aA1!';
          (async()=>{const a=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'sheet-drain@auth.bao-hang-1291.invalid',password:pass,returnSecureToken:true})});if(!a.ok)throw new Error(`DRAIN_SIGNIN_${a.status}`);const id=(await a.json()).idToken;const r=await fetch(`https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents/emergency_events?pageSize=1`,{headers:{authorization:`Bearer ${id}`}});if(r.status!==200)throw new Error(`DRAIN_READ_${r.status}`);const bad=await fetch(`https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents/emergency_events/rule-smoke-forbidden`,{method:'PATCH',headers:{authorization:`Bearer ${id}`,'content-type':'application/json'},body:JSON.stringify({fields:{event_id:{stringValue:'rule-smoke-forbidden'}}})});if(bad.status!==403)throw new Error(`DRAIN_FORBIDDEN_WRITE_${bad.status}`);console.log('FIRESTORE_RULE_SMOKE=PASS drain_read=true drain_business_write_denied=true')})().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
