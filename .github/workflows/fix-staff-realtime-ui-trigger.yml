name: Fix staff realtime UI trigger
on:
  push:
    branches: [main]
    paths:
      - 'ops/fix-staff-realtime-ui.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply, verify and build
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/fix_staff_realtime_ui.py
          python3 ops/fix_web_auth_required.py
          node --check web-admin/src/backend-runtime.js
          node --check web-admin/src/main.js
          node --check web-admin/src/ops-console.js
          grep -q 'let firstSnapshot = true' web-admin/src/backend-runtime.js
          grep -q 'if (firstSnapshot) { firstSnapshot = false; return }' web-admin/src/backend-runtime.js
          grep -q 'auth.authStateReady' web-admin/src/backend-runtime.js
          grep -q 'async function bootstrapApp()' web-admin/src/main.js
          grep -q 'responseNeedsAuthRefresh' web-admin/src/main.js
          grep -q 'window.__BH_AUTH__' web-admin/src/main.js
          grep -q 'bao-hang-1291-staff-view-state' web-admin/src/ops-console.js
          grep -q 'globalThis.__BH_AUTH__?.ensureSession' web-admin/src/ops-console.js
          mkdir -p web-admin/public
          printf 'STAFF_FOCUS_AUTH_V2_20260820-%s\n' "$GITHUB_RUN_ID" > web-admin/public/runtime-revision.txt
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build
      - name: Commit source and deploy marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-admin/src/backend-runtime.js web-admin/src/main.js web-admin/src/ops-console.js web-admin/public/runtime-revision.txt
          git diff --cached --quiet || git commit -m 'fix(web): finalize staff focus and auth bootstrap'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Wait for Firebase Hosting exact build
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(cat web-admin/public/runtime-revision.txt)
          LIVE=''
          for i in $(seq 1 36); do
            LIVE=$(curl -fsSL -H 'Cache-Control: no-cache' "https://bao-hang-1291.web.app/runtime-revision.txt?r=$GITHUB_RUN_ID" 2>/dev/null || true)
            [[ "$LIVE" == "$EXPECTED" ]] && break
            sleep 5
          done
          [[ "$LIVE" == "$EXPECTED" ]] || { echo 'HOSTING_REVISION_NOT_LIVE'; exit 1; }
          curl -fsSL -H 'Cache-Control: no-cache' "https://bao-hang-1291.web.app/?r=$GITHUB_RUN_ID" -o /tmp/index.html
          grep -oE 'src="[^"]+\.js"' /tmp/index.html | cut -d'"' -f2 > /tmp/assets.txt
          : > /tmp/live-js
          while read -r asset; do
            [[ "$asset" = http* ]] && url="$asset" || url="https://bao-hang-1291.web.app$asset"
            curl -fsSL -H 'Cache-Control: no-cache' "$url?r=$GITHUB_RUN_ID" >> /tmp/live-js
          done < /tmp/assets.txt
          grep -q 'bao-hang-1291-staff-view-state' /tmp/live-js
          grep -q 'AUTH_REQUIRED' /tmp/live-js
          grep -q 'authStateReady' /tmp/live-js
          grep -q 'Phiên đăng nhập cần xác thực lại' /tmp/live-js
          curl -fsSI 'https://bao-hang-1291.web.app/' > /tmp/headers.txt
          grep -qi 'content-security-policy:' /tmp/headers.txt
          grep -qi 'x-content-type-options: nosniff' /tmp/headers.txt
          sha256sum /tmp/live-js | awk '{print $1}' > /tmp/live.sha
      - name: Verify Firebase refresh token reaches authenticated Neon RPC
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          if(sa.project_id!=='bao-hang-1291'||!sa.client_email||!sa.private_key) throw new Error('SERVICE_ACCOUNT_SCOPE');
          const src=fs.readFileSync('web-admin/src/backend-runtime.js','utf8');
          const apiKey=(src.match(/FIREBASE_API_KEY = '([^']+)'/)||[])[1];
          const neon=(src.match(/NEON_API = '([^']+)'/)||[])[1];
          if(!apiKey||!neon) throw new Error('PUBLIC_CONFIG_MISSING');
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          const signJwt=(payload)=>{const h=enc({alg:'RS256',typ:'JWT'}),p=enc(payload),u=`${h}.${p}`;return `${u}.${crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url')}`};
          async function json(url,init={}){const r=await fetch(url,init);const t=await r.text();let d={};try{d=JSON.parse(t)}catch{};if(!r.ok)throw new Error(`HTTP_${r.status}`);return d}
          (async()=>{
            const now=Math.floor(Date.now()/1000);
            const assertion=signJwt({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900});
            const oauth=await json('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});
            const lookup=await json(`https://identitytoolkit.googleapis.com/v1/projects/${sa.project_id}/accounts:lookup`,{method:'POST',headers:{authorization:`Bearer ${oauth.access_token}`,'content-type':'application/json'},body:JSON.stringify({email:['6281280@bao-hang-1291.local']})});
            const uid=lookup.users?.[0]?.localId;if(!uid)throw new Error('ADMIN_FIREBASE_UID_MISSING');
            const custom=signJwt({iss:sa.client_email,sub:sa.client_email,aud:'https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit',iat:now,exp:now+900,uid});
            const signed=await json(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:custom,returnSecureToken:true})});
            const refreshed=await json(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:signed.refreshToken})});
            const rpc=await json(`${neon}/rpc/api_session_profile_rpc`,{method:'POST',headers:{authorization:`Bearer ${refreshed.id_token}`,'content-type':'application/json'},body:JSON.stringify({p_test_role:null})});
            if(rpc.employee_code!=='6281280'||rpc.role!=='ADMIN')throw new Error('NEON_AUTH_CONTEXT_INVALID');
            console.log('AUTH_REFRESH_TO_NEON=PASS');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Record live proof
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(cat /tmp/live.sha)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > ops/web-runtime-live-proof.json <<EOF
          {
            "status": "PASS",
            "hosting": "https://bao-hang-1291.web.app",
            "staff_reconnect_baseline": "PASS",
            "staff_search_session_state": "PASS",
            "hidden_toast_suppression": "PASS",
            "cold_load_force_refresh": "PASS",
            "auth_required_single_retry": "PASS",
            "firebase_refresh_to_neon": "PASS",
            "security_headers": "PASS",
            "bundle_sha256": "$SHA",
            "verified_at": "$NOW"
          }
          EOF
          cat ops/web-runtime-live-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/web-runtime-live-proof.json
          git diff --cached --quiet || git commit -m 'chore(web): record staff and auth live proof'
          git pull --rebase origin main
          git push origin HEAD:main
