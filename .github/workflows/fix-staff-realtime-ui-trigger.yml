name: Fix staff realtime UI trigger
on:
  push:
    branches: [main]
    paths:
      - 'ops/fix-staff-realtime-ui.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply, verify and build with proof
        id: apply
        shell: bash
        run: |
          set +e
          STAGE=PATCH_STAFF
          python3 ops/fix_staff_realtime_ui.py >/tmp/webfix.log 2>&1
          RC=$?
          if [[ $RC -eq 0 ]]; then STAGE=PATCH_AUTH; python3 ops/fix_web_auth_required.py >>/tmp/webfix.log 2>&1; RC=$?; fi
          if [[ $RC -eq 0 ]]; then
            STAGE=SOURCE_GATES
            node --check web-admin/src/backend-runtime.js >>/tmp/webfix.log 2>&1 && \
            node --check web-admin/src/main.js >>/tmp/webfix.log 2>&1 && \
            node --check web-admin/src/ops-console.js >>/tmp/webfix.log 2>&1 && \
            grep -q 'let firstSnapshot = true' web-admin/src/backend-runtime.js && \
            grep -q 'if (firstSnapshot) { firstSnapshot = false; return }' web-admin/src/backend-runtime.js && \
            grep -q 'auth.authStateReady' web-admin/src/backend-runtime.js && \
            grep -q 'async function bootstrapApp()' web-admin/src/main.js && \
            grep -q 'responseNeedsAuthRefresh' web-admin/src/main.js && \
            grep -q 'window.__BH_AUTH__' web-admin/src/main.js && \
            grep -q 'bao-hang-1291-staff-view-state' web-admin/src/ops-console.js && \
            grep -q 'globalThis.__BH_AUTH__?.ensureSession' web-admin/src/ops-console.js
            RC=$?
          fi
          if [[ $RC -eq 0 ]]; then
            STAGE=BUILD
            npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock >>/tmp/webfix.log 2>&1 && npm --prefix web-admin run build >>/tmp/webfix.log 2>&1
            RC=$?
          fi
          export STAGE RC
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          raw=Path('/tmp/webfix.log').read_text(errors='replace') if Path('/tmp/webfix.log').exists() else ''
          tail='\n'.join(raw.splitlines()[-12:])
          tail=re.sub(r'https?://\S+','<url>',tail)
          Path('ops/web-auth-staff-patch-proof.json').write_text(json.dumps({
            'status':'PASS' if int(os.environ['RC'])==0 else 'FAIL',
            'stage':os.environ['STAGE'],
            'error_tail':tail[:1400]
          },ensure_ascii=False,indent=2)+'\n')
          PY
          exit $RC
      - name: Commit source and sanitized proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/web-auth-staff-patch-proof.json || printf '%s\n' '{"status":"FAIL","stage":"RUNNER"}' > ops/web-auth-staff-patch-proof.json
          cat ops/web-auth-staff-patch-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/web-auth-staff-patch-proof.json
          if grep -q '"status": "PASS"' ops/web-auth-staff-patch-proof.json; then
            git add web-admin/src/backend-runtime.js web-admin/src/main.js web-admin/src/ops-console.js
          fi
          git diff --cached --quiet || git commit -m 'fix(web): restore auth before load and preserve staff state'
          git pull --rebase origin main
          git push origin HEAD:main
          grep -q '"status": "PASS"' ops/web-auth-staff-patch-proof.json
