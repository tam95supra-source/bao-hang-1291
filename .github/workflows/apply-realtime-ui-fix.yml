name: Apply realtime and picker UX fix

on:
  push:
    branches: [main]
    paths:
      - 'ops/apply-realtime-ui-fix.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-realtime-ui-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply guarded source patch
        run: python3 ops/apply_realtime_ui_fix_20260819.py
      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F "emitIssueRealtimeSignal" web-admin/src/backend-runtime.js >/dev/null
          grep -F "SKU đã báo hôm nay • cũ → mới" app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt >/dev/null
          grep -F "tvAppVersion" app/src/main/res/layout/activity_main.xml >/dev/null
          grep -F "MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT" app/src/main/java/vn/pickpack1291/baohang/notifications/OverlayAlertService.kt >/dev/null
          grep -F "firestore.rules" firebase.json >/dev/null
          grep -F "staff:minute:" sql/20260819_staff_realtime_coalesce.sql >/dev/null
          echo 'PATCH_SHAPE=PASS'
      - name: Commit patched runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-admin/src/backend-runtime.js firebase.json firestore.rules .github/workflows/deploy-web-admin.yml app/src/main/java/vn/pickpack1291/baohang/network/ApiClient.kt app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt app/src/main/java/vn/pickpack1291/baohang/notifications/OverlayAlertService.kt app/src/main/res/layout/activity_main.xml google-apps-script/DEPLOY_NEON.gs sql/20260819_staff_realtime_coalesce.sql
          git diff --cached --quiet && { echo 'No patch changes'; exit 0; }
          git commit -m 'fix: realtime delivery, staff invalidation and picker UX'
          git pull --rebase origin main
          git push origin HEAD:main
