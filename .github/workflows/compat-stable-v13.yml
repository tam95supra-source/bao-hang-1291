name: Add Stable compatibility shim v1.3

on:
  push:
    branches: [work/beta-catalog-staff-ux-v13]
    paths:
      - '.github/workflows/compat-stable-v13.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta-catalog-staff-ux-v13
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3
      - name: Add no-data retired compatibility routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/api/index.ts')
          s = p.read_text(encoding='utf-8')
          marker = '    case "replace-catalog": return replaceCatalog(context, body);\n'
          if s.count(marker) != 1:
              raise SystemExit(f'Expected one replace-catalog route marker, got {s.count(marker)}')
          lines = [
              '    // Stable 1.1.x compatibility only. Detailed inventory integration is retired;',
              '    // These routes never read credentials, sessions, source APIs, snapshots, or quantity data.',
              '    case "inventory-status": return {',
              '      sku: required(body.sku, "SKU"), freshness_status: "UNKNOWN", stock_status: "NO_DATA", snapshot_captured_at: null,',
              '    };',
              '    case "inventory-current":',
              '      requireRole(context, ["ADMIN", "ADMIN_INVENT", "INVENT"]);',
              '      return { items: [] };',
              '    case "inventory-summary":',
              '      requireRole(context, ["ADMIN", "ADMIN_INVENT"]);',
              '      return { current_sku_count: 0, snapshot: null, jobs: [], connection: { enabled: false, status: "RETIRED" }, config: {} };',
              '    case "inventory-sync-start":',
              '    case "inventory-recovery-start":',
              '    case "inventory-recovery-stage":',
              '    case "inventory-recovery-finalize":',
              '    case "inventory-job-cancel":',
              '      requireRole(context, ["ADMIN", "ADMIN_INVENT"]);',
              '      throw new HttpError(410, "Chức năng tồn kho chi tiết đã ngừng. Vui lòng dùng Danh mục SKU / Tên hàng ở phiên bản mới.");',
          ]
          compat = '\n'.join(lines) + '\n'
          p.write_text(s.replace(marker, compat + marker, 1), encoding='utf-8')
          PY
      - name: Verify retired integration stays removed
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -i -E 'api-supra|SUPRA_CREDENTIAL|SOURCE_CONTRACT|SUPRA_POC|encrypted_credential_bundle' supabase/functions; then
            echo 'Retired source integration code returned' >&2
            exit 1
          fi
          deno check supabase/functions/_shared/fcm.ts supabase/functions/api/index.ts supabase/functions/web-api/index.ts
          git diff --check
      - name: Commit compatibility and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/compat-stable-v13.yml
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Stable inventory calls fail-safe after integration retirement'
          git push origin HEAD:work/beta-catalog-staff-ux-v13
