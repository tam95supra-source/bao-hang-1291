name: Provision Supra credential master key

on:
  push:
    branches: [main]
    paths:
      - 'ops/provision-supra-master-key.request'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oedasgcdjppjwidhlqdr
    steps:
      - name: Validate existing deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing existing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Provision idempotently without printing secret
        shell: bash
        run: |
          set -euo pipefail
          if supabase secrets list --project-ref "$PROJECT_REF" | grep -q 'SUPRA_CREDENTIAL_MASTER_KEY'; then
            echo 'SUPRA_MASTER_KEY=ALREADY_CONFIGURED'
            exit 0
          fi
          KEY="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$KEY"
          supabase secrets set "SUPRA_CREDENTIAL_MASTER_KEY=$KEY" --project-ref "$PROJECT_REF" >/dev/null
          unset KEY
          supabase secrets list --project-ref "$PROJECT_REF" | grep -q 'SUPRA_CREDENTIAL_MASTER_KEY'
          echo 'SUPRA_MASTER_KEY=PROVISIONED'
