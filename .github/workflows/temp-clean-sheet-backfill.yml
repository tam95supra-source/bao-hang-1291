name: Temp cleanup Sheet backfill helpers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-clean-sheet-backfill.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Remove all completed temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find .github/workflows -maxdepth 1 -type f -name 'temp-*.yml' -print0 | xargs -0 -r git rm -f --
          find .ops -maxdepth 1 -type f -name 'temp*' -print0 2>/dev/null | xargs -0 -r git rm -f --
          git add -A
          git diff --cached --quiet || git commit -m 'chore(ci): remove completed Sheet backfill helpers'
          git pull --rebase origin main
          git push origin HEAD:main
