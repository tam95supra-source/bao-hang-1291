name: Validate Full Role V2

on:
  push:
    branches:
      - work/full-role-web-log-v2-ready
    paths:
      - 'web-admin/**'
      - 'docs/templates/**'
      - 'app/src/main/res/raw/mau_nhan_su_bao_hang_1291.xlsx'
      - '.github/workflows/validate-full-role-v2.yml'

permissions:
  contents: read

jobs:
  web-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate source and XLSX assets
        shell: bash
        run: |
          set -euo pipefail
          node --check web-admin/src/main.js
          unzip -t docs/templates/MAU_NHAN_SU_BAO_HANG_1291.xlsx >/dev/null
          cmp docs/templates/MAU_NHAN_SU_BAO_HANG_1291.xlsx app/src/main/res/raw/mau_nhan_su_bao_hang_1291.xlsx
      - name: Build web without deploy
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build
      - name: Reject secret material from static build
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|service_role' web-admin/dist; then
            echo 'Secret-like material found in static build' >&2
            exit 1
          fi
          test -s web-admin/dist/index.html
          grep -q 'Web nghiệp vụ' web-admin/src/main.js
          echo 'FULL_ROLE_WEB_BUILD=PASS'
