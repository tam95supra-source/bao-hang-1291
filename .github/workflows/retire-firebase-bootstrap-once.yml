name: Retire stale Firebase bootstrap once

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - '.github/workflows/retire-firebase-bootstrap-once.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - name: Replace one-shot bootstrap with fail-closed stub
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/functions/firebase-bootstrap/index.ts <<'EOF'
          /**
           * RETIRED ONE-SHOT.
           *
           * Initial Firebase provisioning is completed/owner-gated. Keeping this
           * endpoint fail-closed prevents a future backend deploy from replaying
           * stale Firestore rules or attempting database creation.
           */
          Deno.serve(() => new Response(
            JSON.stringify({ ok: false, error: "RETIRED_ONE_SHOT" }),
            {
              status: 410,
              headers: {
                "content-type": "application/json; charset=utf-8",
                "cache-control": "no-store",
              },
            },
          ));
          EOF
          git diff --check -- supabase/functions/firebase-bootstrap/index.ts
          grep -Fq 'RETIRED_ONE_SHOT' supabase/functions/firebase-bootstrap/index.ts
          ! grep -Fq 'FIRESTORE_RULES' supabase/functions/firebase-bootstrap/index.ts
      - name: Commit source retirement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/firebase-bootstrap/index.ts
          git commit -m "fix: retire stale Firebase bootstrap one-shot"
          git push origin HEAD:target-final-20260814-impl
