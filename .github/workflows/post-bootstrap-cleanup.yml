name: Post-bootstrap secret cleanup

on:
  push:
    branches: [main]
    paths:
      - 'ops/post-bootstrap-cleanup.request'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_REF: oedasgcdjppjwidhlqdr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Validate management token
        shell: bash
        run: test -n "${SUPABASE_ACCESS_TOKEN:-}"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Remove one-time bootstrap secret
        shell: bash
        run: supabase secrets unset BOOTSTRAP_SECRET --project-ref "$PROJECT_REF"
