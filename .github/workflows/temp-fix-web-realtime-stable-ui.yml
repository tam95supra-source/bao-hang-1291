name: Temp fix Web realtime stable UI

on:
  push:
    branches: [main]
    paths:
      - 'ops/fix-web-realtime-stable-ui.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch Web to one realtime owner and deterministic UI renderers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Deterministic module order. Remove duplicate issue realtime module.
          p=Path('web-admin/index.html'); s=p.read_text(encoding='utf-8')
          old='''    <script type="module" src="/src/main.js"></script>\n    <script type="module" src="/src/warehouse-ui-v2.js"></script>\n    <script type="module" src="/src/config-live.js"></script>\n    <script type="module" src="/src/ops-console.js"></script>'''
          new='''    <script type="module" src="/src/warehouse-ui-v2.js"></script>\n    <script type="module" src="/src/ops-console.js"></script>\n    <script type="module" src="/src/main.js"></script>\n    <script type="module" src="/src/config-live.js"></script>'''
          if old not in s: raise SystemExit('index module block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 2) Warehouse UI becomes a passive renderer owned by main.js, no MutationObserver.
          p=Path('web-admin/src/warehouse-ui-v2.js'); s=p.read_text(encoding='utf-8')
          marker='const observer=new MutationObserver(()=>queueMicrotask(reconcile));observer.observe(document.documentElement,{childList:true,subtree:true});window.addEventListener(\'hashchange\',()=>queueMicrotask(reconcile));window.addEventListener(\'pageshow\',()=>queueMicrotask(reconcile));document.addEventListener(\'visibilitychange\',()=>{if(!document.hidden)queueMicrotask(reconcile)});queueMicrotask(reconcile);'
          replacement="window.__BH_WV2_RENDER__={overview:renderOverview,events:renderEvents,reports:renderReports};"
          if marker not in s: raise SystemExit('warehouse observer marker not found')
          s=s.replace(marker,replacement,1)
          # Do not blank current page while a realtime refresh is fetching.
          s=s.replace("content.innerHTML=`<div class=\"warehouse-v2-root\">${heading('Tổng quan hôm nay','Tình hình báo thiếu, xử lý và kết quả kho trong 24 giờ.',false,`<div><b>${escapeHtml(dayLabel())}</b><div style=\"color:#98a2b3;font-size:11px;text-align:right\">Đang tải dữ liệu…</div></div>`)}<div class=\"wv2-empty\">Đang tổng hợp dữ liệu vận hành…</div></div>`;", "if(!content.querySelector(':scope > .warehouse-v2-root'))content.innerHTML=`<div class=\"warehouse-v2-root\">${heading('Tổng quan hôm nay','Tình hình báo thiếu, xử lý và kết quả kho trong 24 giờ.',false,`<div><b>${escapeHtml(dayLabel())}</b><div style=\"color:#98a2b3;font-size:11px;text-align:right\">Đang tải dữ liệu…</div></div>`)}<div class=\"wv2-empty\">Đang tổng hợp dữ liệu vận hành…</div></div>`;",1)
          s=s.replace("const token=++ui.renderToken;content.innerHTML=`<div class=\"warehouse-v2-root\">${heading('Xử lý báo hàng','Đang xử lý là số hiện tại; lịch sử Có hàng/SKIP/Thu hồi tính trong hôm nay.')}<div class=\"wv2-empty\">Đang tải báo thiếu…</div></div>`;", "const token=++ui.renderToken;if(!content.querySelector(':scope > .warehouse-v2-root'))content.innerHTML=`<div class=\"warehouse-v2-root\">${heading('Xử lý báo hàng','Đang xử lý là số hiện tại; lịch sử Có hàng/SKIP/Thu hồi tính trong hôm nay.')}<div class=\"wv2-empty\">Đang tải báo thiếu…</div></div>`;",1)
          p.write_text(s,encoding='utf-8')

          # 3) Ops console becomes passive deterministic renderer, no MutationObserver.
          p=Path('web-admin/src/ops-console.js'); s=p.read_text(encoding='utf-8')
          old='''function scheduleEnhance(delay = 120) {\n  clearTimeout(ui.enhanceTimer);\n  ui.enhanceTimer = setTimeout(enhanceCurrentPage, delay);\n}\n\nconst observer = new MutationObserver(() => scheduleEnhance());\nobserver.observe(document.documentElement, { childList: true, subtree: true });\nwindow.addEventListener('hashchange', () => scheduleEnhance(40));\nwindow.addEventListener('pageshow', () => scheduleEnhance(40));\ndocument.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleEnhance(40); });\nscheduleEnhance(40);'''
          new='''window.__BH_OPS_RENDER__ = {\n  overview: renderOverviewView,\n  users: renderUsersView,\n  config: renderTimingView,\n  sla: renderTimingView,\n  services: renderServerView,\n  server: renderServerView,\n};\nwindow.__BH_OPS_NORMALIZE__ = normalizeNavigation;'''
          if old not in s: raise SystemExit('ops observer block not found')
          s=s.replace(old,new,1)
          # Preserve current staff table while new realtime payload loads.
          s=s.replace("content.innerHTML = `${pageHeading('Nhân sự & tài khoản', 'Google Sheet là nguồn chính; tài khoản tạo thêm được quản lý riêng và không ghi ngược vào nguồn.', `<span class=\"ops-source-label\">DỮ LIỆU THEO NGÀY · DANH SÁCH NHÂN SỰ</span>`)}<div class=\"ops-loading\">Đang tải nhân sự…</div>`;", "if(content.dataset.opsRender!=='users'||!content.querySelector('.ops-users-table'))content.innerHTML = `${pageHeading('Nhân sự & tài khoản', 'Google Sheet là nguồn chính; tài khoản tạo thêm được quản lý riêng và không ghi ngược vào nguồn.', `<span class=\"ops-source-label\">DỮ LIỆU THEO NGÀY · DANH SÁCH NHÂN SỰ</span>`)}<div class=\"ops-loading\">Đang tải nhân sự…</div>`;",1)
          p.write_text(s,encoding='utf-8')

          # 4) main.js is the single owner of realtime and routes each tab to one renderer.
          p=Path('web-admin/src/main.js'); s=p.read_text(encoding='utf-8')
          old='''  const handlers = {\n    overview: renderOverview, events: renderEvents, picker: renderPicker, reports: renderReports,\n    sku: renderSku, users: renderUsers, devices: renderDevices, services: renderIntegrations, logs: renderLogs,\n    sla: renderSla, config: renderConfig, versions: renderVersions,\n  };\n  handlers[state.activeTab]?.();'''
          new='''  window.__BH_OPS_NORMALIZE__?.();\n  const wv2 = window.__BH_WV2_RENDER__ || {};\n  const ops = window.__BH_OPS_RENDER__ || {};\n  const handlers = {\n    overview: () => (wv2.overview ? wv2.overview() : renderOverview()),\n    events: () => (wv2.events ? wv2.events() : renderEvents()),\n    picker: renderPicker,\n    reports: () => (wv2.reports ? wv2.reports() : renderReports()),\n    sku: renderSku,\n    users: () => (ops.users ? ops.users() : renderUsers()),\n    devices: renderDevices,\n    services: () => (ops.services ? ops.services() : renderIntegrations()),\n    logs: renderLogs,\n    sla: () => (ops.sla ? ops.sla() : renderSla()),\n    config: () => (ops.config ? ops.config() : renderConfig()),\n    versions: renderVersions,\n  };\n  handlers[state.activeTab]?.();'''
          if old not in s: raise SystemExit('main handlers block not found')
          s=s.replace(old,new,1)

          old='''function scheduleLiveRefresh(kind) {\n  if (document.hidden) return;\n  clearTimeout(state.refreshTimer);\n  state.refreshTimer = setTimeout(() => {\n    if (kind === 'catalog' && ['sku','overview','picker'].includes(state.activeTab)) renderTab();\n    if (kind === 'staff' && ['users','overview'].includes(state.activeTab)) renderTab();\n    if (kind === 'issue' && ['events','overview','picker'].includes(state.activeTab)) renderTab();\n  }, 180);\n}'''
          new='''let realtimeNoticeTimer = null;\nfunction showRealtimeNotice(text) {\n  let el = document.getElementById('realtimeNotice');\n  if (!el) { el = document.createElement('div'); el.id = 'realtimeNotice'; el.className = 'realtime-notice'; document.body.appendChild(el); }\n  el.textContent = text; el.hidden = false;\n  clearTimeout(realtimeNoticeTimer);\n  realtimeNoticeTimer = setTimeout(() => { if (el.isConnected) el.hidden = true; }, 2400);\n}\nfunction scheduleLiveRefresh(kind) {\n  if (document.hidden) return;\n  clearTimeout(state.refreshTimer);\n  state.refreshTimer = setTimeout(() => {\n    if (kind === 'catalog' && ['sku','overview','picker'].includes(state.activeTab)) renderTab();\n    if (kind === 'staff' && ['users','overview'].includes(state.activeTab)) renderTab();\n    if (kind === 'issue' && ['events','overview','picker'].includes(state.activeTab)) renderTab();\n  }, 220);\n}'''
          if old not in s: raise SystemExit('scheduleLiveRefresh block not found')
          s=s.replace(old,new,1)
          s=s.replace(".on('broadcast', { event: 'catalog_changed' }, () => scheduleLiveRefresh('catalog')).subscribe(subscribeStatus);", ".on('broadcast', { event: 'catalog_changed' }, () => { showRealtimeNotice('Danh mục SKU vừa cập nhật'); scheduleLiveRefresh('catalog'); }).subscribe(subscribeStatus);",1)
          s=s.replace(".on('broadcast', { event: 'issue_changed' }, () => scheduleLiveRefresh('issue'))", ".on('broadcast', { event: 'issue_changed' }, () => { showRealtimeNotice('Có cập nhật báo hàng mới'); scheduleLiveRefresh('issue'); })",1)
          s=s.replace(".on('broadcast', { event: 'staff_changed' }, () => scheduleLiveRefresh('staff')).subscribe(subscribeStatus);", ".on('broadcast', { event: 'staff_changed' }, () => { showRealtimeNotice('Danh sách nhân sự vừa cập nhật'); scheduleLiveRefresh('staff'); }).subscribe(subscribeStatus);",1)
          old="""    if (['events','picker','sku','overview','users'].includes(state.activeTab)) renderTab();"""
          new="""    if (['events','picker','sku','overview','users'].includes(state.activeTab)) renderTab();"""
          if old not in s: raise SystemExit('fallback refresh marker missing')
          p.write_text(s,encoding='utf-8')

          # 5) Toast styling; one fixed non-blocking notification like modern web apps.
          p=Path('web-admin/src/style.css'); s=p.read_text(encoding='utf-8')
          css='''\n.realtime-notice{position:fixed;right:20px;top:76px;z-index:1200;max-width:360px;padding:10px 14px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;box-shadow:0 8px 28px rgba(15,23,42,.14);font-size:13px;font-weight:700;color:#0f172a;pointer-events:none}.realtime-notice[hidden]{display:none!important}\n'''
          if '.realtime-notice{' not in s: s += css
          p.write_text(s,encoding='utf-8')
          PY

          cp web-admin/src/main.js "$RUNNER_TEMP/main.mjs"
          cp web-admin/src/warehouse-ui-v2.js "$RUNNER_TEMP/warehouse.mjs"
          cp web-admin/src/ops-console.js "$RUNNER_TEMP/ops.mjs"
          node --check "$RUNNER_TEMP/main.mjs"
          node --check "$RUNNER_TEMP/warehouse.mjs"
          node --check "$RUNNER_TEMP/ops.mjs"
          grep -q '__BH_WV2_RENDER__' web-admin/src/warehouse-ui-v2.js
          grep -q '__BH_OPS_RENDER__' web-admin/src/ops-console.js
          grep -q 'Có cập nhật báo hàng mới' web-admin/src/main.js
          ! grep -q '/src/config-realtime.js' web-admin/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-admin/index.html web-admin/src/main.js web-admin/src/warehouse-ui-v2.js web-admin/src/ops-console.js web-admin/src/style.css
          git diff --cached --quiet || git commit -m 'fix(web): stabilize realtime UI without reload races'
          git pull --rebase origin main
          git push origin HEAD:main
