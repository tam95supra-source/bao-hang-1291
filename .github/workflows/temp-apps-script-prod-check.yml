name: Temp Apps Script production check

on:
  push:
    branches:
      - migration/neon-cutover
    paths:
      - '.github/workflows/temp-apps-script-prod-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      GOOGLE_SHEET_WEBHOOK_SECRET: ${{ secrets.GOOGLE_SHEET_WEBHOOK_SECRET }}
    steps:
      - name: Validate secret bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_SHEET_WEBHOOK_URL:-}" || { echo 'Missing webhook URL'; exit 1; }
          test -n "${GOOGLE_SHEET_WEBHOOK_SECRET:-}" || { echo 'Missing webhook secret'; exit 1; }
          case "$GOOGLE_SHEET_WEBHOOK_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo 'Webhook URL is not an Apps Script /exec URL'; exit 1 ;;
          esac

      - name: Verify production ping
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location \
            --header 'Content-Type: application/json' \
            --data '{"action":"ping"}' \
            --output ping.json \
            "$GOOGLE_SHEET_WEBHOOK_URL"
          python3 - <<'PY'
          import json
          d=json.load(open('ping.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          assert d.get('project') == 'bao-hang-1291', d
          assert d.get('provider') == 'NEON_FIREBASE_GOOGLE', d
          print('PING_OK project=bao-hang-1291 provider=NEON_FIREBASE_GOOGLE')
          PY

      - name: Verify authenticated sheet webhook without writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          with open('request.json','w',encoding='utf-8') as f:
              json.dump({'secret': os.environ['GOOGLE_SHEET_WEBHOOK_SECRET'], 'events': []}, f)
          PY
          curl --silent --show-error --location \
            --header 'Content-Type: application/json' \
            --data-binary @request.json \
            --output webhook.json \
            "$GOOGLE_SHEET_WEBHOOK_URL"
          rm -f request.json
          python3 - <<'PY'
          import json
          d=json.load(open('webhook.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          if 'processed' in d:
              assert int(d.get('processed') or 0) == 0, d
          print('SHEET_WEBHOOK_AUTH_OK no_write_probe=true')
          PY
          rm -f ping.json webhook.json
