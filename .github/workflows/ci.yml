name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - 'ops/**'
      - 'bootstrap-source.zip'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Unit test and assemble debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bao-hang-1291-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
