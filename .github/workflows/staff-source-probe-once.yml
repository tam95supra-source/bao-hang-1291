name: Staff source reachability probe once

on:
  push:
    branches: ['ops/firebase-read-probe-20260815']
    paths: ['.github/workflows/staff-source-probe-once.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Diagnose private staff source APIs without printing staff data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}'); const sid='1HLBzpxHLd8qoTJopOA7M_q0dDvO56G0Tb4curKZV7EM';
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          async function token(scope){const n=Math.floor(Date.now()/1000),h=enc({alg:'RS256',typ:'JWT'}),p=enc({iss:sa.client_email,scope,aud:'https://oauth2.googleapis.com/token',iat:n,exp:n+900}),u=`${h}.${p}`,sig=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${u}.${sig}`})});return r.ok?(await r.json()).access_token:null}
          async function probe(name,url,t){const r=await fetch(url,{headers:{authorization:`Bearer ${t}`}});const text=await r.text();let b={};try{b=JSON.parse(text)}catch{};const status=String(b?.error?.status||'').replace(/[^A-Z0-9_.:-]/gi,'_');const reason=String(b?.error?.details?.[0]?.reason||b?.error?.errors?.[0]?.reason||'').replace(/[^A-Z0-9_.:-]/gi,'_');console.log(`${name}=${r.status}_${status||'NONE'}_${reason||'NONE'}`);return {r,text,b}}
          (async()=>{
            const ts=await token('https://www.googleapis.com/auth/spreadsheets.readonly'); console.log(`SHEETS_OAUTH=${ts?'200':'FAIL'}`); if(ts){const range=encodeURIComponent("'Trang tính1'!A1:I990");await probe('SHEETS_VALUES',`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${range}?majorDimension=ROWS`,ts)}
            const td=await token('https://www.googleapis.com/auth/drive.readonly'); console.log(`DRIVE_OAUTH=${td?'200':'FAIL'}`); if(td){await probe('DRIVE_FILE_GET',`https://www.googleapis.com/drive/v3/files/${sid}?fields=id,name,mimeType`,td);await probe('DRIVE_EXPORT_CSV',`https://www.googleapis.com/drive/v3/files/${sid}/export?mimeType=text%2Fcsv`,td)}
          })().catch(e=>{console.error(String(e.message||e).replace(/[^A-Z0-9_.:-]/gi,'_').slice(0,120));process.exitCode=1});
          NODE