name: Staff source reachability probe once

on:
  push:
    branches: ['ops/firebase-read-probe-20260815']
    paths: ['.github/workflows/staff-source-probe-once.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Probe filtered Google Sheet GViz without printing staff data
        shell: bash
        run: |
          set -euo pipefail
          URL1="https://docs.google.com/spreadsheets/d/1FRROqCp1lmkuHc3lc4UBpVI5_ZrtiPI1thlEymv458E/gviz/tq?tqx=out%3Acsv&sheet=DANH+M%E1%BB%A4C+NH%C3%82N+S%E1%BB%B0&tq=select+A%2CB%2CD%2CE+where+G+%3D+1291+and+H+%3D+%27HY1%27"
          URL2="https://docs.google.com/spreadsheets/d/1FRROqCp1lmkuHc3lc4UBpVI5_ZrtiPI1thlEymv458E/gviz/tq?tqx=out%3Acsv&sheet=DANH+M%E1%BB%A4C+NH%C3%82N+S%E1%BB%B0&tq=select+A%2CB%2CD%2CE+where+G+%3D+%271291%27+and+H+%3D+%27HY1%27"
          for i in 1 2; do
            if [ "$i" = 1 ]; then URL="$URL1"; else URL="$URL2"; fi
            CODE="$(curl -L -sS --max-time 20 -o "$RUNNER_TEMP/staff-$i.csv" -w '%{http_code}' "$URL" || true)"
            BYTES="$(wc -c < "$RUNNER_TEMP/staff-$i.csv" 2>/dev/null || echo 0)"
            MIME="$(file -b --mime-type "$RUNNER_TEMP/staff-$i.csv" 2>/dev/null || echo unknown)"
            echo "STAFF_GVIZ_VARIANT_${i}=HTTP_${CODE}_BYTES_${BYTES}_MIME_${MIME}"
            rm -f "$RUNNER_TEMP/staff-$i.csv"
          done