name: Staff source reachability probe once

on:
  push:
    branches: ['ops/firebase-read-probe-20260815']
    paths: ['.github/workflows/staff-source-probe-once.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Verify private Google Sheet through service-account OAuth without printing staff data
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          const sid='1HLBzpxHLd8qoTJopOA7M_q0dDvO56G0Tb4curKZV7EM';
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          async function token(){const n=Math.floor(Date.now()/1000),h=enc({alg:'RS256',typ:'JWT'}),p=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/spreadsheets.readonly',aud:'https://oauth2.googleapis.com/token',iat:n,exp:n+900}),u=`${h}.${p}`,sig=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth-type:jwt-bearer',assertion:`${u}.${sig}`})}); if(!r.ok){console.log(`OAUTH=${r.status}`);return null;} console.log('OAUTH=200');return (await r.json()).access_token}
          (async()=>{
            // Use the RFC JWT bearer grant literal separately to avoid exposing any credential.
            const n=Math.floor(Date.now()/1000), h=enc({alg:'RS256',typ:'JWT'}), p=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/spreadsheets.readonly',aud:'https://oauth2.googleapis.com/token',iat:n,exp:n+900}), u=`${h}.${p}`, sig=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');
            const tr=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${u}.${sig}`})});
            console.log(`OAUTH=${tr.status}`); if(!tr.ok)return; const t=(await tr.json()).access_token;
            const range=encodeURIComponent("'Trang tính1'!A1:I990");
            const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${range}?majorDimension=ROWS`,{headers:{authorization:`Bearer ${t}`}});
            console.log(`SHEETS_VALUES=${r.status}`); if(!r.ok)return;
            const body=await r.json(); const rows=Array.isArray(body.values)?body.values.slice(1):[];
            const active=rows.filter(row=>String(row[0]||'').trim()==='Kho Yên Mỹ - Hưng Yên'&&String(row[1]||'').trim()==='1291'&&String(row[8]||'').trim().toLowerCase()==='đang làm việc');
            const unique=new Set(active.map(row=>String(row[3]||'').trim().toLowerCase()).filter(Boolean));
            console.log(`STAFF_PRIVATE_SOURCE=PASS_ACTIVE_ROWS_${active.length}_UNIQUE_${unique.size}`);
          })().catch(e=>{console.error(String(e.message||e).replace(/[^A-Z0-9_.:-]/gi,'_').slice(0,120));process.exitCode=1});
          NODE