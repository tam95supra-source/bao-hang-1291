name: Firebase read permission probe once

on:
  push:
    branches: ['ops/firebase-read-probe-20260815']
    paths: ['.github/workflows/firebase-read-probe-once.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PROJECT_ID: bao-hang-1291
    steps:
      - name: Probe Firebase APIs read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          const project=process.env.PROJECT_ID;
          if(!sa.client_email||!sa.private_key) throw new Error('SERVICE_ACCOUNT_SECRET_INVALID');
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          async function token(){
            const n=Math.floor(Date.now()/1000), h=enc({alg:'RS256',typ:'JWT'}), p=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:n,exp:n+900});
            const u=`${h}.${p}`, sig=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');
            const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${u}.${sig}`})});
            console.log(`OAUTH=${r.status}`); if(!r.ok) process.exit(0); return (await r.json()).access_token;
          }
          async function probe(name,url,t,init={}){
            const r=await fetch(url,{...init,headers:{authorization:`Bearer ${t}`,'content-type':'application/json',...(init.headers||{})}});
            const text=await r.text(); let body={}; try{body=text?JSON.parse(text):{}}catch{}
            const status=String(body?.error?.status||body?.error?.message||'').replace(/[^A-Z0-9_.:-]/gi,'_').slice(0,100);
            console.log(`${name}=${r.status}${status?`_${status}`:''}`);
          }
          (async()=>{
            const t=await token(); if(!t) return;
            await probe('FIRESTORE_DB_GET',`https://firestore.googleapis.com/v1/projects/${project}/databases/(default)`,t);
            await probe('FIRESTORE_RUNQUERY',`https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents:runQuery`,t,{method:'POST',body:JSON.stringify({structuredQuery:{from:[{collectionId:'emergency_events'}],limit:1}})});
            await probe('FIREBASE_RULES_RELEASES',`https://firebaserules.googleapis.com/v1/projects/${project}/releases?pageSize=1`,t);
            await probe('FIREBASE_AUTH_CONFIG',`https://identitytoolkit.googleapis.com/admin/v2/projects/${project}/config`,t);
          })().catch(e=>{console.error(String(e.message||e).replace(/[^A-Z0-9_.:-]/gi,'_').slice(0,120));process.exitCode=1});
          NODE