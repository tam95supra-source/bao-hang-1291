name: Temp patch Apps Script staff sync isolation
on:
  push:
    paths:
      - '.github/workflows/temp-patch-appscript-staff-isolation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch fail-isolated staff sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('google-apps-script/DEPLOY_NEON.gs')
          s=p.read_text()
          old="""  if (Date.now() - last < interval * 60000) return;\n  runStaffSync_('AUTO', {role:'ADMIN'});\n}"""
          new="""  if (Date.now() - last < interval * 60000) return;\n  try {\n    runStaffSync_('AUTO', {role:'ADMIN'});\n    props.deleteProperty('LAST_STAFF_SYNC_ERROR');\n  } catch (error) {\n    props.setProperty('LAST_STAFF_SYNC_ERROR', safeError_(error));\n  }\n}"""
          if old not in s:
              if "LAST_STAFF_SYNC_ERROR" in s:
                  print('ALREADY_PATCHED')
              else:
                  raise SystemExit('TARGET_BLOCK_NOT_FOUND')
          else:
              p.write_text(s.replace(old,new,1))
              print('PATCHED')
          PY
          grep -q "LAST_STAFF_SYNC_ERROR" google-apps-script/DEPLOY_NEON.gs
          git config user.name github-actions
          git config user.email github-actions@github.com
          if git diff --quiet; then exit 0; fi
          git add google-apps-script/DEPLOY_NEON.gs
          git commit -m "fix(worker): isolate staff source failures"
          git push
