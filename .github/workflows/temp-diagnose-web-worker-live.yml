name: Temp diagnose live web worker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-diagnose-web-worker-live.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Diagnose sanitized live transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops "$RUNNER_TEMP/d"
          web_code=$(curl -sS -o "$RUNNER_TEMP/d/index.html" -w '%{http_code}' https://bao-hang-1291.web.app/ || true)
          asset_count=0; web_fix=NO
          if [ "$web_code" = 200 ]; then
            python3 - <<'PY' > "$RUNNER_TEMP/d/assets.txt"
          import os,re
          s=open(os.environ['RUNNER_TEMP']+'/d/index.html').read()
          for x in sorted(set(re.findall(r'/assets/[^"\x27]+\.js',s))): print(x)
          PY
            asset_count=$(wc -l < "$RUNNER_TEMP/d/assets.txt" | tr -d ' ')
            : > "$RUNNER_TEMP/d/bundle.js"
            while IFS= read -r a; do curl -sS "https://bao-hang-1291.web.app$a" >> "$RUNNER_TEMP/d/bundle.js" || true; done < "$RUNNER_TEMP/d/assets.txt"
            if grep -F 'text/plain;charset=UTF-8' "$RUNNER_TEMP/d/bundle.js" >/dev/null && grep -F 'initial_password' "$RUNNER_TEMP/d/bundle.js" >/dev/null; then web_fix=YES; fi
          fi
          worker_present=NO; worker_code=000; worker_json=NO; worker_project=NO
          if [ -n "${WORKER_URL:-}" ]; then
            worker_present=YES
            worker_code=$(curl -sS -L -o "$RUNNER_TEMP/d/worker.out" -w '%{http_code}' -H 'content-type: text/plain;charset=UTF-8' --data-binary '{"action":"ping"}' "$WORKER_URL" || true)
            if jq -e . "$RUNNER_TEMP/d/worker.out" >/dev/null 2>&1; then worker_json=YES; fi
            if jq -e '.ok==true and .project=="bao-hang-1291"' "$RUNNER_TEMP/d/worker.out" >/dev/null 2>&1; then worker_project=YES; fi
          fi
          printf 'web_http=%s\nweb_asset_count=%s\nweb_fix_markers=%s\nworker_secret_present=%s\nworker_http=%s\nworker_json=%s\nworker_project_ok=%s\n' "$web_code" "$asset_count" "$web_fix" "$worker_present" "$worker_code" "$worker_json" "$worker_project" > ops/last-live-transport-diagnostic.txt
          cat ops/last-live-transport-diagnostic.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/last-live-transport-diagnostic.txt; git diff --cached --quiet || git commit -m 'chore: record live transport diagnostic'; git pull --rebase origin main; git push origin HEAD:main
