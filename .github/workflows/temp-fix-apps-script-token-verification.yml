name: Temp fix Apps Script Firebase token verification

on:
  push:
    branches:
      - migration/neon-cutover
    paths:
      - '.github/workflows/temp-fix-apps-script-token-verification.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
          fetch-depth: 0
      - name: Patch unsupported Firebase token verifier
        shell: bash
        env:
          NEW_VERIFIER_B64: ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          p=Path('google-apps-script/DEPLOY_NEON.gs')
          text=p.read_text(encoding='utf-8')
          new=base64.b64decode(os.environ['NEW_VERIFIER_B64']).decode('utf-8')
          pattern=r"function verifyFirebaseIdToken_\(token\) \{.*?\n\}\n\nfunction firebaseOAuthAccessToken_"
          replaced,n=re.subn(pattern,new+'\nfunction firebaseOAuthAccessToken_',text,count=1,flags=re.S)
          if n != 1: raise SystemExit(f'verifier replacement count={n}')
          if 'verifyRsaSha256Signature' in replaced: raise SystemExit('unsupported verifier still present')
          p.write_text(replaced,encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'identitytoolkit.googleapis.com/v1/accounts:lookup?key=' google-apps-script/DEPLOY_NEON.gs
          if grep -Fq 'verifyRsaSha256Signature' google-apps-script/DEPLOY_NEON.gs; then exit 1; fi
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tam95supra-source'
          git config user.email 'tam95.supra@gmail.com'
          git add google-apps-script/DEPLOY_NEON.gs
          git commit -m 'fix(apps-script): verify Firebase ID tokens via Auth backend'
          git push origin HEAD:migration/neon-cutover
