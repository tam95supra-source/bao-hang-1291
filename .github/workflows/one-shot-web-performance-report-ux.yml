name: One-shot Web performance report UX

on:
  push:
    branches:
      - fix/web-performance-report-ux-20260904
    paths:
      - '.patch-trigger/web-performance-report-ux'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply exact Web performance and report UX patch
        run: |
          set -euo pipefail
          node ops/patch_web_performance_report_ux.cjs
          node scripts/validate-web-performance-report-v4.cjs
          git diff --check
          rm -f .patch-trigger/web-performance-report-ux
          rm -f .github/workflows/one-shot-web-performance-report-ux.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(web): remove Drive blocking and redesign reports'
          git push origin HEAD:fix/web-performance-report-ux-20260904
