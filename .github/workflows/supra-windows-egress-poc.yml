name: Supra Windows egress POC

on:
  push:
    branches: [main]
    paths:
      - 'ops/supra-windows-egress-poc.request'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Probe Supra via Windows HTTP stack without credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $base = 'https://api-supra.winmart.vn'
          $endpoint = '/sft3-hy1/api/v1/report/stock/binStocks'
          $headers = @{
            'Accept' = 'application/json, text/plain, */*'
            'Accept-Language' = 'en-US,en;q=0.9'
            'Cache-Control' = 'no-cache'
            'Pragma' = 'no-cache'
            'Origin' = 'https://dashboard-supra.winmart.vn'
            'Referer' = 'https://dashboard-supra.winmart.vn/'
            'withcredentials' = 'true'
            'warehouse' = 'HY1'
          }
          try {
            $r = Invoke-WebRequest -Uri "$base/" -Method Get -Headers $headers -MaximumRedirection 0 -TimeoutSec 15 -SkipHttpErrorCheck
            Write-Host "ROOT_WINDOWS reached_http=true status=$($r.StatusCode)"
          } catch {
            Write-Host "ROOT_WINDOWS reached_http=false error=$($_.Exception.GetType().Name) message=$($_.Exception.Message)"
          }
          try {
            $r = Invoke-WebRequest -Uri "$base$endpoint" -Method Get -Headers $headers -MaximumRedirection 0 -TimeoutSec 15 -SkipHttpErrorCheck
            Write-Host "BIN_WINDOWS reached_http=true status=$($r.StatusCode) content_type=$($r.Headers.'Content-Type')"
          } catch {
            Write-Host "BIN_WINDOWS reached_http=false error=$($_.Exception.GetType().Name) message=$($_.Exception.Message)"
          }
