name: Runtime smoke test

on:
  push:
    branches: [main]
    paths:
      - 'ops/runtime-smoke.request'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_URL: https://oedasgcdjppjwidhlqdr.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_LGgDehtHMSyeJ1XyJDvQiQ_cdlqIKq7
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ADMIN_CODE: ${{ secrets.INITIAL_ADMIN_EMPLOYEE_CODE }}
      ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
    steps:
      - name: Validate Admin auth and Edge API
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          test -n "${ADMIN_CODE:-}"
          test -n "${ADMIN_PASSWORD:-}"
          EMAIL="${ADMIN_CODE}@bao-hang-1291.local"
          AUTH_STATUS="$(curl -sS --max-time 30 -o /tmp/auth.json -w '%{http_code}' \
            -X POST "$PROJECT_URL/auth/v1/token?grant_type=password" \
            -H 'content-type: application/json' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --data-binary "$(jq -n --arg email "$EMAIL" --arg password "$ADMIN_PASSWORD" '{email:$email,password:$password}')")"
          test "$AUTH_STATUS" = '200' || { jq '{error,error_description,msg}' /tmp/auth.json >&2; exit 1; }
          ACCESS_TOKEN="$(jq -r '.access_token' /tmp/auth.json)"
          echo "::add-mask::$ACCESS_TOKEN"
          API_STATUS="$(curl -sS --max-time 30 -o /tmp/api.json -w '%{http_code}' \
            -X POST "$PROJECT_URL/functions/v1/api/active-issues" \
            -H 'content-type: application/json' \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d '{}')"
          test "$API_STATUS" = '200' || { cat /tmp/api.json >&2; exit 1; }
          jq -e '.issues | type == "array"' /tmp/api.json >/dev/null
          echo 'Supabase Auth + Edge API: OK'

      - name: Validate Firebase service account and FCM HTTP v1
        shell: bash
        run: |
          set -euo pipefail
          SA_PROJECT="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r '.project_id')"
          test "$SA_PROJECT" = 'bao-hang-1291'
          ASSERTION="$(node <<'NODE'
          const crypto = require('crypto');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          const now = Math.floor(Date.now()/1000);
          const enc = (v) => Buffer.from(JSON.stringify(v)).toString('base64url');
          const input = enc({alg:'RS256',typ:'JWT'}) + '.' + enc({
            iss: sa.client_email,
            scope: 'https://www.googleapis.com/auth/firebase.messaging',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600
          });
          const signature = crypto.sign('RSA-SHA256', Buffer.from(input), sa.private_key).toString('base64url');
          process.stdout.write(input + '.' + signature);
          NODE
          )"
          echo "::add-mask::$ASSERTION"
          TOKEN_STATUS="$(curl -sS --max-time 30 -o /tmp/google-token.json -w '%{http_code}' \
            -X POST 'https://oauth2.googleapis.com/token' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=$ASSERTION")"
          test "$TOKEN_STATUS" = '200' || { jq '{error,error_description}' /tmp/google-token.json >&2; exit 1; }
          GOOGLE_TOKEN="$(jq -r '.access_token' /tmp/google-token.json)"
          echo "::add-mask::$GOOGLE_TOKEN"
          FCM_STATUS="$(curl -sS --max-time 30 -o /tmp/fcm.json -w '%{http_code}' \
            -X POST 'https://fcm.googleapis.com/v1/projects/bao-hang-1291/messages:send' \
            -H 'content-type: application/json' \
            -H "Authorization: Bearer $GOOGLE_TOKEN" \
            --data-binary '{"validate_only":true,"message":{"token":"runtime-smoke-invalid-token","data":{"smoke":"true"}}}')"
          if [ "$FCM_STATUS" = '401' ] || [ "$FCM_STATUS" = '403' ]; then
            jq '{error:{code:.error.code,status:.error.status,message:.error.message}}' /tmp/fcm.json >&2
            exit 1
          fi
          echo "Firebase OAuth + FCM HTTP v1: reachable (HTTP $FCM_STATUS)"
