name: Deploy notification consolidation once

on:
  push:
    branches:
      - target-final-20260814-impl

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: oedasgcdjppjwidhlqdr
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
      - name: Validate credential
        run: test -n "${SUPABASE_ACCESS_TOKEN:-}"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Android API only
        run: supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Restore picker result worker only
        run: supabase functions deploy notification-worker --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Remove one-shot workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(gh api repos/tam95supra-source/bao-hang-1291/contents/.github/workflows/deploy-notify-consolidation-once.yml?ref=target-final-20260814-impl --jq .sha)"
          gh api -X DELETE repos/tam95supra-source/bao-hang-1291/contents/.github/workflows/deploy-notify-consolidation-once.yml -f message='ops: remove notify deploy workflow' -f sha="$SHA" -f branch='target-final-20260814-impl'
