name: Temp cutover CI patch
on:
  push:
    branches: [migration/neon-cutover]
    paths: ['.github/workflows/temp-cutover-ci-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
          fetch-depth: 0
      - name: Wire production Apps Script URL into signed Android builds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/production-release.yml')
          s=p.read_text(encoding='utf-8')
          old="""    env:\n      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}\n      GH_TOKEN: ${{ github.token }}\n"""
          new="""    env:\n      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}\n      APPS_SCRIPT_WORKER_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}\n      GH_TOKEN: ${{ github.token }}\n"""
          if s.count(old)!=1:
              raise SystemExit('release job env anchor mismatch')
          s=s.replace(old,new)
          anchor="""          RELEASE_STORE_PASSWORD=\"$(cat \"$RUNNER_TEMP/release-store-password\")\"\n          RELEASE_KEY_PASSWORD=\"$(cat \"$RUNNER_TEMP/release-key-password\")\"\n          echo \"::add-mask::$RELEASE_STORE_PASSWORD\"\n          echo \"::add-mask::$RELEASE_KEY_PASSWORD\"\n"""
          repl=anchor+"""          test -n \"${APPS_SCRIPT_WORKER_URL:-}\" || { echo 'Missing Apps Script worker URL' >&2; exit 1; }\n          case \"$APPS_SCRIPT_WORKER_URL\" in https://script.google.com/macros/s/*/exec) ;; *) echo 'Invalid Apps Script worker URL' >&2; exit 1;; esac\n"""
          if s.count(anchor)!=1:
              raise SystemExit('release build anchor mismatch')
          s=s.replace(anchor,repl)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'APPS_SCRIPT_WORKER_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}' .github/workflows/production-release.yml
          grep -Fq "Missing Apps Script worker URL" .github/workflows/production-release.yml
      - name: Commit cutover CI fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tam95supra-source'
          git config user.email 'tam95.supra@gmail.com'
          git add .github/workflows/production-release.yml
          git commit -m 'ci(cutover): inject Apps Script worker URL into OTA builds'
          git push origin HEAD:migration/neon-cutover
