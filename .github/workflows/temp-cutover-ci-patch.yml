name: Temp cutover CI patch
on:
  push:
    branches: [migration/neon-cutover]
    paths: ['.github/workflows/temp-cutover-ci-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
          fetch-depth: 0
      - name: Wire production Apps Script URL into signed Android builds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/production-release.yml')
          lines=p.read_text(encoding='utf-8').splitlines()
          if any('APPS_SCRIPT_WORKER_URL:' in x for x in lines):
              raise SystemExit('worker URL env already present unexpectedly')
          idx=[i for i,x in enumerate(lines) if x.startswith('      FIREBASE_SERVICE_ACCOUNT:')]
          if len(idx)!=1:
              raise SystemExit(f'expected one Firebase job env, got {len(idx)}')
          expression='$'+'{{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}'
          lines.insert(idx[0]+1, '      APPS_SCRIPT_WORKER_URL: '+expression)
          s='\n'.join(lines)+'\n'
          anchor='          echo "::add-mask::$RELEASE_KEY_PASSWORD"\n'
          check='''          test -n "${APPS_SCRIPT_WORKER_URL:-}" || { echo 'Missing Apps Script worker URL' >&2; exit 1; }\n          case "$APPS_SCRIPT_WORKER_URL" in https://script.google.com/macros/s/*/exec) ;; *) echo 'Invalid Apps Script worker URL' >&2; exit 1;; esac\n'''
          if s.count(anchor)!=1:
              raise SystemExit('release build anchor mismatch')
          s=s.replace(anchor,anchor+check)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -Fq 'APPS_SCRIPT_WORKER_URL:' .github/workflows/production-release.yml
          grep -Fq 'GOOGLE_SHEET_WEBHOOK_URL' .github/workflows/production-release.yml
          grep -Fq 'Missing Apps Script worker URL' .github/workflows/production-release.yml
      - name: Commit cutover CI fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tam95supra-source'
          git config user.email 'tam95.supra@gmail.com'
          git add .github/workflows/production-release.yml
          git commit -m 'ci(cutover): inject Apps Script worker URL into OTA builds'
          git push origin HEAD:migration/neon-cutover
