name: Apply Apps Script signing fallback fix

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - 'scripts/fix_apps_script_signing_secret.py'
      - '.github/workflows/apply-apps-script-signing-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - run: python3 scripts/fix_apps_script_signing_secret.py
      - run: |
          set -euo pipefail
          cp google-apps-script/Code.gs "$RUNNER_TEMP/Code.js"
          node --check "$RUNNER_TEMP/Code.js"
          git diff --check
      - name: Keep workflow connector-owned
        run: git checkout HEAD -- .github/workflows/apply-apps-script-signing-fix.yml
      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: share server fallback signing secret contract'
          git push origin HEAD:target-final-20260814-impl
