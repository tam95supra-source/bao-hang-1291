name: Branch Web Feature Check
on:
  push:
    branches:
      - feat/web-logs-i18n-skip-policy-20260903
    paths:
      - 'web-admin/**'
      - 'google-apps-script/**'
      - 'ops/neon/20260904_auto_skip_found_item_reminder.sql'
      - '.github/workflows/branch-web-feature-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for f in web-admin/src/i18n.js web-admin/src/web-logger.js web-admin/src/backend-runtime.js web-admin/src/main.js web-admin/src/ops-console.js web-admin/src/web-fast-ui.js web-admin/src/warehouse-ui-v2.js web-admin/src/config-live.js; do
            node --check "$f"
          done
          cp google-apps-script/DEPLOY_NEON.gs "$RUNNER_TEMP/DEPLOY_NEON.js"
          node --check "$RUNNER_TEMP/DEPLOY_NEON.js"
          ! grep -RInF 'Bỏ qua_ALLOWED' web-admin/src
          ! grep -RInE 'status\.Bỏ|status === .Bỏ|data-update=.Bỏ' web-admin/src
          grep -F "SKIP_ALLOWED" web-admin/src/web-fast-ui.js >/dev/null
          grep -F "SKIP_ALLOWED" web-admin/src/warehouse-ui-v2.js >/dev/null
          grep -F "upload-web-log" google-apps-script/DEPLOY_NEON.gs >/dev/null
          grep -F "ĐÃ TÌM THẤY HÀNG" web-admin/src/web-fast-ui.js >/dev/null
          grep -F "found_item_reminder_minutes" web-admin/src/ops-console.js >/dev/null
      - name: Build Web Admin
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build
          test -f web-admin/dist/index.html
          ! grep -R -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|service_role' web-admin/dist
          grep -R -F 'upload-web-log' web-admin/dist >/dev/null
          grep -R -F 'English' web-admin/dist >/dev/null
          echo BRANCH_WEB_FEATURE_CHECK=PASS
