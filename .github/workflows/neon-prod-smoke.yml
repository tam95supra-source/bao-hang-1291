name: Neon production Firebase JWT smoke

on:
  push:
    branches: [migration/neon-cutover]
    paths:
      - '.github/workflows/neon-prod-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Public-repo standard runner; no cache/artifacts. Temporary Firebase user is deleted in trap.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT: bao-hang-1291
      TEST_UID: 56b6ca48-8034-42a1-8b93-d494d8e40912
      TEST_CODE: e2eprod0817
      NEON_API: https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1
    steps:
      - uses: actions/checkout@v4

      - name: Verify production target and Firebase JWT authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          test "$FIREBASE_PROJECT" = 'bao-hang-1291'
          case "$NEON_API" in
            https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1) ;;
            *) echo 'Unexpected Neon production Data API target' >&2; exit 1 ;;
          esac
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}" || { echo 'Missing FIREBASE_SERVICE_ACCOUNT' >&2; exit 1; }

          api_key="$(jq -er '.client[0].api_key[0].current_key' app/google-services.json)"
          project_id="$(jq -er '.project_info.project_id' app/google-services.json)"
          test "$project_id" = "$FIREBASE_PROJECT"
          email="${TEST_CODE}@bao-hang-1291.local"
          password="$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 28)Aa1"
          echo "::add-mask::$password"

          work="$RUNNER_TEMP/neon-prod-smoke"
          mkdir -p "$work"
          chmod 700 "$work"
          key_file="$work/service-account-key.pem"
          jq -er '.private_key' <<<"$FIREBASE_SERVICE_ACCOUNT" > "$key_file"
          chmod 600 "$key_file"
          client_email="$(jq -er '.client_email' <<<"$FIREBASE_SERVICE_ACCOUNT")"
          sa_project="$(jq -er '.project_id' <<<"$FIREBASE_SERVICE_ACCOUNT")"
          test "$sa_project" = "$FIREBASE_PROJECT"

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          exp="$((now + 3000))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(jq -cn --arg iss "$client_email" --arg scope 'https://www.googleapis.com/auth/identitytoolkit' --arg aud 'https://oauth2.googleapis.com/token' --argjson iat "$now" --argjson exp "$exp" '{iss:$iss,scope:$scope,aud:$aud,iat:$iat,exp:$exp}' | b64url)"
          unsigned="$header.$payload"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" | b64url)"
          assertion="$unsigned.$signature"
          oauth_json="$(curl -fsS --retry 2 --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' --data-urlencode "assertion=$assertion" https://oauth2.googleapis.com/token)"
          access_token="$(jq -er '.access_token' <<<"$oauth_json")"
          echo "::add-mask::$access_token"

          cleanup() {
            curl -sS --retry 1 -X POST "https://identitytoolkit.googleapis.com/v1/projects/${FIREBASE_PROJECT}/accounts:batchDelete" \
              -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' \
              -d "$(jq -cn --arg uid "$TEST_UID" '{localIds:[$uid],force:true}')" >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT

          # Idempotent cleanup from any interrupted prior run.
          curl -sS --retry 1 -X POST "https://identitytoolkit.googleapis.com/v1/projects/${FIREBASE_PROJECT}/accounts:batchDelete" \
            -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg uid "$TEST_UID" '{localIds:[$uid],force:true}')" >/dev/null || true

          create_json="$(curl -fsS --retry 2 -X POST "https://identitytoolkit.googleapis.com/v1/projects/${FIREBASE_PROJECT}/accounts?key=${api_key}" \
            -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg uid "$TEST_UID" --arg email "$email" --arg password "$password" '{localId:$uid,email:$email,password:$password,emailVerified:true,displayName:"E2E Neon Production"}')")"
          test "$(jq -er '.localId' <<<"$create_json")" = "$TEST_UID"

          claims='{"role":"authenticated","app_role":"PICKER","employee_code":"e2eprod0817"}'
          update_json="$(curl -fsS --retry 2 -X POST "https://identitytoolkit.googleapis.com/v1/projects/${FIREBASE_PROJECT}/accounts:update?key=${api_key}" \
            -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg uid "$TEST_UID" --arg claims "$claims" '{localId:$uid,customAttributes:$claims,returnSecureToken:false}')")"
          test "$(jq -er '.localId' <<<"$update_json")" = "$TEST_UID"

          login_json="$(curl -fsS --retry 2 -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${api_key}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg email "$email" --arg password "$password" '{email:$email,password:$password,returnSecureToken:true}')")"
          id_token="$(jq -er '.idToken' <<<"$login_json")"
          echo "::add-mask::$id_token"

          call_rpc() {
            local rpc="$1" body="$2" out="$3"
            curl -sS --retry 2 -o "$out" -w '%{http_code}' -X POST "$NEON_API/rpc/$rpc" \
              -H "Authorization: Bearer $id_token" -H 'Content-Type: application/json' -d "$body"
          }

          session_code="$(call_rpc api_session_profile_rpc '{"p_test_role":null}' "$work/session.json")"
          test "$session_code" = '200' || { cat "$work/session.json"; exit 1; }
          test "$(jq -er '.profile.employee_code' "$work/session.json")" = "$TEST_CODE"
          test "$(jq -er '.profile.role' "$work/session.json")" = 'PICKER'

          search_code="$(call_rpc api_search_skus_rpc '{"p_query":"__E2E_NO_MATCH__","p_limit":3,"p_test_role":null}' "$work/search.json")"
          test "$search_code" = '200' || { cat "$work/search.json"; exit 1; }

          profile_code="$(curl -sS --retry 2 -o "$work/profile.json" -w '%{http_code}' "$NEON_API/profiles?id=eq.${TEST_UID}&select=id,employee_code,role,active" -H "Authorization: Bearer $id_token")"
          test "$profile_code" = '200' || { cat "$work/profile.json"; exit 1; }
          test "$(jq -er 'length' "$work/profile.json")" = '1'
          test "$(jq -er '.[0].employee_code' "$work/profile.json")" = "$TEST_CODE"

          issues_code="$(curl -sS --retry 2 -o "$work/issues.json" -w '%{http_code}' "$NEON_API/issues?select=id&limit=1" -H "Authorization: Bearer $id_token")"
          test "$issues_code" != '200' || { echo 'Direct issues table access unexpectedly allowed' >&2; exit 1; }

          worker_code="$(call_rpc worker_tick_rpc '{}' "$work/worker.json")"
          test "$worker_code" != '200' || { echo 'Picker unexpectedly executed worker RPC' >&2; exit 1; }
          grep -F 'WORKER_ADMIN_REQUIRED' "$work/worker.json" >/dev/null

          admin_code="$(call_rpc api_admin_summary_rpc '{"p_test_role":null}' "$work/admin.json")"
          test "$admin_code" != '200' || { echo 'Picker unexpectedly executed admin summary' >&2; exit 1; }

          echo 'Neon production Data API Firebase JWT smoke PASS'
          echo 'PASS: Firebase token accepted; profile self-read allowed; canonical RPC allowed; direct business table denied; worker/admin privilege denied.'
