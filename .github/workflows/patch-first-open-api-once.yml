name: Consolidate first-open notification source once

on:
  push:
    branches:
      - target-final-20260814-impl

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - name: Apply API patch
        run: python3 scripts/ops_patch_first_open_api_20260815.py
      - name: Commit and cleanup one-shot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/api/index.ts
          git rm scripts/ops_patch_first_open_api_20260815.py .github/workflows/patch-first-open-api-once.yml
          git commit -m 'fix(notify): alert handlers only on first SKU report'
          git push origin HEAD:target-final-20260814-impl
