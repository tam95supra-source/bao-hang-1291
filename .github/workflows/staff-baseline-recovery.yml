name: Guarded Staff Baseline Recovery (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify canonical staff contract and retired 502 recovery
        shell: bash
        run: |
          set -euo pipefail
          node ops/staff_recover_current_source.cjs 2>&1 | tee "$RUNNER_TEMP/staff-recovery-retired.log"
          grep -F 'STAFF_SOURCE_CONTRACT=1291_HY1' "$RUNNER_TEMP/staff-recovery-retired.log" >/dev/null
          grep -F 'LEGACY_502_RECOVERY_RETIRED=PASS' "$RUNNER_TEMP/staff-recovery-retired.log" >/dev/null
          echo 'STAFF_BASELINE_RECOVERY_RETIRED=PASS'
