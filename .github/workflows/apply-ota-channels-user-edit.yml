              }

              private fun editUser(user: UserProfile, refresh: () -> Unit) {
                  val effective = app.session.effectiveRole
                  val allowedRoles = when {
                      user.role == UserRole.ADMIN -> listOf(UserRole.ADMIN)
                      effective == UserRole.ADMIN -> listOf(UserRole.ADMIN_INVENT, UserRole.INVENT, UserRole.PICKER)
                      else -> listOf(UserRole.INVENT, UserRole.PICKER)
                  }
                  val wrap = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(8), dp(20), 0) }
                  fun field(hintText: String, value: String): EditText = EditText(this).apply {
                      hint = hintText
                      setText(value)
                      wrap.addView(this)
                  }
                  val employeeCode = field("Mã nhân viên", user.employeeCode)
                  val fullName = field("Họ tên", user.fullName)
                  val contractor = field("Nhà thầu", user.contractor)
                  val roleField = AutoCompleteTextView(this).apply {
                      hint = "Quyền"
                      threshold = 0
                      setText(user.role.wire, false)
                      setAdapter(ArrayAdapter(this@MainActivity, android.R.layout.simple_dropdown_item_1line, allowedRoles.map { it.wire }))
                      setOnClickListener { showDropDown() }
                      isEnabled = user.role != UserRole.ADMIN
                      wrap.addView(this)
                  }
                  val active = CheckBox(this).apply {
                      text = "Tài khoản đang hoạt động"
                      isChecked = user.active
                      isEnabled = user.role != UserRole.ADMIN
                      wrap.addView(this)
                  }
                  val password = EditText(this).apply {
                      hint = "Mật khẩu mới (để trống nếu giữ nguyên)"
                      inputType = android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD
                      wrap.addView(this)
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Chỉnh sửa ${user.employeeCode}")
                      .setView(wrap)
                      .setNegativeButton("HỦY", null)
                      .setPositiveButton("LƯU") { _, _ ->
                          val roleWire = roleField.text.toString().trim().uppercase()
                          val selectedRole = allowedRoles.firstOrNull { it.wire == roleWire }
                          if (selectedRole == null) {
                              toast("Quyền không hợp lệ")
                              return@setPositiveButton
                          }
                          lifecycleScope.launch {
                              runCatching {
                                  app.repository.updateUser(
                                      user,
                                      employeeCode.text.toString().trim(),
                                      fullName.text.toString().trim(),
                                      contractor.text.toString().trim(),
                                      selectedRole,
                                      active.isChecked,
                                      password.text.toString()
                                  )
                              }.onSuccess { updated ->
                                  toast("Đã cập nhật ${updated.employeeCode}")
                                  if (updated.id == app.session.profile?.id) runCatching { app.repository.refreshProfile() }
                                  refresh()
                              }.onFailure { error -> toast(error.message ?: "Không cập nhật được nhân sự") }
                          }
                      }
                      .show()
              }

          '''.replace('\n              ', '\n')
          replace('app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt',
          '''    private fun showReports() {''', users_block + '''    private fun showReports() {''')

          # --- Backend user management with privilege boundaries ---
          api_path = Path('supabase/functions/api/index.ts')
          api_text = api_path.read_text()
          marker = '''async function syncSheet() {'''
          if api_text.count(marker) != 1:
              raise SystemExit('api syncSheet marker mismatch')
          helper = r'''
          async function listUsers(context: Context) {
            requireRole(context, ["ADMIN", "ADMIN_INVENT"]);
            const { data, error, count } = await admin.from("profiles").select("id,employee_code,full_name,contractor,role,active", { count: "exact" }).order("employee_code").limit(2000);
            if (error) throw error;
            if ((count ?? 0) > 2000) throw new HttpError(409, "Số nhân sự vượt giới hạn 2000 tài khoản");
            return { users: data ?? [], count: count ?? 0 };
          }

          async function updateManagedUser(context: Context, body: Record<string, unknown>) {
            requireRole(context, ["ADMIN", "ADMIN_INVENT"]);
            const targetId = required(body.id, "User ID");
            const { data: target, error: targetError } = await admin.from("profiles").select("id,employee_code,full_name,contractor,role,active").eq("id", targetId).single();
            if (targetError || !target) throw new HttpError(404, "Không tìm thấy tài khoản");
            if (context.effectiveRole === "ADMIN_INVENT" && !["INVENT", "PICKER"].includes(target.role)) throw new HttpError(403, "Admin Invent chỉ được sửa tài khoản Báo hàng Invent hoặc Người lấy hàng");

            const employeeCode = required(body.employee_code, "Mã nhân viên");
            const fullName = required(body.full_name, "Họ tên");
            const contractor = String(body.contractor ?? "").trim();
            const role = String(body.role ?? target.role).trim().toUpperCase() as Role;
            const active = typeof body.active === "boolean" ? body.active : Boolean(target.active);
            const newPassword = String(body.new_password ?? "");
            if (!["ADMIN", "ADMIN_INVENT", "INVENT", "PICKER"].includes(role)) throw new HttpError(400, "Quyền không hợp lệ");
            if (newPassword && newPassword.length < 8) throw new HttpError(400, "Mật khẩu mới cần ít nhất 8 ký tự");

            if (target.role === "ADMIN") {
              if (context.effectiveRole !== "ADMIN") throw new HttpError(403, "Tài khoản ADMIN được bảo vệ");
              if (role !== "ADMIN" || !active) throw new HttpError(409, "ADMIN_PROTECTED");
            } else {
              if (role === "ADMIN") throw new HttpError(409, "ADMIN_ALREADY_EXISTS");
              if (context.effectiveRole === "ADMIN_INVENT" && !["INVENT", "PICKER"].includes(role)) throw new HttpError(403, "Admin Invent không được cấp quyền cao hơn quyền của mình");
            }

            if (employeeCode.toLowerCase() !== String(target.employee_code).toLowerCase()) {
              const { data: duplicate, error: duplicateError } = await admin.from("profiles").select("id").ilike("employee_code", employeeCode).neq("id", targetId).maybeSingle();
              if (duplicateError) throw duplicateError;
              if (duplicate) throw new HttpError(409, "Mã nhân viên đã tồn tại");
            }

            const values = { employee_code: employeeCode, full_name: fullName, contractor, role, active, updated_at: new Date().toISOString() };
            const { data: updated, error: updateError } = await admin.from("profiles").update(values).eq("id", targetId).select("id,employee_code,full_name,contractor,role,active").single();
            if (updateError || !updated) throw updateError ?? new Error("Không cập nhật được hồ sơ");

            const authValues: { email?: string; password?: string } = {};
            if (employeeCode.toLowerCase() !== String(target.employee_code).toLowerCase()) authValues.email = employeeEmail(employeeCode);
            if (newPassword) authValues.password = newPassword;
            if (Object.keys(authValues).length) {
              const { error: authError } = await admin.auth.admin.updateUserById(targetId, authValues);
              if (authError) {
                await admin.from("profiles").update({ employee_code: target.employee_code, full_name: target.full_name, contractor: target.contractor, role: target.role, active: target.active, updated_at: new Date().toISOString() }).eq("id", targetId);
                throw authError;
              }
            }
            const { error: queueError } = await admin.from("sheet_export_queue").insert({ event_type: "USER_UPSERT", payload: values });
            if (queueError) console.warn("USER_UPSERT queue deferred", errorText(queueError));
            return { profile: updated };
          }

          '''.replace('\n          ', '\n').lstrip()
          api_path.write_text(api_text.replace(marker, helper + marker, 1))

          replace('supabase/functions/api/index.ts',
          '''    case "import-skus": { requireRole(context, ["ADMIN", "ADMIN_INVENT"]);''',
          '''    case "list-users": return listUsers(context);
              case "update-user": return updateManagedUser(context, body);
              case "import-skus": { requireRole(context, ["ADMIN", "ADMIN_INVENT"]);''')

          replace('supabase/functions/web-api/index.ts',
          '''  "import-skus", "import-users", "sync-google-sheet", "reports-summary", "issue-history", "audit-history",''',
          '''  "import-skus", "import-users", "list-users", "update-user", "sync-google-sheet", "reports-summary", "issue-history", "audit-history",''')

          # --- Web: Admin Invent gets direct user editor too; import remains ADMIN-only ---
          replace('web-admin/src/main.js',
          '''const state = { session: null, testRole: null, selectedSku: null, pollTimer: null, activeTab: null };''',
          '''const state = { session: null, testRole: null, selectedSku: null, pollTimer: null, activeTab: null, managedUsers: [] };''')
          replace('web-admin/src/main.js',
          '''if(r==='ADMIN_INVENT')return[['overview','Tổng quan'],['operations','Báo hàng'],['reports','Báo cáo'],['logs','Log'],['sku','SKU']];''',
          '''if(r==='ADMIN_INVENT')return[['overview','Tổng quan'],['operations','Báo hàng'],['reports','Báo cáo'],['logs','Log'],['sku','SKU'],['users','Nhân sự']];''')

          web = Path('web-admin/src/main.js')
          text = web.read_text()
          start = text.index('function renderUsers(){')
          end = text.index('async function previewUsers', start)
          new_users = r'''function renderUsers(){
            const canImport=role()==='ADMIN';
            $('#content').innerHTML=`<div class="heading"><div><p class="eyebrow">NHÂN SỰ</p><h2>Quản lý tài khoản</h2></div><button id="refreshUsers" class="secondary">Làm mới</button></div><div class="card"><p class="muted">Admin sửa mọi tài khoản; ADMIN duy nhất vẫn được bảo vệ. Admin Invent chỉ sửa tài khoản Báo hàng Invent và Người lấy hàng.</p><div id="managedUsers"></div></div>${canImport?`<div class="heading compact"><h3>Import nhân sự</h3><button id="userTemplate" class="secondary">Tải file mẫu</button></div><div class="card"><input id="userFile" type="file" accept=".xlsx"><p class="muted">Vai trò import: ADMIN_INVENT, INVENT, PICKER. ADMIN hiện tại không thể tạo thêm, hạ quyền hoặc vô hiệu hóa.</p><div id="userMsg" class="message" hidden></div></div><div id="userPreview"></div>`:''}`;
            $('#refreshUsers').onclick=loadManagedUsers;
            if(canImport){$('#userFile').onchange=e=>previewUsers(e.target.files?.[0]);$('#userTemplate').onclick=downloadUserTemplate;}
            loadManagedUsers();
          }
          async function loadManagedUsers(){
            try{const d=await api('list-users');state.managedUsers=d.users||[];$('#managedUsers').innerHTML=state.managedUsers.map(u=>{const editable=role()==='ADMIN'||(role()==='ADMIN_INVENT'&&['INVENT','PICKER'].includes(u.role));return`<div class="row"><span><strong>${escapeHtml(u.employee_code)} · ${escapeHtml(u.full_name)}</strong><br><small>${escapeHtml(ROLES[u.role]||u.role)} · ${u.active?'Đang hoạt động':'Đã khóa'}${u.contractor?` · ${escapeHtml(u.contractor)}`:''}</small></span>${editable?`<button class="secondary" data-edit-user="${u.id}">Chỉnh sửa</button>`:''}</div>`;}).join('')||'<span class="muted">Chưa có tài khoản.</span>';$$('[data-edit-user]').forEach(b=>b.onclick=()=>openUserEditor(b.dataset.editUser));}catch(e){$('#managedUsers').innerHTML=`<div class="message" data-type="error">${escapeHtml(e.message)}</div>`;}}
          }
          function openUserEditor(id){
            const u=state.managedUsers.find(x=>x.id===id);if(!u)return;const allowed=u.role==='ADMIN'?['ADMIN']:(role()==='ADMIN'?['ADMIN_INVENT','INVENT','PICKER']:['INVENT','PICKER']);
            document.body.insertAdjacentHTML('beforeend',`<div class="alert-modal" id="userEditorModal"><div class="card"><p class="eyebrow">CHỈNH SỬA NHÂN SỰ</p><h2>${escapeHtml(u.employee_code)}</h2><form id="editUserForm" class="form-grid"><label>Mã nhân viên<input id="editCode" value="${escapeHtml(u.employee_code)}" required></label><label>Họ tên<input id="editName" value="${escapeHtml(u.full_name)}" required></label><label>Nhà thầu<input id="editContractor" value="${escapeHtml(u.contractor||'')}"></label><label>Quyền<select id="editRole" ${u.role==='ADMIN'?'disabled':''}>${allowed.map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${escapeHtml(ROLES[r]||r)}</option>`).join('')}</select></label><label><input id="editActive" type="checkbox" ${u.active?'checked':''} ${u.role==='ADMIN'?'disabled':''}> Tài khoản đang hoạt động</label><label>Mật khẩu mới<input id="editPassword" type="password" placeholder="Để trống nếu giữ nguyên"></label><div class="actions span"><button type="button" id="cancelUserEdit" class="secondary">HỦY</button><button class="primary">LƯU</button></div><div id="editUserMsg" class="message span" hidden></div></form></div></div>`);
            $('#cancelUserEdit').onclick=()=>$('#userEditorModal')?.remove();
            $('#editUserForm').onsubmit=async e=>{e.preventDefault();try{setBusy(true,'Đang cập nhật nhân sự…');await api('update-user',{id:u.id,employee_code:$('#editCode').value.trim(),full_name:$('#editName').value.trim(),contractor:$('#editContractor').value.trim(),role:$('#editRole').value||u.role,active:u.role==='ADMIN'?true:$('#editActive').checked,new_password:$('#editPassword').value});$('#userEditorModal')?.remove();await loadManagedUsers();}catch(err){message('#editUserMsg',err.message,'error');}finally{setBusy(false);}};
          }

          '''.replace('\n          ', '\n')
          web.write_text(text[:start] + new_users + text[end:])

          # --- Channel-aware signed release workflow ---
          Path('.github/workflows/production-release.yml').write_text(r'''name: Production OTA release

          on:
            push:
              branches: [main]
              paths:
                - 'ops/release-request.json'

          permissions:
            contents: write

          concurrency:
            group: production-ota-release
            cancel-in-progress: false

          jobs:
            release:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              env:
                FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                GH_TOKEN: ${{ github.token }}
              steps:
                - uses: actions/checkout@v6
                  with:
                    fetch-depth: 0

                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'

                - uses: gradle/actions/setup-gradle@v6
                  with:
                    gradle-version: '8.9'
                    cache-disabled: true

                - name: Validate release request and channel monotonicity
                  id: request
                  shell: bash
                  run: |
                    set -euo pipefail
                    request='ops/release-request.json'
                    test -s "$request"
                    jq -e . "$request" >/dev/null
                    jq -e '(.channel | type) == "string"' "$request" >/dev/null
                    jq -e '(.versionName | type) == "string"' "$request" >/dev/null
                    jq -e '(.versionCode | type) == "number" and (.versionCode > 0) and (.versionCode == (.versionCode | floor))' "$request" >/dev/null
                    jq -e '(.mandatory | type) == "boolean"' "$request" >/dev/null
                    jq -e '((.releaseNotes // "") | type) == "string"' "$request" >/dev/null
                    jq -e '((.action // "publish") | type) == "string"' "$request" >/dev/null

                    action="$(jq -r '.action // "publish"' "$request")"
                    channel="$(jq -r '.channel' "$request" | tr '[:upper:]' '[:lower:]')"
                    version_name="$(jq -r '.versionName' "$request")"
                    version_code="$(jq -r '.versionCode' "$request")"
                    mandatory="$(jq -r '.mandatory' "$request")"

                    [[ "$action" = 'validate' || "$action" = 'publish' ]] || { echo 'action must be validate or publish' >&2; exit 1; }
                    [[ "$channel" = 'stable' || "$channel" = 'beta' ]] || { echo 'channel must be stable or beta' >&2; exit 1; }
                    [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                    [[ "$version_code" =~ ^[1-9][0-9]*$ ]]

                    tag="$channel-v$version_name"
                    apk_name="bao-hang-1291-$channel-$version_name.apk"
                    pointer="ota/$channel/release-manifest.json"
                    if test "$action" = 'publish' && gh release view "$tag" >/dev/null 2>&1; then
                      echo "Release $tag already exists; refusing overwrite." >&2
                      exit 1
                    fi
                    if test -s "$pointer"; then
                      previous_channel="$(jq -r '.channel // empty' "$pointer")"
                      previous_code="$(jq -r '.versionCode // 0' "$pointer")"
                      test "$previous_channel" = "$channel"
                      [[ "$previous_code" =~ ^[0-9]+$ ]]
                      (( version_code > previous_code )) || { echo "versionCode must be greater than current $channel $previous_code" >&2; exit 1; }
                    fi

                    {
                      echo "action=$action"
                      echo "channel=$channel"
                      echo "version_name=$version_name"
                      echo "version_code=$version_code"
                      echo "mandatory=$mandatory"
                      echo "tag=$tag"
                      echo "apk_name=$apk_name"
                      echo "pointer=$pointer"
                    } >> "$GITHUB_OUTPUT"

                - name: Restore and verify permanent signing key
                  id: signing
                  shell: bash
                  run: |
                    set -euo pipefail
                    umask 077
                    test -s signing/production-signing.bundle.enc
                    test -s signing/production-cert-sha256.txt
                    test "$(cat signing/wrap-scheme.txt)" = 'firebase-service-account-private-key-v1'
                    test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
                    work="$RUNNER_TEMP/production-signing"
                    mkdir -p "$work/plain"
                    firebase_private_key="$(jq -er '.private_key' <<<"$FIREBASE_SERVICE_ACCOUNT")"
                    wrap_key="$({ printf '%s\0' "$firebase_private_key"; printf '%s' "$GITHUB_REPOSITORY"; } | sha256sum | awk '{print $1}')"
                    echo "::add-mask::$wrap_key"
                    WRAP_KEY="$wrap_key" openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -md sha256 -pass env:WRAP_KEY -in signing/production-signing.bundle.enc -out "$work/signing.tar"
                    tar -C "$work/plain" -xf "$work/signing.tar"
                    test -s "$work/plain/bao-hang-1291-production.p12"
                    test -s "$work/plain/signing.properties"
                    source "$work/plain/signing.properties"
                    echo "::add-mask::$RELEASE_STORE_PASSWORD"
                    echo "::add-mask::$RELEASE_KEY_PASSWORD"
                    pinned="$(tr -d '[:space:]' < signing/production-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
                    keytool -list -v -keystore "$work/plain/bao-hang-1291-production.p12" -storetype PKCS12 -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" 2>/dev/null > "$work/keytool.txt"
                    actual="$(sed -n 's/^.*SHA256: //p' "$work/keytool.txt" | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
                    [[ "$pinned" =~ ^[0-9a-f]{64}$ ]]
                    test "$actual" = "$pinned"
                    {
                      echo "store_file=$work/plain/bao-hang-1291-production.p12"
                      echo "key_alias=$RELEASE_KEY_ALIAS"
                      echo "pinned_fingerprint=$pinned"
                    } >> "$GITHUB_OUTPUT"
                    printf '%s' "$RELEASE_STORE_PASSWORD" > "$RUNNER_TEMP/release-store-password"
                    printf '%s' "$RELEASE_KEY_PASSWORD" > "$RUNNER_TEMP/release-key-password"
                    chmod 600 "$RUNNER_TEMP/release-store-password" "$RUNNER_TEMP/release-key-password"

                - name: Test, build, sign and verify channel APK
                  id: build
                  shell: bash
                  env:
                    RELEASE_STORE_FILE: ${{ steps.signing.outputs.store_file }}
                    RELEASE_KEY_ALIAS: ${{ steps.signing.outputs.key_alias }}
                    VERSION_NAME: ${{ steps.request.outputs.version_name }}
                    VERSION_CODE: ${{ steps.request.outputs.version_code }}
                    OTA_CHANNEL: ${{ steps.request.outputs.channel }}
                    APK_NAME: ${{ steps.request.outputs.apk_name }}
                    PINNED_FINGERPRINT: ${{ steps.signing.outputs.pinned_fingerprint }}
                  run: |
                    set -euo pipefail
                    RELEASE_STORE_PASSWORD="$(cat "$RUNNER_TEMP/release-store-password")"
                    RELEASE_KEY_PASSWORD="$(cat "$RUNNER_TEMP/release-key-password")"
                    echo "::add-mask::$RELEASE_STORE_PASSWORD"
                    echo "::add-mask::$RELEASE_KEY_PASSWORD"
                    RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
                      gradle --no-daemon testReleaseUnitTest assembleRelease -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" -POTA_CHANNEL="$OTA_CHANNEL"
                    apk='app/build/outputs/apk/release/app-release.apk'
                    test -s "$apk"
                    apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
                    apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -111 | sort -V | tail -n1)"
                    test -x "$apksigner"
                    test -x "$apkanalyzer"
                    "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
                    actual_fingerprint="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
                    test "$actual_fingerprint" = "$PINNED_FINGERPRINT"
                    package_name="$("$apkanalyzer" manifest application-id "$apk")"
                    apk_version_code="$("$apkanalyzer" manifest version-code "$apk")"
                    apk_version_name="$("$apkanalyzer" manifest version-name "$apk")"
                    test "$package_name" = 'vn.pickpack1291.baohang'
                    test "$apk_version_code" = "$VERSION_CODE"
                    test "$apk_version_name" = "$VERSION_NAME"
                    "$apkanalyzer" manifest print "$apk" > "$RUNNER_TEMP/manifest.xml"
                    grep -F 'vn.pickpack1291.baohang.OTA_CHANNEL' "$RUNNER_TEMP/manifest.xml" >/dev/null
                    grep -F "$OTA_CHANNEL" "$RUNNER_TEMP/manifest.xml" >/dev/null
                    grep -R -F "OTA_CHANNEL = \"$OTA_CHANNEL\"" app/build/generated/source/buildConfig/release >/dev/null
                    echo "Verified package=$package_name version=$apk_version_name($apk_version_code) channel=$OTA_CHANNEL"
                    release_dir="$RUNNER_TEMP/release-assets"
                    mkdir -p "$release_dir"
                    cp "$apk" "$release_dir/$APK_NAME"
                    apk_sha256="$(sha256sum "$release_dir/$APK_NAME" | awk '{print $1}')"
                    echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
                    echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"

                - name: Record validation proof
                  if: steps.request.outputs.action == 'validate'
                  shell: bash
                  env:
                    CHANNEL: ${{ steps.request.outputs.channel }}
                    VERSION_NAME: ${{ steps.request.outputs.version_name }}
                    VERSION_CODE: ${{ steps.request.outputs.version_code }}
                    APK_SHA256: ${{ steps.build.outputs.apk_sha256 }}
                    SIGNER_SHA256: ${{ steps.signing.outputs.pinned_fingerprint }}
                  run: |
                    set -euo pipefail
                    echo "Production validation PASS channel=$CHANNEL version=$VERSION_NAME code=$VERSION_CODE"
                    echo "APK SHA-256: $APK_SHA256"
                    echo "Signer SHA-256: $SIGNER_SHA256"

                - name: Publish verified channel OTA release
                  if: steps.request.outputs.action == 'publish'
                  shell: bash
                  env:
                    CHANNEL: ${{ steps.request.outputs.channel }}
                    VERSION_NAME: ${{ steps.request.outputs.version_name }}
                    VERSION_CODE: ${{ steps.request.outputs.version_code }}
                    MANDATORY: ${{ steps.request.outputs.mandatory }}
                    TAG: ${{ steps.request.outputs.tag }}
                    APK_NAME: ${{ steps.request.outputs.apk_name }}
                    POINTER: ${{ steps.request.outputs.pointer }}
                    RELEASE_DIR: ${{ steps.build.outputs.release_dir }}
                    APK_SHA256: ${{ steps.build.outputs.apk_sha256 }}
                    SIGNER_SHA256: ${{ steps.signing.outputs.pinned_fingerprint }}
                  run: |
                    set -euo pipefail
                    work="$RUNNER_TEMP/publish-release"
                    mkdir -p "$work/published"
                    notes="$work/release-notes.txt"
                    jq -r '.releaseNotes // ""' ops/release-request.json > "$notes"
                    if ! test -s "$notes"; then printf '%s\n' "Báo hàng 1291 ${CHANNEL^^} $VERSION_NAME" > "$notes"; fi
                    apk_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
                    manifest="$RELEASE_DIR/release-manifest.json"
                    jq -n --arg channel "$CHANNEL" --argjson versionCode "$VERSION_CODE" --arg versionName "$VERSION_NAME" --arg apkUrl "$apk_url" --arg sha256 "$APK_SHA256" --argjson mandatory "$MANDATORY" --arg releaseNotes "$(cat "$notes")" --arg signerSha256 "$SIGNER_SHA256" --arg sourceSha "$GITHUB_SHA" \
                      '{channel:$channel,versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256,mandatory:$mandatory,releaseNotes:$releaseNotes,signerSha256:$signerSha256,sourceSha:$sourceSha}' > "$manifest"
                    jq -e . "$manifest" >/dev/null
                    cleanup_failed_release() { if gh release view "$TAG" >/dev/null 2>&1; then gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true; fi; }
                    trap cleanup_failed_release ERR
                    if test "$CHANNEL" = 'stable'; then
                      gh release create "$TAG" "$RELEASE_DIR/$APK_NAME" "$manifest" --target "$GITHUB_SHA" --title "Báo hàng 1291 Stable $VERSION_NAME" --notes-file "$notes" --latest
                    else
                      gh release create "$TAG" "$RELEASE_DIR/$APK_NAME" "$manifest" --target "$GITHUB_SHA" --title "Báo hàng 1291 Beta $VERSION_NAME" --notes-file "$notes" --prerelease
                    fi
                    gh release download "$TAG" --pattern "$APK_NAME" --dir "$work/published"
                    gh release download "$TAG" --pattern 'release-manifest.json' --dir "$work/published"
                    published_sha="$(sha256sum "$work/published/$APK_NAME" | awk '{print $1}')"
                    test "$published_sha" = "$APK_SHA256"
                    cmp -s "$manifest" "$work/published/release-manifest.json"
                    trap - ERR
                    mkdir -p "$(dirname "$POINTER")"
                    cp "$manifest" "$POINTER"
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add "$POINTER"
                    git commit -m "Update $CHANNEL OTA manifest to $VERSION_NAME"
                    git push origin HEAD:main
                    echo "Published $CHANNEL OTA $VERSION_NAME code=$VERSION_CODE sha256=$APK_SHA256"
          '''.replace('\n          ', '\n').lstrip())

          # The one-time patch workflow removes itself before committing.
          Path('.github/workflows/apply-ota-channels-user-edit.yml').unlink()
          PY

          node --check web-admin/src/main.js
          git diff --check
          test ! -e .github/workflows/apply-ota-channels-user-edit.yml
          git status --short

      - name: Commit patched source to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add channel-bound OTA and direct user editing'
          git push origin HEAD:work/ota-channels-user-edit
