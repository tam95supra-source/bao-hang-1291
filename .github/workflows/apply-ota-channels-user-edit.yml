name: Apply staged OTA and user edits

on:
  push:
    branches:
      - work/ota-channels-user-edit
    paths:
      - '.github/workflows/apply-ota-channels-user-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/ota-channels-user-edit
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply approved source patches and validate static assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ops/patch_ota_channel.py')
          text = p.read_text()
          old = '    if actual != count:\n'
          new = '    if actual < count:\n'
          if text.count(old) != 1:
              raise SystemExit('patch helper guard not found exactly once')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 ops/patch_ota_channel.py
          python3 ops/patch_user_edit.py
          node --check web-admin/src/main.js
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build
          if grep -R -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|service_role' web-admin/dist; then
            echo 'Secret-like material found in static web build' >&2
            exit 1
          fi
          git diff --check
          rm -f ops/patch_ota_channel.py ops/patch_user_edit.py .github/workflows/apply-ota-channels-user-edit.yml
          test ! -e ops/patch_ota_channel.py
          test ! -e ops/patch_user_edit.py
          test ! -e .github/workflows/apply-ota-channels-user-edit.yml
      - name: Commit final staged source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add APK-bound OTA channels and user management'
          git push origin HEAD:work/ota-channels-user-edit
