name: Apply OTA channels and user editing

on:
  push:
    branches: [work/ota-channels-user-edit]
    paths:
      - '.github/workflows/apply-ota-channels-user-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/ota-channels-user-edit
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply approved source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          # --- Android build channel identity ---
          replace('app/build.gradle.kts',
          '''val productionSignerSha256 = if (productionSignerFile.isFile) {
              productionSignerFile.readText().trim().lowercase()
          } else {
              ""
          }

          android {''',
          '''val productionSignerSha256 = if (productionSignerFile.isFile) {
              productionSignerFile.readText().trim().lowercase()
          } else {
              ""
          }

          val requestedOtaChannel = (project.findProperty("OTA_CHANNEL") as String?)?.trim()?.lowercase() ?: "stable"
          require(requestedOtaChannel in setOf("stable", "beta")) {
              "OTA_CHANNEL must be stable or beta"
          }
          val otaManifestUrl = "https://raw.githubusercontent.com/tam95supra-source/bao-hang-1291/main/ota/$requestedOtaChannel/release-manifest.json"

          android {''')

          replace('app/build.gradle.kts',
          '''        buildConfigField("String", "UPDATE_MANIFEST_URL", "\\\"${secret("UPDATE_MANIFEST_URL", "https://github.com/tam95supra-source/bao-hang-1291/releases/latest/download/release-manifest.json")}\\\"")
                  buildConfigField("String", "PRODUCTION_SIGNER_SHA256", "\\\"$productionSignerSha256\\\"")''',
          '''        buildConfigField("String", "OTA_CHANNEL", "\\\"$requestedOtaChannel\\\"")
                  buildConfigField("String", "UPDATE_MANIFEST_URL", "\\\"${secret("UPDATE_MANIFEST_URL", otaManifestUrl)}\\\"")
                  buildConfigField("String", "PRODUCTION_SIGNER_SHA256", "\\\"$productionSignerSha256\\\"")
                  manifestPlaceholders["otaChannel"] = requestedOtaChannel''')

          replace('app/build.gradle.kts',
          '''        debug {
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-debug"
                      isMinifyEnabled = false
                  }''',
          '''        debug {
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-debug"
                      isMinifyEnabled = false
                      buildConfigField("String", "OTA_CHANNEL", "\\\"debug\\\"")
                      buildConfigField("String", "UPDATE_MANIFEST_URL", "\\\"\\\"")
                      manifestPlaceholders["otaChannel"] = "debug"
                  }''')

          replace('app/src/main/AndroidManifest.xml',
          '''        android:theme="@style/Theme.BaoHang1291"
                  android:usesCleartextTraffic="false">

                  <activity''',
          '''        android:theme="@style/Theme.BaoHang1291"
                  android:usesCleartextTraffic="false">

                  <meta-data
                      android:name="vn.pickpack1291.baohang.OTA_CHANNEL"
                      android:value="${otaChannel}" />

                  <activity''')

          replace('app/src/main/java/vn/pickpack1291/baohang/BaoHangApplication.kt',
          '''        diagnostics.info("app_start", mapOf("version" to BuildConfig.VERSION_NAME, "build_type" to BuildConfig.BUILD_TYPE))''',
          '''        diagnostics.info("app_start", mapOf("version" to BuildConfig.VERSION_NAME, "build_type" to BuildConfig.BUILD_TYPE, "ota_channel" to BuildConfig.OTA_CHANNEL))''')

          Path('app/src/main/java/vn/pickpack1291/baohang/update/AppUpdater.kt').write_text(r'''package vn.pickpack1291.baohang.update

          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import android.widget.Toast
