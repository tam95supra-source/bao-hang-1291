                  content.addView(button("QUẢN LÝ NHÂN SỰ") { showUsers() })
                  content.addView(button("IMPORT SKU.EXCEL")''')
          replace('app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt',
