name: Deploy verified target Web Admin once

on:
  push:
    branches: [target-final-20260814-impl]
    paths: ['.github/workflows/deploy-target-web-once.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
      - name: Zero-cost guard
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}'),enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          (async()=>{if(!sa.client_email||!sa.private_key)throw new Error('Firebase service account incomplete');const n=Math.floor(Date.now()/1000),h=enc({alg:'RS256',typ:'JWT'}),p=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:n,exp:n+900}),u=`${h}.${p}`,s=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url'),r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${u}.${s}`})});if(!r.ok)throw new Error(`OAuth ${r.status}`);const t=(await r.json()).access_token,b=await fetch('https://cloudbilling.googleapis.com/v1/projects/bao-hang-1291/billingInfo',{headers:{authorization:`Bearer ${t}`}}),j=await b.json();if(!b.ok)throw new Error(`Billing verify ${b.status}`);if(j.billingEnabled===true||j.billingAccountName)throw new Error('COST_GUARD_STOP: Billing attached');console.log('COST_GUARD=PASS billingEnabled=false')})().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build reviewed Web Admin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-admin/public
          cp docs/templates/MAU_NHAN_SU_BAO_HANG_1291.xlsx web-admin/public/MAU_NHAN_SU_BAO_HANG_1291.xlsx
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build
          test -f web-admin/dist/index.html
          ! grep -R -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|service_role' web-admin/dist
      - name: Materialize Hosting credential
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          jq -e '.project_id == "bao-hang-1291" and .client_email and .private_key' "$RUNNER_TEMP/firebase-sa.json" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Deploy Hosting
        run: npx --yes firebase-tools@14.17.0 deploy --only hosting --project bao-hang-1291 --non-interactive
      - name: Verify live target
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://bao-hang-1291.web.app/ -o "$RUNNER_TEMP/index.html"
          grep -q 'Báo hàng 1291' "$RUNNER_TEMP/index.html"
          curl -fsSI https://bao-hang-1291.web.app/ -o "$RUNNER_TEMP/headers.txt"
          grep -qi '^content-security-policy:' "$RUNNER_TEMP/headers.txt"
          grep -qi '^x-content-type-options: nosniff' "$RUNNER_TEMP/headers.txt"
          API_URL='https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/web-api/admin-summary'
          CODE="$(curl -sS -o "$RUNNER_TEMP/api.json" -w '%{http_code}' -X POST "$API_URL" -H 'Origin: https://bao-hang-1291.web.app' -H 'Content-Type: application/json' -d '{}')"
          test "$CODE" = '401'
          echo 'TARGET_WEB_LIVE=PASS'
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/index.html" "$RUNNER_TEMP/headers.txt" "$RUNNER_TEMP/api.json"
