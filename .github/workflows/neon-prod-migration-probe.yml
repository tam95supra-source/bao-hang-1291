name: Neon production importer probe

on:
  push:
    branches: [migration/neon-cutover]
    paths: ['.github/workflows/neon-prod-migration-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MIGRATION_SECRET: ${{ secrets.GOOGLE_SHEET_WEBHOOK_SECRET }}
      URL: https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/migration-neon-production-push
    steps:
      - name: Probe exact guarded target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          test -n "${MIGRATION_SECRET:-}" || { echo 'Missing migration secret' >&2; exit 1; }
          test ${#MIGRATION_SECRET} -ge 32
          body='{"project":"bao-hang-1291","supabase_ref":"oedasgcdjppjwidhlqdr","neon_project":"tiny-boat-19315489","neon_branch":"br-broad-resonance-aznwrpea","action":"probe"}'
          code="$(curl -sS --retry 2 -o "$RUNNER_TEMP/probe.json" -w '%{http_code}' -X POST "$URL" -H "x-migration-secret: $MIGRATION_SECRET" -H 'content-type: application/json' -d "$body")"
          cat "$RUNNER_TEMP/probe.json" | jq '{ok,target_project,target_branch,source_ref,error}'
          test "$code" = 200
          jq -e '.ok==true and .target_project=="tiny-boat-19315489" and .target_branch=="br-broad-resonance-aznwrpea" and .source_ref=="oedasgcdjppjwidhlqdr"' "$RUNNER_TEMP/probe.json" >/dev/null
