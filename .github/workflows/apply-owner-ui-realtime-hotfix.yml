name: Apply owner UI realtime hotfix

on:
  push:
    branches: [main]
    paths:
      - 'ops/apply-invent-ui-realtime.request'

permissions:
  contents: write

concurrency:
  group: apply-owner-ui-realtime-hotfix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          python3 scripts/apply_invent_ui_realtime_hotfix.py
          grep -F 'val labels = listOf("Đang xử lý", "Đã có hàng", "Đã bỏ qua", "Picker thu hồi")' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt >/dev/null
          grep -F '0 -> raw.sortedBy { it.reportedAt }' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt >/dev/null
          grep -F '1, 2 -> raw.sortedByDescending { it.updatedAt }' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt >/dev/null
          grep -F 'SKU - ${issue.sku} - ${issue.reportCount} lượt báo' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt >/dev/null
          grep -F 'FIRESTORE_POLL_MS = 6_000L' app/src/main/java/vn/pickpack1291/baohang/realtime/RealtimeClient.kt >/dev/null
      - name: Commit source hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt app/src/main/java/vn/pickpack1291/baohang/realtime/RealtimeClient.kt
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source changes produced' >&2; exit 2; }
          git commit -m 'fix(android): compact invent board and reliable realtime UI'
          git pull --rebase origin main
          git push origin HEAD:main
