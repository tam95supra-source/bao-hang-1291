# Neon-only production gate; refreshed after full Supabase source retirement.
name: Target quality gate

on:
  pull_request:
    branches: [main]
    paths: ['web-admin/**','app/**','ops/neon/**','google-apps-script/**','docs/**','.github/workflows/quality-target.yml']
  push:
    branches: [main]
    paths: ['web-admin/**','app/**','ops/neon/**','google-apps-script/**','docs/**','.github/workflows/quality-target.yml']

permissions:
  contents: read

concurrency:
  group: target-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Build Web Admin
        run: |
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build
      - name: Enforce Neon-only runtime and public-source security
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '[.]supabase[.]co|oedasgcdjppjwidhlqdr|SUPABASE_URL|SUPABASE_ANON_KEY|/functions/v1/' app/src web-admin/src google-apps-script scripts 2>/dev/null; then
            echo 'Retired backend runtime reference found' >&2
            exit 1
          fi
          if grep -RInE '^[[:space:]]*-----BEGIN (RSA )?PRIVATE KEY-----|"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN|RELEASE_STORE_PASSWORD[[:space:]]*=[[:space:]]*[^$[:space:]]' app web-admin google-apps-script ops docs 2>/dev/null; then
            echo 'Secret/private-key material detected' >&2
            exit 1
          fi
          grep -R -F 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech' web-admin/dist >/dev/null
          grep -F 'NEON_DATA_API' app/build.gradle.kts >/dev/null
          echo 'NEON_ONLY_SOURCE_GUARD=PASS'
      - name: Verify Android dependency graph and tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > "$RUNNER_TEMP/android-deps.txt"
          if grep -iE 'supabase|postgrest|gotrue' "$RUNNER_TEMP/android-deps.txt"; then
            echo 'Retired backend Android dependency found' >&2
            exit 1
          fi
          gradle --no-daemon testDebugUnitTest assembleDebug
          echo 'ANDROID_NEON_ONLY_GATE=PASS'
