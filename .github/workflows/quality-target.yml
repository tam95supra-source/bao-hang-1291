# Neon-only production gate; refreshed after full Supabase source retirement.
name: Target quality gate

on:
  pull_request:
    branches: [main]
    paths: ['web-admin/**','app/**','ops/neon/**','ops/apps_script_deploy_staff.mjs','ops/apps_script_deploy_worker.mjs','ops/configure_password_recovery_mail.cjs','ops/staff_cleanup_orphans.mjs','ops/staff_cleanup_orphans_direct.cjs','google-apps-script/**','docs/**','.github/workflows/quality-target.yml']
  push:
    branches: [main]
    paths: ['web-admin/**','app/**','ops/neon/**','ops/apps_script_deploy_staff.mjs','ops/apps_script_deploy_worker.mjs','ops/staff_cleanup_orphans.mjs','ops/staff_cleanup_orphans_direct.cjs','google-apps-script/**','docs/**','.github/workflows/quality-target.yml']

permissions:
  contents: read

concurrency:
  group: target-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Detect Android-impacting changes
        id: scope
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${EVENT_BEFORE:-}}"
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            base="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$base" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(app/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$)' "$RUNNER_TEMP/changed-files.txt"; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
            echo 'ANDROID_SCOPE=CHANGED'
          else
            echo 'android=false' >> "$GITHUB_OUTPUT"
            echo 'ANDROID_SCOPE=SKIP_WEB_ONLY'
          fi

      - uses: actions/setup-java@v5
        if: steps.scope.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.scope.outputs.android == 'true'
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build Web Admin
        run: |
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build

      - name: Verify canonical Web shell contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-web-shell-consistency.cjs
          node --check scripts/web-shell-consistency-e2e.cjs

      - name: Verify Apps Script syntax and Web initial JS budget
        shell: bash
        run: |
          set -euo pipefail
          cp google-apps-script/DEPLOY_NEON.gs "$RUNNER_TEMP/deploy-neon.js"
          cp google-apps-script/STAFF_SOURCE_BRIDGE_RECEIVER.gs "$RUNNER_TEMP/staff-bridge.js"
          node --check "$RUNNER_TEMP/deploy-neon.js"
          node --check "$RUNNER_TEMP/staff-bridge.js"
          node --check ops/staff_cleanup_orphans.mjs
          node --check ops/staff_cleanup_orphans_direct.cjs
          node --check ops/apps_script_deploy_staff.mjs
          node --check ops/apps_script_deploy_worker.mjs
          node --check ops/configure_password_recovery_mail.cjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const deploy = fs.readFileSync('google-apps-script/DEPLOY_NEON.gs', 'utf8');
          const bridge = fs.readFileSync('google-apps-script/STAFF_SOURCE_BRIDGE_RECEIVER.gs', 'utf8');
          const filter = "String(row[6] || '').trim() !== '1291' || String(row[7] || '').trim().toUpperCase() !== 'HY1'";
          if (!deploy.includes(filter)) throw new Error('STAFF_CONTRACT_DEPLOY_FILTER_MISSING');
          if (!bridge.includes(filter)) throw new Error('STAFF_CONTRACT_BRIDGE_FILTER_MISSING');
          if (!deploy.includes("if (action === 'staff-recovery-current-source') throw new Error('STAFF_RECOVERY_RETIRED_CANONICAL_HY1')")) throw new Error('LEGACY_502_RECOVERY_ROUTE_ACTIVE');
          console.log('STAFF_SOURCE_CONTRACT_GATE=PASS canonical=1291/HY1 legacy_502_recovery=retired');
          NODE
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const paths = ['.github/workflows/staff-sync.yml','.github/workflows/staff-sync-exact.yml','.github/workflows/one-time-staff-picker-normalize.yml'];
          for (const path of paths) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes('(retired)') || !source.includes('LEGACY_STAFF_MUTATION_WORKFLOW_RETIRED=PASS')) throw new Error('LEGACY_STAFF_WORKFLOW_ACTIVE:' + path);
            if (source.includes('ops/staff-sync.request') || source.includes('ops/staff-sync-exact.request') || source.includes('ops/staff-picker-normalize.trigger') || source.includes('full_staff_sync') || source.includes('run_full_staff_sync_compat')) throw new Error('LEGACY_STAFF_MUTATION_PATH_PRESENT:' + path);
          }
          console.log('LEGACY_STAFF_MUTATION_WORKFLOWS_RETIRED=PASS');
          NODE
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import zlib from 'node:zlib';

          const root = 'web-admin/dist';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, '.vite/manifest.json'), 'utf8'));
          const entry = manifest['index.html'] || Object.values(manifest).find((item) => item.isEntry);
          if (!entry) throw new Error('WEB_MANIFEST_ENTRY_MISSING');

          const seen = new Set();
          function walk(item) {
            if (!item || seen.has(item.file)) return;
            seen.add(item.file);
            for (const key of item.imports || []) walk(manifest[key]);
          }
          walk(entry);

          let gzipBytes = 0;
          const files = [];
          for (const file of [...seen].sort()) {
            if (!file.endsWith('.js')) continue;
            const bytes = fs.readFileSync(path.join(root, file));
            const gz = zlib.gzipSync(bytes, { level: 9 }).length;
            gzipBytes += gz;
            files.push({ file, gzipBytes: gz });
          }
          console.log('WEB_INITIAL_JS_GZIP_FILES=' + JSON.stringify(files));
          console.log('WEB_INITIAL_JS_GZIP_BYTES=' + gzipBytes);
          if (gzipBytes > 150 * 1024) {
            throw new Error('WEB_INITIAL_JS_GZIP_BUDGET_EXCEEDED:' + gzipBytes);
          }
          console.log('WEB_INITIAL_JS_GZIP_GATE=PASS');
          NODE
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const invalid = /(?<!\$)\$\([^\n;]*\)\.forEach\s*\(/g;
          const files = ['web-admin/src/main.js','web-admin/src/web-fast-ui.js','web-admin/src/ops-console.js','web-admin/src/warehouse-ui-v2.js'];
          const matches = files.flatMap((file) => [...fs.readFileSync(file, 'utf8').matchAll(invalid)].map((m) => file + ':' + m[0]));
          if (matches.length) throw new Error('WEB_SINGLE_SELECTOR_FOREACH=' + JSON.stringify(matches));
          console.log('WEB_DOM_COLLECTION_HELPER_GATE=PASS files=' + files.length);
          NODE
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const main = fs.readFileSync('web-admin/src/main.js', 'utf8');
          const fast = fs.readFileSync('web-admin/src/web-fast-ui.js', 'utf8');
          const ops = fs.readFileSync('web-admin/src/ops-console.js', 'utf8');
          if (!main.includes('window.__BH_AUTH_FETCH__ = authenticatedFetch')) throw new Error('WEB_AUTH_REFRESH_HELPER_MISSING');
          if (!fast.includes('return rowsForBucket().find') || !fast.includes('const activeStatus =')) throw new Error('WEB_STALE_SKU_GUARD_MISSING');
          if (!ops.includes('opsStaffSourceForm') || !ops.includes('filter((user) => user.active === true)')) throw new Error('WEB_CURRENT_STAFF_SOURCE_UI_MISSING');
          console.log('WEB_AUTH_STALE_SKU_STAFF_GATE=PASS');
          NODE
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const main = fs.readFileSync('web-admin/src/main.js', 'utf8');
          const runtime = fs.readFileSync('web-admin/src/backend-runtime.js', 'utf8');
          const gas = fs.readFileSync('google-apps-script/DEPLOY_NEON.gs', 'utf8');
          const requiredMain = ['Lấy lại mật khẩu','password-reset-preview','password-reset-request',"TEMP_PASSWORD_PREFIX = 'R!'",'Đổi mật khẩu','changeOwnPassword'];
          for (const marker of requiredMain) if (!main.includes(marker)) throw new Error('PASSWORD_RECOVERY_WEB_MISSING:' + marker);
          const requiredRuntime = ['public-auth','updatePassword','/auth/change-password'];
          for (const marker of requiredRuntime) if (!runtime.includes(marker)) throw new Error('PASSWORD_RECOVERY_RUNTIME_MISSING:' + marker);
          const requiredGas = ["BH_PASSWORD_RECOVERY_EMAIL = 'tam95.supra@gmail.com'","BH_PASSWORD_RESET_COOLDOWN_MS = 5 * 60 * 1000","passwordResetGmailSend_","passwordResetMailAccessToken_","passwordResetMailOAuthConfigure_","passwordResetRequest_","passwordResetPreview_","passwordResetMailCapability_"];
          for (const marker of requiredGas) if (!gas.includes(marker)) throw new Error('PASSWORD_RECOVERY_GAS_MISSING:' + marker);
          if (/console\.log\([^\n]*code4|return\s*\{[^}]*code4/s.test(gas)) throw new Error('PASSWORD_RESET_CODE_EXPOSURE_RISK');
          if (gas.includes('MailApp.sendEmail') || gas.includes('MailApp.getRemainingDailyQuota')) throw new Error('PASSWORD_RECOVERY_MAILAPP_SCOPE_REGRESSION');
          const mailConfig = fs.readFileSync('ops/configure_password_recovery_mail.cjs','utf8');
          if (!mailConfig.includes('GMAIL_SEND_OAUTH_SCOPE_MISSING') || !mailConfig.includes('password-reset-mail-oauth-configure')) throw new Error('PASSWORD_RECOVERY_OAUTH_CONFIG_GUARD_MISSING');
          console.log('PASSWORD_RECOVERY_SECURITY_GATE=PASS email=fixed temp_input=4digits cooldown=5m self_change=true provider=gmail_oauth');
          NODE
          echo 'APPS_SCRIPT_SYNTAX_GATE=PASS'

      - name: Enforce Neon-only runtime and public-source security
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '[.]supabase[.]co|oedasgcdjppjwidhlqdr|SUPABASE_URL|SUPABASE_ANON_KEY|/functions/v1/' app/src web-admin/src google-apps-script scripts 2>/dev/null; then
            echo 'Retired backend runtime reference found' >&2
            exit 1
          fi
          if grep -RInE '^[[:space:]]*-----BEGIN (RSA )?PRIVATE KEY-----|"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN|RELEASE_STORE_PASSWORD[[:space:]]*=[[:space:]]*[^$[:space:]]' app web-admin google-apps-script ops docs 2>/dev/null; then
            echo 'Secret/private-key material detected' >&2
            exit 1
          fi
          grep -R -F 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech' web-admin/dist >/dev/null
          grep -F 'NEON_DATA_API' app/build.gradle.kts >/dev/null
          echo 'NEON_ONLY_SOURCE_GUARD=PASS'

      - name: Verify Android dependency graph and tests
        if: steps.scope.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > "$RUNNER_TEMP/android-deps.txt"
          if grep -iE 'supabase|postgrest|gotrue' "$RUNNER_TEMP/android-deps.txt"; then
            echo 'Retired backend Android dependency found' >&2
            exit 1
          fi
          gradle --no-daemon testDebugUnitTest assembleDebug
          echo 'ANDROID_NEON_ONLY_GATE=PASS'
