name: Temp verify new staff Sheet
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-force-web-deploy.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Read exact 1291 HY1 staff set without writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops "$RUNNER_TEMP/staff"
          python3 - <<'PY'
          import urllib.parse
          base='https://docs.google.com/spreadsheets/d/1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78/gviz/tq'
          q="select A,B,D,E,F where G = 1291 and H = 'HY1'"
          print(base+'?'+urllib.parse.urlencode({'tqx':'out:csv','sheet':'DANH SÁCH NHÂN SỰ','tq':q}))
          PY
          URL=$(python3 - <<'PY'
          import urllib.parse
          base='https://docs.google.com/spreadsheets/d/1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78/gviz/tq'
          print(base+'?'+urllib.parse.urlencode({'tqx':'out:csv','sheet':'DANH SÁCH NHÂN SỰ','tq':"select A,B,D,E,F where G = 1291 and H = 'HY1'"}))
          PY
          )
          HTTP=$(curl -sSL --retry 3 --retry-all-errors --retry-delay 2 -o "$RUNNER_TEMP/staff/source.csv" -w '%{http_code}' "$URL")
          python3 - "$HTTP" <<'PY' > ops/new-staff-sheet-read-check.txt
          import csv,sys,os
          http=sys.argv[1]
          path=os.environ['RUNNER_TEMP']+'/staff/source.csv'
          rows=[]
          try:
              with open(path,encoding='utf-8-sig',newline='') as f: rows=list(csv.reader(f))
          except Exception as e:
              print('http='+http);print('read=FAIL');print('error='+type(e).__name__);raise SystemExit(0)
          data=[]
          for r in rows[1:]:
              if len(r)<5: continue
              code,name,position,contractor,department=[str(x).strip() for x in r[:5]]
              if code and name: data.append((code,name,position,contractor,department))
          print('http='+http)
          print('read='+('PASS' if http=='200' and data else 'FAIL'))
          print('eligible_count='+str(len(data)))
          print('unique_codes='+str(len({x[0].lower() for x in data})))
          print('duplicate_codes='+str(len(data)-len({x[0].lower() for x in data})))
          print('invent_department='+str(sum(1 for x in data if 'INVENT' in x[4].upper())))
          print('coordinator_position='+str(sum(1 for x in data if 'ĐIỀU PHỐI' in x[2].upper() or 'DIEU PHOI' in x[2].upper())))
          PY
          cat ops/new-staff-sheet-read-check.txt
          grep -q '^read=PASS$' ops/new-staff-sheet-read-check.txt
          grep -q '^duplicate_codes=0$' ops/new-staff-sheet-read-check.txt
      - name: Commit proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add ops/new-staff-sheet-read-check.txt;git diff --cached --quiet || git commit -m 'chore(temp): record new staff Sheet read gate';git pull --rebase origin main;git push origin HEAD:main
