name: Temp verify live Bao Hang staff source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-force-web-deploy.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Verify live ping fields
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),u=String(process.env.GOOGLE_SHEET_WEBHOOK_URL||'').trim();
          (async()=>{const r=await fetch(u,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'ping'})}),t=await r.text();let j={};try{j=JSON.parse(t)}catch{};if(!r.ok||j.ok!==true||j.project!=='bao-hang-1291')throw new Error('PING_FAIL');fs.mkdirSync('ops',{recursive:true});fs.writeFileSync('ops/live-staff-source-check.txt',`ping=PASS\nstaff_sheet_id=${String(j.staff_sheet_id||'')}\nstaff_sheet_name=${String(j.staff_sheet_name||'')}\n`);})().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          cat ops/live-staff-source-check.txt
      - name: Commit proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add ops/live-staff-source-check.txt;git diff --cached --quiet || git commit -m 'chore(temp): record live staff source markers';git pull --rebase origin main;git push origin HEAD:main
