name: Patch web realtime UI once

on:
  push:
    branches:
      - target-final-20260814-impl

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch realtime UI behavior
        run: python3 .github/scripts/patch_web_realtime_ui.py

      - name: Build web admin
        working-directory: web-admin
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Verify realtime UI guardrails
        run: |
          grep -q "picker_status_changed" web-admin/src/main.js
          grep -q "state.liveRefresh.issue = load" web-admin/src/main.js
          grep -q "data-issue-card=" web-admin/src/main.js
          ! grep -q "picker_alert" web-admin/src/main.js

      - name: Commit patch and cleanup one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-admin/src/main.js
          git rm .github/scripts/patch_web_realtime_ui.py
          git rm .github/workflows/patch-web-realtime-ui-once.yml
          git commit -m "fix(web): update realtime UI in place"
          git push origin HEAD:target-final-20260814-impl
