name: One-time Web Admin Hardening Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-web-admin-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Apply targeted hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('web-admin/src/main.js')
          text = main.read_text()
          old = "import ExcelJS from 'exceljs';\nimport './style.css';\n"
          new = "import './style.css';\n\nlet excelModulePromise;\nasync function getExcelJS() {\n  excelModulePromise ||= import('exceljs').then((module) => module.default ?? module);\n  return excelModulePromise;\n}\n"
          if old not in text:
              raise SystemExit('Expected ExcelJS import block not found')
          text = text.replace(old, new, 1)

          old_read = "  const workbook = new ExcelJS.Workbook();\n  await workbook.xlsx.load(await file.arrayBuffer());"
          new_read = "  const ExcelJS = await getExcelJS();\n  const workbook = new ExcelJS.Workbook();\n  await workbook.xlsx.load(await file.arrayBuffer());"
          if old_read not in text:
              raise SystemExit('Expected XLSX read block not found')
          text = text.replace(old_read, new_read, 1)

          old_write = "    const workbook = new ExcelJS.Workbook();\n    const sheet = workbook.addWorksheet('SKU');"
          new_write = "    const ExcelJS = await getExcelJS();\n    const workbook = new ExcelJS.Workbook();\n    const sheet = workbook.addWorksheet('SKU');"
          if old_write not in text:
              raise SystemExit('Expected XLSX write block not found')
          text = text.replace(old_write, new_write, 1)
          main.write_text(text)

          workflow = Path('.github/workflows/deploy-web-admin.yml')
          yml = workflow.read_text()
          old_node = "      - uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n"
          new_node = "      - uses: actions/setup-node@v6\n        with:\n          node-version: '22'\n          package-manager-cache: false\n"
          if old_node not in yml:
              raise SystemExit('Expected setup-node block not found')
          yml = yml.replace(old_node, new_node, 1)

          marker = "      - name: Cleanup credential files\n"
          smoke_lines = [
              "      - name: Verify Web Admin API CORS and auth boundary",
              "        shell: bash",
              "        run: |",
              "          set -euo pipefail",
              "          API_URL=\"https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/web-api/admin-summary\"",
              "          ORIGIN=\"https://bao-hang-1291.web.app\"",
              "          curl -sS -D \"$RUNNER_TEMP/cors-headers.txt\" -o /dev/null -X OPTIONS \"$API_URL\" -H \"Origin: $ORIGIN\" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,apikey,content-type'",
              "          grep -qi '^access-control-allow-origin: https://bao-hang-1291.web.app' \"$RUNNER_TEMP/cors-headers.txt\"",
              "          CODE=\"$(curl -sS -D \"$RUNNER_TEMP/api-headers.txt\" -o \"$RUNNER_TEMP/api-body.json\" -w '%{http_code}' -X POST \"$API_URL\" -H \"Origin: $ORIGIN\" -H 'Content-Type: application/json' -d '{}')\"",
              "          test \"$CODE\" = '401'",
              "          grep -qi '^access-control-allow-origin: https://bao-hang-1291.web.app' \"$RUNNER_TEMP/api-headers.txt\"",
              "          grep -q 'Phiên đăng nhập' \"$RUNNER_TEMP/api-body.json\"",
              "          echo 'WEB_API_CORS_AUTH_SMOKE=PASS'",
              "",
          ]
          if 'WEB_API_CORS_AUTH_SMOKE=PASS' not in yml:
              if marker not in yml:
                  raise SystemExit('Cleanup marker not found')
              yml = yml.replace(marker, "\n".join(smoke_lines) + marker, 1)

          old_cleanup = '        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/web-index.html" "$RUNNER_TEMP/web-headers.txt"\n'
          new_cleanup = '        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/web-index.html" "$RUNNER_TEMP/web-headers.txt" "$RUNNER_TEMP/cors-headers.txt" "$RUNNER_TEMP/api-headers.txt" "$RUNNER_TEMP/api-body.json"\n'
          if old_cleanup not in yml:
              raise SystemExit('Expected cleanup command not found')
          yml = yml.replace(old_cleanup, new_cleanup, 1)
          workflow.write_text(yml)
          PY

          rm -f .github/workflows/patch-web-admin-hardening.yml
          node --check web-admin/src/main.js
          git diff --check

      - name: Commit hardened Web Admin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A web-admin/src/main.js .github/workflows/deploy-web-admin.yml .github/workflows/patch-web-admin-hardening.yml
          git commit -m 'Harden and optimize Web Admin delivery'
          git push origin HEAD:main
