name: One-time Web Admin Source Optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-web-admin-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Lazy-load Excel parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web-admin/src/main.js')
          text = path.read_text()

          old = "import ExcelJS from 'exceljs';\nimport './style.css';\n"
          new = "import './style.css';\n\nlet excelModulePromise;\nasync function getExcelJS() {\n  excelModulePromise ||= import('exceljs').then((module) => module.default ?? module);\n  return excelModulePromise;\n}\n"
          if old not in text:
              raise SystemExit('Expected ExcelJS import block not found')
          text = text.replace(old, new, 1)

          old_read = "  const workbook = new ExcelJS.Workbook();\n  await workbook.xlsx.load(await file.arrayBuffer());"
          new_read = "  const ExcelJS = await getExcelJS();\n  const workbook = new ExcelJS.Workbook();\n  await workbook.xlsx.load(await file.arrayBuffer());"
          if old_read not in text:
              raise SystemExit('Expected XLSX read block not found')
          text = text.replace(old_read, new_read, 1)

          old_write = "    const workbook = new ExcelJS.Workbook();\n    const sheet = workbook.addWorksheet('SKU');"
          new_write = "    const ExcelJS = await getExcelJS();\n    const workbook = new ExcelJS.Workbook();\n    const sheet = workbook.addWorksheet('SKU');"
          if old_write not in text:
              raise SystemExit('Expected XLSX write block not found')
          text = text.replace(old_write, new_write, 1)

          path.write_text(text)
          PY
          node --check web-admin/src/main.js
          git diff --check

      - name: Commit source optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add web-admin/src/main.js
          git commit -m 'Lazy-load Excel parser in Web Admin'
          git push origin HEAD:main
