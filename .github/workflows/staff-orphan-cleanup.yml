name: Staff orphan cleanup

on:
  push:
    branches: [main]
    paths:
      - 'ops/staff-orphan-cleanup.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bao-hang-1291-staff-orphan-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEON_DATA_API: https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install cleanup runtime
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/staff-cleanup"; mkdir -p "$D"; printf '{"private":true}' > "$D/package.json"
          npm --prefix "$D" install firebase-admin@13.4.0 --ignore-scripts --no-audit --no-fund --no-package-lock
          echo "NODE_PATH=$D/node_modules" >> "$GITHUB_ENV"
      - name: Cleanup inactive history-free personnel
        id: cleanup
        run: |
          set -euo pipefail
          node ops/staff_cleanup_orphans_direct.cjs
      - name: Verify evidence is sanitized
        if: always()
        run: |
          set -euo pipefail
          test -s acceptance-evidence/staff-orphan-cleanup-direct.json
          if grep -RniE 'private_key|access_token|refresh_token|Bearer [A-Za-z0-9._-]+' acceptance-evidence/staff-orphan-cleanup-direct.json; then
            echo SECRET_MATERIAL_DETECTED >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-orphan-cleanup-${{ github.run_id }}
          path: acceptance-evidence/staff-orphan-cleanup-direct.json
          retention-days: 1
          if-no-files-found: error
      - name: Publish sanitized cleanup receipt
        if: always()
        env:
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ops/status
          python3 - <<'PY'
          import json, os
          payload={
            "workflow":"Staff orphan cleanup",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "run_attempt":int(os.environ.get("GITHUB_RUN_ATTEMPT","1")),
            "trigger_sha":os.environ["GITHUB_SHA"],
            "status":"PASS" if os.environ.get("CLEANUP_OUTCOME")=="success" else "FAIL",
            "cleanup":os.environ.get("CLEANUP_OUTCOME",""),
          }
          with open("ops/status/staff-orphan-cleanup-last.json","w",encoding="utf-8") as fh:
            json.dump(payload,fh,ensure_ascii=False,indent=2); fh.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/status/staff-orphan-cleanup-last.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ops): record staff orphan cleanup receipt'
            git push origin HEAD:main
          fi
