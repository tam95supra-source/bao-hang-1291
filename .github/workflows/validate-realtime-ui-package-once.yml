name: Validate realtime UI package once

on:
  push:
    branches:
      - target-final-20260814-impl

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3
      - name: Android unit test and compile
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Build Web Admin
        run: |
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build
      - name: Web performance and secret budgets
        shell: bash
        run: |
          set -euo pipefail
          test -f web-admin/dist/index.html
          if grep -R -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|service_role|SUPRA_CREDENTIAL_MASTER_KEY|encrypted_credential_bundle' web-admin/dist; then exit 1; fi
          shopt -s nullglob
          app_js=(web-admin/dist/assets/index-*.js)
          css=(web-admin/dist/assets/index-*.css)
          test ${#app_js[@]} -ge 1
          js_gzip=$(gzip -c "${app_js[0]}" | wc -c)
          test "$js_gzip" -le 153600
          if [ ${#css[@]} -ge 1 ]; then css_gzip=$(gzip -c "${css[0]}" | wc -c); test "$css_gzip" -le 30720; fi
          echo "WEB_BUDGET=PASS initial_js_gzip=$js_gzip"
      - name: Type-check Edge Functions
        run: |
          deno check \
            supabase/functions/_shared/fcm.ts \
            supabase/functions/api/index.ts \
            supabase/functions/web-api/index.ts \
            supabase/functions/admin-ops/index.ts \
            supabase/functions/staff-watch/index.ts \
            supabase/functions/notification-worker/index.ts \
            supabase/functions/sheet-worker/index.ts \
            supabase/functions/fallback-token/index.ts \
            supabase/functions/emergency-auth/index.ts \
            supabase/functions/emergency-drain/index.ts \
            supabase/functions/fallback-importer/index.ts \
            supabase/functions/firebase-bootstrap/index.ts \
            supabase/functions/backup-account-admin/index.ts
      - name: Syntax and source guards
        shell: bash
        run: |
          set -euo pipefail
          cp google-apps-script/Code.gs "$RUNNER_TEMP/Code.js"
          node --check "$RUNNER_TEMP/Code.js"
          ! grep -En '[0-9]_[0-9]' google-apps-script/Code.gs
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          test -s firestore.rules
          grep -Fq 'allow read, write: if false' firestore.rules
          grep -Fq 'FIREBASE_EMERGENCY' firestore.rules
          if grep -R -n -E --exclude='*.example' --exclude='BUSINESS_RULES.md' '^[[:space:]]*-----BEGIN (RSA )?PRIVATE KEY-----|"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^$[:space:]]|RELEASE_STORE_PASSWORD[[:space:]]*=[[:space:]]*[^$[:space:]]|SUPRA_CREDENTIAL_MASTER_KEY[[:space:]]*=[[:space:]]*[^$[:space:]]' supabase app web-admin google-apps-script docs; then exit 1; fi
          echo 'SOURCE_GUARDS=PASS'
      - name: Remove one-shot workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(gh api repos/tam95supra-source/bao-hang-1291/contents/.github/workflows/validate-realtime-ui-package-once.yml?ref=target-final-20260814-impl --jq .sha)"
          gh api -X DELETE repos/tam95supra-source/bao-hang-1291/contents/.github/workflows/validate-realtime-ui-package-once.yml -f message='ops: remove realtime UI validator' -f sha="$SHA" -f branch='target-final-20260814-impl'
