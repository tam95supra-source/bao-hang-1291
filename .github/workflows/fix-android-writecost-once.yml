name: Fix Android emergency quota compile error once

on:
  push:
    branches: ['ops/firebase-read-probe-20260815']
    paths: ['.github/workflows/fix-android-writecost-once.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - name: Fix scoped Firestore write cost accounting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/vn/pickpack1291/baohang/network/EmergencyFirestoreClient.kt')
          s=p.read_text(encoding='utf-8')
          bad='''            val writeCost = if (!active) 5 else if (projectionNeedsWrite) 4 else 3\n            val writeCost = 4 + if (eventType in setOf("AVAILABLE", "SKIP_ALLOWED")) projections.size else 0\n'''
          good='''            val writeCost = if (!active) 5 else if (projectionNeedsWrite) 4 else 3\n'''
          if s.count(bad) != 1:
              raise SystemExit(f'duplicate writeCost marker count={s.count(bad)}')
          s=s.replace(bad,good,1)
          marker='''            val payload = canonicalJson(payloadMap)\n\n            val quota = quotaControl(control, writeCost, sequence, acked, requestId, now)\n'''
          replacement='''            val payload = canonicalJson(payloadMap)\n            val writeCost = 4 + if (eventType in setOf("AVAILABLE", "SKIP_ALLOWED")) projections.size else 0\n\n            val quota = quotaControl(control, writeCost, sequence, acked, requestId, now)\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'mutate quota marker count={s.count(marker)}')
          s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -n "val writeCost" app/src/main/java/vn/pickpack1291/baohang/network/EmergencyFirestoreClient.kt
      - name: Commit target source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tam95supra-source'
          git config user.email 'tam95.supra@gmail.com'
          git add app/src/main/java/vn/pickpack1291/baohang/network/EmergencyFirestoreClient.kt
          git diff --cached --quiet && { echo NO_CHANGES; exit 0; }
          git commit -m 'fix: scope emergency write cost accounting'
          git push origin HEAD:target-final-20260814-impl