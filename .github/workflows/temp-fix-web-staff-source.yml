name: Temp fix web account creation and staff source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-web-staff-source.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      WORKER_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch source exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Browser -> Apps Script must remain a CORS-simple request.
          p = Path('web-admin/src/backend-runtime.js')
          s = p.read_text()
          old = """async function worker(action, body, init) {\n  if (!WORKER_URL) return jsonResponse({ ok: false, error: 'WORKER_NOT_CONFIGURED' }, 503)\n  const token = bearer(init) || realtimeToken\n  return originalFetch(WORKER_URL, {\n    method: 'POST',\n    headers: { 'content-type': 'application/json' },\n    body: JSON.stringify({ action, id_token: token, ...body }),\n  })\n}\n"""
          new = """async function worker(action, body, init) {\n  if (!WORKER_URL) return jsonResponse({ ok: false, error: 'WORKER_NOT_CONFIGURED' }, 503)\n  const token = bearer(init) || realtimeToken\n  return originalFetch(WORKER_URL, {\n    method: 'POST',\n    // text/plain keeps this a CORS-simple request. Apps Script parses the JSON body itself.\n    headers: { 'content-type': 'text/plain;charset=UTF-8' },\n    body: JSON.stringify({ action, id_token: token, ...body }),\n  })\n}\n"""
          if old not in s:
              if "text/plain;charset=UTF-8" not in s:
                  raise SystemExit('worker() target block not found')
          else:
              s = s.replace(old, new, 1)

          old = "if (action === 'create-user') return worker('update-user', body, init)"
          new = "if (action === 'create-user') return worker('update-user', { ...body, initial_password: body.initial_password || body.password || '' }, init)"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('create-user mapping target not found')
          p.write_text(s)

          # 2) Move staff authority to DỮ LIỆU THEO NGÀY / DANH SÁCH NHÂN SỰ.
          p = Path('google-apps-script/DEPLOY_NEON.gs')
          s = p.read_text()
          s = s.replace("const BH_STAFF_SHEET_ID = '1FRROqCp1lmkuHc3lc4UBpVI5_ZrtiPI1thlEymv458E';", "const BH_STAFF_SHEET_ID = '1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78';", 1)
          s = s.replace("const BH_STAFF_SHEET_NAME = 'DANH MỤC NHÂN SỰ';", "const BH_STAFF_SHEET_NAME = 'DANH SÁCH NHÂN SỰ';", 1)
          old = "const contractor=String(row[2]||'').trim(),position=String(row[3]||'').trim();"
          new = "const position=String(row[2]||'').trim(),contractor=String(row[3]||'').trim();"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('staff D/E parser target not found')
          old = "if (action === 'ping') return json_({ok:true,project:BH_PROJECT,provider:'NEON_FIREBASE_GOOGLE'});"
          new = "if (action === 'ping') return json_({ok:true,project:BH_PROJECT,provider:'NEON_FIREBASE_GOOGLE',staff_sheet_id:BH_STAFF_SHEET_ID,staff_sheet_name:BH_STAFF_SHEET_NAME});"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('ping target not found')
          if "1FRROqCp1lmkuHc3lc4UBpVI5_ZrtiPI1thlEymv458E" in s or "DANH MỤC NHÂN SỰ" in s:
              raise SystemExit('old staff source still present in Apps Script')
          p.write_text(s)

          # 3) Keep admin wording aligned with the real source.
          p = Path('web-admin/src/main.js')
          s = p.read_text().replace('Nguồn DANH MỤC NHÂN SỰ', 'Nguồn DỮ LIỆU THEO NGÀY / DANH SÁCH NHÂN SỰ').replace('Đang đồng bộ DANH MỤC NHÂN SỰ…', 'Đang đồng bộ DANH SÁCH NHÂN SỰ…')
          p.write_text(s)
          PY

          cp google-apps-script/DEPLOY_NEON.gs "$RUNNER_TEMP/DEPLOY_NEON.js"
          node --check "$RUNNER_TEMP/DEPLOY_NEON.js"
          node --check web-admin/src/backend-runtime.js
          node --check web-admin/src/main.js
          grep -F "text/plain;charset=UTF-8" web-admin/src/backend-runtime.js >/dev/null
          grep -F "initial_password: body.initial_password || body.password || ''" web-admin/src/backend-runtime.js >/dev/null
          grep -F "BH_STAFF_SHEET_ID = '1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78'" google-apps-script/DEPLOY_NEON.gs >/dev/null
          grep -F "BH_STAFF_SHEET_NAME = 'DANH SÁCH NHÂN SỰ'" google-apps-script/DEPLOY_NEON.gs >/dev/null
          grep -F "const position=String(row[2]||'').trim(),contractor=String(row[3]||'').trim();" google-apps-script/DEPLOY_NEON.gs >/dev/null

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-admin/src/backend-runtime.js web-admin/src/main.js google-apps-script/DEPLOY_NEON.gs
          git diff --cached --quiet || git commit -m 'fix: repair account creation and move staff source'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy Apps Script source when OAuth capability is present
        id: gas
        shell: bash
        run: |
          set -euo pipefail
          status_dir="$RUNNER_TEMP/status"
          mkdir -p "$status_dir"
          if [ -z "${GOOGLE_OAUTH_CLIENT_ID:-}" ] || [ -z "${GOOGLE_OAUTH_CLIENT_SECRET:-}" ] || [ -z "${GOOGLE_OAUTH_REFRESH_TOKEN:-}" ] || [ -z "${GAS_SCRIPT_ID:-}" ] || [ -z "${WORKER_URL:-}" ]; then
            printf '%s\n' 'MISSING_GOOGLE_APPS_SCRIPT_OAUTH_CAPABILITY' > "$status_dir/gas.txt"
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const statusDir = path.join(process.env.RUNNER_TEMP, 'status');
          const write = (x) => fs.writeFileSync(path.join(statusDir, 'gas.txt'), x + '\n');
          async function json(url, options={}) {
            const r = await fetch(url, options);
            const text = await r.text();
            let body = {}; try { body = text ? JSON.parse(text) : {}; } catch { body = {raw:text}; }
            if (!r.ok) throw new Error(`HTTP_${r.status}:${String(body.error?.message || body.error || body.raw || '').slice(0,240)}`);
            return body;
          }
          (async()=>{
            const tokenRes = await json('https://oauth2.googleapis.com/token', {
              method:'POST', headers:{'content-type':'application/x-www-form-urlencoded'},
              body:new URLSearchParams({client_id:process.env.GOOGLE_OAUTH_CLIENT_ID,client_secret:process.env.GOOGLE_OAUTH_CLIENT_SECRET,refresh_token:process.env.GOOGLE_OAUTH_REFRESH_TOKEN,grant_type:'refresh_token'})
            });
            const access = tokenRes.access_token;
            const auth = {Authorization:`Bearer ${access}`,'content-type':'application/json'};
            const scriptId = process.env.GAS_SCRIPT_ID;
            const current = await json(`https://script.googleapis.com/v1/projects/${encodeURIComponent(scriptId)}/content`, {headers:{Authorization:`Bearer ${access}`}});
            const source = fs.readFileSync('google-apps-script/DEPLOY_NEON.gs','utf8');
            const files = Array.isArray(current.files) ? current.files : [];
            let target = files.find(f => f.type === 'SERVER_JS' && String(f.source||'').includes("const BH_PROJECT = 'bao-hang-1291'"));
            if (!target) target = files.find(f => f.type === 'SERVER_JS' && String(f.source||'').includes('function doPost'));
            if (!target) throw new Error('BAO_HANG_SERVER_JS_NOT_FOUND');
            target.source = source;
            await json(`https://script.googleapis.com/v1/projects/${encodeURIComponent(scriptId)}/content`, {method:'PUT',headers:auth,body:JSON.stringify({files})});
            const version = await json(`https://script.googleapis.com/v1/projects/${encodeURIComponent(scriptId)}/versions`, {method:'POST',headers:auth,body:JSON.stringify({description:'Báo hàng 1291 - staff source + web account fix'})});
            const deploymentId = process.env.GAS_DEPLOYMENT_ID || ((process.env.WORKER_URL.match(/\/macros\/s\/([^/]+)\/exec/)||[])[1] || '');
            if (!deploymentId) throw new Error('GAS_DEPLOYMENT_ID_MISSING');
            await json(`https://script.googleapis.com/v1/projects/${encodeURIComponent(scriptId)}/deployments/${encodeURIComponent(deploymentId)}`, {
              method:'PUT',headers:auth,body:JSON.stringify({deploymentConfig:{versionNumber:version.versionNumber,manifestFileName:'appsscript',description:'Báo hàng 1291 production'}})
            });
            const ping = await json(process.env.WORKER_URL,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'ping'})});
            if (ping.ok !== true || ping.project !== 'bao-hang-1291' || ping.staff_sheet_id !== '1E7ZWz-4eMcBliQxDYBVoogIoeSYyiaXGwj0I6mbMm78' || ping.staff_sheet_name !== 'DANH SÁCH NHÂN SỰ') throw new Error('LIVE_STAFF_SOURCE_VERIFY_FAILED');
            write(`PASS version=${version.versionNumber} source=DỮ LIỆU THEO NGÀY/DANH SÁCH NHÂN SỰ`);
          })().catch(e=>{ write(`FAIL ${String(e.message).replace(/[\r\n]+/g,' ').slice(0,300)}`); process.exitCode=0; });
          NODE

      - name: Record non-secret capability result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          gas_status="$(cat "$RUNNER_TEMP/status/gas.txt" 2>/dev/null || echo UNKNOWN)"
          printf 'web_source_fix=PASS\nstaff_source_repo=PASS\napps_script_deploy=%s\n' "$gas_status" > ops/last-web-staff-fix-status.txt
          git add ops/last-web-staff-fix-status.txt
          git diff --cached --quiet || git commit -m 'chore: record web staff fix capability result'
          git pull --rebase origin main
          git push origin HEAD:main
