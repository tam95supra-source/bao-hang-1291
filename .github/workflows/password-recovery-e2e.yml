name: Password Recovery E2E

on:
  push:
    branches: [main]
    paths:
      - 'ops/password-recovery-e2e.request'

permissions:
  contents: write
  actions: read

concurrency:
  group: bao-hang-1291-password-recovery-e2e
  cancel-in-progress: false

jobs:
  password-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATA_API: https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1
      APPS_SCRIPT_WORKER_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scope and zero-cost guard
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          test "$NEON_DATA_API" = 'https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1'
          node <<'NODE'
          const crypto=require('crypto');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          if(sa.project_id!=='bao-hang-1291'||!sa.client_email||!sa.private_key)throw new Error('FIREBASE_SCOPE');
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          const now=Math.floor(Date.now()/1000),h=enc({alg:'RS256',typ:'JWT'}),p=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900}),u=`${h}.${p}`;
          const assertion=`${u}.${crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url')}`;
          (async()=>{
            const t=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion}),signal:AbortSignal.timeout(15000)});
            if(!t.ok)throw new Error('BILLING_OAUTH_'+t.status);
            const access=(await t.json()).access_token;
            const r=await fetch('https://cloudbilling.googleapis.com/v1/projects/bao-hang-1291/billingInfo',{headers:{authorization:`Bearer ${access}`},signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw new Error('BILLING_READ_'+r.status);
            const b=await r.json();if(b.billingEnabled===true)throw new Error('COST_GUARD_STOP');
            console.log('COST_GUARD=PASS billingEnabled=false');
          })().catch(e=>{console.error(e.message);process.exit(3)});
          NODE

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install E2E runtime
        shell: bash
        run: |
          set -euo pipefail
          E2E_DIR="$RUNNER_TEMP/password-recovery-e2e"
          mkdir -p "$E2E_DIR"
          printf '{"private":true}' > "$E2E_DIR/package.json"
          npm --prefix "$E2E_DIR" install firebase-admin@13.4.0 playwright-core@1.55.0 --ignore-scripts --no-audit --no-fund --no-package-lock
          echo "E2E_DIR=$E2E_DIR" >> "$GITHUB_ENV"

      - name: Seed exact guarded fixtures
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          export E2E_RUN_MARKER="e2e-final-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export E2E_SEED_MANIFEST=".e2e-manifest/base/cleanup-manifest.json"
          NODE_PATH="$E2E_DIR/node_modules" node scripts/final-e2e-seed.cjs

      - name: Run full production password recovery E2E
        id: recovery
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          NODE_PATH="$E2E_DIR/node_modules" CHROME_BIN="$CHROME_BIN" node scripts/password-recovery-e2e.cjs

      - name: Cleanup guarded Neon and Firebase fixtures
        if: always()
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          export E2E_RUN_MARKER="e2e-final-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          MANIFEST=".e2e-manifest/base/cleanup-manifest.json"
          test -s "$MANIFEST"
          NODE_PATH="$E2E_DIR/node_modules" node scripts/final-e2e-cleanup.cjs "$MANIFEST"

      - name: Cleanup encrypted handshake files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -f ops/status/password-recovery-e2e-pending.json ops/status/password-recovery-e2e-cipher.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ops/status
          if ! git diff --cached --quiet; then
            git commit -m 'test(auth): cleanup encrypted password E2E handshake'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Final marker
        if: steps.recovery.outcome == 'success'
        shell: bash
        run: |
          echo 'PASSWORD_RECOVERY_FINAL_ACCEPTANCE=PASS'
          echo 'ANDROID_SCOPE=SKIP_WEB_ONLY'
