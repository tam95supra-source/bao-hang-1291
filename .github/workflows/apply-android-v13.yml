name: Apply Android v1.3 transformation

on:
  push:
    branches: [work/beta-catalog-staff-ux-v13]
    paths:
      - 'ops/patch_android_v13_clean.py'
      - '.github/workflows/apply-android-v13.yml'

permissions:
  contents: write

concurrency:
  group: android-v13-transform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta-catalog-staff-ux-v13
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Gradle 8.9 without cache
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/gradle-8.9-bin.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          curl -fsSLo "$RUNNER_TEMP/gradle-8.9-bin.zip.sha256" https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256
          echo "$(cat "$RUNNER_TEMP/gradle-8.9-bin.zip.sha256")  $RUNNER_TEMP/gradle-8.9-bin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Harden transformation parser and Kotlin string generation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('ops/patch_android_v13_clean.py')
          s = p.read_text(encoding='utf-8')
          override = r'''
          def brace_end(text, open_index):
              member = re.search(r'(?m)^    (?=(?:private\s+)?(?:suspend\s+)?fun\s+[A-Za-z_][A-Za-z0-9_]*\s*\(|companion\s+object\b)', text[open_index + 1:])
              if member:
                  return open_index + 1 + member.start()
              closing = re.search(r'(?m)^}\s*$', text[open_index + 1:])
              if closing:
                  return open_index + 1 + closing.start()
              raise SystemExit('Unable to find next Kotlin member boundary')
          '''
          marker = '\n# ---- Models ----\n'
          if marker not in s:
              raise SystemExit('Models marker missing')
          s = s.replace(marker, '\n' + override + marker, 1)
          s = re.sub(r'([=,+])"""', r'\1r"""', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate transformation script
        run: python -m py_compile ops/patch_android_v13_clean.py
      - name: Apply Android source transformation
        run: python ops/patch_android_v13_clean.py
      - name: Verify retired Android inventory/Supra paths
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'inventory-sync-start|inventory-credential-update|api-supra\.winmart\.vn|SCREEN_INVENTORY|TỒN SNAPSHOT' app/src/main; then
            echo 'Retired Android inventory/Supra path remains' >&2
            exit 1
          fi
          git diff --check
      - name: Compile and unit test Android
        id: android_compile
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Persist focused compile diagnostic
        if: failure() && steps.android_compile.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          { grep -E '(^e: | error: |\.kt:[0-9]+:|AAPT: error|Android resource linking failed|FAILURE: Build failed|What went wrong:|Execution failed for task)' "$RUNNER_TEMP/android-build.log" || true; } | tail -n 120 > ops/android_v13_compile_error.txt
          test -s ops/android_v13_compile_error.txt || tail -n 80 "$RUNNER_TEMP/android-build.log" > ops/android_v13_compile_error.txt
          sed -n '430,700p' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt > ops/android_v13_main_context.txt
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/android_v13_compile_error.txt ops/android_v13_main_context.txt
          git commit -m 'Capture Android v1.3 compile context' || true
          git push origin HEAD:work/beta-catalog-staff-ux-v13
      - name: Remove one-time tooling
        if: success()
        run: rm -f ops/patch_android_v13.py ops/patch_android_v13_clean.py ops/android_v13_compile_error.txt ops/android_v13_main_context.txt .github/workflows/apply-android-v13.yml
      - name: Commit Android source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No Android source changes'; exit 2; }
          git commit -m 'Implement catalog-only Android UX and final picker alerts'
          git push origin HEAD:work/beta-catalog-staff-ux-v13
