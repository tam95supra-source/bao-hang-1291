name: One-time staff picker normalize (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify canonical staff contract only
        shell: bash
        run: |
          set -euo pipefail
          node ops/staff_recover_current_source.cjs
          echo 'LEGACY_STAFF_MUTATION_WORKFLOW_RETIRED=PASS'
