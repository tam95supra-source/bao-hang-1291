name: Temp patch account create v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-patch-account-create-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Patch Web runtime and staff UI
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_account_create_v2.py
          node --check web-admin/src/backend-runtime.js
          node --check web-admin/src/ops-console.js
          grep -q 'api_admin_create_profile_rpc' web-admin/src/backend-runtime.js
          grep -q 'DỮ LIỆU THEO NGÀY' web-admin/src/ops-console.js
          ! grep -q "opsStaffSync').onclick" web-admin/src/ops-console.js
      - name: Commit Web patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-admin/src/backend-runtime.js web-admin/src/ops-console.js
          git diff --cached --quiet || git commit -m 'fix(web): create accounts without legacy Apps Script worker'
          git pull --rebase origin main
          git push origin HEAD:main
