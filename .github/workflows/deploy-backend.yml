name: Rollback-only Supabase Edge Functions

on:
  workflow_dispatch:

concurrency:
  group: supabase-rollback-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: oedasgcdjppjwidhlqdr
    steps:
      - uses: actions/checkout@v6
      - name: Fail closed on BÁO HÀNG rollback scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          test "$SUPABASE_PROJECT_ID" = 'oedasgcdjppjwidhlqdr'
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Android API Edge Function for rollback only
        run: supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy Web Admin API Edge Function for rollback only
        if: ${{ hashFiles('supabase/functions/web-api/index.ts') != '' }}
        run: supabase functions deploy web-api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy focused Admin Ops Edge Function for rollback only
        if: ${{ hashFiles('supabase/functions/admin-ops/index.ts') != '' }}
        run: supabase functions deploy admin-ops --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy lightweight Staff Watch Edge Function for rollback only
        if: ${{ hashFiles('supabase/functions/staff-watch/index.ts') != '' }}
        run: supabase functions deploy staff-watch --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy Picker withdrawal Edge Function for rollback only
        if: ${{ hashFiles('supabase/functions/issue-withdraw/index.ts') != '' }}
        run: supabase functions deploy issue-withdraw --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
