name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: supabase-edge-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: oedasgcdjppjwidhlqdr
    steps:
      - uses: actions/checkout@v6
      - name: Validate deployment credential
        shell: bash
        run: test -n "${SUPABASE_ACCESS_TOKEN:-}"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Android API Edge Function
        run: supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy Web Admin API Edge Function
        run: supabase functions deploy web-api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy focused Admin Ops Edge Function
        run: supabase functions deploy admin-ops --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy lightweight Staff Watch Edge Function
        run: supabase functions deploy staff-watch --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy event-driven Picker notification worker
        run: supabase functions deploy notification-worker --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy dedicated Google Sheet worker
        run: supabase functions deploy sheet-worker --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy fallback token issuer
        run: supabase functions deploy fallback-token --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy Emergency Firebase auth broker
        run: supabase functions deploy emergency-auth --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy Firestore-to-Sheet emergency drain helper
        run: supabase functions deploy emergency-drain --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy Sheet-to-Service recovery importer
        run: supabase functions deploy fallback-importer --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy backup technical account admin
        run: supabase functions deploy backup-account-admin --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy zero-cost Firebase bootstrap/verifier
        run: supabase functions deploy firebase-bootstrap --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
