name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

concurrency:
  group: supabase-edge-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: oedasgcdjppjwidhlqdr
    steps:
      - uses: actions/checkout@v6
      - name: Validate deployment credential
        shell: bash
        run: test -n "${SUPABASE_ACCESS_TOKEN:-}"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Android API Edge Function
        run: supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy Web Admin API Edge Function
        if: ${{ hashFiles('supabase/functions/web-api/index.ts') != '' }}
        run: supabase functions deploy web-api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy focused Admin Ops Edge Function
        if: ${{ hashFiles('supabase/functions/admin-ops/index.ts') != '' }}
        run: supabase functions deploy admin-ops --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy lightweight Staff Watch Edge Function
        if: ${{ hashFiles('supabase/functions/staff-watch/index.ts') != '' }}
        run: supabase functions deploy staff-watch --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
