name: Apply target recovery final patch

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - 'scripts/apply_target_recovery_final.py'
      - '.github/workflows/apply-target-recovery-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - name: Apply recovery hardening
        run: python3 scripts/apply_target_recovery_final.py
      - name: Keep workflow changes connector-owned
        run: git checkout HEAD -- .github/workflows/apply-target-recovery-final.yml
      - name: Validate syntax and patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cp google-apps-script/Code.gs "$RUNNER_TEMP/Code.js"
          node --check "$RUNNER_TEMP/Code.js"
          ! grep -R -n "Admin Event" web-admin/src app/src/main || true
          grep -q "EMERGENCY_CAUGHT_UP" google-apps-script/Code.gs
          grep -q "drain_identity_ready" supabase/functions/firebase-bootstrap/index.ts
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'target: harden emergency recovery and picker privacy'
          git push origin HEAD:target-final-20260814-impl
