name: Fix web realtime auth once

on:
  push:
    branches:
      - target-final-20260814-impl

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Patch realtime auth and per-channel health
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('web-admin/src/main.js')
          src = path.read_text(encoding='utf-8')
          original = src

          count = src.count('realtimeClient.realtime.setAuth(state.session.access_token);')
          if count != 2:
              raise SystemExit(f'expected 2 setAuth calls, got {count}')
          src = src.replace('realtimeClient.realtime.setAuth(state.session.access_token);', 'await realtimeClient.realtime.setAuth(state.session.access_token);')

          old = "  realtimeStatus: 'OFFLINE',\n  fallbackTimer: null,"
          new = "  realtimeStatus: 'OFFLINE',\n  channelStatus: { issue: 'OFFLINE', catalog: 'OFFLINE', staff: 'OFFLINE' },\n  fallbackTimer: null,"
          if old not in src:
              raise SystemExit('state realtimeStatus anchor missing')
          src = src.replace(old, new, 1)

          old = "  state.realtimeStatus = 'OFFLINE';\n}"
          new = "  state.realtimeStatus = 'OFFLINE';\n  state.channelStatus = { issue: 'OFFLINE', catalog: 'OFFLINE', staff: 'OFFLINE' };\n}"
          if old not in src:
              raise SystemExit('stopRealtime anchor missing')
          src = src.replace(old, new, 1)

          marker = "async function startRealtime() {"
          helper = "\n".join([
              "function expectedRealtimeKinds() {",
              "  if (role() === 'PICKER') return ['issue', 'catalog'];",
              "  if (['ADMIN', 'ADMIN_INVENT'].includes(role())) return ['issue', 'staff', 'catalog'];",
              "  return ['issue', 'catalog'];",
              "}",
              "function syncRealtimeHealth() {",
              "  const expected = expectedRealtimeKinds();",
              "  const statuses = expected.map((kind) => state.channelStatus[kind]);",
              "  const allOnline = statuses.every((status) => status === 'SUBSCRIBED');",
              "  const hasFailure = statuses.some((status) => ['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status));",
              "  if (allOnline) {",
              "    const wasOnline = state.realtimeStatus === 'ONLINE';",
              "    setRealtimeHealth('ONLINE', 'good');",
              "    clearInterval(state.fallbackTimer);",
              "    state.fallbackTimer = null;",
              "    if (!wasOnline) expected.forEach(runLiveRefresh);",
              "    return;",
              "  }",
              "  if (hasFailure) {",
              "    setRealtimeHealth('FALLBACK', 'warn');",
              "    ensureFallbackPolling();",
              "  } else {",
              "    setRealtimeHealth('ĐANG NỐI');",
              "  }",
              "}",
              "",
          ])
          if marker not in src:
              raise SystemExit('startRealtime marker missing')
          src = src.replace(marker, helper + marker, 1)

          pattern = re.compile(r"  const subscribeStatus = \(status\) => \{.*?\n  \};\n  if \(role\(\) === 'PICKER'\) \{", re.S)
          replacement = "  const subscribeStatus = (kind) => (status) => {\n    state.channelStatus[kind] = status;\n    syncRealtimeHealth();\n  };\n  if (role() === 'PICKER') {"
          src, n = pattern.subn(replacement, src, count=1)
          if n != 1:
              raise SystemExit(f'subscribeStatus block matches={n}')

          replacements = [
              (".on('broadcast', { event: 'picker_status_changed' }, () => scheduleLiveRefresh('issue'))\n      .subscribe(subscribeStatus);", ".on('broadcast', { event: 'picker_status_changed' }, () => scheduleLiveRefresh('issue'))\n      .subscribe(subscribeStatus('issue'));"),
              (".on('broadcast', { event: 'issue_changed' }, () => scheduleLiveRefresh('issue'))\n      .subscribe(subscribeStatus);", ".on('broadcast', { event: 'issue_changed' }, () => scheduleLiveRefresh('issue'))\n      .subscribe(subscribeStatus('issue'));"),
              (".on('broadcast', { event: 'staff_changed' }, () => scheduleLiveRefresh('staff')).subscribe(subscribeStatus);", ".on('broadcast', { event: 'staff_changed' }, () => scheduleLiveRefresh('staff')).subscribe(subscribeStatus('staff'));"),
              (".on('broadcast', { event: 'catalog_changed' }, () => scheduleLiveRefresh('catalog')).subscribe(subscribeStatus);", ".on('broadcast', { event: 'catalog_changed' }, () => scheduleLiveRefresh('catalog')).subscribe(subscribeStatus('catalog'));"),
          ]
          for old, new in replacements:
              if old not in src:
                  raise SystemExit('channel subscribe anchor missing')
              src = src.replace(old, new, 1)

          old = "  setTimeout(() => { if (state.realtimeStatus !== 'ONLINE') ensureFallbackPolling(); }, 6000);"
          new = "  setTimeout(() => { if (!expectedRealtimeKinds().every((kind) => state.channelStatus[kind] === 'SUBSCRIBED')) { setRealtimeHealth('FALLBACK', 'warn'); ensureFallbackPolling(); } }, 6000);"
          if old not in src:
              raise SystemExit('fallback timeout anchor missing')
          src = src.replace(old, new, 1)

          if src.count('await realtimeClient.realtime.setAuth(state.session.access_token);') != 2:
              raise SystemExit('await setAuth guard failed')
          if 'subscribe(subscribeStatus);' in src:
              raise SystemExit('stale shared subscribe status remains')
          if src == original:
              raise SystemExit('no source changes')
          path.write_text(src, encoding='utf-8')
          PY

      - name: Build Web Admin
        shell: bash
        run: |
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build

      - name: Verify realtime auth guardrails
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'await realtimeClient.realtime.setAuth(state.session.access_token);' web-admin/src/main.js)" -eq 2
          ! grep -q 'subscribe(subscribeStatus);' web-admin/src/main.js
          grep -q "subscribeStatus('issue')" web-admin/src/main.js
          grep -q 'syncRealtimeHealth' web-admin/src/main.js

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-admin/src/main.js
          git rm .github/workflows/fix-web-realtime-auth-once.yml
          git commit -m 'fix(web): authenticate private realtime channels before subscribe'
          git push origin HEAD:target-final-20260814-impl
