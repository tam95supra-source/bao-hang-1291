name: Temp dispatch staff sync retry

on:
  push:
    branches: [main]
    paths:
      - 'ops/staff-sync-retry-20260819.trigger'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch canonical staff sync
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/staff-sync.yml/dispatches" \
            -d '{"ref":"main"}'
