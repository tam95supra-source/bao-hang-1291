name: Temporary picker UX and withdrawal patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-picker-ux-withdraw.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: agent/picker-ux-withdraw-20260816
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create work branch
        run: git switch -c "$BRANCH"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3
      - name: Apply guarded product patch
        run: python3 ops/tmp_picker_patch.py
      - name: Validate expected product shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'inventSelectedTab' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt
          grep -q 'searchSkuDigits' app/src/main/java/vn/pickpack1291/baohang/data/AppDatabase.kt
          grep -q 'Người lấy hàng thu hồi SKU' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt
          grep -q 'THU HỒI BÁO THIẾU' web-admin/src/main.js
          grep -q 'withdraw_shortage_atomic' supabase/migrations/20260816083600_picker_withdraw_v1.sql
          grep -q 'issue-withdraw' .github/workflows/deploy-backend.yml
          test -s supabase/functions/issue-withdraw/index.ts
          git diff --check
      - name: Android unit test and debug build
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Web build
        run: |
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build
      - name: Type-check focused Edge Function
        run: deno check supabase/functions/_shared/fcm.ts supabase/functions/issue-withdraw/index.ts
      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app web-admin supabase .github/workflows/deploy-backend.yml .github/workflows/quality-target.yml .github/workflows/tmp-picker-ux-withdraw.yml ops/tmp_picker_patch.py
          git status --short
          git commit -m 'Improve Picker UX and add 30-second withdrawal'
          git push origin "$BRANCH"
