name: Temporary trace validated Picker packaging

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-picker-ux-withdraw.yml'

permissions:
  contents: write

jobs:
  trace-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BRANCH: agent/picker-ux-withdraw-20260816
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trace deterministic patch recreation
        shell: bash
        run: |
          set -euxo pipefail
          git switch -c "$BRANCH"
          test -s ops/tmp_picker_patch.py
          grep -n 'def sub_once' ops/tmp_picker_patch.py | head
          sed -i 's/re.subn(pattern, repl, text, count=1, flags=re.S)/re.subn(pattern, lambda _: repl, text, count=1, flags=re.S)/' ops/tmp_picker_patch.py
          echo STEP_PATCH
          python3 ops/tmp_picker_patch.py
          echo STEP_ANDROID_REPAIR
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/vn/pickpack1291/baohang/data/AppDatabase.kt')
          s=p.read_text()
          old='if (!digits.matches(Regex("\\d{3,}"))) return emptyList()'
          new='if (digits.length < 3 || !digits.all(Char::isDigit)) return emptyList()'
          print('android repair matches',s.count(old))
          if s.count(old) != 1: raise SystemExit(1)
          p.write_text(s.replace(old,new,1))
          PY
          echo STEP_EDGE_REPAIR
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/issue-withdraw/index.ts')
          s=p.read_text()
          old='const base=baseIssue(raw);delete base.report_count;issues.push({...base,status:withdrawn?"WITHDRAWN":raw.status,reported_at:source.reported_at,withdrawn_at:withdrawn?g.latest.withdrawn_at:null,withdraw_allowed_until:deadline,can_withdraw:Boolean(g.active)&&now<=new Date(deadline).getTime()});'
          new='const base=baseIssue(raw);issues.push({id:base.id,sku:base.sku,product_name:base.product_name,status:withdrawn?"WITHDRAWN":raw.status,reported_at:source.reported_at,updated_at:base.updated_at,issue_version:base.issue_version,assigned_id:base.assigned_id,withdrawn_at:withdrawn?g.latest.withdrawn_at:null,withdraw_allowed_until:deadline,can_withdraw:Boolean(g.active)&&now<=new Date(deadline).getTime()});'
          print('edge repair matches',s.count(old))
          if s.count(old) != 1: raise SystemExit(1)
          p.write_text(s.replace(old,new,1))
          PY
          echo STEP_RESTORE_HELPERS
          git restore --source=HEAD -- .github/workflows/deploy-backend.yml .github/workflows/quality-target.yml .github/workflows/tmp-picker-ux-withdraw.yml ops/tmp_picker_patch.py
          echo STEP_DIFF
          git diff --check
          git status --short
          echo TRACE_PACKAGE_PASS
