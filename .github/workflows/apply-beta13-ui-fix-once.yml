name: Apply Beta13 UI fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-beta13-ui-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply beta13 UI patch once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch Android UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt')
          s = path.read_text()

          replacements = []

          replacements.append((
'''        root.addView(tabs, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(44)))''',
'''        root.addView(tabs, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(60)))'''))

          replacements.append((
'''        val labels = listOf("Đang xử lý", "Đã có hàng", "Đã bỏ qua", "Picker thu hồi")
