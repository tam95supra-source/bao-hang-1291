name: Patch dashboard V5 delegates

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overview-reports-visual-v5
          fetch-depth: 0
      - name: Patch exact route delegates
        run: |
          python -c "from pathlib import Path; p=Path('web-admin/src/main.js'); s=p.read_text(); a=\"overview: () => requireRenderer(wv2.overview, 'Tổng quan hôm nay')(),\"; b=\"overview: () => requireRenderer(globalThis.__BH_OVERVIEW_V5_RENDER__ || wv2.overview, 'Tổng quan hôm nay')(),\"; c=\"reports: () => requireRenderer(globalThis.__BH_REPORT_V4_RENDER__ || wv2.reports, 'Báo cáo vận hành')(),\"; d=\"reports: () => requireRenderer(globalThis.__BH_REPORT_V5_RENDER__ || globalThis.__BH_REPORT_V4_RENDER__ || wv2.reports, 'Báo cáo vận hành')(),\"; assert s.count(a)==1 and s.count(c)==1; p.write_text(s.replace(a,b).replace(c,d))"
          git diff --check
          git diff -- web-admin/src/main.js
      - name: Commit feature branch patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-admin/src/main.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat(web): route overview and reports directly to dashboard v5'
          git push origin HEAD:fix/overview-reports-visual-v5
