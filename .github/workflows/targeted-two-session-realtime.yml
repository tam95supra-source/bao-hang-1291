name: Targeted Two-Session Realtime

on:
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        description: Exact production source SHA to accept
        required: true
        type: string
      production_url:
        description: Production URL
        required: true
        type: string
        default: https://bao-hang-1291.web.app

permissions:
  contents: read

jobs:
  acceptance:
    uses: ./.github/workflows/final-production-acceptance.yml
    with:
      expected_deployed_sha: ${{ inputs.expected_deployed_sha }}
      production_url: ${{ inputs.production_url }}
      acceptance_mode: targeted
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
