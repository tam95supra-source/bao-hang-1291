name: Temp repair coordinator role
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-fix-10096-role.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      ADMIN_UID: 44fae0a2-09eb-4226-8412-0f1a1f5d7ef8
      NEON_API: https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Repair MNV 10096 to ADMIN_INVENT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT),cfg=JSON.parse(fs.readFileSync('app/google-services.json','utf8')),key=cfg.client[0].api_key[0].current_key;
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          function sign(p){const h=enc({alg:'RS256',typ:'JWT'}),b=enc(p),u=h+'.'+b,s=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');return u+'.'+s}
          async function req(u,o={}){const r=await fetch(u,o),t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch{j={raw:t}};if(!r.ok)throw new Error('HTTP_'+r.status+':'+String(j?.error?.message||j?.error||j?.message||j?.raw||'').slice(0,160));return j}
          async function neon(name,p,token){return req(process.env.NEON_API+'/rpc/'+name,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify(p)})}
          (async()=>{
            const now=Math.floor(Date.now()/1000),custom=sign({iss:sa.client_email,sub:sa.client_email,aud:'https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit',iat:now,exp:now+900,uid:process.env.ADMIN_UID});
            const auth=await req('https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key='+encodeURIComponent(key),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:custom,returnSecureToken:true})});const token=auth.idToken;if(!token)throw new Error('ADMIN_TOKEN_MISSING');
            const snap=await neon('worker_profiles_snapshot_rpc',{},token),p=snap.find(x=>String(x.employee_code)==='10096');if(!p)throw new Error('PROFILE_10096_MISSING');
            const w=await req(process.env.GOOGLE_SHEET_WEBHOOK_URL,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'update-user',id_token:token,id:p.id,employee_code:'10096',full_name:'Lê Anh Cường',contractor:'Man Power',role:'ADMIN_INVENT',active:true,source_position:'Điều phối'})});if(w.ok!==true)throw new Error('WORKER_'+String(w.error||'FAILED'));
            await neon('worker_profile_upsert_rpc',{p_id:p.id,p_employee_code:'10096',p_full_name:'Lê Anh Cường',p_contractor:'Man Power',p_role:'ADMIN_INVENT',p_active:true,p_source_kind:'GSHEET',p_source_position:'Điều phối',p_protected_account:false},token);
            fs.writeFileSync('ops/staff-role-10096-repair.txt','status=PASS\nemployee_code=10096\nrole=ADMIN_INVENT\nsource_kind=GSHEET\n');
          })().catch(e=>{fs.writeFileSync('ops/staff-role-10096-repair.txt','status=FAIL\nerror='+String(e.message).replace(/[\r\n]+/g,' ').slice(0,300)+'\n');process.exit(1)});
          NODE
          cat ops/staff-role-10096-repair.txt
      - name: Commit proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add ops/staff-role-10096-repair.txt;git diff --cached --quiet || git commit -m 'chore(staff): record coordinator role repair';git pull --rebase origin main;git push origin HEAD:main
