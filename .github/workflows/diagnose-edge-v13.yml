name: Diagnose Edge v1.3 typecheck

on:
  push:
    branches: [work/beta-catalog-staff-ux-v13]
    paths:
      - '.github/workflows/diagnose-edge-v13.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta-catalog-staff-ux-v13
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3
      - name: Apply focused API fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/api/index.ts')
          s = p.read_text(encoding='utf-8')
          bad_route = 'async function route(req: Request) {async function route(req: Request) {'
          if s.count(bad_route) != 1:
              raise SystemExit(f'Expected one duplicate route marker, got {s.count(bad_route)}')
          s = s.replace(bad_route, 'async function route(req: Request) {', 1)
          bad_rpc = 'await admin.rpc("broadcast_staff_change_service",{p_payload:{run_id:run.id,status,created,updated,deactivated}}).catch(()=>{});'
          replacement = 'const {error:broadcastError}=await admin.rpc("broadcast_staff_change_service",{p_payload:{run_id:run.id,status,created,updated,deactivated}});if(broadcastError)console.warn("Staff realtime broadcast deferred",errorText(broadcastError));'
          if s.count(bad_rpc) != 1:
              raise SystemExit(f'Expected one PostgREST catch marker, got {s.count(bad_rpc)}')
          p.write_text(s.replace(bad_rpc, replacement, 1), encoding='utf-8')
          PY
      - name: Type-check and capture diagnostics
        id: check
        shell: bash
        run: |
          set +e
          deno check supabase/functions/_shared/fcm.ts supabase/functions/api/index.ts supabase/functions/web-api/index.ts > "$RUNNER_TEMP/edge-check.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/edge-check.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist fixes and diagnostics on failure
        if: steps.check.outputs.code != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/edge-check.txt" ops/edge_v13_typecheck.txt
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/api/index.ts ops/edge_v13_typecheck.txt
          git commit -m 'Fix API typecheck defects and capture remaining diagnostic'
          git push origin HEAD:work/beta-catalog-staff-ux-v13
      - name: Commit fixes and remove diagnostic tooling on success
        if: steps.check.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-edge-v13.yml ops/edge_v13_typecheck.txt
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Edge typecheck defects and remove one-time diagnostic'
          git push origin HEAD:work/beta-catalog-staff-ux-v13
