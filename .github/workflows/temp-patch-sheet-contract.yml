name: Temp patch Sheet contract
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-patch-sheet-contract.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Normalize Apps Script report contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('google-apps-script/DEPLOY_NEON.gs')
          s=p.read_text()
          s=re.sub(r"const BH_EVENT_HEADERS\s*=\s*\[[^\n]*\];", "const BH_EVENT_HEADERS = ['Mã sự kiện','Thời gian','Loại sự kiện','Ticket ID','SKU','Tên sản phẩm','Trạng thái','Số lượt báo','Người báo/Actor ID','Dữ liệu JSON'];", s, count=1)
          s=re.sub(r"const BH_ISSUE_HEADERS\s*=\s*\[[^\n]*\];", "const BH_ISSUE_HEADERS = ['Ticket ID','SKU','Tên sản phẩm','Trạng thái','Số lượt báo','Báo lần đầu','Cập nhật cuối','Invent xử lý','Số lần mở lại'];", s, count=1)
          s=re.sub(r"const BH_USER_HEADERS\s*=\s*\[[^\n]*\];", "const BH_USER_HEADERS = ['Mã nhân viên','Họ tên','Nhà thầu','Vai trò','Trạng thái','Cập nhật cuối'];", s, count=1)
          replacement=r'''function applyEvent_(event) {
  event = event || {};
  const payload = event.payload && typeof event.payload === 'object' ? event.payload : {};
  const eventType = String(event.event_type || event.type || '').trim();
  const historyId = String(event.event_id || event.queue_id || event.id || '').trim();
  if (!historyId) throw new Error('SHEET_EVENT_ID_REQUIRED');
  const issueId = String(event.issue_id || payload.id || '').trim();
  const sku = String(event.sku || payload.sku || '').trim();
  const productName = String(payload.product_name || event.product_name || '').trim();
  const status = String(payload.status || event.status || '').trim();
  const reportCount = Number(payload.report_count != null ? payload.report_count : (event.report_count || 0));
  const actorId = String(event.actor_account_id || payload.actor_id || payload.reporter_id || event.actor_user_id || '').trim();
  const eventTime = String(event.accepted_at_authority || event.created_at || payload.updated_at || '').trim();

  const history = getOrCreateSheet_('SU_KIEN', BH_EVENT_HEADERS);
  upsertByKey_(history, 1, historyId, [historyId,eventTime,eventType,issueId,sku,productName,status,reportCount,actorId,JSON.stringify(payload)]);

  if (eventType === 'USER_UPSERT') {
    const code = String(payload.employee_code || event.employee_code || '').trim();
    if (!code) return;
    const staff = getOrCreateSheet_('NHAN_SU', BH_USER_HEADERS);
    upsertByKey_(staff, 1, code, [code,String(payload.full_name || event.full_name || ''),String(payload.contractor || event.contractor || ''),String(payload.role || event.role || ''),payload.active === false ? 'Ngừng hoạt động' : 'Đang hoạt động',String(payload.updated_at || event.updated_at || eventTime)]);
    return;
  }

  if ((eventType === 'REPORT_SHORTAGE' || eventType === 'ISSUE_STATUS') && issueId) {
    const state = getOrCreateSheet_('TRANG_THAI_SKU', BH_ISSUE_HEADERS);
    upsertByKey_(state, 1, issueId, [issueId,sku,productName,status,reportCount,String(payload.reported_at || event.first_reported_at || ''),String(payload.updated_at || event.last_reported_at || eventTime),String(payload.assigned_name || event.invent_assignee_name || ''),Number(payload.reopen_count != null ? payload.reopen_count : (event.reopen_count || 0))]);
  }
}

'''
          pattern=r"function applyEvent_\(event\)\s*\{.*?\n\}\n\n(?=function upsertByKey_)"
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('applyEvent_ block not found exactly once')
          s=ns
          if "BH_REPORT_SHEET_ID = '15_AJ8oB7cEeQjeM6Jb6dm0ki6NcqyxPRVRTAvQPHVM0'" not in s:
              raise SystemExit('canonical sheet pin missing')
          if 'SpreadsheetApp.getActiveSpreadsheet()' in s:
              raise SystemExit('active spreadsheet reference remains')
          p.write_text(s)
          PY
          cp google-apps-script/DEPLOY_NEON.gs "$RUNNER_TEMP/DEPLOY_NEON.js"
          node --check "$RUNNER_TEMP/DEPLOY_NEON.js"
          grep -F "const BH_EVENT_HEADERS = ['Mã sự kiện'" google-apps-script/DEPLOY_NEON.gs >/dev/null
          grep -F "const historyId = String(event.event_id || event.queue_id || event.id || '').trim();" google-apps-script/DEPLOY_NEON.gs >/dev/null
          grep -F "BH_REPORT_SHEET_ID = '15_AJ8oB7cEeQjeM6Jb6dm0ki6NcqyxPRVRTAvQPHVM0'" google-apps-script/DEPLOY_NEON.gs >/dev/null
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google-apps-script/DEPLOY_NEON.gs
          git diff --cached --quiet || git commit -m 'fix(sheet): align worker events with Neon queue contract'
          git pull --rebase origin main
          git push origin HEAD:main
