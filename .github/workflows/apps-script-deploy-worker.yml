name: Apps Script realtime worker deploy

on:
  push:
    branches: [main, perf/candidate-20260828]
    paths:
      - 'ops/apps-script-deploy-worker.request'
      - 'ops/apps-script-deploy-worker.candidate-request'

permissions:
  contents: write
  actions: read

concurrency:
  group: bao-hang-apps-script-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch, deploy and read back realtime worker
        shell: bash
        run: |
          set -euo pipefail
          node ops/apps_script_deploy_worker.mjs
          git diff --check

      - name: Verify staging source is canonical
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- google-apps-script/DEPLOY_NEON.gs
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Commit canonical worker patch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google-apps-script/DEPLOY_NEON.gs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(realtime): prioritize worker transport over Sheet export'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify no secret material in evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s acceptance-evidence/apps-script-worker-deploy.json
          if grep -RniE 'client_secret|refresh_token|access_token|private_key' acceptance-evidence/apps-script-worker-deploy.json; then
            echo SECRET_MATERIAL_DETECTED >&2
            exit 1
          fi

      - name: Upload worker deployment evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-worker-deploy-${{ github.run_id }}
          path: acceptance-evidence/apps-script-worker-deploy.json
          retention-days: 1
          if-no-files-found: error

      - name: Final marker
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          echo "APPS_SCRIPT_WORKER_DEPLOY_ARTIFACT_ID=$ARTIFACT_ID"
          echo "APPS_SCRIPT_WORKER_DEPLOY_ACCEPTANCE=PASS"
