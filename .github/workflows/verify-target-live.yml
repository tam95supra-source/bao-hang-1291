name: Verify target live

on:
  push:
    branches: [main]
    paths:
      - 'ops/verify-target-live.request'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oedasgcdjppjwidhlqdr
    steps:
      - name: Validate management credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify deployed Edge versions and Supra master key name
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_REF" --output json > "$RUNNER_TEMP/functions.json"
          API_VERSION="$(jq -r '[.[] | select((.slug // .name)=="api")][0].version // 0' "$RUNNER_TEMP/functions.json")"
          WEB_VERSION="$(jq -r '[.[] | select((.slug // .name)=="web-api")][0].version // 0' "$RUNNER_TEMP/functions.json")"
          test "$API_VERSION" -ge 8 || { echo "api version too old: $API_VERSION" >&2; exit 1; }
          test "$WEB_VERSION" -ge 4 || { echo "web-api version too old: $WEB_VERSION" >&2; exit 1; }
          supabase secrets list --project-ref "$PROJECT_REF" > "$RUNNER_TEMP/secrets.txt"
          grep -q 'SUPRA_CREDENTIAL_MASTER_KEY' "$RUNNER_TEMP/secrets.txt"
          rm -f "$RUNNER_TEMP/functions.json" "$RUNNER_TEMP/secrets.txt"
          echo "EDGE_LIVE=PASS api=$API_VERSION web-api=$WEB_VERSION supra_master_key=present"
      - name: Verify Firebase Hosting and web API boundary
        shell: bash
        run: |
          set -euo pipefail
          WEB='https://bao-hang-1291.web.app'
          API='https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/web-api/admin-summary'
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$WEB/" -o "$RUNNER_TEMP/index.html"
          grep -q 'Báo hàng 1291' "$RUNNER_TEMP/index.html"
          curl -fsSI --retry 5 --retry-all-errors --retry-delay 2 "$WEB/" -o "$RUNNER_TEMP/headers.txt"
          grep -qi '^content-security-policy:' "$RUNNER_TEMP/headers.txt"
          grep -qi '^x-content-type-options: nosniff' "$RUNNER_TEMP/headers.txt"
          curl -sS -D "$RUNNER_TEMP/cors.txt" -o /dev/null -X OPTIONS "$API" \
            -H 'Origin: https://bao-hang-1291.web.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,apikey,content-type'
          grep -qi '^access-control-allow-origin: https://bao-hang-1291.web.app' "$RUNNER_TEMP/cors.txt"
          CODE="$(curl -sS -o "$RUNNER_TEMP/body.json" -w '%{http_code}' -X POST "$API" -H 'Origin: https://bao-hang-1291.web.app' -H 'Content-Type: application/json' -d '{}')"
          test "$CODE" = '401'
          grep -q 'Phiên đăng nhập' "$RUNNER_TEMP/body.json"
          rm -f "$RUNNER_TEMP/index.html" "$RUNNER_TEMP/headers.txt" "$RUNNER_TEMP/cors.txt" "$RUNNER_TEMP/body.json"
          echo 'WEB_LIVE=PASS hosting=ok cors=ok auth_boundary=401'
