name: Signed release validation

on:
  push:
    branches: [main]
    paths:
      - 'ops/signed-release.request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-validation
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo 'Missing KEYSTORE_BASE64' >&2; exit 1; }
          test -n "${RELEASE_STORE_PASSWORD:-}" || { echo 'Missing RELEASE_STORE_PASSWORD' >&2; exit 1; }
          test -n "${RELEASE_KEY_ALIAS:-}" || { echo 'Missing RELEASE_KEY_ALIAS' >&2; exit 1; }
          test -n "${RELEASE_KEY_PASSWORD:-}" || { echo 'Missing RELEASE_KEY_PASSWORD' >&2; exit 1; }
      - name: Restore production keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bao-hang-1291-production.jks"
          test -s "$RUNNER_TEMP/bao-hang-1291-production.jks"
      - name: Build signed production APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/bao-hang-1291-production.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon clean testReleaseUnitTest assembleRelease -PVERSION_NAME=1.0.0 -PVERSION_CODE=1
      - name: Verify APK signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
          cp "$APK" bao-hang-1291-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bao-hang-1291-signed-v1.0.0
          path: bao-hang-1291-v1.0.0.apk
          retention-days: 1
