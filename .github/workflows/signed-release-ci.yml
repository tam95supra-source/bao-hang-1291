name: Production signing rewrap

on:
  push:
    branches: [main]
    paths:
      - 'ops/signing-rewrap.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-signing-rewrap
  cancel-in-progress: false

jobs:
  rewrap-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Rewrap the existing key without key rotation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -s signing/production-signing.bundle.enc
          test -s signing/production-cert-sha256.txt
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"

          work="$RUNNER_TEMP/signing-rewrap"
          mkdir -p "$work/plain"

          old_wrap_key="$({ printf '%s\0' "$FIREBASE_SERVICE_ACCOUNT"; printf '%s\0' "$SUPABASE_ACCESS_TOKEN"; printf '%s' "$GITHUB_REPOSITORY"; } | sha256sum | awk '{print $1}')"
          echo "::add-mask::$old_wrap_key"
          OLD_WRAP_KEY="$old_wrap_key" openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -md sha256 \
            -pass env:OLD_WRAP_KEY \
            -in signing/production-signing.bundle.enc \
            -out "$work/signing.tar"

          tar -C "$work/plain" -xf "$work/signing.tar"
          test -s "$work/plain/bao-hang-1291-production.p12"
          test -s "$work/plain/signing.properties"
          source "$work/plain/signing.properties"
          echo "::add-mask::$RELEASE_STORE_PASSWORD"
          echo "::add-mask::$RELEASE_KEY_PASSWORD"

          actual_fingerprint="$(keytool -list -v \
            -keystore "$work/plain/bao-hang-1291-production.p12" \
            -storetype PKCS12 \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" 2>/dev/null \
            | sed -n 's/^.*SHA256: //p' | head -n1 \
            | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          pinned_fingerprint="$(tr -d '[:space:]' < signing/production-cert-sha256.txt | tr '[:upper:]' '[:lower:]')"
          [[ "$actual_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          test "$actual_fingerprint" = "$pinned_fingerprint"

          firebase_private_key="$(jq -er '.private_key' <<<"$FIREBASE_SERVICE_ACCOUNT")"
          new_wrap_key="$({ printf '%s\0' "$firebase_private_key"; printf '%s' "$GITHUB_REPOSITORY"; } | sha256sum | awk '{print $1}')"
          echo "::add-mask::$new_wrap_key"

          NEW_WRAP_KEY="$new_wrap_key" openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -md sha256 \
            -pass env:NEW_WRAP_KEY \
            -in "$work/signing.tar" \
            -out "$work/production-signing.bundle.enc"

          NEW_WRAP_KEY="$new_wrap_key" openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -md sha256 \
            -pass env:NEW_WRAP_KEY \
            -in "$work/production-signing.bundle.enc" \
            -out "$work/verify.tar"
          cmp -s "$work/signing.tar" "$work/verify.tar"

          mv "$work/production-signing.bundle.enc" signing/production-signing.bundle.enc
          printf '%s\n' 'firebase-service-account-private-key-v1' > signing/wrap-scheme.txt

          git config user.name 'bao-hang-1291-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add signing/production-signing.bundle.enc signing/wrap-scheme.txt
          git commit -m 'Rewrap permanent production signing bundle'
          git push origin HEAD:main
