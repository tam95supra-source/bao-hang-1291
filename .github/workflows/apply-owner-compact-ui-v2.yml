name: Apply owner compact UI v2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-owner-compact-ui-v2.yml'

permissions:
  contents: write

concurrency:
  group: apply-owner-compact-ui-v2-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch compact operational UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt')
          models_path = Path('app/src/main/java/vn/pickpack1291/baohang/data/Models.kt')
          card_path = Path('app/src/main/res/drawable/bg_card.xml')

          models = models_path.read_text(encoding='utf-8')
          old = '''    val withdrawRemainingMs: Long = 0L,
              val canWithdraw: Boolean = false
          ) {'''
          new = '''    val withdrawRemainingMs: Long = 0L,
              val canWithdraw: Boolean = false,
              val restoredAvailable: Boolean = false,
              val inventRespondedAt: String = ""
          ) {'''
          if old not in models:
              raise SystemExit('StockIssue field marker missing')
          models = models.replace(old, new, 1)
          old = '''            withdrawRemainingMs = json.optLong("withdraw_remaining_ms", 0L).coerceAtLeast(0L),
                      canWithdraw = json.optBoolean("can_withdraw", false)
                  )'''
          new = '''            withdrawRemainingMs = json.optLong("withdraw_remaining_ms", 0L).coerceAtLeast(0L),
                      canWithdraw = json.optBoolean("can_withdraw", false),
                      restoredAvailable = json.optBoolean("restored_available", false),
                      inventRespondedAt = json.optString("invent_responded_at")
                  )'''
          if old not in models:
              raise SystemExit('StockIssue JSON marker missing')
          models = models.replace(old, new, 1)
          models_path.write_text(models, encoding='utf-8')

          main = main_path.read_text(encoding='utf-8')

          # Reduce fixed operational page chrome only.
          fs = main.index('    private fun fixedPage(')
          fe = main.index('    private fun showPicker()', fs)
          fixed = main[fs:fe]
          old = 'setPadding(dp(14), dp(10), dp(14), dp(10))'
          if old not in fixed:
              raise SystemExit('fixedPage padding marker missing')
          fixed = fixed.replace(old, 'setPadding(dp(10), dp(6), dp(10), dp(6))', 1)
          main = main[:fs] + fixed + main[fe:]

          # Four Invent tabs remain on one row; narrower PDAs shrink text safely.
          ts = main.index('    private fun showInventBoard() {')
          te = main.index('    private fun issueCard(', ts)
          tabs = main[ts:te]
          tabs = tabs.replace('root.addView(tabs, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(48)))',
                              'root.addView(tabs, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(44)))', 1)
          tabs = tabs.replace('''                minHeight = dp(44)
                          setPadding(dp(2), 0, dp(2), 0)
                          setSingleLine(true)
                          setAutoSizeTextTypeUniformWithConfiguration(9, 12, 1, TypedValue.COMPLEX_UNIT_SP)''',
                              '''                minHeight = dp(40)
                          setPadding(dp(1), 0, dp(1), 0)
                          setSingleLine(true)
                          includeFontPadding = false
                          setAutoSizeTextTypeUniformWithConfiguration(7, 11, 1, TypedValue.COMPLEX_UNIT_SP)''', 1)
          tabs = tabs.replace('minWidth = dp(17)', 'minWidth = dp(14)', 1)
          tabs = tabs.replace('minHeight = dp(17)', 'minHeight = dp(14)', 1)
          tabs = tabs.replace('setPadding(dp(3), 0, dp(3), 0)', 'setPadding(dp(2), 0, dp(2), 0)', 1)
          tabs = tabs.replace('cornerRadius = dp(9).toFloat()', 'cornerRadius = dp(7).toFloat()', 1)
          tabs = tabs.replace('FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(44), Gravity.CENTER)',
                              'FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(40), Gravity.CENTER)', 1)
          tabs = tabs.replace('FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(18), Gravity.TOP or Gravity.END)',
                              'FrameLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dp(15), Gravity.TOP or Gravity.END)', 1)
          tabs = tabs.replace('LinearLayout.LayoutParams(0, dp(46), 1f)', 'LinearLayout.LayoutParams(0, dp(42), 1f)', 1)
          main = main[:ts] + tabs + main[te:]

          # Invent cards: SKU gets visual priority; count/handler are compact and single-line.
          start = main.index('    private fun issueCard(issue: StockIssue, bucket: Int, refresh: () -> Unit): View {')
          end = main.index('    private fun confirmIssueUpdate(', start)
          issue_card = r'''    private fun issueCard(issue: StockIssue, bucket: Int, refresh: () -> Unit): View {
              val elevated = app.session.effectiveRole in setOf(UserRole.ADMIN, UserRole.ADMIN_INVENT)
              val card = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(dp(7), dp(4), dp(7), dp(4))
                  setBackgroundResource(R.drawable.bg_card)
              }
              card.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                  setMargins(0, dp(1), 0, dp(1))
              }

              val header = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  gravity = Gravity.CENTER_VERTICAL
              }
              header.addView(
                  text("SKU - ${issue.sku}", 18, true).apply {
                      setSingleLine(true)
                      includeFontPadding = false
                      setAutoSizeTextTypeUniformWithConfiguration(14, 18, 1, TypedValue.COMPLEX_UNIT_SP)
                  },
                  LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
              )
              header.addView(
                  text("${issue.reportCount} lượt báo", 10, false).apply {
                      setSingleLine(true)
                      includeFontPadding = false
                      setTextColor(getColor(R.color.text_secondary))
                      setPadding(dp(5), 0, 0, 0)
                  }
              )
              card.addView(header)
              card.addView(text(issue.productName, 12, true).apply {
                  includeFontPadding = false
                  setPadding(0, dp(1), 0, dp(1))
              })

              val actor = when (bucket) {
                  3 -> issue.latestReporterName
                  else -> issue.handledByName.ifBlank { issue.assignedName }
              }
              val actorTime = when (bucket) {
                  3 -> issue.withdrawnAt.ifBlank { issue.updatedAt }
                  1, 2 -> issue.updatedAt
                  else -> if (actor.isNotBlank()) issue.updatedAt else ""
              }
              val handler = when {
                  actor.isBlank() -> "Người xử lí: Chưa nhận"
                  actorTime.isBlank() -> "Người xử lí: $actor"
                  else -> "Người xử lí: $actor lúc ${clockTime(actorTime)}"
              }
              card.addView(text(handler, 10, false).apply {
                  setTextColor(getColor(R.color.text_secondary))
                  setSingleLine(true)
                  includeFontPadding = false
                  setAutoSizeTextTypeUniformWithConfiguration(7, 10, 1, TypedValue.COMPLEX_UNIT_SP)
              })

              if (bucket == 0) {
                  val actions = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  actions.addView(
                      button("Có hàng", ButtonTone.SUCCESS) { confirmIssueUpdate(issue, "AVAILABLE", refresh) }.apply {
                          textSize = 11f
                          minHeight = dp(38)
                          setPadding(dp(3), 0, dp(3), 0)
                      },
                      LinearLayout.LayoutParams(0, dp(38), 1f).apply { setMargins(0, dp(3), dp(1), 0) }
                  )
                  actions.addView(
                      button("Cho SKIP", ButtonTone.DANGER) { confirmIssueUpdate(issue, "NOT_FOUND", refresh) }.apply {
                          textSize = 11f
                          minHeight = dp(38)
                          setPadding(dp(3), 0, dp(3), 0)
                      },
                      LinearLayout.LayoutParams(0, dp(38), 1f).apply { setMargins(dp(1), dp(3), 0, 0) }
                  )
                  card.addView(actions)
              } else if (bucket == 2) {
                  val canRestore = elevated || (app.session.effectiveRole == UserRole.INVENT && issue.assignedId == app.session.profile?.id)
                  if (canRestore) {
                      card.addView(
                          button("Báo lại đã có hàng", ButtonTone.SUCCESS) { confirmRestoreSkipped(issue, refresh) }.apply {
                              textSize = 11f
                              minHeight = dp(38)
                          },
                          LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(38)).apply { setMargins(0, dp(3), 0, 0) }
                      )
                  }
              }
              return card
          }

          '''
          main = main[:start] + issue_card + main[end:]

          # Picker entry block: remove redundant caption and tighten only this screen.
          ps = main.index('    private fun showPicker() {')
          pe = main.index('    private fun loadMyIssues(', ps)
          picker = main[ps:pe]
          redundant = '        entryRegion.addView(text("Nhập hoặc quét mã SKU", 12, true).apply { setPadding(dp(2), 0, 0, dp(4)) })\n'
          if redundant not in picker:
              raise SystemExit('picker caption marker missing')
          picker = picker.replace(redundant, '', 1)
          picker = picker.replace('setPadding(dp(10), dp(8), dp(10), dp(8))', 'setPadding(dp(7), dp(4), dp(7), dp(4))', 1)
          picker = picker.replace('setPadding(dp(12), dp(9), dp(12), dp(9))', 'setPadding(dp(7), dp(4), dp(7), dp(4))', 1)
          picker = picker.replace('cornerRadius = dp(10).toFloat()', 'cornerRadius = dp(7).toFloat()', 1)
          picker = picker.replace('LinearLayout.LayoutParams(0, dp(50), 1f).apply { setMargins(0, 0, dp(6), 0) }',
                                  'LinearLayout.LayoutParams(0, dp(46), 1f).apply { setMargins(0, 0, dp(4), 0) }', 1)
          picker = picker.replace('inputRow.addView(reportButton, LinearLayout.LayoutParams(dp(104), dp(50)))',
                                  'inputRow.addView(reportButton, LinearLayout.LayoutParams(dp(96), dp(46)))', 1)
          picker = picker.replace('setMargins(0, dp(6), 0, 0)', 'setMargins(0, dp(4), 0, 0)', 1)
          picker = picker.replace('setMargins(0, 0, 0, dp(10))', 'setMargins(0, 0, 0, dp(6))', 1)
          picker = picker.replace('text("Lịch sử báo hàng hôm nay", 14, true).apply { setPadding(dp(2), dp(2), 0, dp(6)) }',
                                  'text("Lịch sử báo hàng hôm nay", 13, true).apply { setPadding(dp(1), dp(1), 0, dp(3)) }', 1)
          picker = picker.replace('textSize = 13f\n                        minHeight = dp(44)\n                        setPadding(dp(8), 0, dp(8), 0)',
                                  'textSize = 12f\n                        minHeight = dp(40)\n                        setPadding(dp(6), 0, dp(6), 0)', 1)
          main = main[:ps] + picker + main[pe:]

          # Picker history: exact three-line compact format with audit-backed response time.
          start = main.index('    private fun loadMyIssues(target: LinearLayout) {')
          end = main.index('    private fun confirmWithdrawIssue(', start)
          history = r'''    private fun loadMyIssues(target: LinearLayout) {
              lifecycleScope.launch {
                  runCatching { app.repository.loadMyIssues() }
                      .onSuccess { issues ->
                          target.removeAllViews()
                          target.gravity = Gravity.TOP
                          val visibleIssues = issues.filter { issue ->
                              isTodayReport(issue.reportedAt) || issue.status.isOpenBucket
                          }
                          if (visibleIssues.isEmpty()) target.addView(infoBox("Chưa có lịch sử báo hàng cần hiển thị."))
                          val ordered = visibleIssues.sortedByDescending { issue ->
                              if (issue.status == IssueStatus.WITHDRAWN) issue.withdrawnAt.ifBlank { issue.reportedAt } else issue.reportedAt
                          }
                          ordered.take(50).forEach { issue ->
                              val (fillColor, strokeColor) = when {
                                  issue.status == IssueStatus.AVAILABLE -> getColor(R.color.green_50) to getColor(R.color.green_600)
                                  issue.status == IssueStatus.SKIP_ALLOWED -> getColor(R.color.red_50) to getColor(R.color.red_600)
                                  issue.status.isOpenBucket -> getColor(R.color.amber_50) to getColor(R.color.amber_500)
                                  else -> getColor(R.color.surface_subtle) to getColor(R.color.border)
                              }
                              val row = LinearLayout(this@MainActivity).apply {
                                  orientation = LinearLayout.VERTICAL
                                  setPadding(dp(7), dp(4), dp(7), dp(4))
                                  background = GradientDrawable().apply {
                                      shape = GradientDrawable.RECTANGLE
                                      cornerRadius = dp(7).toFloat()
                                      setColor(fillColor)
                                      setStroke(dp(1), strokeColor)
                                  }
                              }
                              val statusText = when {
                                  issue.status == IssueStatus.AVAILABLE && issue.restoredAvailable -> "INVENT CẬP NHẬT LẠI CÓ HÀNG"
                                  issue.status == IssueStatus.AVAILABLE -> "ĐÃ CÓ HÀNG"
                                  issue.status.isOpenBucket -> "ĐANG XỬ LÝ"
                                  issue.status == IssueStatus.SKIP_ALLOWED -> "ĐÃ BỎ QUA"
                                  issue.status == IssueStatus.WITHDRAWN -> "ĐÃ THU HỒI"
                                  else -> issue.status.label
                              }
                              row.addView(text("SKU ${issue.sku} - $statusText", 14, true).apply {
                                  setSingleLine(true)
                                  includeFontPadding = false
                                  setAutoSizeTextTypeUniformWithConfiguration(8, 14, 1, TypedValue.COMPLEX_UNIT_SP)
                              })
                              row.addView(text(issue.productName, 12, true).apply {
                                  includeFontPadding = false
                                  setPadding(0, dp(1), 0, dp(1))
                              })
                              val responseIso = issue.inventRespondedAt.ifBlank {
                                  if (issue.status in setOf(IssueStatus.AVAILABLE, IssueStatus.SKIP_ALLOWED)) issue.updatedAt else ""
                              }
                              val response = responseIso.takeIf { it.isNotBlank() }?.let(::clockTime) ?: "—"
                              row.addView(text("Báo hết ${clockTime(issue.reportedAt)}, Invent phản hồi $response", 10, false).apply {
                                  setTextColor(getColor(R.color.text_secondary))
                                  setSingleLine(true)
                                  includeFontPadding = false
                                  setAutoSizeTextTypeUniformWithConfiguration(8, 10, 1, TypedValue.COMPLEX_UNIT_SP)
                              })

                              val remainingMs = issue.withdrawRemainingMs.coerceIn(0L, 30_000L)
                              if (issue.canWithdraw && remainingMs > 0L) {
                                  val expiresAtElapsed = SystemClock.elapsedRealtime() + remainingMs
                                  lateinit var withdrawButton: Button
                                  withdrawButton = button("Thu hồi báo thiếu", ButtonTone.DANGER) {
                                      if (SystemClock.elapsedRealtime() >= expiresAtElapsed) {
                                          withdrawButton.visibility = View.GONE
                                          toast("Đã quá 30 giây nên không thể thu hồi SKU ${issue.sku}")
                                      } else confirmWithdrawIssue(issue, target, expiresAtElapsed, withdrawButton)
                                  }.apply {
                                      textSize = 11f
                                      minHeight = dp(38)
                                  }
                                  withdrawButton.postDelayed({
                                      if (SystemClock.elapsedRealtime() >= expiresAtElapsed) withdrawButton.visibility = View.GONE
                                  }, remainingMs + 25L)
                                  row.addView(withdrawButton, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(38)).apply {
                                      setMargins(0, dp(3), 0, 0)
                                  })
                              }
                              target.addView(row, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                                  setMargins(0, dp(1), 0, dp(1))
                              })
                          }
                      }.onFailure {
                          target.removeAllViews()
                          target.addView(infoBox("Không tải được lịch sử: ${it.message}"))
                      }
              }
          }

          '''
          main = main[:start] + history + main[end:]

          marker = '    private fun fullDateTime(iso: String): String {\n'
          if marker not in main:
              raise SystemExit('fullDateTime marker missing')
          helper = r'''    private fun clockTime(iso: String): String {
              if (iso.isBlank()) return "—"
              val zone = ZoneId.systemDefault()
              val value = runCatching { OffsetDateTime.parse(iso).atZoneSameInstant(zone) }
                  .recoverCatching { Instant.parse(iso).atZone(zone) }
                  .getOrNull() ?: return iso.substringAfter('T', iso).take(8)
              return DateTimeFormatter.ofPattern("HH:mm:ss").format(value)
          }

          '''
          main = main.replace(marker, helper + marker, 1)
          main_path.write_text(main, encoding='utf-8')

          card_path.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="@color/surface_card" />
              <corners android:radius="8dp" />
              <stroke android:width="1dp" android:color="@color/border" />
              <padding android:left="6dp" android:top="6dp" android:right="6dp" android:bottom="6dp" />
          </shape>
          ''', encoding='utf-8')
          print('PATCH_READY')
          PY

          grep -F 'INVENT CẬP NHẬT LẠI CÓ HÀNG' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt >/dev/null
          grep -F 'Báo hết ${clockTime(issue.reportedAt)}, Invent phản hồi $response' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt >/dev/null
          ! grep -F 'Nhập hoặc quét mã SKU' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt
          grep -F 'restoredAvailable = json.optBoolean("restored_available", false)' app/src/main/java/vn/pickpack1291/baohang/data/Models.kt >/dev/null
          grep -F 'android:radius="8dp"' app/src/main/res/drawable/bg_card.xml >/dev/null

      - name: Commit source and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-owner-compact-ui-v2.yml
          git add app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt \
                  app/src/main/java/vn/pickpack1291/baohang/data/Models.kt \
                  app/src/main/res/drawable/bg_card.xml
          git diff --cached --check
          git commit -m 'fix(android): compact invent and picker history UI'
          git pull --rebase origin main
          git push origin HEAD:main
