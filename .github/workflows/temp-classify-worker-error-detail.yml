name: Temp classify worker error detail
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-classify-worker-error-detail.yml']
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      WORKER_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Classify sanitized Apps Script error
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops "$RUNNER_TEMP/w"
          test -n "${WORKER_URL:-}"
          curl -sS -L -H 'content-type: text/plain;charset=UTF-8' --data-binary '{"action":"ping"}' "$WORKER_URL" -o "$RUNNER_TEMP/w/body"
          python3 - <<'PY' > ops/last-worker-error-detail.txt
          import os,re,html
          p=os.environ['RUNNER_TEMP']+'/w/body'
          raw=open(p,errors='replace').read(500000)
          text=html.unescape(re.sub(r'<[^>]+>',' ',raw))
          text=re.sub(r'\s+',' ',text).strip()
          classes=[]
          patterns={
            'FUNCTION_NOT_FOUND':r'Script function not found',
            'AUTHORIZATION_REQUIRED':r'Authorization is required|requires your permission|needs your permission',
            'ACCESS_DENIED':r'You do not have access|Access denied|permission denied',
            'SERVER_ERROR':r'server error|internal error',
            'EXCEPTION':r'Exception:',
            'REFERENCE_ERROR':r'ReferenceError',
            'TYPE_ERROR':r'TypeError',
            'QUOTA':r'quota|too many times|exceeded',
            'LOGIN_REQUIRED':r'Sign in|Log in|accounts\.google',
          }
          for k,patt in patterns.items():
            if re.search(patt,text,re.I): classes.append(k)
          safe=text[:350]
          safe=re.sub(r'https?://\S+','[URL]',safe)
          safe=re.sub(r'AKfy[a-zA-Z0-9_-]+','[DEPLOYMENT]',safe)
          print('class=' + ('+'.join(classes) if classes else 'UNCLASSIFIED'))
          print('safe_text=' + safe)
          PY
          cat ops/last-worker-error-detail.txt
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/last-worker-error-detail.txt
          git diff --cached --quiet || git commit -m 'chore: record worker error detail classification'
          git pull --rebase origin main
          git push origin HEAD:main
