name: Temp Web Neon compatibility fix

on:
  push:
    branches: [migration/neon-cutover]
    paths: ['.github/workflows/temp-web-neon-compat-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
          fetch-depth: 0
      - name: Patch legacy Web modules onto local compatibility transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[Path('web-admin/src/main.js'),Path('web-admin/src/ops-console.js'),Path('web-admin/src/config-realtime.js'),Path('web-admin/src/warehouse-ui-v2.js'),Path('web-admin/src/config-live.js')]
          old_url='https://oedasgcdjppjwidhlqdr.supabase.co'
          compat_url='https://compat.bao-hang-1291.invalid'
          old_key='sb_publishable_LGgDehtHMSyeJ1XyJDvQiQ_cdlqIKq7'
          for p in files:
              s=p.read_text(encoding='utf-8')
              if old_url not in s: raise SystemExit(f'missing old URL in {p}')
              p.write_text(s.replace(old_url,compat_url).replace(old_key,'compat-public'),encoding='utf-8')
          p=Path('web-admin/src/supabase-shim.js')
          s=p.read_text(encoding='utf-8')
          old="if (!url.hostname.endsWith('.supabase.co')) return originalFetch(input, init)"
          new="if (url.hostname !== 'compat.bao-hang-1291.invalid') return originalFetch(input, init)"
          if s.count(old)!=1: raise SystemExit('compat host anchor mismatch')
          s=s.replace(old,new)
          old_match="const functionMatch = url.pathname.match(/^\\/functions\\/v1\\/(web-api|api|issue-withdraw)\\/([^/]+)$/)"
          new_match="const functionMatch = url.pathname.match(/^\\/functions\\/v1\\/(web-api|api|issue-withdraw|admin-ops)\\/([^/]+)$/)"
          if s.count(old_match)!=1: raise SystemExit('function family anchor mismatch')
          s=s.replace(old_match,new_match)
          anchor="      if (family === 'issue-withdraw') {\n        action = ({ board:'withdrawn-board', search:'picker-search-digits', my:'picker-my-issues', withdraw:'withdraw-shortage' })[action] || action\n      }\n"
          extra="      if (family === 'admin-ops') {\n        if (action === 'create-user') return worker('update-user', body, init)\n        if (action === 'update-user') return worker('update-user', body, init)\n        if (action === 'delete-user') return worker('user-disable', { user_id: body.id || body.user_id }, init)\n      }\n"
          if s.count(anchor)!=1: raise SystemExit('admin ops insertion anchor mismatch')
          p.write_text(s.replace(anchor,anchor+extra),encoding='utf-8')
          p=Path('web-admin/index.html')
          s=p.read_text(encoding='utf-8')
          old_order='    <script type="module" src="/src/warehouse-ui-v2.js"></script>\n    <script type="module" src="/src/main.js"></script>\n'
          new_order='    <script type="module" src="/src/main.js"></script>\n    <script type="module" src="/src/warehouse-ui-v2.js"></script>\n'
          if s.count(old_order)!=1: raise SystemExit('index module order anchor mismatch')
          p.write_text(s.replace(old_order,new_order),encoding='utf-8')
          PY
          git diff --check
          ! grep -RInF 'oedasgcdjppjwidhlqdr.supabase.co' web-admin/src web-admin/index.html
          ! grep -RInF 'sb_publishable_LGgDehtHMSyeJ1XyJDvQiQ_cdlqIKq7' web-admin/src web-admin/index.html
          grep -Fq 'compat.bao-hang-1291.invalid' web-admin/src/supabase-shim.js
          grep -Fq 'admin-ops' web-admin/src/supabase-shim.js
      - name: Commit Web runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tam95supra-source'
          git config user.email 'tam95.supra@gmail.com'
          git add web-admin/src web-admin/index.html
          git commit -m 'fix(cutover): route legacy Web calls through Neon Firebase shim'
          git push origin HEAD:migration/neon-cutover
