name: Probe Firebase Auth initialization once

on:
  push:
    branches: [target-final-20260814-impl]
    paths: ['.github/workflows/probe-firebase-auth-init-once.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: bao-hang-1291
    steps:
      - name: Initialize Auth and enable password provider if permitted
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}'),project=process.env.FIREBASE_PROJECT_ID;
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          async function token(){const n=Math.floor(Date.now()/1000),h=enc({alg:'RS256',typ:'JWT'}),p=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:n,exp:n+900}),u=`${h}.${p}`,s=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url'),r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${u}.${s}`})});if(!r.ok)throw new Error(`OAUTH_${r.status}`);return (await r.json()).access_token}
          async function call(url,t,init={}){const r=await fetch(url,{...init,headers:{authorization:`Bearer ${t}`,'content-type':'application/json',...(init.headers||{})}}),x=await r.text();let b={};try{b=x?JSON.parse(x):{}}catch{}return{status:r.status,body:b}}
          (async()=>{if(!sa.client_email||!sa.private_key)throw new Error('SERVICE_ACCOUNT_MISSING');const t=await token();let get=await call(`https://identitytoolkit.googleapis.com/admin/v2/projects/${project}/config`,t);console.log(`AUTH_CONFIG_INITIAL_GET=${get.status}`);if(get.status===404){const init=await call(`https://identitytoolkit.googleapis.com/v2/projects/${project}/identityPlatform:initializeAuth`,t,{method:'POST',body:'{}'});console.log(`AUTH_INITIALIZE_STATUS=${init.status}_${init.body?.error?.status||'OK'}`);if(![200,201,409].includes(init.status)){process.exitCode=3;return;}get=await call(`https://identitytoolkit.googleapis.com/admin/v2/projects/${project}/config`,t);console.log(`AUTH_CONFIG_AFTER_INIT=${get.status}`);}if(get.status!==200){console.log(`AUTH_CONFIG=BLOCKED_${get.status}_${get.body?.error?.status||'UNKNOWN'}`);process.exitCode=4;return;}const patch=await call(`https://identitytoolkit.googleapis.com/admin/v2/projects/${project}/config?updateMask=signIn.email.enabled,signIn.email.passwordRequired`,t,{method:'PATCH',body:JSON.stringify({signIn:{email:{enabled:true,passwordRequired:true}}})});console.log(`AUTH_EMAIL_PROVIDER_STATUS=${patch.status}_${patch.body?.error?.status||'OK'}`);if(patch.status!==200)process.exitCode=5;else console.log('FIREBASE_EMAIL_PASSWORD_AUTH=PASS enabled=true');})().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
