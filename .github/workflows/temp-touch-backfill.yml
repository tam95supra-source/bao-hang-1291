name: Temp trigger Sheet backfill rerun
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-touch-backfill.yml']
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Trigger backfill workflow with current Neon guard
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# retry-after-neon-guard\n' >> .github/workflows/temp-neon-sheet-backfill.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/temp-neon-sheet-backfill.yml
          git commit -m 'ci(sheet): rerun canonical backfill'
          git push origin HEAD:main
