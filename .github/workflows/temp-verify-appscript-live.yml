name: Temp verify Apps Script Neon worker live
on:
  push:
    paths:
      - '.github/workflows/temp-verify-appscript-live.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ADMIN_UID: 44fae0a2-09eb-4226-8412-0f1a1f5d7ef8
      NEON_API: https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1
    steps:
      - uses: actions/checkout@v4
      - name: Verify production worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          const apiKey=JSON.parse(fs.readFileSync('app/google-services.json','utf8')).client[0].api_key[0].current_key;
          const b64u=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const input=b64u({alg:'RS256',typ:'JWT'})+'.'+b64u({iss:sa.client_email,sub:sa.client_email,aud:'https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit',iat:now,exp:now+3600,uid:process.env.ADMIN_UID});
          const custom=input+'.'+crypto.sign('RSA-SHA256',Buffer.from(input),sa.private_key).toString('base64url');
          async function post(url,body,headers={}){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',...headers},body:JSON.stringify(body)});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={raw:t}}return{status:r.status,json:j}}
          (async()=>{
            const ping=await post(process.env.WEBHOOK_URL,{action:'ping'}); assert.equal(ping.status,200); assert.equal(ping.json.provider,'NEON_FIREBASE_GOOGLE');
            const sign=await post('https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key='+encodeURIComponent(apiKey),{token:custom,returnSecureToken:true}); assert.equal(sign.status,200); assert(sign.json.idToken);
            const direct=await post(process.env.NEON_API+'/rpc/api_session_profile_rpc',{p_test_role:null},{Authorization:'Bearer '+sign.json.idToken}); assert.equal(direct.status,200); assert.equal(direct.json.effective_role,'ADMIN');
            const kick=await post(process.env.WEBHOOK_URL,{action:'worker-kick',id_token:sign.json.idToken});
            console.log('WORKER_KICK_HTTP='+kick.status);
            console.log('WORKER_KICK_OK='+String(kick.json&&kick.json.ok===true));
            console.log('WORKER_KICK_ERROR='+String(kick.json&&kick.json.error||''));
            assert(kick.json&&kick.json.ok===true,'WORKER_NOT_OK');
            console.log('SHEET_COUNT='+String(kick.json.sheet&&kick.json.sheet.count||0));
            console.log('REALTIME_COUNT='+String(kick.json.realtime&&kick.json.realtime.count||0));
            console.log('NOTIFICATION_COUNT='+String(kick.json.notifications&&kick.json.notifications.count||0));
            console.log('APPS_SCRIPT_NEON_WORKER_PASS');
          })().catch(e=>{console.error('VERIFY_FAIL='+e.message);process.exit(1)});
          NODE
