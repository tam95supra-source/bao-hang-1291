name: Temp P6 alert restore diagnostic

on:
  push:
    branches:
      - migration/neon-cutover
    paths:
      - '.github/workflows/temp-p6-business-flow-e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PICKER_UID: '24c03a64-83f1-4ff7-ae2d-0d96beb1224e'
      INVENT_UID: '44a0e427-0c65-4224-aaa3-dde76175a977'
      PICKER_EMAIL: 'p6-picker2@example.invalid'
      INVENT_EMAIL: 'p6-invent2@example.invalid'
      FIREBASE_API_KEY: 'AIzaSyB-n368fntzxsuuLlvte9NXhcuX0DDbTXM'
      NEON_API: 'https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1'
      ISSUE_A: '0fcc12ff-6c5b-45ce-964c-59729a27d284'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - name: Diagnose alert then restore existing isolated issue
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 30 | tr -d '\n')Aa1!"
          echo "::add-mask::$password"
          export TEST_PASSWORD="$password"
          cleanup() {
            node <<'NODE' >/dev/null 2>&1 || true
          const admin=require('firebase-admin');
          if(!admin.apps.length) admin.initializeApp({credential:admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT))});
          Promise.all([process.env.PICKER_UID,process.env.INVENT_UID].map(uid=>admin.auth().deleteUser(uid).catch(()=>{}))).finally(()=>process.exit(0));
          NODE
            rm -f *.p6.json
          }
          trap cleanup EXIT
          node <<'NODE'
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT))});
          (async()=>{
            for(const uid of [process.env.PICKER_UID,process.env.INVENT_UID]){try{await admin.auth().deleteUser(uid)}catch(_){}}
            await admin.auth().createUser({uid:process.env.PICKER_UID,email:process.env.PICKER_EMAIL,password:process.env.TEST_PASSWORD,emailVerified:true});
            await admin.auth().setCustomUserClaims(process.env.PICKER_UID,{role:'authenticated',app_role:'PICKER'});
            await admin.auth().createUser({uid:process.env.INVENT_UID,email:process.env.INVENT_EMAIL,password:process.env.TEST_PASSWORD,emailVerified:true});
            await admin.auth().setCustomUserClaims(process.env.INVENT_UID,{role:'authenticated',app_role:'INVENT'});
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          sleep 2
          signin(){
            local email="$1" out="$2" code
            code="$(curl -sS -o "$out" -w '%{http_code}' -H 'Content-Type: application/json' --data "$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password,returnSecureToken:true}')" "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$FIREBASE_API_KEY")"
            echo "SIGNIN_${email%%@*}_HTTP=$code" >&2
            test "$code" = 200
            jq -er '.idToken' "$out"
          }
          picker_token="$(signin "$PICKER_EMAIL" picker-login.p6.json)"
          invent_token="$(signin "$INVENT_EMAIL" invent-login.p6.json)"
          echo "::add-mask::$picker_token"; echo "::add-mask::$invent_token"
          rpc(){ local token="$1" name="$2" body="$3" out="$4"; curl -sS -o "$out" -w '%{http_code}' -H 'Content-Type: application/json' -H "Authorization: Bearer $token" --data "$body" "$NEON_API/rpc/$name"; }

          code="$(rpc "$picker_token" api_pending_alerts_rpc '{"p_test_role":null}' alerts.p6.json)"
          echo "PENDING_ALERTS_HTTP=$code"
          if test "$code" != 200; then jq -c '{code,message,details,hint}' alerts.p6.json || true; exit 1; fi
          echo "PENDING_ALERT_COUNT=$(jq '.events|length' alerts.p6.json)"
          jq -e --arg id "$ISSUE_A" '.events | any(.issue_id==$id and .status=="SKIP_ALLOWED" and .critical==true)' alerts.p6.json >/dev/null
          echo 'PENDING_ALERT_MATCH_OK'

          code="$(rpc "$invent_token" api_restore_skipped_issue_rpc "$(jq -nc --arg id "$ISSUE_A" '{p_issue_id:$id,p_reason:"P6 isolated restore",p_test_role:null}')" restore.p6.json)"
          echo "RESTORE_HTTP=$code"
          if test "$code" != 200; then jq -c '{code,message,details,hint}' restore.p6.json || true; exit 1; fi
          jq -e '.issue.status=="AVAILABLE" and .issue.restored_from_skip==true' restore.p6.json >/dev/null
          echo 'P6_ALERT_RESTORE_OK'
