name: Preserve Stable realtime join compatibility

on:
  push:
    branches:
      - work/beta-catalog-staff-ux-v13
    paths:
      - '.github/workflows/realtime-compat-v13.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta-catalog-staff-ux-v13
          fetch-depth: 0
      - name: Preserve empty legacy receive topic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/20260812230000_catalog_staff_ops_v2.sql')
          s = p.read_text(encoding='utf-8')
          old = "realtime.topic() in ('site:1291:issues','site:1291:catalog','site:1291:staff')"
          new = "realtime.topic() in ('site:1291:issues','site:1291:catalog','site:1291:staff','site:1291:inventory')"
          if s.count(old) != 1:
              raise SystemExit('Realtime policy marker mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/realtime-compat-v13.yml
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Allow empty legacy inventory realtime topic for Stable clients'
          git push origin HEAD:work/beta-catalog-staff-ux-v13
