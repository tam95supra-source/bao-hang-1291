name: Temp browser auth hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-auth-browser-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web-admin/src/supabase-shim.js')
          s = p.read_text()
          s2 = s.replace("authDomain: `${FIREBASE_PROJECT}.firebaseapp.com`,", "authDomain: `${FIREBASE_PROJECT}.web.app`,", 1)
          s2 = s2.replace("      const auth = authModule.getAuth(app)\n      authModule.setPersistence(auth, authModule.browserLocalPersistence).catch(() => {})", "      let auth\n      try {\n        auth = authModule.initializeAuth(app, { persistence: authModule.browserLocalPersistence })\n      } catch (error) {\n        if (error?.code !== 'auth/already-initialized') throw error\n        auth = authModule.getAuth(app)\n      }", 1)
          if s2 == s:
              raise SystemExit('auth patch did not apply')
          p.write_text(s2)
          p = Path('firebase.json')
          s = p.read_text()
          marker = "frame-ancestors 'none'; form-action 'self'"
          replacement = "frame-ancestors 'none'; frame-src 'self' https://bao-hang-1291.firebaseapp.com https://bao-hang-1291.web.app; form-action 'self'"
          if marker not in s:
              raise SystemExit('CSP marker missing')
          p.write_text(s.replace(marker, replacement, 1))
          PY
          git diff --check
          grep -F 'authDomain: `${FIREBASE_PROJECT}.web.app`' web-admin/src/supabase-shim.js >/dev/null
          grep -F 'initializeAuth(app' web-admin/src/supabase-shim.js >/dev/null
          grep -F "frame-src 'self' https://bao-hang-1291.firebaseapp.com https://bao-hang-1291.web.app" firebase.json >/dev/null
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-admin/src/supabase-shim.js firebase.json
          git commit -m 'fix(web): remove cross-origin Firebase Auth resolver'
          git pull --rebase origin main
          git push origin HEAD:main
