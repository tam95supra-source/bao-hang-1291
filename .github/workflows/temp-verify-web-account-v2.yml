name: Temp verify final UUID-safe Web account creation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-verify-web-account-v2.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      ADMIN_UID: 44fae0a2-09eb-4226-8412-0f1a1f5d7ef8
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Verify billing, live bundle and non-mutating worker contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops "$RUNNER_TEMP/web"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          const cfg=JSON.parse(fs.readFileSync('app/google-services.json','utf8'));
          const apiKey=cfg.client?.[0]?.api_key?.[0]?.current_key;
          const workerUrl=String(process.env.GOOGLE_SHEET_WEBHOOK_URL||'').trim();
          if(sa.project_id!=='bao-hang-1291'||!sa.client_email||!sa.private_key||!apiKey||!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(workerUrl))throw new Error('SCOPE_CONFIG');
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          const signJwt=payload=>{const h=enc({alg:'RS256',typ:'JWT'}),p=enc(payload),u=h+'.'+p,s=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');return u+'.'+s};
          async function main(){
            const now=Math.floor(Date.now()/1000);
            const assertion=signJwt({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900});
            let r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});
            if(!r.ok)throw new Error('OAUTH_'+r.status); const cloudToken=(await r.json()).access_token;
            r=await fetch('https://cloudbilling.googleapis.com/v1/projects/bao-hang-1291/billingInfo',{headers:{Authorization:'Bearer '+cloudToken}});
            if(!r.ok)throw new Error('BILLING_'+r.status); const billing=await r.json(); if(billing.billingEnabled===true)throw new Error('COST_GUARD_STOP');

            const ir=await fetch('https://bao-hang-1291.web.app/',{cache:'no-store'}); if(!ir.ok)throw new Error('WEB_'+ir.status);
            const index=await ir.text(); const srcs=[...index.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m=>m[1]); let bundle='';
            for(const src of srcs){const url=new URL(src,'https://bao-hang-1291.web.app/');const rr=await fetch(url,{cache:'no-store'});if(rr.ok)bundle+='\n'+await rr.text()}
            const transport=bundle.includes('text/plain;charset=UTF-8');
            const mapping=bundle.includes('initial_password')&&bundle.includes('body.password');
            const staff=bundle.includes('DỮ LIỆU THEO NGÀY')&&bundle.includes('DANH SÁCH NHÂN SỰ');
            const legacyButton=bundle.includes('opsStaffSync');
            const experimental=bundle.includes('api_admin_create_profile_rpc')||bundle.includes('createManagedUser');

            const custom=signJwt({iss:sa.client_email,sub:sa.client_email,aud:'https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit',iat:now,exp:now+900,uid:process.env.ADMIN_UID});
            r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key='+encodeURIComponent(apiKey),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:custom,returnSecureToken:true})});
            if(!r.ok)throw new Error('ADMIN_TOKEN_'+r.status); const adminToken=(await r.json()).idToken; if(!adminToken)throw new Error('ADMIN_TOKEN_MISSING');

            const employeeCode='ci_probe_'+String(process.env.GITHUB_RUN_ID||Date.now());
            r=await fetch(workerUrl,{method:'POST',headers:{'content-type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'update-user',id_token:adminToken,employee_code:employeeCode,full_name:'Web Account Probe',contractor:'',role:'INVENT',active:true,source_position:'',initial_password:'x'})});
            const text=await r.text(); let response={}; try{response=JSON.parse(text)}catch{}
            const contract=r.ok&&response?.ok!==true&&String(response?.error||response?.message||'').includes('PASSWORD_TOO_SHORT');

            fs.writeFileSync('ops/web-account-final-live.txt',[
              'billing=OFF','web_http=200',
              `worker_transport=${transport?'PASS':'FAIL'}`,
              `password_mapping=${mapping?'PASS':'FAIL'}`,
              `staff_source_label=${staff?'PASS':'FAIL'}`,
              `legacy_staff_button=${legacyButton?'PRESENT':'ABSENT'}`,
              `experimental_create_route=${experimental?'PRESENT':'ABSENT'}`,
              `admin_invent_create_contract=${contract?'PASS':'FAIL'}`,
              'probe_mutation=NONE'
            ].join('\n')+'\n');
            if(!transport||!mapping||!staff||legacyButton||experimental||!contract)process.exitCode=2;
          }
          main().catch(e=>{fs.writeFileSync('ops/web-account-final-live.txt','status=FAIL\nerror='+String(e.message).replace(/[\r\n]+/g,' ').slice(0,220)+'\n');process.exitCode=3});
          NODE
          cat ops/web-account-final-live.txt
          grep -q '^billing=OFF$' ops/web-account-final-live.txt
          grep -q '^worker_transport=PASS$' ops/web-account-final-live.txt
          grep -q '^password_mapping=PASS$' ops/web-account-final-live.txt
          grep -q '^staff_source_label=PASS$' ops/web-account-final-live.txt
          grep -q '^legacy_staff_button=ABSENT$' ops/web-account-final-live.txt
          grep -q '^experimental_create_route=ABSENT$' ops/web-account-final-live.txt
          grep -q '^admin_invent_create_contract=PASS$' ops/web-account-final-live.txt
          grep -q '^probe_mutation=NONE$' ops/web-account-final-live.txt
      - name: Commit proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/web-account-final-live.txt
          git diff --cached --quiet || git commit -m 'chore(web): record final account creation live proof'
          git pull --rebase origin main
          git push origin HEAD:main
# final-worker-safe-verifier: 1
