name: Configure Google Sheet webhook

on:
  push:
    branches: [main]
    paths:
      - 'ops/google-sheet-config.request'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      GOOGLE_SHEET_WEBHOOK_SECRET: ${{ secrets.GOOGLE_SHEET_WEBHOOK_SECRET }}
      PROJECT_REF: oedasgcdjppjwidhlqdr
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }
          test -n "${GOOGLE_SHEET_WEBHOOK_URL:-}" || { echo 'Missing GOOGLE_SHEET_WEBHOOK_URL' >&2; exit 1; }
          test -n "${GOOGLE_SHEET_WEBHOOK_SECRET:-}" || { echo 'Missing GOOGLE_SHEET_WEBHOOK_SECRET' >&2; exit 1; }
          case "$GOOGLE_SHEET_WEBHOOK_URL" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo 'GOOGLE_SHEET_WEBHOOK_URL must be a deployed Apps Script /exec URL' >&2; exit 1 ;;
          esac
          test ${#GOOGLE_SHEET_WEBHOOK_SECRET} -ge 32 || { echo 'GOOGLE_SHEET_WEBHOOK_SECRET must be at least 32 characters' >&2; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Store Sheet webhook in Supabase secrets
        shell: bash
        run: |
          supabase secrets set \
            GOOGLE_SHEET_WEBHOOK_URL="$GOOGLE_SHEET_WEBHOOK_URL" \
            GOOGLE_SHEET_WEBHOOK_SECRET="$GOOGLE_SHEET_WEBHOOK_SECRET" \
            --project-ref "$PROJECT_REF"
