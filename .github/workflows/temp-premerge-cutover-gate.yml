name: Temp final premerge cutover gate
on:
  push:
    branches: [migration/neon-cutover]
    paths: ['.github/workflows/temp-premerge-cutover-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APPS_SCRIPT_WORKER_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      NEON_DATA_API: https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed on project and runtime scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          test -n "${APPS_SCRIPT_WORKER_URL:-}"
          case "$APPS_SCRIPT_WORKER_URL" in https://script.google.com/macros/s/*/exec) ;; *) exit 1;; esac
          ! grep -RInE 'ttwftrooaizxmjovkbaz|pick-pack-1291\.web\.app|pick-pack-1291-primary' app/src app/build.gradle.kts web-admin/src web-admin/package.json web-admin/vite.config.js
          ! grep -RInF 'oedasgcdjppjwidhlqdr.supabase.co' app/src app/build.gradle.kts web-admin/src web-admin/package.json web-admin/vite.config.js
          grep -RInF 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech' app/build.gradle.kts web-admin/src >/dev/null
          grep -Fq 'project_id" : "bao-hang-1291"' app/google-services.json || grep -Fq '"project_id": "bao-hang-1291"' app/google-services.json
      - name: Verify live Neon auth boundary and Apps Script ping
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 3 --retry-all-errors --retry-delay 2 -o "$RUNNER_TEMP/neon.json" -w '%{http_code}' -X POST "$NEON_DATA_API/rpc/api_session_profile_rpc" -H 'Content-Type: application/json' -d '{"p_test_role":null}')"
          echo "NEON_UNAUTH_HTTP=$code"
          case "$code" in 401|403) ;; *) cat "$RUNNER_TEMP/neon.json"; exit 1;; esac
          code="$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 2 -o "$RUNNER_TEMP/apps.json" -w '%{http_code}' -H 'Content-Type: application/json' --data '{"action":"ping"}' "$APPS_SCRIPT_WORKER_URL")"
          echo "APPS_SCRIPT_PING_HTTP=$code"; test "$code" = 200
          jq -e '.ok==true and .project=="bao-hang-1291" and .provider=="NEON_FIREBASE_GOOGLE"' "$RUNNER_TEMP/apps.json" >/dev/null
      - name: Build Web Admin against Neon production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-admin/public
          cp docs/templates/MAU_NHAN_SU_BAO_HANG_1291.xlsx web-admin/public/MAU_NHAN_SU_BAO_HANG_1291.xlsx
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build
          test -s web-admin/dist/index.html
          grep -R -F 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech' web-admin/dist >/dev/null
          ! grep -R -F 'oedasgcdjppjwidhlqdr.supabase.co' web-admin/dist
          ! grep -R -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|service_role' web-admin/dist
      - name: Test and assemble Android Neon debug
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug
          generated='app/build/generated/source/buildConfig/debug/vn/pickpack1291/baohang/debug/BuildConfig.java'
          test -s "$generated"
          grep -F 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech' "$generated" >/dev/null
          grep -F 'script.google.com/macros/s/' "$generated" >/dev/null
          ! grep -F 'oedasgcdjppjwidhlqdr.supabase.co' "$generated"
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo PREMERGE_CUTOVER_GATE_PASS
