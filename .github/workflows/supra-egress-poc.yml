name: Supra egress POC

on:
  push:
    branches: [main]
    paths:
      - 'ops/supra-egress-poc.request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supra-egress-poc
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Supra transport without credentials
        shell: bash
        run: |
          set +e
          host='api-supra.winmart.vn'
          base='https://api-supra.winmart.vn'
          endpoint='/sft3-hy1/api/v1/report/stock/binStocks'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36'
          common=(
            -H 'accept: application/json, text/plain, */*'
            -H 'accept-language: en-US,en;q=0.9'
            -H 'cache-control: no-cache'
            -H 'pragma: no-cache'
            -H 'dnt: 1'
            -H 'content-type: application/json'
            -H 'withcredentials: true'
            -H 'origin: https://dashboard-supra.winmart.vn'
            -H 'referer: https://dashboard-supra.winmart.vn/'
            -A "$ua"
          )

          echo '=== DNS/TLS ==='
          getent ahostsv4 "$host" | head -n 3 || true
          timeout 15 openssl s_client -connect "$host:443" -servername "$host" -brief </dev/null 2>&1 \
            | grep -E 'CONNECTION ESTABLISHED|Protocol version|Ciphersuite|Peer certificate|Verification|DONE' || true

          echo '=== ROOT BROWSER-CONTEXT HTTP/1.1 ==='
          curl --http1.1 -sS -o /dev/null --connect-timeout 10 --max-time 15 \
            "${common[@]}" \
            -w 'ROOT_CONTEXT status=%{http_code} remote=%{remote_ip} verify=%{ssl_verify_result}\n' \
            "$base/"
          echo "ROOT_CONTEXT_EXIT=$?"

          echo '=== BINSTOCKS CONTEXT warehouse=HY1 UNSIGNED ==='
          curl --http1.1 -sS -o /dev/null --connect-timeout 10 --max-time 15 \
            "${common[@]}" -H 'warehouse: HY1' \
            -w 'BIN_HY1 status=%{http_code} remote=%{remote_ip} verify=%{ssl_verify_result}\n' \
            "$base$endpoint"
          echo "BIN_HY1_EXIT=$?"

          echo '=== BINSTOCKS CONTEXT warehouse=none UNSIGNED ==='
          curl --http1.1 -sS -o /dev/null --connect-timeout 10 --max-time 15 \
            "${common[@]}" -H 'warehouse: none' \
            -w 'BIN_NONE status=%{http_code} remote=%{remote_ip} verify=%{ssl_verify_result}\n' \
            "$base$endpoint"
          echo "BIN_NONE_EXIT=$?"

          exit 0
