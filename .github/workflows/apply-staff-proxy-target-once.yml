name: Apply private staff proxy target patch once

on:
  push:
    branches: ['ops/firebase-read-probe-20260815']
    paths: ['.github/workflows/apply-staff-proxy-target-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - name: Patch target source coherently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---- staff-watch: private Apps Script proxy + fail-safe degraded mode ----
          p=Path('supabase/functions/staff-watch/index.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
            'const STAFF_SHEET_ID = "1FRROqCp1lmkuHc3lc4UBpVI5_ZrtiPI1thlEymv458E";\nconst STAFF_SHEET_NAME = "DANH MỤC NHÂN SỰ";',
            'const STAFF_PROXY_URL = Deno.env.get("GOOGLE_SHEET_WEBHOOK_URL") ?? "";\nconst STAFF_PROXY_SECRET = Deno.env.get("GOOGLE_SHEET_WEBHOOK_SECRET") ?? "";\nconst STAFF_SOURCE_ID = "1HLBzpxHLd8qoTJopOA7M_q0dDvO56G0Tb4curKZV7EM";\nconst STAFF_SOURCE_NAME = "Trang tính1";'
          )
          old_role='''function staffRole(position: string, employeeCode: string): Role {\n  if (employeeCode === PROTECTED_ADMIN_CODE) return "ADMIN";\n  return ["chuyen vien", "truong nhom", "truong kho"].includes(normalize(position)) ? "ADMIN_INVENT" : "PICKER";\n}'''
          new_role='''function staffRole(position: string, employeeCode: string): Role {\n  if (employeeCode === PROTECTED_ADMIN_CODE) return "ADMIN";\n  const title = normalize(position);\n  return ["chuyen vien", "truong nhom", "truong kho", "truong phong"].some((prefix) => title.startsWith(prefix))\n    ? "ADMIN_INVENT"\n    : "PICKER";\n}'''
          if old_role not in s: raise SystemExit('staffRole marker missing')
          s=s.replace(old_role,new_role,1)
          new_fetch=r'''async function fetchFilteredStaff(): Promise<{ staff: Staff[]; sourceHash: string; responseBytes: number }> {
  if (!STAFF_PROXY_URL || !STAFF_PROXY_SECRET) throw new Error("SOURCE_PROXY_NOT_CONFIGURED");
  let response: Response;
  try {
    response = await fetch(STAFF_PROXY_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ mode: "staff_source", secret: STAFF_PROXY_SECRET }),
      redirect: "follow",
    });
  } catch {
    throw new Error("SOURCE_PROXY_NETWORK");
  }
  if (!response.ok) throw new Error(`SOURCE_PROXY_HTTP_${response.status}`);
  const text = await response.text();
  const responseBytes = new TextEncoder().encode(text).byteLength;
  if (!text || responseBytes > 1_000_000) throw new Error("SOURCE_PROXY_INVALID_SIZE");
  let body: any;
  try { body = JSON.parse(text); } catch { throw new Error("SOURCE_PROXY_INVALID_JSON"); }
  if (!body?.ok || !Array.isArray(body.staff)) {
    const code = String(body?.error ?? "INVALID_RESPONSE").toUpperCase().replace(/[^A-Z0-9_:-]/g, "_").slice(0, 100);
    throw new Error(`SOURCE_PROXY_${code}`);
  }
  const byCode = new Map<string, Staff>();
  for (const raw of body.staff.slice(0, 2000)) {
    const employeeCode = String(raw?.employee_code ?? "").trim();
    const fullName = String(raw?.full_name ?? "").trim();
    if (!employeeCode || !fullName || !/^[a-z0-9._-]+$/i.test(employeeCode)) continue;
    const contractor = String(raw?.contractor ?? "").trim();
    const sourcePosition = String(raw?.source_position ?? "").trim();
    byCode.set(employeeCode.toLowerCase(), {
      employee_code: employeeCode,
      full_name: fullName,
      contractor,
      source_position: sourcePosition,
      role: staffRole(sourcePosition, employeeCode),
    });
  }
  if (!byCode.size) throw new Error("SOURCE_PROXY_EMPTY_ACTIVE_1291");
  const staff = [...byCode.values()].sort((a, b) => a.employee_code.localeCompare(b.employee_code));
  const canonical = staff.map((item) => `${item.employee_code}|${item.full_name}|${item.contractor}|${item.source_position}|${item.role}`).join("\n");
  return { staff, sourceHash: await sha256(canonical), responseBytes };
}'''
          s,n=re.subn(r'async function fetchFilteredStaff\(\): Promise<\{ staff: Staff\[\]; sourceHash: string; responseBytes: number \}> \{.*?\n\}\nasync function defaultPassword',new_fetch+'\nasync function defaultPassword',s,flags=re.S)
          if n!=1: raise SystemExit(f'fetchFilteredStaff replace count={n}')
          s=s.replace('source_sheet_id: STAFF_SHEET_ID,','source_sheet_id: STAFF_SOURCE_ID,',1)
          old_catch='''  } catch (error) {\n    console.error("staff-watch", error);\n    return new Response(JSON.stringify({ error: "STAFF_WATCH_FAILED" }), { status: 500, headers: { "content-type": "application/json", "cache-control": "no-store" } });\n  }'''
          new_catch='''  } catch (error) {\n    const message = errorText(error);\n    if (message.startsWith("SOURCE_")) {\n      const errorCode = message.replace(/[^A-Z0-9_:-]/gi, "_").slice(0, 120);\n      console.warn("staff-watch source degraded", errorCode);\n      return new Response(JSON.stringify({\n        status: "DEGRADED_SOURCE_UNAVAILABLE", changed: false, preserved_existing_profiles: true, error_code: errorCode,\n      }), { status: 200, headers: { "content-type": "application/json", "cache-control": "no-store" } });\n    }\n    console.error("staff-watch", error);\n    return new Response(JSON.stringify({ error: "STAFF_WATCH_FAILED" }), { status: 500, headers: { "content-type": "application/json", "cache-control": "no-store" } });\n  }'''
          if old_catch not in s: raise SystemExit('staff catch marker missing')
          s=s.replace(old_catch,new_catch,1)
          p.write_text(s,encoding='utf-8')

          # ---- Apps Script: private staff source proxy + stale property rejection ----
          p=Path('google-apps-script/Code.gs')
          s=p.read_text(encoding='utf-8')
          marker="const DEFAULT_INDEX_SPREADSHEET_ID = '1i_KPYGsXpxCag-Oz5NkG4UmshZt2fbDFBcv1QH1-p8w';"
          addition=marker+"\nconst STAFF_SOURCE_SPREADSHEET_ID = '1HLBzpxHLd8qoTJopOA7M_q0dDvO56G0Tb4curKZV7EM';\nconst STAFF_SOURCE_SHEET_NAME = 'Trang tính1';"
          if 'const STAFF_SOURCE_SPREADSHEET_ID' not in s:
            if marker not in s: raise SystemExit('Apps Script constants marker missing')
            s=s.replace(marker,addition,1)
          dispatch="    if (mode === 'recovery_state') return json_(handleRecoveryState_(body));"
          if "mode === 'staff_source'" not in s:
            if dispatch not in s: raise SystemExit('Apps Script dispatch marker missing')
            s=s.replace(dispatch,dispatch+"\n    if (mode === 'staff_source') return json_(handleStaffSource_(body));",1)
          handler=r'''function handleStaffSource_(body) {
  requireIntegrationSecret_(body);
  const source = SpreadsheetApp.openById(STAFF_SOURCE_SPREADSHEET_ID);
  const sheet = source.getSheetByName(STAFF_SOURCE_SHEET_NAME);
  if (!sheet) throw new Error('STAFF_SOURCE_TAB_NOT_FOUND');
  const lastRow = sheet.getLastRow();
  if (lastRow < 2) throw new Error('STAFF_SOURCE_EMPTY');
  const values = sheet.getRange(2, 1, lastRow - 1, 9).getDisplayValues();
  const byCode = new Map();
  values.forEach((row) => {
    if (String(row[0] || '').trim() !== 'Kho Yên Mỹ - Hưng Yên') return;
    if (String(row[1] || '').trim() !== '1291') return;
    if (String(row[8] || '').trim().toLowerCase() !== 'đang làm việc') return;
    const employeeCode = String(row[3] || '').trim();
    const fullName = String(row[4] || '').trim();
    if (!employeeCode || !fullName) return;
    byCode.set(employeeCode.toLowerCase(), {
      employee_code: employeeCode,
      full_name: fullName,
      contractor: String(row[2] || '').trim(),
      source_position: String(row[5] || '').trim(),
    });
  });
  const staff = Array.from(byCode.values()).sort((a,b)=>String(a.employee_code).localeCompare(String(b.employee_code)));
  if (!staff.length) throw new Error('STAFF_SOURCE_EMPTY_ACTIVE_1291');
  return {
    ok: true,
    source_sheet_id: STAFF_SOURCE_SPREADSHEET_ID,
    source_sheet_name: STAFF_SOURCE_SHEET_NAME,
    source_hash: sha256Hex_(canonicalJson_(staff)),
    count: staff.length,
    staff,
  };
}

'''
          if 'function handleStaffSource_' not in s:
            idx=s.find('function handleExport_(body)')
            if idx<0: raise SystemExit('handleExport marker missing')
            s=s[:idx]+handler+s[idx:]
          old_workbook=r'''function workbook_() {
  const id = String(PropertiesService.getScriptProperties().getProperty('TARGET_SPREADSHEET_ID') || DEFAULT_TARGET_SPREADSHEET_ID).trim();
  if (id) return SpreadsheetApp.openById(id);
  throw new Error('TARGET_SPREADSHEET_ID_NOT_CONFIGURED');
}'''
          new_workbook=r'''function workbook_() {
  const configured = String(PropertiesService.getScriptProperties().getProperty('TARGET_SPREADSHEET_ID') || '').trim();
  if (configured) {
    try {
      const candidate = SpreadsheetApp.openById(configured);
      const sync = candidate.getSheetByName('SYNC_CONTROL');
      if (sync && controlValue_(candidate, 'schema_version', '') === SCHEMA_VERSION) return candidate;
    } catch (_) {}
  }
  return SpreadsheetApp.openById(DEFAULT_TARGET_SPREADSHEET_ID);
}'''
          if old_workbook not in s: raise SystemExit('workbook_ marker missing')
          s=s.replace(old_workbook,new_workbook,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          node --check <(cp google-apps-script/Code.gs /dev/stdout) 2>/dev/null || { cp google-apps-script/Code.gs "$RUNNER_TEMP/Code.js"; node --check "$RUNNER_TEMP/Code.js"; }
          git status --short
      - name: Commit and push only target source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tam95supra-source'
          git config user.email 'tam95.supra@gmail.com'
          git add google-apps-script/Code.gs supabase/functions/staff-watch/index.ts
          git diff --cached --quiet && { echo 'NO_CHANGES'; exit 0; }
          git commit -m 'target: proxy private staff source and fail safe'
          git push origin HEAD:target-final-20260814-impl