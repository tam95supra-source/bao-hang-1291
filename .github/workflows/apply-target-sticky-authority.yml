name: Apply target sticky authority patch

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - '.github/workflows/apply-target-sticky-authority.yml'

permissions:
  contents: write

concurrency:
  group: target-sticky-authority-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0
      - name: Apply idempotent source patch
        run: python3 scripts/apply_target_sticky_authority.py
      - name: Verify patch markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'preferredAuthority' app/src/main/java/vn/pickpack1291/baohang/data/SessionStore.kt
          grep -Fq 'suspend fun health()' app/src/main/java/vn/pickpack1291/baohang/network/SheetFallbackClient.kt
          grep -Fq 'preferred_authority' app/src/main/java/vn/pickpack1291/baohang/data/AppRepository.kt
          git diff --check
      - name: Commit target patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/pickpack1291/baohang/data/SessionStore.kt \
                  app/src/main/java/vn/pickpack1291/baohang/network/SheetFallbackClient.kt \
                  app/src/main/java/vn/pickpack1291/baohang/data/AppRepository.kt
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix(android): keep fallback authority sticky through recovery'
          git push origin HEAD:target-final-20260814-impl
