name: One-time patch Google Sheet sync validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sheet-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate Google Sheet response body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/api/index.ts')
          s = p.read_text()
          old = '  if (!response.ok) throw new Error(`Google Sheet ${response.status}: ${await response.text()}`);'
          new = '''  const responseText = await response.text();
  if (!response.ok) throw new Error(`Google Sheet ${response.status}: ${responseText}`);
  const sheetResult = JSON.parse(responseText) as { ok?: boolean; error?: string };
  if (sheetResult.ok !== true) throw new Error(`Google Sheet từ chối đồng bộ: ${sheetResult.error ?? "Không rõ lỗi"}`);'''
          if old not in s:
              raise SystemExit('Target response check not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/api/index.ts
          git commit -m "Validate Google Sheet webhook response before export"
          git push origin HEAD:main
