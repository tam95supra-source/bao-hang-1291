name: One-time patch Google Sheet sync validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sheet-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate Google Sheet response body
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import base64; p=Path("supabase/functions/api/index.ts"); s=p.read_text(); old=base64.b64decode("ICBpZiAoIXJlc3BvbnNlLm9rKSB0aHJvdyBuZXcgRXJyb3IoYEdvb2dsZSBTaGVldCAke3Jlc3BvbnNlLnN0YXR1c306ICR7YXdhaXQgcmVzcG9uc2UudGV4dCgpfWApOw==").decode(); new=base64.b64decode("").decode(); assert old in s, "target response check not found"; p.write_text(s.replace(old,new,1))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/api/index.ts
          git commit -m "Validate Google Sheet webhook response before export"
          git push origin HEAD:main
