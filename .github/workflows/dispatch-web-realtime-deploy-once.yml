name: Verify live realtime bundle and cleanup once

on:
  push:
    branches:
      - target-final-20260814-impl

permissions:
  contents: write

jobs:
  verify-cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl
          fetch-depth: 0

      - name: Verify deployed production bundle contains realtime UI fix
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$RUNNER_TEMP/live-index.html"
          JS="$RUNNER_TEMP/live-app.js"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://bao-hang-1291.web.app/ -o "$INDEX"
          ASSET="$(grep -oE 'src="/assets/index-[^"]+\.js"' "$INDEX" | head -1 | cut -d'"' -f2)"
          test -n "$ASSET"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://bao-hang-1291.web.app$ASSET" -o "$JS"
          grep -q 'picker_status_changed' "$JS"
          ! grep -q 'picker_alert' "$JS"
          echo "LIVE_REALTIME_BUNDLE=PASS asset=$ASSET"

      - name: Remove one-shot verifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-web-realtime-deploy-once.yml
          git commit -m "ops: remove one-shot web realtime verifier"
          git push origin HEAD:target-final-20260814-impl
