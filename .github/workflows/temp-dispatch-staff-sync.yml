name: Temp dispatch steady-state staff sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-dispatch-staff-sync.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch staff-sync.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/tam95supra-source/bao-hang-1291/actions/workflows/staff-sync.yml/dispatches \
            -d '{"ref":"main"}'
          echo STAFF_SYNC_DISPATCH=PASS
# trigger: run-now
