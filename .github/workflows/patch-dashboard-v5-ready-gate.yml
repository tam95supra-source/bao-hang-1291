name: Patch dashboard V5 ready-state gate

on:
  push:
    branches:
      - fix/dashboard-v5-ready-state-gate
    paths:
      - .github/workflows/patch-dashboard-v5-ready-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-v5-ready-state-gate
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patch-dashboard-v5-ready.py
      - name: Validate
        run: |
          node --check scripts/web-shell-consistency-e2e.cjs
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/web-shell-consistency-e2e.cjs web-admin/index.html
          git diff --cached --quiet && exit 0
          git commit -m "test(web): require fully rendered dashboard V5 in production"
          git push origin HEAD:fix/dashboard-v5-ready-state-gate
