name: Final repository cleanup v1.3

on:
  push:
    branches:
      - work/beta-catalog-staff-ux-v13
    paths:
      - '.github/workflows/repo-cleanup-v13.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta-catalog-staff-ux-v13
          fetch-depth: 0
      - name: Remove transient and retired repository files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ops/__pycache__
          rm -f ops/provision-supra-master-key.request
          rm -f ops/CLEANUP_V13_PENDING.txt ops/.cleanup-placeholder
          rm -f ops/cleanup-final-v13.request ops/cleanup-final-v13-2.request ops/cleanup-final-v13-3.request
          grep -qxF '__pycache__/' .gitignore || printf '\n__pycache__/\n' >> .gitignore
          grep -qxF '*.pyc' .gitignore || printf '*.pyc\n' >> .gitignore
          rm -f .github/workflows/repo-cleanup-v13.yml
          git diff --check
          if find . -type d -name __pycache__ -print -quit | grep -q .; then echo '__pycache__ remains' >&2; exit 1; fi
          if find . -type f -name '*.pyc' -print -quit | grep -q .; then echo '*.pyc remains' >&2; exit 1; fi
          test ! -e ops/provision-supra-master-key.request
      - name: Commit clean repository state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove transient build files and retired provisioning request'
          git push origin HEAD:work/beta-catalog-staff-ux-v13
