name: Temp P6 Apps Script diagnostic validation

on:
  push:
    branches:
      - migration/neon-cutover
    paths:
      - '.github/workflows/temp-p6-firebase-drive-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      FIREBASE_API_KEY: 'AIzaSyB-n368fntzxsuuLlvte9NXhcuX0DDbTXM'
      PICKER_UID: 'a8d5f1e7-4c4b-4e07-8f78-19c1a809f401'
      ADMIN_UID: 'b7e4e019-1fa9-4e81-aed0-d46ee0655f02'
      PICKER_EMAIL: 'p6-log-picker@example.invalid'
      ADMIN_EMAIL: 'p6-log-admin@example.invalid'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/neon-cutover
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - name: Diagnose Apps Script Drive diagnostic roundtrip
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 30 | tr -d '\n')Aa1!"
          echo "::add-mask::$password"; export TEST_PASSWORD="$password"
          cleanup() {
            node <<'NODE' >/dev/null 2>&1 || true
          const admin=require('firebase-admin');
          if(!admin.apps.length) admin.initializeApp({credential:admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT))});
          Promise.all([process.env.PICKER_UID,process.env.ADMIN_UID].map(uid=>admin.auth().deleteUser(uid).catch(()=>{}))).finally(()=>process.exit(0));
          NODE
            rm -f *.p6.json *.p6.gz p6-log.gz p6-log.txt
          }
          trap cleanup EXIT
          node <<'NODE'
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT))});
          (async()=>{
            for(const uid of [process.env.PICKER_UID,process.env.ADMIN_UID]){try{await admin.auth().deleteUser(uid)}catch(_){}}
            await admin.auth().createUser({uid:process.env.PICKER_UID,email:process.env.PICKER_EMAIL,password:process.env.TEST_PASSWORD,emailVerified:true});
            await admin.auth().setCustomUserClaims(process.env.PICKER_UID,{role:'authenticated',app_role:'PICKER'});
            await admin.auth().createUser({uid:process.env.ADMIN_UID,email:process.env.ADMIN_EMAIL,password:process.env.TEST_PASSWORD,emailVerified:true});
            await admin.auth().setCustomUserClaims(process.env.ADMIN_UID,{role:'authenticated',app_role:'ADMIN_INVENT'});
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          sleep 2
          signin(){
            local email="$1" out="$2" code
            code="$(curl -sS -o "$out" -w '%{http_code}' -H 'Content-Type: application/json' --data "$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password,returnSecureToken:true}')" "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$FIREBASE_API_KEY")"
            echo "SIGNIN_HTTP=$code" >&2; test "$code" = 200; jq -er '.idToken' "$out"
          }
          picker_token="$(signin "$PICKER_EMAIL" picker-login.p6.json)"
          admin_token="$(signin "$ADMIN_EMAIL" admin-login.p6.json)"
          echo "::add-mask::$picker_token"; echo "::add-mask::$admin_token"
          printf '%s\n' '{"marker":"P6_DRIVE_DIAGNOSTIC","project":"bao-hang-1291"}' > p6-log.txt
          gzip -n -c p6-log.txt > p6-log.gz
          sha="$(sha256sum p6-log.gz | awk '{print $1}')"; b64="$(base64 -w0 p6-log.gz)"
          jq -nc --arg token "$picker_token" --arg data "$b64" --arg sha "$sha" '{action:"upload-log",id_token:$token,gzip_base64:$data,sha256:$sha,device_name:"P6_ISOLATED",app_version:"P6_VALIDATION"}' > upload-body.p6.json
          code="$(curl -sS -L -H 'Content-Type: application/json' --data-binary @upload-body.p6.json -o upload.p6.json -w '%{http_code}' "$GOOGLE_SHEET_WEBHOOK_URL")"
          echo "UPLOAD_HTTP=$code"
          err="$(jq -r '.error // empty' upload.p6.json 2>/dev/null || true)"
          if test -n "$err"; then echo "UPLOAD_ERROR=$err"; exit 1; fi
          jq -e '.uploaded==true and (.id|type)=="string"' upload.p6.json >/dev/null || { echo 'UPLOAD_RESPONSE_SHAPE_FAILED'; exit 1; }
          log_id="$(jq -er '.id' upload.p6.json)"
          echo 'UPLOAD_OK'
          jq -nc --arg token "$admin_token" --arg id "$log_id" '{action:"download-log",id_token:$token,id:$id}' > download-body.p6.json
          code="$(curl -sS -L -H 'Content-Type: application/json' --data-binary @download-body.p6.json -o download.p6.json -w '%{http_code}' "$GOOGLE_SHEET_WEBHOOK_URL")"
          echo "DOWNLOAD_HTTP=$code"
          err="$(jq -r '.error // empty' download.p6.json 2>/dev/null || true)"
          if test -n "$err"; then echo "DOWNLOAD_ERROR=$err"; exit 1; fi
          jq -e '.ok==true and (.gzip_base64|type)=="string"' download.p6.json >/dev/null || { echo 'DOWNLOAD_RESPONSE_SHAPE_FAILED'; exit 1; }
          jq -r '.gzip_base64' download.p6.json | base64 -d > downloaded.p6.gz
          test "$(sha256sum downloaded.p6.gz | awk '{print $1}')" = "$sha"
          echo 'APPS_SCRIPT_DRIVE_DIAGNOSTIC_ROUNDTRIP_OK'
