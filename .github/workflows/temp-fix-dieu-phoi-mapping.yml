name: Temp fix Điều phối mapping
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-fix-dieu-phoi-mapping.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Fix coordinator normalization and queue reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/temp-cutover-staff-source.yml');s=p.read_text(encoding='utf-8')
          old="""          def upper_ascii(s):
              s=unicodedata.normalize('NFD',str(s or ''))
              return ''.join(c for c in s if unicodedata.category(c)!='Mn').upper()
"""
          new="""          def upper_ascii(s):
              s=unicodedata.normalize('NFD',str(s or '')).replace('Đ','D').replace('đ','d')
              return ''.join(c for c in s if unicodedata.category(c)!='Mn').upper()
"""
          if old not in s and new not in s: raise SystemExit('CUTOVER_MAPPING_BLOCK_NOT_FOUND')
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          
          p=Path('google-apps-script/DEPLOY_NEON.gs');s=p.read_text(encoding='utf-8')
          s=s.replace(".normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();",".normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/Đ/g,'D').toUpperCase();")
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "replace('Đ','D').replace('đ','d')" .github/workflows/temp-cutover-staff-source.yml
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/temp-cutover-staff-source.yml google-apps-script/DEPLOY_NEON.gs
          git diff --cached --quiet || git commit -m 'fix(staff): normalize Điều phối role mapping'
          git pull --rebase origin main
          git push origin HEAD:main
