name: Firebase Billing Read Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-billing-read-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify project read permission for billing guard
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          const enc = (v) => Buffer.from(typeof v === 'string' ? v : JSON.stringify(v)).toString('base64url');
          async function token() {
            const now = Math.floor(Date.now() / 1000);
            const header = enc({ alg: 'RS256', typ: 'JWT' });
            const claim = enc({ iss: sa.client_email, scope: 'https://www.googleapis.com/auth/cloud-platform.read-only', aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 900 });
            const unsigned = `${header}.${claim}`;
            const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), sa.private_key).toString('base64url');
            const res = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth-type:jwt-bearer'.replace('oauth-type','oauth-grant-type'), assertion: `${unsigned}.${signature}` }),
            });
            if (!res.ok) throw new Error(`OAuth token HTTP ${res.status}`);
            return (await res.json()).access_token;
          }
          async function main() {
            const access = await token();
            const res = await fetch('https://cloudresourcemanager.googleapis.com/v1/projects/831583541434', { headers: { Authorization: `Bearer ${access}` } });
            const raw = await res.text();
            if (!res.ok) {
              let j = {}; try { j = JSON.parse(raw); } catch {}
              console.error(`PROJECT_READ_HTTP=${res.status}`);
              console.error(`PROJECT_READ_STATUS=${String(j?.error?.status || 'unknown')}`);
              console.error(`PROJECT_READ_MESSAGE=${String(j?.error?.message || 'unknown').replace(/[\r\n]+/g, ' ')}`);
              process.exitCode = 2; return;
            }
            const j = JSON.parse(raw);
            if (j.projectId !== 'bao-hang-1291') throw new Error('Unexpected project');
            console.log('PROJECT_READ_PERMISSION=PASS');
          }
          main().catch((e) => { console.error(e.message); process.exitCode = 2; });
          NODE
