name: Firebase Billing Read Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-billing-read-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose Cloud Billing read access
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (!sa.client_email || !sa.private_key) throw new Error('Service account JSON incomplete');
          const enc = (v) => Buffer.from(typeof v === 'string' ? v : JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = enc({ alg: 'RS256', typ: 'JWT' });
          const claim = enc({
            iss: sa.client_email,
            scope: 'https://www.googleapis.com/auth/cloud-billing.readonly',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 900,
          });
          const unsigned = `${header}.${claim}`;
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), sa.private_key).toString('base64url');
          const assertion = `${unsigned}.${signature}`;
          async function main() {
            const tokenRes = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion }),
            });
            if (!tokenRes.ok) throw new Error(`OAuth token HTTP ${tokenRes.status}`);
            const token = await tokenRes.json();
            const billingRes = await fetch('https://cloudbilling.googleapis.com/v1/projects/bao-hang-1291/billingInfo', {
              headers: { Authorization: `Bearer ${token.access_token}` },
            });
            const raw = await billingRes.text();
            if (!billingRes.ok) {
              let info = {};
              try { info = JSON.parse(raw); } catch {}
              const err = info.error || {};
              console.error(`CLOUD_BILLING_HTTP=${billingRes.status}`);
              console.error(`CLOUD_BILLING_STATUS=${String(err.status || 'unknown')}`);
              console.error(`CLOUD_BILLING_MESSAGE=${String(err.message || 'unknown').replace(/[\r\n]+/g, ' ')}`);
              const detail = Array.isArray(err.details) ? err.details.find((d) => d && d.reason) : null;
              if (detail) {
                console.error(`CLOUD_BILLING_REASON=${String(detail.reason)}`);
                if (detail.metadata?.permission) console.error(`CLOUD_BILLING_PERMISSION=${String(detail.metadata.permission)}`);
                if (detail.metadata?.service) console.error(`CLOUD_BILLING_SERVICE=${String(detail.metadata.service)}`);
              }
              process.exitCode = 2;
              return;
            }
            const info = JSON.parse(raw);
            console.log(`FIREBASE_BILLING_ENABLED=${info.billingEnabled === true ? 'true' : 'false'}`);
            if (info.billingEnabled === true) process.exitCode = 3;
          }
          main().catch((e) => { console.error(e.message); process.exitCode = 2; });
          NODE
