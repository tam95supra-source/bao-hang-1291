name: Temp web Supabase audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-web-supabase-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Audit source and built web runtime
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SOURCE_SUPABASE_REFERENCES ==='
          grep -RniE 'supabase|oedasgcdjppjwidhlqdr|ap-northeast-2|compat\.bao-hang-1291\.invalid|/auth/v1|/rest/v1|/functions/v1' web-admin --exclude-dir=node_modules --exclude='package-lock.json' || true
          echo '=== ACTUAL_SUPABASE_HOST_REFERENCES ==='
          grep -RniE 'https://[^[:space:]"'"']*supabase\.co|oedasgcdjppjwidhlqdr\.supabase\.co' web-admin --exclude-dir=node_modules --exclude='package-lock.json' || true
          cd web-admin
          npm ci --no-audit --no-fund
          npm run build
          echo '=== DIST_SUPABASE_REFERENCES ==='
          grep -RnioE 'supabase|oedasgcdjppjwidhlqdr|ap-northeast-2|supabase\.co|compat\.bao-hang-1291\.invalid' dist || true
          echo '=== DIST_ACTUAL_SUPABASE_HOST_REFERENCES ==='
          if grep -RniE 'https://[^[:space:]"'"']*supabase\.co|oedasgcdjppjwidhlqdr\.supabase\.co' dist; then
            echo 'ACTUAL_SUPABASE_RUNTIME_FOUND'
            exit 1
          fi
          echo 'NO_ACTUAL_SUPABASE_NETWORK_TARGET_IN_DIST'
