name: Agent no-queue UI validation

on:
  push:
    branches:
      - agent/no-queue-bottom-ui-20260816
    paths:
      - .automation/run-no-queue-ui

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3
      - name: Apply guarded product patch
        run: |
          set -euo pipefail
          python3 .automation/patch_no_queue_ui.py
          git diff --check
      - name: Android unit test and debug build
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Install pinned web dependencies
        run: npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Web production build
        run: npm --prefix web-admin run build
      - name: Web secret and size guard
        shell: bash
        run: |
          set -euo pipefail
          test -f web-admin/dist/index.html
          if grep -R -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|service_role|SUPRA_CREDENTIAL_MASTER_KEY|encrypted_credential_bundle' web-admin/dist; then
            echo 'Secret-like server material found in static build' >&2
            exit 1
          fi
          shopt -s nullglob
          app_js=(web-admin/dist/assets/index-*.js)
          test ${#app_js[@]} -ge 1
          js_gzip=$(gzip -c "${app_js[0]}" | wc -c)
          test "$js_gzip" -le 153600
          echo "WEB_BUDGET=PASS initial_js_gzip=$js_gzip"
      - name: Type-check Android API Edge Function
        run: deno check supabase/functions/api/index.ts
      - name: Public-source secret guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --exclude='*.example' '^[[:space:]]*-----BEGIN (RSA )?PRIVATE KEY-----|"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^$[:space:]]|RELEASE_STORE_PASSWORD[[:space:]]*=[[:space:]]*[^$[:space:]]' app web-admin supabase; then
            echo 'Possible secret material detected' >&2
            exit 1
          fi
          echo SECRET_GUARD=PASS
      - name: Commit validated product files only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/res/layout/activity_main.xml \
            app/src/main/res/layout/activity_login.xml \
            app/src/main/java/vn/pickpack1291/baohang/data/Models.kt \
            app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt \
            supabase/functions/api/index.ts \
            web-admin/src/main.js \
            web-admin/src/warehouse-ui-v2.js \
            web-admin/src/warehouse-ui-v2.css
          git diff --cached --check
          git diff --cached --quiet && { echo 'No product changes'; exit 1; }
          git commit -m 'Remove issue queue and redesign bottom workflows'
          git push origin HEAD:agent/no-queue-bottom-ui-20260816
