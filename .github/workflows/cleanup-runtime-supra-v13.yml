name: Cleanup runtime Supra references v1.3

on:
  push:
    branches: [work/beta-catalog-staff-ux-v13]
    paths:
      - '.github/workflows/cleanup-runtime-supra-v13.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/beta-catalog-staff-ux-v13
          fetch-depth: 0
      - name: Remove residual runtime copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
            Path('app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt'): [
              ('Quản trị vận hành Báo hàng 1291. Tồn Bin chỉ được dùng làm file nguồn SKU / tên sản phẩm; không sử dụng phiên hoặc credential Supra.',
               'Quản trị vận hành Báo hàng 1291. File Tồn Bin chỉ dùng để cập nhật SKU và tên sản phẩm; hệ thống không lưu dữ liệu tồn kho chi tiết.'),
            ],
            Path('web-admin/src/main.js'): [
              ('Web không chứa service-role key, credential Supra hoặc private key.',
               'Web không chứa service-role key, thông tin xác thực máy chủ hoặc private key.'),
            ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Assert Supra runtime is retired
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -i --exclude='*.map' -E 'api-supra|SUPRA_CREDENTIAL|credential Supra|kết nối Supra|Supra session|SUPRA_POC|SOURCE_CONTRACT' app/src/main supabase/functions web-admin/src; then
            echo 'Runtime Supra integration reference remains' >&2
            exit 1
          fi
          git diff --check
      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-runtime-supra-v13.yml
          git config user.name 'bao-hang-1291-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove residual Supra runtime references'
          git push origin HEAD:work/beta-catalog-staff-ux-v13
