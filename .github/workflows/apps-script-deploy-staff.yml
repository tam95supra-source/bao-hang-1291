name: Apps Script canonical deploy

on:
  push:
    branches: [main]
    paths:
      - 'ops/apps-script-deploy-staff.request'

permissions:
  contents: write
  actions: read

concurrency:
  group: bao-hang-apps-script-staff-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      APPS_SCRIPT_OAUTH_CLIENT_ID: ${{ secrets.APPS_SCRIPT_OAUTH_CLIENT_ID }}
      APPS_SCRIPT_OAUTH_CLIENT_SECRET: ${{ secrets.APPS_SCRIPT_OAUTH_CLIENT_SECRET }}
      APPS_SCRIPT_OAUTH_REFRESH_TOKEN: ${{ secrets.APPS_SCRIPT_OAUTH_REFRESH_TOKEN }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
      GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify authority and deploy canonical Apps Script sources
        id: canonical_deploy
        shell: bash
        run: |
          set -euo pipefail
          node ops/apps_script_deploy_staff.mjs
          node ops/apps_script_deploy_worker.mjs
          git diff --check

      - name: Configure password recovery Gmail OAuth
        shell: bash
        run: |
          set -euo pipefail
          node ops/configure_password_recovery_mail.cjs
          echo 'PASSWORD_RESET_MAIL_RUNTIME=PASS'

      - name: Verify completed orphan cleanup receipt
        id: orphan_cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          node <<'NODE'
          const fs = require('fs');
          const path = 'ops/status/staff-orphan-cleanup-last.json';
          const receipt = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (receipt.status !== 'PASS' || receipt.cleanup !== 'success') {
            throw new Error('STAFF_ORPHAN_CLEANUP_RECEIPT_NOT_PASS');
          }
          const evidence = {
            status: 'PASS',
            mode: 'VERIFIED_PRIOR_RECEIPT_NO_RERUN',
            workflow: receipt.workflow,
            run_id: receipt.run_id,
            run_attempt: receipt.run_attempt,
            trigger_sha: receipt.trigger_sha,
            cleanup: receipt.cleanup
          };
          fs.writeFileSync('acceptance-evidence/staff-orphan-cleanup.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log('STAFF_ORPHAN_CLEANUP_PRIOR_RECEIPT=PASS');
          console.log('STAFF_ORPHAN_CLEANUP_RERUN=SKIPPED_ALREADY_PASS');
          NODE

      - name: Commit canonical source normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google-apps-script/STAFF_SOURCE_BRIDGE_RECEIVER.gs google-apps-script/DEPLOY_NEON.gs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(realtime): deploy canonical Apps Script worker fast path'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify no secret material in evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s acceptance-evidence/apps-script-deploy.json
          test -s acceptance-evidence/apps-script-worker-deploy.json
          test -s acceptance-evidence/staff-orphan-cleanup.json
          if grep -RniE 'client_secret|refresh_token|access_token|private_key' acceptance-evidence/apps-script-deploy.json acceptance-evidence/apps-script-worker-deploy.json acceptance-evidence/staff-orphan-cleanup.json; then
            echo SECRET_MATERIAL_DETECTED >&2
            exit 1
          fi

      - name: Upload Apps Script deployment evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-canonical-deploy-${{ github.run_id }}
          path: |
            acceptance-evidence/apps-script-deploy.json
            acceptance-evidence/apps-script-worker-deploy.json
            acceptance-evidence/staff-orphan-cleanup.json
          retention-days: 1
          if-no-files-found: error

      - name: Final marker
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          echo "APPS_SCRIPT_DEPLOY_ARTIFACT_ID=$ARTIFACT_ID"
          echo "APPS_SCRIPT_STAFF_DEPLOY_ACCEPTANCE=PASS"
          echo "APPS_SCRIPT_WORKER_DEPLOY_ACCEPTANCE=PASS"
          echo "STAFF_ORPHAN_CLEANUP=PASS"

      - name: Publish sanitized run receipt
        if: always()
        shell: bash
        env:
          CANONICAL_DEPLOY_OUTCOME: ${{ steps.canonical_deploy.outcome }}
          ORPHAN_CLEANUP_OUTCOME: ${{ steps.orphan_cleanup.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ops/status
          python3 - <<'PY'
          import json, os
          outcomes={
            "canonical_deploy":os.environ.get("CANONICAL_DEPLOY_OUTCOME",""),
            "orphan_cleanup":os.environ.get("ORPHAN_CLEANUP_OUTCOME",""),
            "evidence":os.environ.get("EVIDENCE_OUTCOME",""),
          }
          ok=all(v=="success" for v in outcomes.values())
          payload={
            "workflow":"Apps Script canonical deploy",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "run_attempt":int(os.environ.get("GITHUB_RUN_ATTEMPT","1")),
            "trigger_sha":os.environ["GITHUB_SHA"],
            "status":"PASS" if ok else "FAIL",
            "outcomes":outcomes,
          }
          with open("ops/status/apps-script-last.json","w",encoding="utf-8") as fh:
            json.dump(payload,fh,ensure_ascii=False,indent=2)
            fh.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/status/apps-script-last.json
          if git diff --cached --quiet; then
            echo 'APPS_SCRIPT_RUN_RECEIPT=UNCHANGED'
          else
            git commit -m 'chore(ops): record Apps Script deployment receipt'
            git push origin HEAD:main
            echo 'APPS_SCRIPT_RUN_RECEIPT=RECORDED'
          fi
