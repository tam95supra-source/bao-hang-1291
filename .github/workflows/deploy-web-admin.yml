name: Deploy Web Admin

on:
  push:
    branches: [main]
    paths:
      - 'web-admin/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'docs/templates/MAU_NHAN_SU_BAO_HANG_1291.xlsx'
      - '.github/workflows/deploy-web-admin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/apply-realtime-ui-fix.request'
  workflow_dispatch:

concurrency:
  group: web-admin-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_DATA_API: https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1
      APPS_SCRIPT_WORKER_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Enforce BÁO HÀNG scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          test "$NEON_DATA_API" = 'https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1'
          test -n "${APPS_SCRIPT_WORKER_URL:-}"
          case "$APPS_SCRIPT_WORKER_URL" in https://script.google.com/macros/s/*/exec) ;; *) echo 'Invalid Apps Script worker URL' >&2; exit 1;; esac
          if grep -RInE 'ttwftrooaizxmjovkbaz|pick-pack-1291\.web\.app|pick-pack-1291-primary' web-admin firebase.json; then
            echo 'Forbidden PICK PACK identifier found' >&2
            exit 1
          fi
          if grep -RInF 'oedasgcdjppjwidhlqdr.supabase.co' web-admin/src web-admin/vite.config.js; then
            echo 'Supabase live runtime URL found in Web source' >&2
            exit 1
          fi

      - name: Enforce zero-cost Firebase billing guard
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('crypto');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '{}');
          if (!sa.client_email || !sa.private_key || sa.project_id !== 'bao-hang-1291') throw new Error('Firebase service account secret is incomplete or out of scope');
          const enc = (v) => Buffer.from(typeof v === 'string' ? v : JSON.stringify(v)).toString('base64url');
          async function token() {
            const now = Math.floor(Date.now() / 1000);
            const header = enc({ alg: 'RS256', typ: 'JWT' });
            const claim = enc({ iss: sa.client_email, scope: 'https://www.googleapis.com/auth/cloud-platform', aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 900 });
            const unsigned = `${header}.${claim}`;
            const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), sa.private_key).toString('base64url');
            const res = await fetch('https://oauth2.googleapis.com/token', { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: `${unsigned}.${signature}` }) });
            if (!res.ok) throw new Error(`OAuth token HTTP ${res.status}`);
            return (await res.json()).access_token;
          }
          async function main() {
            const access = await token();
            const res = await fetch('https://cloudbilling.googleapis.com/v1/projects/bao-hang-1291/billingInfo', { headers: { Authorization: `Bearer ${access}` } });
            if (!res.ok) throw new Error(`Cloud Billing read HTTP ${res.status}`);
            const billing = await res.json();
            if (billing.billingEnabled === true) throw new Error('COST_GUARD_STOP: Firebase project is linked to Cloud Billing');
            console.log('COST_GUARD=PASS billingEnabled=false');
          }
          main().catch((error) => { console.error(error.message); process.exitCode = 3; });
          NODE

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Prepare Web Admin assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-admin/public
          cp docs/templates/MAU_NHAN_SU_BAO_HANG_1291.xlsx web-admin/public/MAU_NHAN_SU_BAO_HANG_1291.xlsx

      - name: Install pinned web dependencies
        shell: bash
        run: npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Build Web Admin
        shell: bash
        run: npm --prefix web-admin run build

      - name: Reject retired runtime and secret material from static build
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|service_role' web-admin/dist; then echo 'Secret-like material found in static build' >&2; exit 1; fi
          if grep -R -F 'oedasgcdjppjwidhlqdr.supabase.co' web-admin/dist; then echo 'Supabase runtime URL found in production Web Admin build' >&2; exit 1; fi
          grep -R -F 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech' web-admin/dist >/dev/null
          grep -R -F 'script.google.com/macros/s/' web-admin/dist >/dev/null
          test -f web-admin/dist/index.html
          test -f web-admin/dist/MAU_NHAN_SU_BAO_HANG_1291.xlsx

      - name: Verify Neon production auth boundary before deploy
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 3 --retry-all-errors --retry-delay 2 -o "$RUNNER_TEMP/neon-unauth.json" -w '%{http_code}' -X POST "$NEON_DATA_API/rpc/api_session_profile_rpc" -H 'Content-Type: application/json' -d '{"p_test_role":null}')"
          echo "NEON_UNAUTH_HTTP=$code"
          case "$code" in
            400) jq -e '(.message // "") | contains("missing authentication credentials")' "$RUNNER_TEMP/neon-unauth.json" >/dev/null ;;
            401|403) ;;
            *) echo "Unexpected unauthenticated Neon response: HTTP $code" >&2; cat "$RUNNER_TEMP/neon-unauth.json" >&2; exit 1 ;;
          esac
          echo 'NEON_AUTH_BOUNDARY_SMOKE=PASS'

      - name: Prepare Firebase deployment credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          jq -e '.project_id == "bao-hang-1291" and .client_email and .private_key' "$SA_FILE" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting and Firestore rules
        shell: bash
        run: npx --yes firebase-tools@14.17.0 deploy --only hosting,firestore:rules --project bao-hang-1291 --non-interactive

      - name: Verify live Web Admin
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://bao-hang-1291.web.app/ -o "$RUNNER_TEMP/web-index.html"
          grep -q 'Báo hàng 1291' "$RUNNER_TEMP/web-index.html"
          curl -fsSI --retry 5 --retry-all-errors --retry-delay 2 https://bao-hang-1291.web.app/ -o "$RUNNER_TEMP/web-headers.txt"
          grep -qi '^content-security-policy:' "$RUNNER_TEMP/web-headers.txt"
          grep -qi '^x-content-type-options: nosniff' "$RUNNER_TEMP/web-headers.txt"
          echo 'WEB_ADMIN_LIVE_SMOKE=PASS'

      - name: Cleanup credential files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/web-index.html" "$RUNNER_TEMP/web-headers.txt" "$RUNNER_TEMP/neon-unauth.json"
