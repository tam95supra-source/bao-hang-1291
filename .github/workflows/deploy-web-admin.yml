name: Deploy Web Admin

on:
  push:
    branches: [main]
    paths:
      - 'web-admin/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'docs/templates/MAU_NHAN_SU_BAO_HANG_1291.xlsx'
      - 'scripts/live-web-login-e2e.cjs'
  workflow_dispatch:

concurrency:
  group: bao-hang-1291-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed_sha: ${{ steps.deployed.outputs.deployed_sha }}
    env:
      NEON_DATA_API: https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1
      APPS_SCRIPT_WORKER_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Enforce BÁO HÀNG scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          test "$NEON_DATA_API" = 'https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1'
          test -n "${APPS_SCRIPT_WORKER_URL:-}"
          case "$APPS_SCRIPT_WORKER_URL" in https://script.google.com/macros/s/*/exec) ;; *) echo 'Invalid Apps Script worker URL' >&2; exit 1;; esac
          if grep -RInE 'ttwftrooaizxmjovkbaz|pick-pack-1291\.web\.app|pick-pack-1291-primary' web-admin firebase.json; then
            echo 'Forbidden PICK PACK identifier found' >&2
            exit 1
          fi
          if grep -RInF 'oedasgcdjppjwidhlqdr.supabase.co' web-admin/src web-admin/vite.config.js; then
            echo 'Supabase live runtime URL found in Web source' >&2
            exit 1
          fi

      - name: Enforce zero-cost Firebase billing guard
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          if(!sa.client_email||!sa.private_key||sa.project_id!=='bao-hang-1291')throw new Error('Firebase service account secret is incomplete or out of scope');
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          const now=Math.floor(Date.now()/1000),header=enc({alg:'RS256',typ:'JWT'}),claim=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900}),unsigned=`${header}.${claim}`,signature=crypto.sign('RSA-SHA256',Buffer.from(unsigned),sa.private_key).toString('base64url');
          (async()=>{const tr=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${unsigned}.${signature}`}),signal:AbortSignal.timeout(15000)});if(!tr.ok)throw new Error(`OAuth token HTTP ${tr.status}`);const access=(await tr.json()).access_token;const br=await fetch('https://cloudbilling.googleapis.com/v1/projects/bao-hang-1291/billingInfo',{headers:{Authorization:`Bearer ${access}`},signal:AbortSignal.timeout(15000)});if(!br.ok)throw new Error(`Cloud Billing read HTTP ${br.status}`);const billing=await br.json();if(billing.billingEnabled===true)throw new Error('COST_GUARD_STOP: Firebase project is linked to Cloud Billing');console.log('COST_GUARD=PASS billingEnabled=false')})().catch(e=>{console.error(e.message);process.exitCode=3});
          NODE

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Prepare Web Admin assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-admin/public
          cp docs/templates/MAU_NHAN_SU_BAO_HANG_1291.xlsx web-admin/public/MAU_NHAN_SU_BAO_HANG_1291.xlsx

      - name: Install pinned web dependencies
        shell: bash
        run: npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Verify canonical Web shell contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-web-shell-consistency.cjs
          node --check scripts/web-shell-consistency-e2e.cjs

      - name: Build Web Admin
        shell: bash
        run: npm --prefix web-admin run build

      - name: Embed exact deployed SHA marker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > web-admin/dist/__deployed_sha.txt
          grep -Fx "$GITHUB_SHA" web-admin/dist/__deployed_sha.txt >/dev/null

      - name: Reject retired runtime and secret material from static build
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'BEGIN (RSA )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY|service_role' web-admin/dist; then echo 'Secret-like material found in static build' >&2; exit 1; fi
          if grep -R -F 'oedasgcdjppjwidhlqdr.supabase.co' web-admin/dist; then echo 'Supabase runtime URL found in production Web Admin build' >&2; exit 1; fi
          grep -R -F 'ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech' web-admin/dist >/dev/null
          grep -R -F 'script.google.com/macros/s/' web-admin/dist >/dev/null
          grep -R -F 'api_session_profile_rpc' web-admin/dist >/dev/null
          test -f web-admin/dist/index.html
          test -f web-admin/dist/MAU_NHAN_SU_BAO_HANG_1291.xlsx
          test -f web-admin/dist/__deployed_sha.txt

      - name: Verify Neon production auth boundary before deploy
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 3 --retry-all-errors --retry-delay 2 -o "$RUNNER_TEMP/neon-unauth.json" -w '%{http_code}' -X POST "$NEON_DATA_API/rpc/api_session_profile_rpc" -H 'Content-Type: application/json' -d '{"p_test_role":null}')"
          echo "NEON_UNAUTH_HTTP=$code"
          case "$code" in
            400) jq -e '(.message // "") | contains("missing authentication credentials")' "$RUNNER_TEMP/neon-unauth.json" >/dev/null ;;
            401|403) ;;
            *) echo "Unexpected unauthenticated Neon response: HTTP $code" >&2; cat "$RUNNER_TEMP/neon-unauth.json" >&2; exit 1 ;;
          esac
          echo 'NEON_AUTH_BOUNDARY_SMOKE=PASS'

      - name: Prepare Firebase deployment credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          jq -e '.project_id == "bao-hang-1291" and .client_email and .private_key' "$SA_FILE" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting and Firestore rules
        shell: bash
        run: npx --yes firebase-tools@14.17.0 deploy --only hosting,firestore:rules --project bao-hang-1291 --non-interactive

      - name: Record deployed SHA
        id: deployed
        shell: bash
        run: |
          set -euo pipefail
          echo "deployed_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "DEPLOYED_SHA=$GITHUB_SHA"

      - name: Verify live Web Admin and deployed SHA marker
        shell: bash
        run: |
          set -euo pipefail
          site='https://bao-hang-1291.web.app'
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' "$site/?deploy=$GITHUB_SHA" -o "$RUNNER_TEMP/web-index.html"
          grep -q 'Báo hàng 1291' "$RUNNER_TEMP/web-index.html"

          marker_ok=false
          for attempt in $(seq 1 15); do
            if curl -fsSL --retry 2 --retry-all-errors --retry-delay 1 -H 'Cache-Control: no-cache' "$site/__deployed_sha.txt?deploy=$GITHUB_SHA-$attempt" -o "$RUNNER_TEMP/deployed-sha.txt"; then
              live_sha="$(tr -d '\r\n' < "$RUNNER_TEMP/deployed-sha.txt")"
              if [ "$live_sha" = "$GITHUB_SHA" ]; then
                marker_ok=true
                echo "DEPLOYED_SHA_LIVE=PASS attempt=$attempt sha=$live_sha"
                break
              fi
              echo "DEPLOYED_SHA_PROPAGATING attempt=$attempt live=$live_sha expected=$GITHUB_SHA"
            fi
            sleep 2
          done
          [ "$marker_ok" = true ] || { echo "DEPLOYED_SHA_LIVE=FAIL expected=$GITHUB_SHA" >&2; exit 1; }

          curl -fsSI --retry 5 --retry-all-errors --retry-delay 2 "$site/?headers=$GITHUB_SHA" -o "$RUNNER_TEMP/web-headers.txt"
          grep -qi '^content-security-policy:' "$RUNNER_TEMP/web-headers.txt"
          grep -qi '^x-content-type-options: nosniff' "$RUNNER_TEMP/web-headers.txt"
          echo 'WEB_ADMIN_LIVE_SMOKE=PASS'

      - name: Cleanup credential files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/web-index.html" "$RUNNER_TEMP/web-headers.txt" "$RUNNER_TEMP/neon-unauth.json" "$RUNNER_TEMP/deployed-sha.txt"

  acceptance:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deploy
    uses: ./.github/workflows/final-production-acceptance.yml
    with:
      expected_deployed_sha: ${{ needs.deploy.outputs.deployed_sha }}
      production_url: https://bao-hang-1291.web.app
      acceptance_mode: targeted
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  receipt:
    if: always() && github.ref == 'refs/heads/main'
    needs: [deploy, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish sanitized Web deployment receipt
        shell: bash
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ops/status
          python3 - <<'PY'
          import json, os
          outcomes={
            "deploy":os.environ.get("DEPLOY_RESULT",""),
            "acceptance":os.environ.get("ACCEPTANCE_RESULT",""),
          }
          ok=all(v=="success" for v in outcomes.values())
          payload={
            "workflow":"Deploy Web Admin",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "run_attempt":int(os.environ.get("GITHUB_RUN_ATTEMPT","1")),
            "trigger_sha":os.environ["GITHUB_SHA"],
            "status":"PASS" if ok else "FAIL",
            "outcomes":outcomes,
          }
          with open("ops/status/web-admin-last.json","w",encoding="utf-8") as fh:
            json.dump(payload,fh,ensure_ascii=False,indent=2)
            fh.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/status/web-admin-last.json
          if git diff --cached --quiet; then
            echo 'WEB_ADMIN_RUN_RECEIPT=UNCHANGED'
          else
            git commit -m 'chore(ops): record Web deployment receipt'
            git push origin HEAD:main
            echo 'WEB_ADMIN_RUN_RECEIPT=RECORDED'
          fi
