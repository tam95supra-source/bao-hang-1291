name: Firebase Hosting Permission Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-hosting-permission-probe.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare Firebase service account and config
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          umask 077
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          jq -e '.project_id and .client_email and .private_key' "$SA_FILE" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"
          ROOT="$RUNNER_TEMP/firebase-hosting-cleanup"
          mkdir -p "$ROOT/public"
          printf '%s\n' '{"hosting":{"site":"bao-hang-1291","public":"public"}}' > "$ROOT/firebase.json"
          echo "FIREBASE_WORKDIR=$ROOT" >> "$GITHUB_ENV"

      - name: Delete permission probe channel
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIREBASE_WORKDIR"
          npx --yes firebase-tools@14.17.0 hosting:channel:delete permission-probe-31550262102 --project bao-hang-1291 --non-interactive

      - name: Verify no permission probe channel remains
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIREBASE_WORKDIR"
          npx --yes firebase-tools@14.17.0 hosting:channel:list --project bao-hang-1291 --json > "$RUNNER_TEMP/channels.json"
          if grep -q 'permission-probe-' "$RUNNER_TEMP/channels.json"; then
            echo 'Firebase Hosting permission probe residue found' >&2
            exit 1
          fi
          echo 'FIREBASE_HOSTING_PROBE_CLEANUP=PASS'

      - name: Cleanup credential file
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/channels.json" "$RUNNER_TEMP/firebase-hosting-cleanup"
