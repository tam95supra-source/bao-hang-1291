name: Temp canonical Sheet backfill
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-canonical-sheet-backfill.yml']
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Rebuild canonical report Sheet from Neon snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          cat > "$RUNNER_TEMP/backfill.mjs" <<'NODE'
          import crypto from 'node:crypto';

          const PROJECT='bao-hang-1291';
          const NEON_PROJECT='tiny-boat-19315489';
          const NEON_BRANCH='br-broad-resonance-aznwrpea';
          const BASE='https://ep-morning-bread-az3w94qb.apirest.c-3.ap-southeast-1.aws.neon.tech/neondb/rest/v1';
          const SHEET='15_AJ8oB7cEeQjeM6Jb6dm0ki6NcqyxPRVRTAvQPHVM0';
          const ADMIN_UID='44fae0a2-09eb-4226-8412-0f1a1f5d7ef8';
          const FIREBASE_WEB_API_KEY='AIzaSyB-n368fntzxsuuLlvte9NXhcuX0DDbTXM';
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          if(sa.project_id!==PROJECT||!sa.client_email||!sa.private_key) throw new Error('FIREBASE_SCOPE_MISMATCH');
          console.log('SERVICE_ACCOUNT_EMAIL='+sa.client_email);

          const b64=o=>Buffer.from(typeof o==='string'?o:JSON.stringify(o)).toString('base64url');
          const signJwt=(payload)=>{
            const head=b64({alg:'RS256',typ:'JWT'}), body=b64(payload), unsigned=head+'.'+body;
            const sig=crypto.sign('RSA-SHA256',Buffer.from(unsigned),sa.private_key).toString('base64url');
            return unsigned+'.'+sig;
          };
          const now=Math.floor(Date.now()/1000);
          const custom=signJwt({iss:sa.client_email,sub:sa.client_email,aud:'https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit',iat:now,exp:now+3600,uid:ADMIN_UID});
          const authRes=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key='+encodeURIComponent(FIREBASE_WEB_API_KEY),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:custom,returnSecureToken:true})});
          const authBody=await authRes.json();
          if(!authRes.ok||!authBody.idToken) throw new Error('FIREBASE_CUSTOM_TOKEN_FAILED_'+authRes.status);
          const idToken=authBody.idToken;

          async function neon(path){
            const r=await fetch(BASE+path,{headers:{Authorization:'Bearer '+idToken}});
            const text=await r.text();
            if(!r.ok) throw new Error('NEON_'+r.status+'_'+text.slice(0,300));
            return text?JSON.parse(text):[];
          }
          const [profiles,issues,queue]=await Promise.all([
            neon('/profiles?select=*&order=employee_code.asc&limit=1000'),
            neon('/issues?select=*&order=reported_at.asc&limit=1000'),
            neon('/sheet_export_queue?select=*&order=id.asc&limit=1000')
          ]);
          if(profiles.length<1||issues.length<1||queue.length<1) throw new Error('NEON_SNAPSHOT_EMPTY');
          if(new Set(queue.map(x=>String(x.event_id))).size!==queue.length) throw new Error('DUPLICATE_EVENT_ID_IN_NEON');

          const latestPayload=new Map();
          for(const q of queue){ if(q.issue_id) latestPayload.set(String(q.issue_id),q.payload||{}); }
          const fmt=v=>v==null?'':String(v);
          const localTime=v=>{
            if(!v) return '';
            const d=new Date(v); if(Number.isNaN(d.getTime())) return String(v);
            const p=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
            return p.replace(' ',' ');
          };
          const eventRows=queue.map(q=>{
            const p=q.payload||{};
            return [fmt(q.event_id||q.id),localTime(q.accepted_at_authority||q.created_at),fmt(q.event_type),fmt(q.issue_id),fmt(q.sku),fmt(p.product_name),fmt(p.status),Number(p.report_count||0),fmt(q.actor_account_id||p.actor_id||p.reporter_id),JSON.stringify(p)];
          });
          const issueRows=issues.map(i=>{
            const p=latestPayload.get(String(i.id))||{};
            return [fmt(i.id),fmt(i.sku),fmt(i.product_name),fmt(i.status),Number(i.report_count||0),fmt(i.reported_at),fmt(i.updated_at),fmt(p.assigned_name||''),Number(i.reopen_count||0)];
          });
          const userRows=profiles.map(p=>[fmt(p.employee_code),fmt(p.full_name),fmt(p.contractor),fmt(p.role),p.active===true?'Đang hoạt động':'Ngừng hoạt động',fmt(p.updated_at)]);
          const infoRows=[
            ['Mục','Giá trị'],
            ['Backend','Neon PostgreSQL — BÁO HÀNG 1291'],
            ['Neon project',NEON_PROJECT],
            ['Neon production branch',NEON_BRANCH],
            ['Đăng nhập / thông báo','Firebase Auth + FCM — '+PROJECT],
            ['Google Sheet chính',SHEET],
            ['Lịch sử nghiệp vụ','App/Web → Neon sheet_export_queue → Apps Script → SU_KIEN'],
            ['Trạng thái hiện tại','TRANG_THAI_SKU — snapshot từ Neon issues'],
            ['Nhân sự','NHAN_SU — snapshot từ Neon profiles'],
            ['Mật khẩu','KHÔNG lưu trong Google Sheet'],
            ['Cập nhật',new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',dateStyle:'short',timeStyle:'medium'}).format(new Date())]
          ];

          const assertion=signJwt({iss:sa.client_email,scope:'https://www.googleapis.com/auth/spreadsheets',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+3600});
          const tokRes=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});
          const tokBody=await tokRes.json();
          if(!tokRes.ok||!tokBody.access_token) throw new Error('GOOGLE_OAUTH_FAILED_'+tokRes.status);
          const access=tokBody.access_token;
          async function gs(url,opt={}){
            const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET+url,{...opt,headers:{Authorization:'Bearer '+access,'content-type':'application/json',...(opt.headers||{})}});
            const text=await r.text();
            if(!r.ok) throw new Error('SHEETS_'+r.status+'_'+text.slice(0,500));
            return text?JSON.parse(text):{};
          }
          for(const range of ['SU_KIEN!A1:J5000','TRANG_THAI_SKU!A1:I5000','NHAN_SU!A1:F1000','THONG_TIN!A1:Z200']) await gs('/values/'+encodeURIComponent(range)+':clear',{method:'POST',body:'{}'});
          const data=[
            {range:`SU_KIEN!A1:J${eventRows.length+1}`,values:[['Mã sự kiện','Thời gian','Loại sự kiện','Ticket ID','SKU','Tên sản phẩm','Trạng thái','Số lượt báo','Người báo/Actor ID','Dữ liệu JSON'],...eventRows]},
            {range:`TRANG_THAI_SKU!A1:I${issueRows.length+1}`,values:[['Ticket ID','SKU','Tên sản phẩm','Trạng thái','Số lượt báo','Báo lần đầu','Cập nhật cuối','Invent xử lý','Số lần mở lại'],...issueRows]},
            {range:`NHAN_SU!A1:F${userRows.length+1}`,values:[['Mã nhân viên','Họ tên','Nhà thầu','Vai trò','Trạng thái','Cập nhật cuối'],...userRows]},
            {range:`THONG_TIN!A1:B${infoRows.length}`,values:infoRows}
          ];
          await gs('/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data})});

          async function values(range){ const r=await gs('/values/'+encodeURIComponent(range)); return r.values||[]; }
          const [a,st,us]=await Promise.all([values(`SU_KIEN!A1:A${eventRows.length+2}`),values(`TRANG_THAI_SKU!A1:I${issueRows.length+2}`),values(`NHAN_SU!A1:F${userRows.length+2}`)]);
          const sheetEvents=a.slice(1).map(r=>String(r[0]||''));
          const neonEvents=queue.map(q=>String(q.event_id||q.id));
          if(sheetEvents.length!==neonEvents.length||sheetEvents.some((x,i)=>x!==neonEvents[i])) throw new Error('SHEET_EVENT_SEQUENCE_MISMATCH');
          if(st.length!==issues.length+1) throw new Error('SHEET_ISSUE_COUNT_MISMATCH');
          if(us.length!==profiles.length+1) throw new Error('SHEET_PROFILE_COUNT_MISMATCH');
          const hash=crypto.createHash('sha256').update(neonEvents.join('\n')).digest('hex');
          console.log(`CANONICAL_SHEET_BACKFILL_PASS events=${queue.length} issues=${issues.length} profiles=${profiles.length} event_sha256=${hash}`);
          NODE
          node "$RUNNER_TEMP/backfill.mjs"
