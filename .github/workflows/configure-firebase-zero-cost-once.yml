name: Configure Firebase zero-cost once

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - '.github/workflows/configure-firebase-zero-cost-once.yml'

permissions:
  contents: read

jobs:
  publish-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: target-final-20260814-impl

      - name: Enforce zero-cost Firebase billing guard
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          if(!sa.client_email||!sa.private_key||sa.project_id!=='bao-hang-1291') throw new Error('Firebase service account secret mismatch');
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          async function token(){const now=Math.floor(Date.now()/1000),h=enc({alg:'RS256',typ:'JWT'}),c=enc({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900}),u=`${h}.${c}`,sig=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${u}.${sig}`})});if(!r.ok)throw new Error(`OAuth ${r.status}`);return(await r.json()).access_token;}
          (async()=>{const access=await token(),r=await fetch('https://cloudbilling.googleapis.com/v1/projects/bao-hang-1291/billingInfo',{headers:{Authorization:`Bearer ${access}`}});if(!r.ok)throw new Error(`Cloud Billing read HTTP ${r.status}`);const b=await r.json();if(b.billingEnabled===true||String(b.billingAccountName||'').trim())throw new Error('COST_GUARD_STOP: Billing attached');console.log('COST_GUARD=PASS billingEnabled=false');})().catch(e=>{console.error(e.message);process.exitCode=3});
          NODE

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Prepare Firebase deployment credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          jq -e '.project_id == "bao-hang-1291" and .client_email and .private_key' "$SA_FILE" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"

      - name: Publish validated Firestore rules
        shell: bash
        run: npx --yes firebase-tools@15.25.0 deploy --only firestore:rules --project bao-hang-1291 --non-interactive

      - name: Cleanup credential
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
