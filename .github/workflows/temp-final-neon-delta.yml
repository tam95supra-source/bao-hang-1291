name: Temp final Supabase to Neon delta
on:
  push:
    branches: [migration/neon-cutover]
    paths: ['.github/workflows/temp-final-neon-delta.yml']
permissions:
  contents: read
jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MIGRATION_SECRET: ${{ secrets.GOOGLE_SHEET_WEBHOOK_SECRET }}
      URL: https://oedasgcdjppjwidhlqdr.supabase.co/functions/v1/migration-neon-production-push
    steps:
      - name: Final authoritative sync of all 33 source-owned tables
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          test -n "${MIGRATION_SECRET:-}"; test ${#MIGRATION_SECRET} -ge 32
          base='{"project":"bao-hang-1291","supabase_ref":"oedasgcdjppjwidhlqdr","neon_project":"tiny-boat-19315489","neon_branch":"br-broad-resonance-aznwrpea","action":"import_group"'
          for group in 0 1 2 3; do
            out="$RUNNER_TEMP/final-group-${group}.json"
            body="${base},\"group\":${group}}"
            code="$(curl -sS --retry 2 --max-time 180 -o "$out" -w '%{http_code}' -X POST "$URL" -H "x-migration-secret: $MIGRATION_SECRET" -H 'content-type: application/json' -d "$body")"
            echo "FINAL_GROUP=$group HTTP=$code"
            jq '{ok,group,error,results:[.results[]? | {table,copied,source_count,target_count}]}' "$out"
            test "$code" = 200
            jq -e '.ok==true and ([.results[] | select(.source_count != .target_count)] | length)==0' "$out" >/dev/null
          done
          echo FINAL_DELTA_COUNTS_PASS
