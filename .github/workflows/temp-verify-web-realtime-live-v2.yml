name: Temp verify Web realtime live v2

on:
  push:
    branches: [main]
    paths:
      - 'ops/verify-web-realtime-live-v2.trigger'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT: bao-hang-1291
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify cloud scope and clear stale realtime signals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const result={billing:'FAIL',firestore:'FAIL',error:''},out=process.env.RUNNER_TEMP+'/verify/cloud.json';
          const save=()=>fs.writeFileSync(out,JSON.stringify(result));
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          function jwt(p){const h=enc({alg:'RS256',typ:'JWT'}),b=enc(p),u=h+'.'+b,s=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');return u+'.'+s}
          async function req(url,opt={}){const r=await fetch(url,opt);const text=await r.text();let j={};try{j=text?JSON.parse(text):{}}catch{j={raw:text}};if(!r.ok)throw new Error('HTTP_'+r.status+':'+String(j?.error?.message||j?.error||j?.raw||'').slice(0,180));return j}
          (async()=>{try{
            if(sa.project_id!==process.env.FIREBASE_PROJECT)throw new Error('PROJECT_SCOPE_MISMATCH');
            const now=Math.floor(Date.now()/1000),assertion=jwt({iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/datastore',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900});
            const tok=await req('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});
            const access=tok.access_token;if(!access)throw new Error('ACCESS_TOKEN_MISSING');
            const b=await req('https://cloudbilling.googleapis.com/v1/projects/'+process.env.FIREBASE_PROJECT+'/billingInfo',{headers:{authorization:'Bearer '+access}});if(b.billingEnabled===true)throw new Error('COST_GUARD_STOP');result.billing='PASS';
            for(const doc of ['issues','catalog','staff']){const url='https://firestore.googleapis.com/v1/projects/'+process.env.FIREBASE_PROJECT+'/databases/(default)/documents/realtime/'+doc;const r=await fetch(url,{method:'DELETE',headers:{authorization:'Bearer '+access}});if(!(r.ok||r.status===404))throw new Error('FIRESTORE_DELETE_'+doc+'_'+r.status)}
            result.firestore='PASS';save();
          }catch(e){result.error=String(e.message).slice(0,600);save();process.exitCode=2}})();
          NODE
      - name: Verify Hosting bundle rollout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify/live"
          STATUS=FAIL; DETAIL=not_verified; COUNT=0
          for attempt in $(seq 1 18); do
            curl -fsSL --retry 2 --retry-all-errors https://bao-hang-1291.web.app/ -o "$RUNNER_TEMP/verify/live/index.html" || { sleep 5; continue; }
            python3 - <<'PY' > "$RUNNER_TEMP/verify/live/assets.txt"
          import re,os,pathlib
          s=pathlib.Path(os.environ['RUNNER_TEMP']+'/verify/live/index.html').read_text(errors='ignore')
          print('\n'.join(re.findall(r'(?:src|href)=["\']([^"\']+\.js[^"\']*)',s)))
          PY
            : > "$RUNNER_TEMP/verify/live/all.js"
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              case "$asset" in http*) url="$asset";; /*) url="https://bao-hang-1291.web.app$asset";; *) url="https://bao-hang-1291.web.app/$asset";; esac
              curl -fsSL --retry 2 --retry-all-errors "$url" >> "$RUNNER_TEMP/verify/live/all.js" || true
            done < "$RUNNER_TEMP/verify/live/assets.txt"
            COUNT=$(grep -o 'site:1291:issues' "$RUNNER_TEMP/verify/live/all.js" | wc -l | tr -d ' ' || true)
            if grep -q 'Có cập nhật báo hàng mới' "$RUNNER_TEMP/verify/live/all.js" \
              && grep -q 'Danh sách nhân sự vừa cập nhật' "$RUNNER_TEMP/verify/live/all.js" \
              && grep -q 'realtime-notice' "$RUNNER_TEMP/verify/live/all.js" \
              && ! grep -q 'MutationObserver' "$RUNNER_TEMP/verify/live/all.js" \
              && [ "$COUNT" = 1 ]; then STATUS=PASS;DETAIL=stable_realtime_bundle;break;fi
            DETAIL="attempt_${attempt}_issue_topic_count_${COUNT}";sleep 5
          done
          printf '{"status":"%s","detail":"%s","issue_topic_count":%s}\n' "$STATUS" "$DETAIL" "$COUNT" > "$RUNNER_TEMP/verify/live.json"
          [ "$STATUS" = PASS ]
      - name: Record sanitized proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/verify/cloud.json" || printf '{"billing":"FAIL","firestore":"FAIL","error":"no_cloud_result"}' > "$RUNNER_TEMP/verify/cloud.json"
          test -s "$RUNNER_TEMP/verify/live.json" || printf '{"status":"FAIL","detail":"no_live_result","issue_topic_count":0}' > "$RUNNER_TEMP/verify/live.json"
          mkdir -p ops
          python3 - <<'PY' > ops/web-realtime-stable-live-v2.txt
          import json,os
          c=json.load(open(os.environ['RUNNER_TEMP']+'/verify/cloud.json'));l=json.load(open(os.environ['RUNNER_TEMP']+'/verify/live.json'))
          print('billing='+str(c.get('billing','FAIL')))
          print('firestore_signal_cleanup='+str(c.get('firestore','FAIL')))
          print('live='+str(l.get('status','FAIL')))
          print('detail='+str(l.get('detail',''))[:300])
          print('issue_topic_count='+str(l.get('issue_topic_count',0)))
          print('error='+str(c.get('error','')).replace('\n',' ')[:500])
          PY
          cat ops/web-realtime-stable-live-v2.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/web-realtime-stable-live-v2.txt
          git diff --cached --quiet || git commit -m 'chore(web): record stable realtime live proof v2'
          git pull --rebase origin main
          git push origin HEAD:main
          grep -q '^billing=PASS$' ops/web-realtime-stable-live-v2.txt
          grep -q '^firestore_signal_cleanup=PASS$' ops/web-realtime-stable-live-v2.txt
          grep -q '^live=PASS$' ops/web-realtime-stable-live-v2.txt
