name: One-time harden migration function grants

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-migration-security.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restrict SECURITY DEFINER helpers to service role
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/migrations/202608110001_initial.sql')
          s = p.read_text()
          marker = 'revoke all on function public.report_shortage_atomic(text,uuid,text) from public, anon, authenticated;\n'
          block = (
              '-- SECURITY DEFINER helpers must not be directly callable by client roles.\n'
              'revoke all on function public.current_role() from public, anon, authenticated;\n'
              'revoke all on function public.is_invent_admin() from public, anon, authenticated;\n'
              'revoke all on function public.issue_json(public.issues) from public, anon, authenticated;\n'
          )
          if block not in s:
              if marker not in s:
                  raise SystemExit('revoke marker not found')
              s = s.replace(marker, block + marker, 1)
          marker2 = 'grant execute on function public.report_shortage_atomic(text,uuid,text) to service_role;\n'
          block2 = (
              'grant execute on function public.current_role() to service_role;\n'
              'grant execute on function public.is_invent_admin() to service_role;\n'
              'grant execute on function public.issue_json(public.issues) to service_role;\n'
          )
          if block2 not in s:
              if marker2 not in s:
                  raise SystemExit('grant marker not found')
              s = s.replace(marker2, block2 + marker2, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202608110001_initial.sql
          git commit -m "Harden SECURITY DEFINER function grants"
          git push origin HEAD:main
