name: One-shot live UI fix

on:
  push:
    branches: [agent/fix-live-sku-realtime-wording-20260816]
    paths:
      - 'scripts/run-live-ui-fix-20260816.py'

permissions:
  contents: write

concurrency:
  group: one-shot-live-ui-fix-20260816
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 scripts/run-live-ui-fix-20260816.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'wss://oedasgcdjppjwidhlqdr.supabase.co' firebase.json
          grep -q 'BÁO LẠI TRONG 30 PHÚT' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt
          grep -q 'tabBadges' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt
          grep -q 'requested.length < 3' app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt
          ! grep -R -n -E 'Trung vị|trung vị|Ticket|Cho SKIP|Auto SKIP|P95 hoàn tất' web-admin/src app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt app/src/main/java/vn/pickpack1291/baohang/data/Models.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Android unit test and debug build
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Web build
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix web-admin install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix web-admin run build
          grep -R -q 'site:1291:issues' web-admin/dist/assets

      - name: Commit only validated product changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-live-ui-fix-20260816.py scripts/run-live-ui-fix-20260816.py .github/workflows/one-shot-live-ui-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix SKU search realtime badges and wording'
          git push origin HEAD:${GITHUB_REF_NAME}
