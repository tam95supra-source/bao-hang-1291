name: Temp patch staff source role
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-patch-staff-source-role.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Patch canonical worker staff contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_apps_script_staff_source.py
          cp google-apps-script/DEPLOY_NEON.gs "$RUNNER_TEMP/worker.js"
          node --check "$RUNNER_TEMP/worker.js"
          grep -q "select A,B,D,E,F where G = 1291" google-apps-script/DEPLOY_NEON.gs
          grep -q "staffRole_(position,department,code)" google-apps-script/DEPLOY_NEON.gs
          grep -q "DIEU PHOI" google-apps-script/DEPLOY_NEON.gs
      - name: Commit canonical patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google-apps-script/DEPLOY_NEON.gs
          git diff --cached --quiet || git commit -m 'fix(worker): align canonical staff source and roles'
          git pull --rebase origin main
          git push origin HEAD:main
