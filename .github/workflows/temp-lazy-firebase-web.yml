name: Temp lazy Firebase Web runtime

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-lazy-firebase-web.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Move Firebase SDK behind login and realtime demand
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web-admin/src/supabase-shim.js')
          s=p.read_text(encoding='utf-8')
          old_import="""import { initializeApp, getApps } from 'firebase/app'
import {
  browserLocalPersistence,
  getAuth,
  setPersistence,
  signInWithEmailAndPassword,
  signOut,
} from 'firebase/auth'
import { doc, getFirestore, onSnapshot } from 'firebase/firestore'

"""
          if s.count(old_import)!=1: raise SystemExit('firebase import block mismatch')
          s=s.replace(old_import,'')
          old_init="""const app = getApps().find((item) => item.name === '[DEFAULT]') || initializeApp({
  apiKey: FIREBASE_API_KEY,
  authDomain: `${FIREBASE_PROJECT}.firebaseapp.com`,
  projectId: FIREBASE_PROJECT,
})
const auth = getAuth(app)
const firestore = getFirestore(app)
setPersistence(auth, browserLocalPersistence).catch(() => {})

"""
          new_init="""let firebaseRuntimePromise
async function firebaseRuntime() {
  if (!firebaseRuntimePromise) {
    firebaseRuntimePromise = Promise.all([
      import('firebase/app'),
      import('firebase/auth'),
      import('firebase/firestore'),
    ]).then(([appModule, authModule, firestoreModule]) => {
      const app = appModule.getApps().find((item) => item.name === '[DEFAULT]') || appModule.initializeApp({
        apiKey: FIREBASE_API_KEY,
        authDomain: `${FIREBASE_PROJECT}.firebaseapp.com`,
        projectId: FIREBASE_PROJECT,
      })
      const auth = authModule.getAuth(app)
      authModule.setPersistence(auth, authModule.browserLocalPersistence).catch(() => {})
      return {
        auth,
        firestore: firestoreModule.getFirestore(app),
        signInWithEmailAndPassword: authModule.signInWithEmailAndPassword,
        signOut: authModule.signOut,
        doc: firestoreModule.doc,
        onSnapshot: firestoreModule.onSnapshot,
      }
    })
  }
  return firebaseRuntimePromise
}

"""
          if s.count(old_init)!=1: raise SystemExit('firebase init block mismatch')
          s=s.replace(old_init,new_init)
          old_login="""async function supabaseLikeLogin(body) {
  const credential = await signInWithEmailAndPassword(auth, String(body.email || ''), String(body.password || ''))
"""
          new_login="""async function supabaseLikeLogin(body) {
  const { auth, signInWithEmailAndPassword } = await firebaseRuntime()
  const credential = await signInWithEmailAndPassword(auth, String(body.email || ''), String(body.password || ''))
"""
          if s.count(old_login)!=1: raise SystemExit('login anchor mismatch')
          s=s.replace(old_login,new_login)
          old_refresh="""async function refreshFirebase(body) {
  const refreshToken = String(body.refresh_token || '')
  if (auth.currentUser) {
"""
          new_refresh="""async function refreshFirebase(body) {
  const refreshToken = String(body.refresh_token || '')
  const { auth } = await firebaseRuntime()
  if (auth.currentUser) {
"""
          if s.count(old_refresh)!=1: raise SystemExit('refresh anchor mismatch')
          s=s.replace(old_refresh,new_refresh)
          old_logout="""    if (url.pathname === '/auth/v1/logout') {
      await signOut(auth).catch(() => {})
      realtimeToken = ''
"""
          new_logout="""    if (url.pathname === '/auth/v1/logout') {
      const { auth, signOut } = await firebaseRuntime()
      await signOut(auth).catch(() => {})
      realtimeToken = ''
"""
          if s.count(old_logout)!=1: raise SystemExit('logout anchor mismatch')
          s=s.replace(old_logout,new_logout)
          old_subscribe="""  subscribe(statusCallback) {
    const topic = this.name.split(':').pop()
    if (!['issues', 'config', 'staff', 'catalog'].includes(topic)) {
      statusCallback?.('CHANNEL_ERROR')
      return this
    }
    this.unsub = onSnapshot(
      doc(firestore, 'realtime', topic),
      (snapshot) => {
        if (!snapshot.exists()) return
        const event = snapshot.data() || {}
        this.handlers.forEach(({ filter, callback }) => {
          if (!filter?.event || filter.event === event.event_type) callback({ payload: event })
        })
      },
      () => statusCallback?.('CHANNEL_ERROR'),
    )
    statusCallback?.('SUBSCRIBED')
    return this
  }

  close() {
    this.unsub?.()
    this.unsub = null
  }
"""
          new_subscribe="""  subscribe(statusCallback) {
    const topic = this.name.split(':').pop()
    if (!['issues', 'config', 'staff', 'catalog'].includes(topic)) {
      statusCallback?.('CHANNEL_ERROR')
      return this
    }
    this.closed = false
    statusCallback?.('CONNECTING')
    firebaseRuntime().then(({ firestore, doc, onSnapshot }) => {
      if (this.closed) return
      this.unsub = onSnapshot(
        doc(firestore, 'realtime', topic),
        (snapshot) => {
          if (!snapshot.exists()) return
          const event = snapshot.data() || {}
          this.handlers.forEach(({ filter, callback }) => {
            if (!filter?.event || filter.event === event.event_type) callback({ payload: event })
          })
        },
        () => statusCallback?.('CHANNEL_ERROR'),
      )
      statusCallback?.('SUBSCRIBED')
    }).catch(() => statusCallback?.('CHANNEL_ERROR'))
    return this
  }

  close() {
    this.closed = true
    this.unsub?.()
    this.unsub = null
  }
"""
          if s.count(old_subscribe)!=1: raise SystemExit('realtime subscribe block mismatch')
          s=s.replace(old_subscribe,new_subscribe)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          ! grep -n '^import .*firebase' web-admin/src/supabase-shim.js
          grep -Fq "import('firebase/app')" web-admin/src/supabase-shim.js
          grep -Fq "import('firebase/firestore')" web-admin/src/supabase-shim.js
      - name: Commit performance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tam95supra-source'
          git config user.email 'tam95.supra@gmail.com'
          git add web-admin/src/supabase-shim.js
          git commit -m 'perf(web): lazy-load Firebase auth and realtime SDK'
          git push origin HEAD:main
