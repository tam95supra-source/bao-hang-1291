name: One-time fix MainActivity search compile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mainactivity-search.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Kotlin nullable CharSequence conversion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt')
          s = p.read_text()
          old = 'app.repository.searchSkus(s.orEmpty().toString())'
          new = 'app.repository.searchSkus(s?.toString().orEmpty())'
          if old not in s:
              raise SystemExit('Expected source pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/vn/pickpack1291/baohang/ui/MainActivity.kt
          git commit -m "Fix nullable SKU search text conversion"
          git push origin HEAD:main
