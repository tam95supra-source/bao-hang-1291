name: One-shot Events shell source fix

on:
  push:
    branches:
      - fix/events-shell-source-reference
    paths:
      - '.patch-trigger/events-shell'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Patch exact Events shell reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('web-admin/src/workflow-v3-overrides.js')
          text = src.read_text(encoding='utf-8')
          old = "  </section>`;\n  $('#wv3EventsRefresh').onclick = () => void loadEventsBoard(true);"
          new = "  </section>`;\n  shell = $('#workflowV3Events'); if (!shell) return null;\n  $('#wv3EventsRefresh').onclick = () => void loadEventsBoard(true);"
          count = text.count(old)
          if count != 1:
              raise SystemExit('EVENTS_SHELL_PATCH_SIGNATURE_COUNT=' + str(count))
          src.write_text(text.replace(old, new, 1), encoding='utf-8')
          index = Path('web-admin/index.html')
          idx = index.read_text(encoding='utf-8')
          guard = '    <script src="/src/events-languagechange-stability.js"></script>\n'
          if guard not in idx:
              raise SystemExit('EVENTS_WORKAROUND_INDEX_MARKER_MISSING')
          index.write_text(idx.replace(guard, '', 1), encoding='utf-8')
          PY
          rm -f web-admin/src/events-languagechange-stability.js
          rm -f .patch-trigger/events-shell
          rm -f .github/workflows/one-shot-events-shell-source-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(web): refresh Events shell reference after DOM creation'
          git push origin HEAD:fix/events-shell-source-reference
