name: Bootstrap Firestore Emergency Target

on:
  push:
    branches: [target-final-20260814-impl]
    paths:
      - '.github/workflows/bootstrap-firestore-target.yml'

permissions:
  contents: read

concurrency:
  group: bootstrap-firestore-emergency-target
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FIREBASE_PROJECT_ID: bao-hang-1291
    steps:
      - uses: actions/checkout@v6

      - name: Materialize Firebase service credential
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAO_HANG_1291 }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install zero-cost deployment tooling
        run: |
          npm install --global firebase-tools@latest
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-cloud-cli

      - name: Fail closed if Billing is attached
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud config set project "$FIREBASE_PROJECT_ID" --quiet
          billing_json="$(gcloud beta billing projects describe "$FIREBASE_PROJECT_ID" --format=json 2>/dev/null || true)"
          if [ -n "$billing_json" ]; then
            BILLING_JSON="$billing_json" python3 - <<'PY'
          import json, os, sys
          data=json.loads(os.environ['BILLING_JSON'])
          if data.get('billingEnabled') is True or data.get('billingAccountName'):
              print('Blocked: Firebase project has Billing attached.', file=sys.stderr)
              sys.exit(1)
          print('Billing guard: no billing account attached.')
          PY
          else
            echo "Billing guard: no billing attachment reported."
          fi

      - name: Create the single free Firestore database only if absent
        shell: bash
        run: |
          set -euo pipefail
          existing="$(firebase firestore:databases:list --project "$FIREBASE_PROJECT_ID" 2>&1 || true)"
          printf '%s\n' "$existing"
          if printf '%s' "$existing" | grep -Fq '(default)'; then
            echo "Default Firestore database already exists."
          else
            firebase firestore:databases:create '(default)' --location asia-southeast1 --project "$FIREBASE_PROJECT_ID"
          fi

      - name: Deploy deny-by-default Emergency rules
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only firestore:rules --non-interactive

      - name: Remove credential material
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
