name: Temp reset Firebase Auth — Bao Hang 1291

on:
  push:
    branches: [main]
    paths:
      - 'ops/reset-auth-20260819.trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bao-hang-reset-firebase-auth
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT: bao-hang-1291
      ADMIN_UID: 44fae0a2-09eb-4226-8412-0f1a1f5d7ef8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reset Firebase users except protected Admin
        id: reset
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tam95supra-source/bao-hang-1291'
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          mkdir -p "$RUNNER_TEMP/reset"
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const result={status:'FAILED',before:0,deleted:0,after:0,adminFound:false,error:''};
          const out=process.env.RUNNER_TEMP+'/reset/result.json';
          const save=()=>fs.writeFileSync(out,JSON.stringify(result));
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          if(sa.project_id!==process.env.FIREBASE_PROJECT||!sa.client_email||!sa.private_key)throw new Error('SERVICE_ACCOUNT_SCOPE_MISMATCH');
          const enc=v=>Buffer.from(typeof v==='string'?v:JSON.stringify(v)).toString('base64url');
          function jwt(payload){const h=enc({alg:'RS256',typ:'JWT'}),p=enc(payload),u=h+'.'+p,s=crypto.sign('RSA-SHA256',Buffer.from(u),sa.private_key).toString('base64url');return u+'.'+s}
          async function request(url,opt={}){const r=await fetch(url,opt);const text=await r.text();let j={};try{j=text?JSON.parse(text):{}}catch{j={raw:text}};if(!r.ok)throw new Error('HTTP_'+r.status+':'+String(j?.error?.message||j?.error||j?.raw||'').slice(0,220));return j}
          async function oauth(){const now=Math.floor(Date.now()/1000),assertion=jwt({iss:sa.client_email,scope:'https://www.googleapis.com/auth/identitytoolkit',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+900});return request('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})})}
          async function listAll(access){let users=[],pageToken='';do{const q=new URLSearchParams({maxResults:'1000'});if(pageToken)q.set('nextPageToken',pageToken);const j=await request('https://identitytoolkit.googleapis.com/v1/projects/'+process.env.FIREBASE_PROJECT+'/accounts:batchGet?'+q,{headers:{authorization:'Bearer '+access}});users.push(...(j.users||[]));pageToken=j.nextPageToken||'';}while(pageToken);return users}
          async function del(access,uid){await request('https://identitytoolkit.googleapis.com/v1/projects/'+process.env.FIREBASE_PROJECT+'/accounts:delete',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+access},body:JSON.stringify({localId:uid})})}
          (async()=>{try{const tok=await oauth();const access=tok.access_token;if(!access)throw new Error('OAUTH_TOKEN_MISSING');const before=await listAll(access);result.before=before.length;result.adminFound=before.some(u=>String(u.localId)===process.env.ADMIN_UID);if(!result.adminFound)throw new Error('PROTECTED_ADMIN_NOT_FOUND');for(const u of before){if(String(u.localId)===process.env.ADMIN_UID)continue;await del(access,String(u.localId));result.deleted++;}const after=await listAll(access);result.after=after.length;if(after.length!==1||String(after[0]?.localId)!==process.env.ADMIN_UID)throw new Error('POST_RESET_AUTH_SCOPE_MISMATCH');result.status='PASS';save();}catch(e){result.error=String(e.message).slice(0,1000);save();process.exitCode=2;}})();
          NODE

      - name: Record result and dispatch staff sync
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/reset/result.json" || printf '{"status":"FAILED","before":0,"deleted":0,"after":0,"adminFound":false,"error":"no_result"}' > "$RUNNER_TEMP/reset/result.json"
          mkdir -p ops
          python3 - <<'PY' > ops/firebase-reset-last.txt
          import json,os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/reset/result.json'))
          for k in ['status','before','deleted','after','adminFound','error']:
              print(f'{k}={str(r.get(k,"")).replace(chr(10)," ")[:1000]}')
          PY
          cat ops/firebase-reset-last.txt
          if grep -q '^status=PASS$' ops/firebase-reset-last.txt; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/staff-sync.yml/dispatches" \
              -d '{"ref":"main"}'
            echo 'staff_sync_dispatch=PASS' >> ops/firebase-reset-last.txt
          else
            echo 'staff_sync_dispatch=SKIPPED' >> ops/firebase-reset-last.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/firebase-reset-last.txt
          git diff --cached --quiet || git commit -m 'chore(reset): record Firebase auth reset result'
          git pull --rebase origin main
          git push origin HEAD:main
          grep -q '^status=PASS$' ops/firebase-reset-last.txt
