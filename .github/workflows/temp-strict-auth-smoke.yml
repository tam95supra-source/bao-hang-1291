name: Temp strict browser auth smoke

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-strict-auth-smoke.yml']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify password auth under strict browser privacy
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --test-third-party-cookie-phaseout --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/chrome" about:blank >"$RUNNER_TEMP/chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break || sleep 1; done
          curl -fsS -X PUT 'http://127.0.0.1:9222/json/new?https%3A%2F%2Fbao-hang-1291.web.app%2F' > "$RUNNER_TEMP/tab.json"
          ws="$(jq -er '.webSocketDebuggerUrl' "$RUNNER_TEMP/tab.json")"
          WS_URL="$ws" node <<'NODE'
          const ws = new WebSocket(process.env.WS_URL)
          let id = 0
          const pending = new Map()
          ws.onmessage = e => { const m=JSON.parse(e.data); if(m.id&&pending.has(m.id)){pending.get(m.id)(m);pending.delete(m.id)} }
          const call=(method,params={})=>new Promise((resolve,reject)=>{const i=++id;pending.set(i,m=>m.error?reject(new Error(m.error.message)):resolve(m.result));ws.send(JSON.stringify({id:i,method,params}))})
          const ev=async expression=>(await call('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true})).result?.value
          const sleep=ms=>new Promise(r=>setTimeout(r,ms))
          ws.onopen=async()=>{try{
            await call('Runtime.enable'); await call('Page.enable')
            for(let i=0;i<50;i++){if(await ev("!!document.querySelector('#loginForm')"))break;await sleep(200)}
            if(!(await ev("!!document.querySelector('#loginForm')")))throw new Error('LOGIN_FORM_NOT_READY')
            await ev(`(()=>{const u=document.querySelector('#employeeCode'),p=document.querySelector('#password');u.value='strict_probe_nonexistent';p.value='StrictProbe-NotReal-1291';document.querySelector('#loginForm').requestSubmit(document.querySelector('#loginForm button'));return true})()`)
            let text=''
            for(let i=0;i<50;i++){await sleep(200);text=await ev("document.querySelector('#loginMessage')?.textContent?.trim()||''");if(text&&text!=='Đang xác thực…')break}
            console.log(`STRICT_LOGIN_RESULT=${text}`)
            if(text.includes('network-request-failed'))throw new Error('NETWORK_REQUEST_FAILED')
            if(!text.includes('Sai mã nhân viên hoặc mật khẩu'))throw new Error(`UNEXPECTED:${text}`)
            console.log('STRICT_BROWSER_AUTH_PASS'); ws.close(); process.exit(0)
          }catch(e){console.error(e.message);ws.close();process.exit(1)}}
          NODE
