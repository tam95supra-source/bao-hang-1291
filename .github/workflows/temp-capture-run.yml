name: Temp capture run
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-capture-run.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Record run id first
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          printf '%s\n' "$GITHUB_RUN_ID" > ops/current-run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/current-run-id.txt
          git commit -m 'chore(temp): capture diagnostic workflow run id'
          git pull --rebase origin main
          git push origin HEAD:main
